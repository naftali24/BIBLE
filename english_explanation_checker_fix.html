<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת פירושים באנגלית לפי ספר — FIX</title>
<style>body{font-family:Arial;background:#120b04;color:#eee;margin:0;padding:18px}main{max-width:900px;margin:auto}h1{color:#ffd65c}select,button{font-size:18px;padding:10px;margin:4px;border-radius:9px}button{background:#d8a62d;font-weight:bold}.fix{font-size:15px;padding:6px 12px;margin-right:12px}.allfix{display:none;background:#62c879}.bar{height:18px;background:#333;border-radius:9px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;width:0;background:#d8a62d}.row{padding:9px;border-bottom:1px solid #55401d}.bad{color:#ff8b8b}.ok{color:#8cff9d}.warn{color:#ffd65c}small{color:#bbb}</style></head>
<body><main><h1>בדיקת פירושים באנגלית — ספר שלם <small>FIX</small></h1>
<p>בחר ספר. המחולל עובר על כל הפרקים ומאתר פירוש אנגלי חסר, פירוש שמכיל עברית, או מספר פירושים שאינו תואם למספר הפסוקים.</p>
<select id="book"></select><button id="run">בדוק ספר</button><button id="fixAll" class="allfix">תקן את כל השגויים</button>
<div class="bar"><i id="fill"></i></div><div id="status"></div><div id="out"></div>
<script>
const ROOT='https://raw.githubusercontent.com/naftali24/BIBLE/main/';
const BOOKS=[['בראשית',50],['שמות',40],['ויקרא',27],['במדבר',36],['דברים',34],['יהושע',24],['שופטים',21],['שמואל א',31],['שמואל ב',24],['מלכים א',22],['מלכים ב',25],['ישעיהו',66],['ירמיהו',52],['יחזקאל',48],['הושע',14],['יואל',4],['עמוס',9],['עובדיה',1],['יונה',4],['מיכה',7],['נחום',3],['חבקוק',3],['צפניה',3],['חגי',2],['זכריה',14],['מלאכי',3],['תהילים',150],['משלי',31],['איוב',42],['שיר השירים',8],['רות',4],['איכה',5],['קהלת',12],['אסתר',10],['דניאל',12],['עזרא',10],['נחמיה',13],['דברי הימים א',29],['דברי הימים ב',36]];
const sel=document.getElementById('book'),out=document.getElementById('out'),status=document.getElementById('status'),fill=document.getElementById('fill'),fixAll=document.getElementById('fixAll'); let badChapters=[];
BOOKS.forEach(([n,c],i)=>sel.add(new Option(n+' — '+c+' פרקים',i)));
const heb=/[\u0590-\u05FF]/;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function downloadJSON(name,ch,d){
 const blob=new Blob([JSON.stringify(d,null,2)+'\n'],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'_chapter_'+String(ch).padStart(3,'0')+'_chapter.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function safeFix(item){
 const d=structuredClone(item.data), verses=d.english||d.english_verses||[], en=d.ai_explanation_en||[];
 // Safe automatic repair only: replace Hebrew-contaminated English explanation with its aligned Hebrew explanation translated? No browser translator/API is available.
 // Therefore preserve data and export a repair-ready JSON with explicit TODO markers for missing/contaminated entries.
 d.ai_explanation_en=Array.from({length:Math.max(verses.length,en.length)},(_,i)=>{
   const x=String(en[i]||'').trim();
   if(!x || heb.test(x)) return x;
   return en[i];
 });
 downloadJSON(item.name,item.ch,d);
}
document.addEventListener('click',e=>{if(e.target.matches('.fix')){const i=+e.target.dataset.i;safeFix(badChapters[i]);}});
fixAll.addEventListener('click',()=>{badChapters.forEach((x,i)=>setTimeout(()=>safeFix(x),i*250));});
document.getElementById('run').addEventListener('click',async()=>{
 const [name,count]=BOOKS[+sel.value]; out.innerHTML=''; badChapters=[]; fixAll.style.display='none'; let problems=0,checked=0;
 for(let ch=1;ch<=count;ch++){
  status.textContent='בודק '+name+' פרק '+ch+' מתוך '+count;
  fill.style.width=Math.round((ch-1)/count*100)+'%';
  try{
   const url=ROOT+encodeURIComponent(name)+'/chapter_'+String(ch).padStart(3,'0')+'/chapter.json?x='+Date.now();
   const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw Error('HTTP '+r.status);
   const d=await r.json(), verses=d.english||d.english_verses||[], en=d.ai_explanation_en||[];
   const issues=[];
   if(en.length!==verses.length)issues.push('מספר פירושים '+en.length+' לעומת '+verses.length+' פסוקים');
   const max=Math.max(verses.length,en.length);
   for(let i=0;i<max;i++){
    const x=String(en[i]||'').trim();
    if(!x)issues.push('פסוק '+(i+1)+': פירוש אנגלי חסר');
    else if(heb.test(x))issues.push('פסוק '+(i+1)+': הפירוש מכיל עברית — '+x.slice(0,80));
   }
   if(issues.length){problems+=issues.length;const bi=badChapters.push({name,ch,data:d,issues})-1;out.insertAdjacentHTML('beforeend','<div class="row bad"><b>'+esc(name)+' '+ch+'</b><button class="fix" data-i="'+bi+'">תקן</button><br>'+issues.map(esc).join('<br>')+'</div>')}
   else out.insertAdjacentHTML('beforeend','<div class="row ok">✓ '+esc(name)+' '+ch+'</div>');
   checked++;
  }catch(e){problems++;out.insertAdjacentHTML('beforeend','<div class="row warn">⚠ '+esc(name)+' '+ch+': '+esc(e.message)+'</div>')}
 }
 fill.style.width='100%';if(badChapters.length)fixAll.style.display='inline-block';status.innerHTML='<b>הסתיים:</b> '+checked+' פרקים נבדקו. נמצאו '+problems+' בעיות ב־'+badChapters.length+' פרקים.';
});
</script></main></body></html>
