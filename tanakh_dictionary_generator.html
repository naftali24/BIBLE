<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מחולל מילון התנ״ך</title>
<style>body{font:17px Arial,sans-serif;background:#f2f5fa;color:#15263c;max-width:1050px;margin:auto;padding:15px}section{background:white;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 9px #dce2ec}h1{margin:8px 0}button,select,input{font:inherit;padding:9px;margin:5px;border-radius:6px}button{background:#145aa1;color:white;border:0;cursor:pointer}button:disabled{opacity:.45}textarea{width:100%;height:225px;box-sizing:border-box;font:15px/1.5 monospace;direction:rtl}#report,#saveReport{white-space:pre-wrap;color:#205a39}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.metric{display:inline-block;padding:10px;background:#e9f2fd;border-radius:9px;margin:5px}small{color:#555}</style>
<h1>מחולל מילון לכל התנ״ך</h1><section><div class="row"><label>ספר <select id="book"></select></label><label>מפרק <select id="from"></select></label><label>עד פרק <select id="to"></select></label><label>מילים בקבוצה <input id="limit" type="number" value="150" min="1" max="500" style="width:75px"></label></div><button id="scan">1. סרוק פסוקים בגיטהאב</button><div id="report"></div><div><span class="metric" id="total">במילון: —</span><span class="metric" id="unique">ייחודיות חסרות: —</span><span class="metric" id="remaining">נותרו: —</span><span class="metric" id="batch">קבוצה: —</span></div></section>
<section><h3>2. העתק ל-ChatGPT</h3><textarea id="words" readonly></textarea><div><button id="copy">העתק בקשת פירושים</button><button id="next">הקבוצה הבאה</button><button id="previous">הקבוצה הקודמת</button></div></section>
<section><h3>3. הדבק תשובת JSON</h3><textarea id="answers" placeholder='{"מילה":"פירוש קצר"}'></textarea><div><button id="merge">בדוק והוסף למילון</button><button id="save">4. עדכן מילון בגיטהאב</button><button id="download">הורד גיבוי</button></div><p><label>GitHub token עם הרשאת Contents: Read and write ל-BIBLE בלבד <input id="token" type="password" autocomplete="off" style="width:min(95%,340px)" placeholder="אסימון GitHub"></label></p><div id="saveReport"></div><small>המילון המקורי נשמר. מילים קיימות לא נדרסות. השמירה בגיטהאב מחייבת אסימון אישי; אין להדביק אותו בצ'אט. ניתן גם לשלוח את ה-JSON בצ'אט ולבקש ממני לעדכן ישירות.</small></section>
<script>
const owner='naftali24',repo='BIBLE',dictPath='tanakh_dictionary_compact.json';
const raw=p=>'https://raw.githubusercontent.com/'+owner+'/'+repo+'/main/'+p.split('/').map(encodeURIComponent).join('/');
const api='https://api.github.com/repos/'+owner+'/'+repo;
const books=[['בראשית',50],['שמות',40],['ויקרא',27],['במדבר',36],['דברים',34],['יהושע',24],['שופטים',21],['שמואל א',31],['שמואל ב',24],['מלכים א',22],['מלכים ב',25],['ישעיהו',66],['ירמיהו',52],['יחזקאל',48],['הושע',14],['יואל',4],['עמוס',9],['עובדיה',1],['יונה',4],['מיכה',7],['נחום',3],['חבקוק',3],['צפניה',3],['חגי',2],['זכריה',14],['מלאכי',3],['תהילים',150],['משלי',31],['איוב',42],['שיר השירים',8],['רות',4],['איכה',5],['קהלת',12],['אסתר',10],['דניאל',12],['עזרא',10],['נחמיה',13],['דברי הימים א',29],['דברי הימים ב',36]];
let dict={},missing=[],pos=0,scanned=0,baseCount=0,ready=false;
const $=id=>document.getElementById(id);
const clean=w=>w.normalize('NFD').replace(/[\u0591-\u05c7]/g,'').replace(/[^\u05d0-\u05ea]/g,'');
const entries=()=>Object.keys(dict).length;
function updateCounters(){const n=Math.max(1,Math.min(500,Number($('limit').value)||150));$('total').textContent='במילון: '+entries();$('unique').textContent='ייחודיות חסרות בסריקה: '+scanned;$('remaining').textContent='נותרו: '+missing.length;$('batch').textContent='קבוצה: '+(missing.length?Math.floor(pos/n)+1+'/'+Math.ceil(missing.length/n):'—')}
function show(){const n=Math.max(1,Math.min(500,Number($('limit').value)||150));pos=Math.min(pos,Math.max(0,Math.floor((missing.length-1)/n)*n));$('words').value=missing.slice(pos,pos+n).map(x=>x.word+' | '+x.pointed+' | '+x.book+' '+x.chapter+':'+x.verse).join('\n');updateCounters()}
books.forEach(([b])=>{const o=document.createElement('option');o.value=b;o.textContent=b;$('book').append(o)});
function refreshChapters(){const b=books.find(x=>x[0]===$('book').value);const max=b?b[1]:40;for(const id of ['from','to']){$(id).replaceChildren();for(let i=1;i<=max;i++){const o=document.createElement('option');o.value=i;o.textContent=i;$(id).append(o)}}$('from').value=$('book').value==='שמות'?'6':'1';$('to').value=$('from').value}
$('book').value='שמות';$('book').onchange=refreshChapters;refreshChapters();$('limit').onchange=show;
async function fetchJson(path){const r=await fetch(raw(path)+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('קובץ חסר: '+path+' ('+r.status+')');return r.json()}
async function loadDictionary(){dict=await fetchJson(dictPath);baseCount=entries();updateCounters()}
loadDictionary().catch(e=>$('report').textContent='שגיאה בטעינת המילון: '+e.message);
$('scan').onclick=async()=>{const btn=$('scan');btn.disabled=true;try{await loadDictionary();const b=$('book').value,from=+$('from').value,to=+$('to').value;if(to<from)throw Error('פרק הסיום קטן מפרק ההתחלה');missing=[];pos=0;scanned=0;const seen=new Set();let ok=0;for(let ch=from;ch<=to;ch++){const path=b+'/chapter_'+String(ch).padStart(3,'0')+'/chapter.json';$('report').textContent='סורק '+b+' פרק '+ch+'...';let data;try{data=await fetchJson(path)}catch(e){$('report').textContent+='\n'+e.message;continue}if(!Array.isArray(data.verses)){throw Error('אין מערך verses בקובץ '+path)}data.verses.forEach((verse,index)=>{if(typeof verse!=='string')return;const tokens=verse.match(/[\u05d0-\u05ea][\u0591-\u05c7\u05d0-\u05ea]*/g)||[];for(const pointed of tokens){const word=clean(pointed);if(word.length<2||Object.prototype.hasOwnProperty.call(dict,word)||seen.has(word))continue;seen.add(word);missing.push({word,pointed,book:b,chapter:ch,verse:index+1})}});ok++;$('report').textContent='נסרקו '+ok+' פרקים; נמצאו '+missing.length+' מילים חסרות ייחודיות';updateCounters()}scanned=missing.length;ready=true;show();$('report').textContent='הסריקה הסתיימה: '+ok+' פרקים, '+scanned+' מילים ייחודיות שאינן במילון. כל מילה מופיעה פעם אחת בלבד.'}catch(e){$('report').textContent='שגיאה: '+e.message}finally{btn.disabled=false}};
$('next').onclick=()=>{pos+=Math.max(1,Number($('limit').value)||150);show()};$('previous').onclick=()=>{pos=Math.max(0,pos-(Math.max(1,Number($('limit').value)||150)));show()};
$('copy').onclick=async()=>{if(!$('words').value){$('saveReport').textContent='יש לסרוק קודם';return}const msg='החזר אך ורק אובייקט JSON תקין שבו המפתחות הם המילים ללא ניקוד והערכים פירוש קצר ופשוט בעברית (1–5 מילים), בהתאם לניקוד ולהקשר. ללא Markdown וללא הסברים. אל תשתמש במילה עצמה בתור פירוש.\n\n'+$('words').value;try{await navigator.clipboard.writeText(msg);$('saveReport').textContent='הבקשה הועתקה לצ׳אט'}catch(e){$('saveReport').textContent='לא ניתן להעתיק אוטומטית. העתק ידנית מתוך התיבה.'}};
$('merge').onclick=()=>{try{const input=JSON.parse($('answers').value);if(!input||Array.isArray(input)||typeof input!=='object')throw Error('נדרש אובייקט JSON');let added=0,skipped=0;const allowed=new Set(missing.map(x=>x.word));for(const [key,val] of Object.entries(input)){const k=clean(key);if(!allowed.has(k)||typeof val!=='string'||!val.trim()||Object.prototype.hasOwnProperty.call(dict,k)){skipped++;continue}dict[k]=val.trim();added++}missing=missing.filter(x=>!Object.prototype.hasOwnProperty.call(dict,x.word));pos=0;show();$('saveReport').textContent='נוספו בזיכרון '+added+' פירושים. דולגו '+skipped+'. כעת לחץ ״עדכן מילון בגיטהאב״ כדי לשמור.';$('answers').value=''}catch(e){$('saveReport').textContent='שגיאה בפענוח JSON: '+e.message}};
$('save').onclick=async()=>{const token=$('token').value.trim();if(!token){$('saveReport').textContent='כדי לשמור ישירות בגיטהאב יש להכניס GitHub token בעל הרשאת כתיבה';return}const btn=$('save');btn.disabled=true;try{const url=api+'/contents/'+dictPath;const headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};const r=await fetch(url,{headers,cache:'no-store'});if(!r.ok)throw Error('לא ניתן לקרוא מגיטהאב: '+r.status);const info=await r.json();const remote=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(info.content.replace(/\s/g,'')),c=>c.charCodeAt(0))));let added=0;for(const [k,v] of Object.entries(dict))if(!Object.prototype.hasOwnProperty.call(remote,k)){remote[k]=v;added++}if(!added){$('saveReport').textContent='כל הפירושים כבר נמצאים בגיטהאב. לא נדרש עדכון.';return}const data=JSON.stringify(remote);const bytes=new TextEncoder().encode(data);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.slice(i,i+8192));const wr=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Add '+added+' Tanakh dictionary definitions',sha:info.sha,content:btoa(binary)})});if(!wr.ok)throw Error('GitHub לא אישר שמירה: '+wr.status+' '+(await wr.text()).slice(0,200));dict=remote;baseCount=entries();$('saveReport').textContent='✓ נשמר בגיטהאב! נוספו '+added+' מילים. במילון '+entries()+' מילים.';updateCounters();$('token').value=''}catch(e){$('saveReport').textContent='שמירה נכשלה: '+e.message}finally{btn.disabled=false}};
$('download').onclick=()=>{const blob=new Blob([JSON.stringify(dict)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=dictPath;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
