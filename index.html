<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIBLE APPS</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0d0803;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.wrap{width:min(760px,100%)}
h1{text-align:center;color:#ffe58a;margin:0 0 22px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{border:2px solid #d89b18;border-radius:20px;background:#171006;padding:22px 14px;text-align:center}
.icon{font-size:58px;height:70px}
.card img{width:68px;height:68px;border-radius:15px}
.name{font-size:23px;font-weight:900;color:#ffe58a;margin:10px 0 18px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button,a.btn{border:1px solid #e6b94c;background:#2b1a08;color:#fff3c4;border-radius:12px;padding:11px 16px;font-weight:900;font-size:15px;text-decoration:none;cursor:pointer}
.install[hidden]{display:none}
.status{font-size:12px;margin-top:12px;color:#ddd;min-height:16px}
@media(max-width:560px){.apps{grid-template-columns:1fr}.card{padding:16px}.name{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<h1>BIBLE APPS</h1>
<div class="apps">
  <section class="card">
    <div class="icon">📖</div>
    <div class="name">THE BIBLE</div>
    <div class="actions">
      <a class="btn" href="bible/">OPEN</a>
      <button id="installBible">INSTALL</button>
    </div>
    <div class="status" id="statusBible"></div>
  </section>
  <section class="card">
    <img src="ideas/tanakh-ideas-192.png" alt="">
    <div class="name">BIBLE BY IDEAS</div>
    <div class="actions">
      <a class="btn" href="ideas/">OPEN</a>
      <button id="installIdeas">INSTALL</button>
    </div>
    <div class="status" id="statusIdeas"></div>
  </section>
</div>
</div>
<script>
/*
Browsers expose an install prompt only for the PWA of the current document.
The launcher therefore opens a tiny same-origin installer window for the
chosen app. That window captures its own beforeinstallprompt and triggers it.
After installation it closes itself.
*/
function installApp(which){
  const url = which==='bible' ? 'bible/install.html' : 'ideas/install.html';
  window.open(url, 'install_'+which, 'width=420,height=640');
}
document.getElementById('installBible').onclick=()=>installApp('bible');
document.getElementById('installIdeas').onclick=()=>installApp('ideas');
</script>
</body>
</html>
