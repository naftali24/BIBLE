<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211207"><link rel="manifest" href="./stories.webmanifest"><title>התקנת סיפורי התנ״ך · BIBLE STORIES</title><style>body{background:#211207;color:#ffe5a0;font:20px Arial;text-align:center;padding:28px 12px}main{max-width:540px;margin:auto}button,a{display:block;box-sizing:border-box;margin:18px auto;padding:14px;border-radius:14px;border:2px solid #f8da84;background:linear-gradient(#ffe7a1,#d99a20);color:#211100;font:bold 20px Arial;text-decoration:none;width:min(100%,400px)}p{line-height:1.6}small{font-size:15px}</style></head><body><main><h2>סיפורי התנ״ך · BIBLE STORIES</h2><p>התקנת סמל נפרד במסך הבית · INSTALL</p><button id="install">⬇ התקן · INSTALL</button><p id="help">באנדרואיד: פתח ב־Chrome, לחץ על ⋮ ובחר „התקנת אפליקציה” או „הוספה למסך הבית”.</p><a href="../tanakh%20by%20ideas.html">פתח אפליקציה · OPEN APP</a><a href="../index.html">חזרה לאינדקס · BACK</a><small>אם הדפדפן אינו מציע התקנה, ניתן ליצור קיצור דרך למסך הבית. מסך מלא אינו מובטח לקיצור דרך.</small></main><script>let promptEvent=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;});document.getElementById('install').addEventListener('click',async()=>{if(promptEvent){const p=promptEvent;promptEvent=null;await p.prompt();}else{document.getElementById('help').textContent='ב־Chrome: לחץ על ⋮ ואז התקנת אפליקציה / הוספה למסך הבית. אם האפשרות לא מופיעה, ייתכן שהאפליקציה כבר מותקנת או שהדפדפן אינו תומך בהתקנה.';}});addEventListener('appinstalled',()=>{try{localStorage.setItem('bible-installed-stories','yes')}catch(e){}document.getElementById('install').hidden=true;document.getElementById('help').textContent='האפליקציה הותקנה בהצלחה.'});</script></body></html>
