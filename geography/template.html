<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211207"><link rel="manifest" href="manifest.json"><title>תנ״ך גיאוגרפי — GEOGRAPHICAL BIBLE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#120b04;color:#f8edca;font-family:Arial,'Segoe UI',sans-serif}header{background:#0d0803;border-bottom:2px solid #986b18;padding:8px max(10px,env(safe-area-inset-right));position:sticky;top:0;z-index:5;text-align:center}h1{font-size:clamp(20px,3vw,30px);margin:0 0 7px;color:#ffdc68}.tools{display:flex;gap:6px;max-width:920px;margin:auto;direction:ltr}button,select{cursor:pointer;background:linear-gradient(#ffe99b,#d89a1b);color:#271700;border:1px solid #8c6213;border-radius:9px;font-size:17px;font-weight:bold;padding:8px 11px;min-height:43px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}#books,#lang,#fullscreen{flex:0 0 60px;padding:5px}#events{flex:1;min-width:0;direction:rtl}#progressNote{font-size:13px;color:#e8c46b;margin-top:7px}#status{font-size:13px;min-height:16px;color:#ffdc68}main{max-width:920px;margin:auto;padding:6px 10px calc(65px + env(safe-area-inset-bottom))}.card{background:linear-gradient(135deg,#744809,#281704);border:2px solid #b28c39;border-radius:16px;padding:clamp(10px,2vw,18px);margin:6px 0;min-height:calc(100dvh - var(--head,140px) - 75px);display:flex;flex-direction:column;scroll-margin-top:var(--head,140px)}.meta{color:#e8c46b;font-size:14px}.era{color:#ffdf8e;font-size:14px;padding:7px 0;border-bottom:1px solid #80622c}.title-row{display:flex;justify-content:center;align-items:center;gap:9px;margin:9px 0}.title-row h2{font-size:clamp(23px,3.8vw,33px);margin:0;color:#ffe08a;text-align:center;line-height:1.3;text-decoration:underline;text-underline-offset:6px}.audio{min-width:44px;flex-shrink:0}.quote{font-size:clamp(20px,3.3vw,29px);line-height:1.4;font-weight:bold;color:#f7cb54;text-align:center;margin:7px 0 10px}.facts{list-style:none;margin:0;padding:8px 0;border-top:1px solid #80622c;font-size:clamp(19px,2.8vw,24px);line-height:1.42}.facts li{margin:8px 0}.facts a{color:#ffe385;text-decoration:none;font-size:14px;white-space:nowrap}.fact-kind{font-size:12px;border:1px solid #ad934e;border-radius:5px;padding:2px 4px;margin-inline-end:6px;color:#ffe6a5;white-space:nowrap}.fact-kind.U{border-color:#ffd477}.fact-kind.B{border-color:#aaa}.picture{margin:12px 0 0;margin-top:auto;padding-top:10px}.picture img{display:block;width:100%;max-height:28dvh;object-fit:contain;border-radius:10px}.picture a{color:#ffe385}.picture figcaption{font-size:12px;line-height:1.4;text-align:center;color:#e8c46b;padding:5px}footer{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#0d0803f5;border-top:1px solid #986b18;padding:5px 8px calc(5px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px}footer button{min-width:62px}dialog{background:#1d1307;color:#f8edca;border:2px solid #ffd36b;border-radius:15px;max-width:720px;width:94%;max-height:85dvh;padding:16px}dialog::backdrop{background:#000b}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.book-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}.book-grid button{font-size:17px}.book-grid small{display:block;font-size:11px;margin-top:3px;font-weight:normal}.empty{font-size:23px;text-align:center;padding:50px 20px}.report{font-size:16px;line-height:1.5}.report table{width:100%;border-collapse:collapse}.report td,.report th{text-align:start;border-bottom:1px solid #70501e;padding:7px}.report a{color:#ffe385}#gptPrompt{width:100%;min-height:220px;background:#120b04;color:#f8edca;border:1px solid #a78035;padding:10px;font:16px Arial;line-height:1.5}body.en #events{direction:ltr}body.en .quote{text-align:left}body.en .title-row h2{text-align:left}@media(max-width:430px){header{padding:6px}#books,#lang,#fullscreen{flex-basis:45px;font-size:19px}#events{font-size:14px;padding:4px}.facts{font-size:20px}.title-row h2{font-size:24px}.card{padding:10px}.book-grid{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .18s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:none}}}
</style></head><body>
<header><h1 id="heading"></h1><div class="tools"><button id="books" aria-label="בחירת ספר">🦉</button><button id="lang">EN</button><select id="events" aria-label="בחירת אירוע"></select><button id="fullscreen" aria-label="מסך מלא">⛶</button></div><div id="progressNote"></div><div id="status" role="status" aria-live="polite"></div></header>
<main id="content"></main><footer><button id="previous" aria-label="האירוע הקודם">↑</button><button id="gpt">GPT</button><button id="reportBtn">☷</button><button id="next" aria-label="האירוע הבא">↓</button></footer>
<dialog id="bookDialog"><div class="dialog-top"><strong id="bookLabel"></strong><button data-close="bookDialog">✕</button></div><div class="book-grid" id="bookGrid"></div></dialog>
<dialog id="reportDialog"><div class="dialog-top"><strong id="reportLabel"></strong><button data-close="reportDialog">✕</button></div><div id="reportContent" class="report"></div></dialog>
<dialog id="gptDialog"><div class="dialog-top"><strong>GPT</strong><button data-close="gptDialog">✕</button></div><p id="gptHint"></p><textarea id="gptPrompt" readonly></textarea><p><button id="openGPT"></button> <button id="copyGPT"></button></p></dialog>
<script>
'use strict';
const ATLAS=/*ATLAS_DATA*/;
const $=id=>document.getElementById(id),tx=(he,en)=>lang==='he'?he:en;
let lang='he',book='בראשית',position=0,items=[],player=null,stopTimer=null,gesture=null;
try{const s=JSON.parse(localStorage.getItem('geographical-bible-state')||'null');if(s){lang=s.lang==='en'?'en':'he';if(ATLAS.books[s.book])book=s.book;position=Math.max(0,Number(s.position)||0)}}catch{}
const make=(tag,cls,value)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e};
function remember(){try{localStorage.setItem('geographical-bible-state',JSON.stringify({lang,book,position}))}catch{}}
function stop(){if(player){player.pause();player.src='';player=null}clearTimeout(stopTimer);window.speechSynthesis?.cancel();$('status').textContent='';document.querySelectorAll('.audio').forEach(x=>{x.textContent='▶';x.setAttribute('aria-pressed','false')})}
function announce(t){$('status').textContent=t}
function speak(item){
 if(!window.speechSynthesis){announce(tx('אין מנוע דיבור זמין בדפדפן.','Speech is unavailable in this browser.'));return}
 const utterance=new SpeechSynthesisUtterance(item.quote[lang]);utterance.lang=lang==='he'?'he-IL':'en-US';utterance.rate=.85;
 utterance.onend=()=>stop();utterance.onerror=()=>{stop();announce(tx('הקראת הפסוק אינה זמינה.','Verse speech is unavailable.'))};
 announce(tx('הקראה באמצעות מנוע הדיבור של המכשיר','Reading with the device speech engine'));speechSynthesis.speak(utterance)
}
async function play(item,button){
 if(button.getAttribute('aria-pressed')==='true'){stop();return}stop();button.setAttribute('aria-pressed','true');button.textContent='■';
 const clip=item.audio[lang];if(!clip?.url||!Number.isFinite(clip.start)||!Number.isFinite(clip.end)){speak(item);return}
 const a=new Audio(clip.url);player=a;
 a.addEventListener('timeupdate',()=>{if(a.currentTime>=clip.end)stop()});a.addEventListener('ended',stop);
 a.addEventListener('error',()=>{if(player===a){stop();speak(item)}},{once:true});
 a.addEventListener('loadedmetadata',async()=>{if(player!==a)return;a.currentTime=clip.start;try{await a.play();if(player!==a)return;announce(tx('מנגן את הפסוק בעברית','Playing the verse in English'));stopTimer=setTimeout(stop,(clip.end-clip.start+3)*1000)}catch{if(player===a){stop();speak(item)}}},{once:true});
 a.load();announce(tx('טוען הקלטת פסוק…','Loading verse recording…'))
}
function changeBook(name){stop();book=name;position=0;$('bookDialog').close();render();window.scrollTo(0,0)}
function navigate(delta){if(!items.length)return;const p=Math.min(items.length-1,Math.max(0,position+delta));if(p===position)return;stop();position=p;renderCard();window.scrollTo(0,0);remember()}
function renderCard(){
 const root=$('content');root.replaceChildren();$('events').value=String(position);$('previous').disabled=position<=0||!items.length;$('next').disabled=position>=items.length-1||!items.length;$('gpt').disabled=!items.length;
 if(!items.length){root.append(make('p','empty',tx('התוכן הגיאוגרפי של ספר זה טרם נכתב ונבדק.','The geographical content for this book has not yet been written and reviewed.')));return}
 const it=items[position],card=make('article','card');card.dataset.eventId=it.id;
 card.append(make('div','meta',`${position+1} / ${items.length} · ${lang==='he'?book:ATLAS.books[book]} · ${it.chapter}:${it.verse}`));
 card.append(make('div','era','⏳ '+it.era[lang]));const row=make('div','title-row'),title=make('h2','',it.title[lang]),audio=make('button','audio','▶');audio.type='button';audio.setAttribute('aria-label',tx('השמע את הפסוק בעברית','Play verse in English'));audio.setAttribute('aria-pressed','false');audio.onclick=()=>play(it,audio);row.append(title,audio);card.append(row,make('div','quote',it.quote[lang]));
 const facts=make('ol','facts');for(const f of it.facts){const li=make('li'),badge=make('span','fact-kind '+f.type,({F:tx('ממצא / גאוגרפיה','Evidence / geography'),U:tx('משוער / לא ודאי','Tentative / uncertain'),B:tx('מסורת מקראית','Biblical tradition')})[f.type]),link=make('a','',tx(' ↗ מקור',' ↗ Source'));link.href=f.source;link.target='_blank';link.rel='noopener noreferrer';li.append(badge,document.createTextNode(f[lang]),link);facts.append(li)}card.append(facts);
 const figure=make('figure','picture'),img=make('img');img.src=it.image.src;img.alt=it.image.caption[lang];img.addEventListener('error',()=>{img.hidden=true;figure.querySelector('figcaption').textContent=tx('האיור אינו זמין כרגע.','The illustration is currently unavailable.')},{once:true});figure.append(img,make('figcaption','',it.image.caption[lang]));if(it.image.source){const credit=make('a','',tx(' ↗ מקור התצלום',' ↗ Photo source'));credit.href=it.image.source;credit.target='_blank';credit.rel='noopener noreferrer';figure.querySelector('figcaption').append(credit)}card.append(figure);root.append(card);remember()
}
function render(){
 items=ATLAS.events.filter(x=>x.book===book);position=Math.max(0,Math.min(position,items.length-1));document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.body.classList.toggle('en',lang==='en');document.title=tx('תנ״ך גיאוגרפי — ','Geographical Bible — ')+(lang==='he'?book:ATLAS.books[book]);$('heading').textContent=document.title;$('lang').textContent=lang==='he'?'EN':'עב';$('lang').setAttribute('aria-label',tx('מעבר לאנגלית','Switch to Hebrew'));$('books').setAttribute('aria-label',tx('בחירת ספר','Choose a book'));$('fullscreen').setAttribute('aria-label',tx('מסך מלא','Fullscreen'));$('events').setAttribute('aria-label',tx('בחירת אירוע','Choose an event'));$('previous').setAttribute('aria-label',tx('האירוע הקודם','Previous event'));$('next').setAttribute('aria-label',tx('האירוע הבא','Next event'));$('reportBtn').setAttribute('aria-label',tx('דוח התקדמות','Progress report'));$('bookLabel').textContent=tx('בחירת ספר','Choose a book');$('reportLabel').textContent=tx('מצב האטלס — העבודה טרם הושלמה','Atlas progress — work is incomplete');$('progressNote').textContent=tx(`בהכנה · ${ATLAS.events.length} אירועים · גרסת עבודה · האטלס טרם הושלם`,`In progress · ${ATLAS.events.length} events · work in progress · atlas incomplete`);
 $('events').replaceChildren();if(!items.length){const o=make('option','',tx('טרם הושלם','Not yet completed'));o.value='0';$('events').append(o)}items.forEach((it,i)=>{const o=make('option','',`${it.chapter}:${it.verse} · ${it.title[lang]}`);o.value=i;$('events').append(o)});
 $('bookGrid').replaceChildren();for(const [he,en] of Object.entries(ATLAS.books)){const b=make('button','',lang==='he'?he:en),n=ATLAS.events.filter(x=>x.book===he).length;b.append(make('small','',n?tx(`${n} אירועים · בהכנה`,`${n} events · in progress`):tx('טרם נכתב','Not yet written')));b.onclick=()=>changeBook(he);$('bookGrid').append(b)}renderCard();requestAnimationFrame(() =>document.documentElement.style.setProperty('--head',$('heading').parentElement.offsetHeight+10+'px'))
}
function buildPrompt(it){const name=lang==='he'?it.book:ATLAS.books[it.book],facts=it.facts.map((f,i)=>`${i+1}. ${f[lang]}`).join('\n');return lang==='he'?`אני לומד תנ״ך גיאוגרפי: ${name} ${it.chapter}:${it.verse}.\nהמקום: ${it.title.he}.\nהתקופה: ${it.era.he}.\nהרקע הגיאוגרפי:\n${facts}\nספר לי בקצרה עובדה גיאוגרפית, היסטורית או ארכאולוגית מפתיעה ומדויקת הקשורה למקום. הבחן בין ממצאים מבוססים, השערות מחקריות ומסורת מקראית. ציין מקור אמין ואפשר לי לשאול שאלות המשך.`:`I am studying the geographical Bible: ${name} ${it.chapter}:${it.verse}.\nPlace: ${it.title.en}.\nPeriod: ${it.era.en}.\nGeographical background:\n${facts}\nTell me briefly one additional surprising and accurate geographical, historical or archaeological fact about this place. Distinguish established findings, research hypotheses and biblical tradition. Cite a reliable source and allow follow-up questions. Answer in English.`}
$('books').onclick=()=>{$('bookDialog').showModal()};$('lang').onclick=()=>{stop();lang=lang==='he'?'en':'he';render()};$('events').onchange=e=>{stop();position=Number(e.target.value);renderCard();window.scrollTo(0,0)};$('previous').onclick=()=>navigate(-1);$('next').onclick=()=>navigate(1);
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{announce(tx('מסך מלא זמין גם בפתיחה מתוך האפליקציה המותקנת.','Fullscreen is also available from the installed app.'))}};
for(const b of document.querySelectorAll('[data-close]'))b.onclick=()=>$(b.dataset.close).close();
$('gpt').onclick=()=>{stop();const it=items[position];if(!it)return;$('gptPrompt').value=buildPrompt(it);$('gptHint').textContent=tx('השאלה כוללת את המקום ושש העובדות. לחזרה לאטלס השתמש בלשונית הקודמת או באפליקציות האחרונות.','The question includes the place and all six facts. Return using the previous tab or Recent Apps.');$('openGPT').textContent=tx('פתח GPT','Open GPT');$('copyGPT').textContent=tx('העתק שאלה','Copy question');$('gptDialog').showModal()};
$('openGPT').onclick=()=>{const w=window.open('https://chatgpt.com/?q='+encodeURIComponent($('gptPrompt').value),'_blank');if(!w)$('gptHint').textContent=tx('החלון נחסם. אפשר חלונות קופצים או העתק את השאלה.','The popup was blocked. Allow popups or copy the question.')};$('copyGPT').onclick=async()=>{try{await navigator.clipboard.writeText($('gptPrompt').value);$('copyGPT').textContent=tx('הועתק','Copied')}catch{$('gptPrompt').select();$('gptHint').textContent=tx('בחר העתק בתפריט המכשיר.','Choose Copy from your device menu.')}};
$('reportBtn').onclick=()=>{const r=$('reportContent');r.replaceChildren();r.append(make('p','',tx('זהו מקטע עבודה ראשון, ולא אטלס שהושלם. חמשת חומשי התורה עברו סריקת מועמדים ראשונית; התוכן טרם השלים ביקורת מחקרית מלאה. שאר התנ״ך מופּה טכנית בלבד. בדיקות מבניות אינן תחליף לביקורת מחקרית עצמאית.','This is an initial work segment, not a completed atlas. The Torah books have had an initial geographical candidate pass; the content has not completed full scholarly review. The remaining books have only been technically indexed. Structural checks do not replace independent scholarly review.')));const t=make('table'),head=make('tr');for(const label of [tx('ספר','Book'),tx('פרקים במאגר','Chapters indexed'),tx('אירועים','Events'),tx('מצב','Status')])head.append(make('th','',label));t.append(head);for(const b of ATLAS.coverage.books){const row=make('tr');for(const value of [lang==='he'?b.book:b.nameEn,b.chapters.length,b.events,tx(b.chapters.some(c=>c.scan.startsWith('initial'))?'סריקת מועמדים':'טרם נסרק',b.chapters.some(c=>c.scan.startsWith('initial'))?'Candidate pass':'Not reviewed')])row.append(make('td','',String(value)));t.append(row)}r.append(t,make('p','',tx('גורן האטד: טעון השלמה, ואינו מוצג כאירוע מאושר. רשימת ההשלמות המפורטת מופיעה בדוח שבמאגר.','Atad: incomplete and excluded from the event viewer. The detailed remaining-candidate list is included in the repository progress report.')));$('reportDialog').showModal()};
// Swipes turn events only at the corresponding scroll boundary. Long cards remain readable.
$('content').addEventListener('touchstart',e=>{if(e.touches.length!==1)return;gesture={x:e.touches[0].clientX,y:e.touches[0].clientY,top:window.scrollY<=2,bottom:innerHeight+scrollY>=document.documentElement.scrollHeight-3}},{passive:true});
$('content').addEventListener('touchend',e=>{if(!gesture)return;const dy=e.changedTouches[0].clientY-gesture.y,dx=e.changedTouches[0].clientX-gesture.x;if(Math.abs(dy)>80&&Math.abs(dy)>Math.abs(dx)*1.5){if(dy<0&&gesture.bottom)navigate(1);else if(dy>0&&gesture.top)navigate(-1)}gesture=null},{passive:true});
let wheelLocked=false;window.addEventListener('wheel',e=>{if(document.querySelector('dialog[open]')||Math.abs(e.deltaY)<35||wheelLocked)return;const end=innerHeight+scrollY>=document.documentElement.scrollHeight-3,start=scrollY<=1;if((e.deltaY>0&&end)||(e.deltaY<0&&start)){wheelLocked=true;navigate(e.deltaY>0?1:-1);setTimeout(()=>wheelLocked=false,550)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.closest('button,select,textarea,input')||document.querySelector('dialog[open]'))return;if(e.key==='PageDown'||e.key==='ArrowDown'){e.preventDefault();navigate(1)}else if(e.key==='PageUp'||e.key==='ArrowUp'){e.preventDefault();navigate(-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);render();
</script></body></html>
