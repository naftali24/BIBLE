<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עורך עוגני קריוקי תנ״ך</title><style>body{background:#14100a;color:#fff4d5;font:17px Arial;margin:auto;max-width:1050px;padding:15px}h1{color:#ffd65d}button,select,input{font:inherit;padding:8px;border-radius:7px;margin:3px}button{background:#e9b63c;border:0;cursor:pointer}button.anchor{background:#20a96b;color:white}button.selected{outline:3px solid #fff}section{background:#292018;padding:12px;border-radius:12px;margin:10px 0}#words{line-height:2.6}#words button{font-size:20px;background:#41382a;color:white;border:1px solid #6c5b3c}#words button.marked{background:#176c4a}#words button.current{outline:3px solid #ffdf55}#status{color:#ffe26c;white-space:pre-wrap}audio{width:100%}table{width:100%;border-collapse:collapse}td,th{border:1px solid #5d5141;padding:5px}input[type=number]{width:85px}small{color:#e2d0ad}</style><h1>עורך עוגנים לקריוקי — תנ״ך</h1><section><label>ספר <select id="book"></select></label><label>פרק <select id="chapter"></select></label><button id="load">טען פרק מ־GitHub</button><label>פסוק <select id="verse"></select></label><p id="status">טוען רשימת פרקים...</p></section><section><audio id="audio" controls preload="metadata"></audio><p>זמן נוכחי: <b id="clock">0.00</b> שניות <button id="back">−1 שנ׳</button><button id="forward">+1 שנ׳</button><button id="slower">מהירות 0.75×</button><button id="normal">מהירות 1×</button></p><p><small>הפעל את האודיו. ברגע שהקריין אומר מילה — לחץ עליה כדי לקבוע עוגן בזמן הנוכחי. אפשר לעצור ולתקן עוגן בכל עת. מילים ללא עוגן יקבלו תזמון משוער בין העוגנים.</small></p><div id="words"></div></section><section><button id="estimate">חשב תזמונים לכל המילים</button><button id="download" class="anchor">הורד readalong_words.json</button><button id="clear">מחק עוגנים בפרק</button><p id="summary"></p><div id="anchors"></div></section><script>
const repo='naftali24/BIBLE',raw='https://raw.githubusercontent.com/'+repo+'/main/',treeApi='https://api.github.com/repos/'+repo+'/git/trees/main?recursive=1';let paths=[],path='',chapter={},original={},words=[],verseStarts=[],anchors=new Map(),estimated=[];const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;const fmt=n=>Number(n).toFixed(2);function norm(s){return String(s||'').normalize('NFD').replace(/[\u0591-\u05c7]/g,'').replace(/[^\u05d0-\u05ea]/g,'')}function num(p){return Number((p.match(/chapter_(\d+)\/chapter\.json$/)||[])[1]||0)}function book(p){return p.split('/')[0]}function round(n){return Math.round(n*100)/100}
async function init(){try{let r=await fetch(treeApi);if(!r.ok)throw Error('GitHub '+r.status);let t=await r.json();paths=t.tree.filter(x=>x.type==='blob'&&/\/chapter_\d+\/chapter\.json$/.test(x.path)).map(x=>x.path);let books=[...new Set(paths.map(book))];$('book').innerHTML=books.map(x=>'<option>'+x+'</option>').join('');$('book').value=books.includes('בראשית')?'בראשית':books[0];$('book').onchange=chapters;chapters()}catch(e){status('שגיאה בטעינת הרשימה: '+e.message)}}function chapters(){let a=paths.filter(p=>book(p)===$('book').value).sort((a,b)=>num(a)-num(b));$('chapter').innerHTML=a.map(p=>'<option value="'+p+'">'+num(p)+'</option>').join('');status('בחר פרק ולחץ טען');}
async function getJson(p){let r=await fetch(raw+p+'?t='+Date.now());if(!r.ok)throw Error(p+': '+r.status);return r.json()}
function getVerses(c){for(let k of ['hebrew','verses_he','hebrew_verses','text_he','he']){let a=c[k];if(Array.isArray(a))return a.map(v=>typeof v==='string'?v:(v?.text||v?.hebrew||''))}return []}
function splitVerses(vs){let arr=[],starts=[];for(let i=0;i<vs.length;i++){starts.push(arr.length);for(let s of String(vs[i]).trim().split(/\s+/).filter(Boolean))arr.push({hebrew:s,verse:i+1})}return {arr,starts}}
function alignToOriginal(arr,old){let j=0;for(let i=0;i<arr.length;i++){let n=norm(arr[i].hebrew);if(!n)continue;for(let k=j;k<Math.min(j+8,old.length);k++){if(norm(old[k].hebrew||old[k].word)===n){arr[i].oldIndex=k;j=k+1;break}}}}
$('load').onclick=async()=>{try{path=$('chapter').value;status('טוען פרק, טיימטאגים ואודיו...');chapter=await getJson(path);let wp=path.replace(/chapter\.json$/,'readalong_words.json');try{original=await getJson(wp)}catch{original={book:chapter.book||book(path),chapter:String(num(path)),words:[]}}let vs=getVerses(chapter),sp=splitVerses(vs);words=sp.arr;verseStarts=sp.starts;if(!words.length){words=(original.words||[]).map(w=>({hebrew:w.hebrew||w.word,verse:1}));verseStarts=[0]}alignToOriginal(words,original.words||[]);anchors.clear();estimated=[];$('verse').innerHTML=verseStarts.map((_,i)=>'<option value="'+i+'">'+(i+1)+'</option>').join('');$('verse').onchange=render;let u=chapter.audio_he_url||chapter.audio_url||chapter.audio||chapter.hebrew_audio_url||chapter.audio_he||chapter.hebrew_audio||chapter.audioUrl||chapter.mp3||'';if(typeof u==='object')u=u.url||u.he||'';if(!u){let r=await fetch(raw+path.replace(/chapter\.json$/,'audio_url.txt')+'?t='+Date.now());if(r.ok)u=(await r.text()).trim()}$('audio').src=u?new URL(u,raw+path).href:'';$('audio').load();render();status('נטען '+book(path)+' פרק '+num(path)+' | '+words.length+' מילים | '+verseStarts.length+' פסוקים'+(u?'':' | לא נמצאה כתובת אודיו'));}catch(e){status('שגיאה: '+e.message)}};
function render(){let v=+$('verse').value||0,start=verseStarts[v]||0,end=verseStarts[v+1]??words.length;let el=$('words');el.replaceChildren();for(let i=start;i<end;i++){let b=document.createElement('button');b.textContent=words[i].hebrew;b.dataset.index=i;if(anchors.has(i))b.classList.add('marked');b.title='מילה '+(i+1)+(anchors.has(i)?' | עוגן '+fmt(anchors.get(i)):'');b.onclick=()=>{let t=$('audio').currentTime;if(!Number.isFinite(t))return;anchors.set(i,round(t));render();updateAnchors()};el.append(b)}updateAnchors()}
function updateAnchors(){let a=[...anchors].sort((x,y)=>x[0]-y[0]);$('summary').textContent='עוגנים: '+a.length+' מתוך '+words.length+' מילים';let el=$('anchors');el.replaceChildren();if(!a.length)return;let table=document.createElement('table');table.innerHTML='<tr><th>מילה</th><th>פסוק</th><th>זמן בשניות</th><th>פעולה</th></tr>';for(let [i,t] of a){let tr=document.createElement('tr');let c1=document.createElement('td');c1.textContent=words[i].hebrew;let c2=document.createElement('td');c2.textContent=words[i].verse;let c3=document.createElement('td'),inp=document.createElement('input');inp.type='number';inp.step='.01';inp.value=t;inp.onchange=()=>{anchors.set(i,round(+inp.value));render()};c3.append(inp);let c4=document.createElement('td'),del=document.createElement('button');del.textContent='מחק';del.onclick=()=>{anchors.delete(i);render()};c4.append(del);tr.append(c1,c2,c3,c4);table.append(tr)}el.append(table)}
function estimate(){let a=[...anchors].sort((x,y)=>x[0]-y[0]);if(!a.length)throw Error('יש לקבוע לפחות עוגן אחד');for(let k=1;k<a.length;k++)if(a[k][1]<=a[k-1][1])throw Error('זמני העוגנים חייבים לעלות לפי סדר המילים');let old=original.words||[];let oldStarts=words.map(w=>w.oldIndex!==undefined?Number(old[w.oldIndex]?.start):NaN);let out=[];for(let i=0;i<words.length;i++){let left=a.filter(x=>x[0]<=i).at(-1),right=a.find(x=>x[0]>=i);let t;if(left&&right&&left[0]!==right[0]){let weight=(i-left[0])/(right[0]-left[0]);let oL=oldStarts[left[0]],oR=oldStarts[right[0]],oi=oldStarts[i];if(Number.isFinite(oi)&&Number.isFinite(oL)&&Number.isFinite(oR)&&oR>oL)weight=Math.max(0,Math.min(1,(oi-oL)/(oR-oL)));t=left[1]+(right[1]-left[1])*weight}else if(left&&right)t=left[1];else if(left){let base=oldStarts[left[0]],now=oldStarts[i];t=left[1]+(Number.isFinite(now)&&Number.isFinite(base)?now-base:(i-left[0])*.42)}else{let base=oldStarts[right[0]],now=oldStarts[i];t=right[1]-(Number.isFinite(now)&&Number.isFinite(base)?base-now:(right[0]-i)*.42)}out.push(Math.max(0,round(t)))}for(let i=1;i<out.length;i++)out[i]=Math.max(out[i],out[i-1]);estimated=out.map((t,i)=>{let next=out[i+1];let oldW=old[words[i].oldIndex]||{};let dur=Math.max(.08,Number(oldW.end)-Number(oldW.start)||.36);let end=next!==undefined?Math.max(t,Math.min(t+dur,next)):t+dur;return {position:i,hebrew:words[i].hebrew,start:round(t),end:round(end)}});$('summary').textContent='חושבו '+estimated.length+' מילים מתוך '+a.length+' עוגנים. תזמון בין עוגנים הוא אומדן; מומלץ לקבוע עוגנים נוספים לאורך הפרק.'}
$('estimate').onclick=()=>{try{estimate()}catch(e){status(e.message)}};$('download').onclick=()=>{try{estimate();let data={...original,book:original.book||chapter.book||book(path),chapter:String(num(path)),words:estimated};delete data.audio_start_offset;let blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='readalong_words.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status('הורד readalong_words.json עבור '+book(path)+' פרק '+num(path))}catch(e){status('לא ניתן להוריד: '+e.message)}};$('clear').onclick=()=>{if(confirm('למחוק את כל העוגנים בפרק?')){anchors.clear();estimated=[];render()}};$('back').onclick=()=>{$('audio').currentTime=Math.max(0,$('audio').currentTime-1)};$('forward').onclick=()=>{$('audio').currentTime+=1};$('slower').onclick=()=>{$('audio').playbackRate=.75};$('normal').onclick=()=>{$('audio').playbackRate=1};$('audio').addEventListener('timeupdate',()=>{$('clock').textContent=fmt($('audio').currentTime)});init();</script></html>
