l damages a shared world built over time."], "2:16": ["מעשים בתוך קשר אישי משפיעים על תחושת הביטחון והאמון בחברה כולה. החירות האישית אינה מתירה להתעלם מפגיעות הזולת.", "Actions within private relationships also affect trust and safety in society. Personal freedom does not license disregard for others."], "2:17": ["כאשר מכנים עוול בשם צדק, קשה עוד יותר לזהות את הנפגעים ולתקן את המצב. יושר מוסרי מתחיל בשפה שאינה מסתירה את המציאות.", "When injustice is called justice, victims become harder to recognize and wrongs harder to repair. Moral honesty begins with truthful language."], "3:2": ["שינוי עמוק אינו רק הבטחה מנחמת; הוא עשוי לחשוף הרגלים ופגמים שאנו מעדיפים להסתיר. צמיחה מחייבת לעמוד באי־הנוחות הזאת.", "Deep change is not only comforting; it may expose habits and faults we would rather hide. Growth requires facing that discomfort."], "3:5": ["חברה אינה נמדדת רק בחוקיה אלא גם במידת ההגנה שהיא מעניקה למי שקולם חלש. עוול כלפי פגיעים חושף כשל מוסרי יסודי.", "A society is judged not only by its laws but by how it protects those with little power. Mistreatment of the vulnerable reveals a basic moral failure."], "3:7": ["אי אפשר לצפות לחידוש היחסים בלי לשנות את הדפוסים שפגעו בהם. פיוס אינו נוסטלגיה אלא מחויבות להתנהגות אחרת.", "Relationships cannot be renewed while harmful patterns remain unchanged. Reconciliation is not nostalgia but commitment to different conduct."], "3:8": ["כשאדם מנצל משאב שנועד לשרת את הכלל, הוא פוגע ביותר מן הסכום שנלקח. הוא מערער את האמון שמאפשר פעולה משותפת.", "Misusing resources intended for the common good harms more than the amount taken. It weakens the trust that makes cooperation possible."], "3:10": ["תרומה לטובת הכלל מחברת בין הצלחת היחיד לבין רווחת הקהילה. חברה יציבה אינה מתקיימת רק מציפייה לקבל.", "Contributing to the common good links individual success to community welfare. A resilient society cannot rest solely on expecting to receive."], "3:14": ["הדרישה שכל מעשה טוב יניב רווח מיידי מצמצמת את המוסר לעסקה. יש מעשים שערכם טמון ביושרם ובה const ZECHARIAH_INTERPRETATIONS={"1:3": ["אין די בגעגוע לעבר טוב יותר. שינוי מוסרי דורש פעולה בהווה והכרה באחריותנו למה שיבוא.", "Longing for a better past is not enough. Moral renewal requires present action and ownership of the future."], "1:4": ["מורשת יכולה ללמד, אך אינה מחייבת לחזור על כישלונות. חירות מוסרית כוללת את היכולת לבחון מחדש מנהגים מושרשים.", "Tradition can teach without compelling repetition of old failures. Moral freedom includes reexamining inherited habits."], "2:8": ["פגיעה באדם אינה נמדדת רק בעוצמתו או במעמדו. כבודו דורש הגנה גם כאשר אין לו יכולת להתגונן.", "The seriousness of harm does not depend on a person’s power or status. Dignity deserves protection even when defense is impossible."], "3:4": ["אדם אינו חייב להישאר מוגדר לעד על ידי כישלונותיו. תיקון דורש הכרה בעבר, אך גם פתח להתחלה חדשה.", "A person need not be defined forever by past failure. Repair acknowledges the past while allowing a new beginning."], "4:6": ["משאבים וכוח חשובים, אך אינם מספיקים בלי משמעות משותפת ומחויבות. הישג יציב זקוק ליותר מאמצעי כפייה.", "Resources and power matter, but lasting achievement also requires shared purpose and commitment."], "4:10": ["שינויים עמוקים מתחילים לעיתים בצעד צנוע. ערכה של פעולה אינו נקבע רק על פי הרושם הראשוני שהיא יוצרת.", "Deep change often begins with a modest step. An action’s worth is not measured only by its initial appearance."], "5:3": ["שקר וגניבה פוגעים מעבר לקורבן הישיר. הם שוחקים את הביטחון ההדדי שעליו נשענים חיי קהילה.", "Lying and theft harm more than their immediate victims. They erode the mutual confidence on which communities depend."], "6:13": ["כוח ומעמד מקבלים הצדקה כאשר הם מאפשרים חיים משותפים ולא רק מפארים את המחזיק בהם.", "Power and status gain legitimacy when they sustain shared life rather than glorify their holder."], "7:9": ["משפט הוגן דורש כללים, אך גם יכולת לראות את האדם שמאחורי המקרה. צדק ללא חמלה עלול להפוך לנוקשות עיוורת.", "Fair judgment needs principles and an ability to see the person behind the case. Justice without compassion can become blind rigidity."], "7:10": ["מי שאינו יכול להגן על עצמו תלוי במיוחד בהגינות הציבור. אחריות מוסרית נבחנת בהגנה על אלמנה, יתום, גר ועני.", "Those unable to defend themselves depend especially on public fairness. Moral responsibility is tested in protecting the vulnerable."], "7:11": ["אדם שסוגר עצמו לביקורת מוותר מראש על האפשרות ללמוד. הקשבה אינה חולשה אלא תנאי לצמיחה.", "Someone who shuts out criticism gives up the chance to learn. Listening is not weakness but a condition for growth."], "8:16": ["שלום יציב אינו נשען על הסתרת עוול, ואמת מוסרית אינה מחייבת השפלה. שניהם זקוקים לאמון ולהגינות.", "Lasting peace cannot rest on concealing injustice, and truth need not humiliate. Both require trust and fairness."], "8:17": ["כשאדם מטפח רצון להרע, הוא משנה את יחסו לזולת גם לפני שפעל. תיקון מוסרי מתחיל בבחינת הכוונה.", "Nurturing ill will changes how we see others even before acting. Moral reform begins by examining intention."], "8:19": ["חגיגה וחיים טובים אינם מנוגדים ליושרה. דווקא בשעות שמחה חשוב לשמור על אמת ועל שלום עם אחרים.", "Celebration and a good life need not conflict with integrity. Joy is richer when joined to truth and peace."], "9:9": ["מנהיגות אינה חייבת להישען על ראוותנות. לעיתים סמכות מוסרית נוצרת דווקא מן היכולת לרסן את הכוח.", "Leadership need not rely on spectacle. Moral authority can grow from restraint rather than display."], "9:12": ["נסיבות קשות מצמצמות חירות, אך אינן חייבות למחוק את היכולת לדמיין עתיד אחר. תקווה יכולה לשמור על נכונות לפעול.", "Hard circumstances constrain freedom without necessarily erasing the ability to imagine another future. Hope can preserve agency."], "10:1": ["הכרה בתלות שלנו באחרים ובכוחות שמחוץ לשליטתנו מאפשרת פעולה מפוכחת יותר. עצמאות אינה מחייבת בדידות.", "Recognizing dependence on others and forces beyond our control allows wiser action. Independence need not mean isolation."], "10:2": ["כשאדם מבקש ודאות בתוך אי־ודאות, קל לפתות אותו באשליות. אחריות מוסרית מחייבת שלא לסחור בתקוות הזולת.", "When people seek certainty amid uncertainty, illusions are tempting. Ethical responsibility forbids exploiting others’ hopes."], "11:5": ["כוחו של מנהיג משפיע על חייהם של מי שתלויים בו. ניצול האמון הופך סמכות לכלי פגיעה.", "A leader’s choices shape the lives of those who depend on them. Abusing trust turns authority into harm."], "11:17": ["ערכו של מעשה אינו נקבע רק במחירו הכספי. לעיתים בחירה צנועה חושפת כיצד אדם מעריך נאמנות ואמון.", "An act’s meaning is not measured only in money. A modest choice can reveal how one values loyalty and trust."], "12:10": ["הכרה בחולשה אינה כניעה. לעיתים היא מאפשרת לבקש עזרה, להכיר בכאב ולהתחיל בתיקון.", "Admitting vulnerability is not surrender. It can make room for help, acknowledgment of pain, and repair."], "13:1": ["התחדשות מוסרית אינה מתרחשת באמצעות הכחשת הפגיעה. היא דורשת בחינה אמיצה של הטעויות והשלכותיהן.", "Moral renewal cannot come from denying harm. It requires facing mistakes and their consequences."], "13:9": ["אובדן יכול לשנות את העולם המוכר, אך אינו חייב לסגור את העתיד. האפשרות להתחיל מחדש מעניקה כוח להתמיד.", "Loss can transform the familiar world without closing the future. The possibility of renewal gives strength to continue."], "14:9": ["חזון של אחדות מוסרית מאתגר את הנטייה לצמצם ערך ואמת לגבולות השייכות שלנו.", "A vision of moral unity challenges the tendency to confine truth and worth to the boundaries of our own group."], "14:20": ["ההבחנה בין חיי רוח לחיי מעשה אינה חייבת להיות מוחלטת. גם פעולות פשוטות יכולות לבטא ערכים עמוקים.", "The division between spiritual ideals and practical life need not be absolute. Ordinary acts can express profound values."]};

const HAGGAI_INTERPRETATIONS={"1:2": ["כאשר מחויבות חשובה נדחית שוב ושוב, הזמן עצמו הופך לתירוץ. אחריות מחייבת להחליט מתי מתחילים לפעול.", "When an important obligation is repeatedly delayed, time itself becomes an excuse. Responsibility requires deciding when to act."], "1:4": ["דאגה לבית הפרטי חשובה, אך היא אינה פוטרת מהשקעה במה שמאפשר לקהילה כולה לשגשג.", "Caring for a home matters, but it does not absolve us from sustaining the wider community."], "1:5": ["לפני שממשיכים להשקיע מאמץ באותה דרך, ראוי לשאול אם המעשים מקדמים את הערכים והמטרות שבחרנו.", "Before repeating our efforts, we should ask whether our actions actually serve our chosen values and goals."], "1:6": ["אדם יכול לעבוד ללא הרף ועדיין לחוש ריקנות. משמעות אינה נמדדת רק בכמות ההישגים אלא בהתאמתם למה שחשוב באמת.", "A person may work endlessly and still feel empty. Meaning depends not only on achievement but on what achievement serves."], "1:8": ["כוונות יפות אינן בונות דבר לבדן. שינוי מתחיל כאשר רצון הופך למאמץ מעשי ומתמשך.", "Good intentions build nothing by themselves. Change begins when aspiration becomes sustained action."], "1:9": ["כאשר כל אדם דואג רק לצרכיו, נכסים משותפים עלולים להיזנח. אחריות הדדית היא תנאי לשגשוג חברתי.", "When everyone attends only to private needs, shared goods can be neglected. Mutual responsibility makes collective flourishing possible."], "1:13": ["ברגעי חולשה, הידיעה שאיננו פועלים לבד יכולה להפוך חשש לנכונות להתחיל מחדש.", "In moments of uncertainty, knowing we are not alone can turn hesitation into a willingness to begin again."], "1:14": ["מנהיגות אינה רק מתן הוראות. היא מצליחה כאשר אנשים שונים רואים במשימה עניין משותף ונרתמים אליה מרצונם.", "Leadership is more than issuing commands. It succeeds when people see a task as their own and willingly take part."], "2:3": ["זיכרון הישגים קודמים עשוי לעורר השראה, אך גם לגרום לזלזול במה שנבנה כעת. ערכו של מפעל חדש אינו תלוי רק בגודלו.", "Past achievements can inspire, but they can also diminish appreciation of what is being built const CHRON2_INTERPRETATIONS={"1:10": ["בקשת חוכמה לפני עושר וכוח מבטאת הבנה שמנהיגות ראויה תלויה בשיקול דעת. הכרה במגבלות הידיעה היא ראשיתה של למידה.", "Seeking wisdom before wealth or power recognizes that good leadership depends on judgment. Awareness of our limits is the beginning of learning."], "1:12": ["אמצעים חומריים יכולים להרחיב אפשרויות, אך אינם מלמדים כיצד לבחור ביניהן. ערכם תלוי במטרות שלשמן משתמשים בהם.", "Material resources expand options but cannot tell us which to choose. Their worth depends on the purposes they serve."], "2:5": ["אדם יכול לבנות מבנים מפוארים, אך אין פירוש הדבר שהוא שולט בכל מה שהם מייצגים. ענווה שומרת על יחס נכון בין מעשה למשמעות.", "People can build magnificent structures without mastering everything they represent. Humility preserves the distinction between achievement and meaning."], "6:18": ["מקום קדוש או מוסד ציבורי עשויים לבטא ערכים גדולים, אך אסור לבלבל בין הסמל לבין המציאות הרחבה שהוא מבקש לשרת.", "A sacred place or institution may express great values, but its symbol must not be confused with the larger reality it seeks to serve."], "6:29": ["לכל אדם כאב משלו שאינו נבלע בסיפור הקולקטיבי. צדק וחמלה דורשים הקשבה גם למצוקה הפרטית.", "Each person's suffering has a distinct reality beyond the collective story. Justice and compassion require attention to individual pain."], "7:14": ["החיים משתנים בין שפע למחסור. חוכמה היא היכולת להימנע משאננות בהצלחה ומייאוש בכישלון.", "Life alternates between abundance and hardship. Wisdom resists complacency in success and despair in failure."], "7:19": ["הבחירה המוסרית אינה רק זכות אלא מחויבות לשקול את השלכות המעשים על הזולת ועל העתיד.", "Moral choice is not only a right but a duty to consider how our actions affect others and the future."], "9:7": ["שלטון נבחן בדרך שבה הוא משתמש בעוצמתו. כפייה שמשרתת רק את השליט מחלישה את הלגיטימיות המוסרית של סמכותו.", "Authority is judged by how it uses its strength. Coercion serving only the ruler undermines moral legitimacy."], "10:7": ["מנהיג שמעדיף להוכיח סמכות על פני הבנת המצוקה עלול לאבד את אמון הציבור. הקשבה היא צורה של אחריות.", "A leader who prizes displays of authority over understanding hardship risks losing public trust. Listening is a form of responsibility."], "10:15": ["כאשר הנהגה מתעלמת מקולות שונים, היא מעמיקה ניכור. כוח יציב נשען גם על הסכמה ועל יחס מכבד.", "When leadership ignores differing voices, alienation grows. Durable authority also depends on consent and respect."], "12:7": ["עמידה לצד ערך אינה תמיד בטוחה או פופולרית. אומץ נמדד בנכונות לשאת במחיר של פעולה נכונה.", "Standing by a principle is not always safe or popular. Courage appears in willingness to bear the cost of doing right."], "14:11": ["הצלחה מוסרית מחייבת גם תכנון, התמדה ומוכנות לבחון תוצאות. כוונה ראויה לבדה אינה מבטיחה מעשה ראוי.", "Ethical success also requires planning, persistence, and attention to results. Good intentions alone do not ensure good outcomes."], "15:7": ["ביקורת שאינה נעימה לשמיעה יכולה לחשוף טעויות לפני שיהפכו לאסון. חוכמה היא לאפשר לאמת להישמע.", "Unwelcome criticism can reveal errors before they become disasters. Wisdom makes room for difficult truths."], "16:9": ["היעדר ודאות אינו סיבה להימנע מפעולה. אחריות מוסרית נבחנת בבחירות שאנו עושים בתוך מגבלות כוחנו.", "Uncertainty is no excuse for inaction. Moral responsibility is tested by the choices we make within our limits."], "18:7": ["שותפות אינה מתמצה בהצהרות. היא מתגלה כאשר אדם נחלץ לעזרת האחר בשעת סכנה.", "Partnership is more than a declaration. It becomes real when people help one another in danger."], "19:7": ["מעשה מוסרי אינו נעשה ראוי רק בזכות הכרה חיצונית. יושרה היא נאמנות לערכים גם ללא תגמול.", "A good act does not depend on public recognition. Integrity means remaining faithful to principles without reward."], "20:20": ["כוח יכול לסייע בהתמודדות עם סכנה, אך אינו מחליף שיקול דעת, אמון ומגבלות מוסריות.", "Strength may help confront danger, but it cannot replace judgment, trust, and ethical restraint."], "24:19": ["ביטחון עצמי אינו מצדיק זלזול באחרים. כאשר כוח פוגש גאווה בלתי מרוסנת, גדלה הסכנה לפגיעה.", "Confidence does not justify contempt. Power combined with unchecked pride increases the risk of harm."], "25:9": ["כוונות טובות של יחידים אינן מספיקות כאשר נורמות ומוסדות מעודדים עוול. שינוי עמוק דורש תיקון של הכללים המשותפים.", "Good intentions are insufficient when institutions reward wrongdoing. Deep change requires reforming shared rules."], "26:16": ["הצלחה עלולה ליצור אשליה שאדם פטור ממגבלות. דווקא בשיא העוצמה נדרשת היכולת לעצור ולהכיר בגבולות.", "Success can create the illusion of being above limits. Restraint matters most at the height of power."], "28:9": ["מנהיגות אינה מתבטאת רק ביכולת לפקד. היא מחייבת הקשבה, לימוד והבנת ההשלכות של בחירה.", "Leadership is more than commanding others. It requires listening, learning, and considering consequences."], "29:9": ["מעמד או תפקיד אינם מבטיחים רגישות מוסרית. הערך האמיתי ניכר בעזרה למי שזקוק לה.", "Status and office do not guarantee compassion. Moral worth is visible in helping those in need."], "30:9": ["הכרה בטעות אינה חולשה אלא צעד ראשון לקראת תיקון. חברה המסוגלת לבחון את עצמה שומרת על תקווה לעתיד.", "Acknowledging mistakes is not weakness but the first step toward reform. A self-examining society keeps hope alive."], "32:8": ["מנהיגות בעת משבר יכולה לעורר אומץ בלי להכחיש סכנות. תקווה אחראית מחברת בין ראיית המציאות לבין נכונות לפעול.", "Leadership in crisis can inspire courage without denying danger. Responsible hope joins realism with action."], "33:12": ["כאשר סמכות אינה מרוסנת, היא עלולה לפגוע גם במי שהייתה אמורה להגן עליו. מוסר דורש גבולות ברורים לכוח.", "Unchecked authority may harm the very people it should protect. Ethics demands clear limits on power."], "34:31": ["הצהרות על נאמנות לעקרונות מקבלות משמעות כאשר הן מנחות התנהגות יומיומית, גם בלי פיקוח.", "Declarations of principle gain meaning when they guide everyday conduct, even without supervision."], "35:21": ["אין להסתפק בציפייה שהחברה כולה תשתנה. לכל אדם יכולת להתחיל בתיקון במקום שבו הוא פועל.", "We need not wait for society to change all at once. Each person can begin reform where they act."], "36:16": ["פגיעה במוסדות ובאמון עשויה להתרחש במהירות, בעוד ששיקומם דורש שנים של עבודה. האחריות לשמר גדולה מן הרצון לנצח ברגע.", "Institutions and trust can be destroyed quickly, while rebuilding takes years. Preserving them requires long-term responsibility."], "36:22": ["כישלון עמוק אינו מבטל את האפשרות להתחיל מחדש. תקווה נעשית ממשית כאשר היא מלווה במעשה ובהתחדשות.", "Profound failure does not erase the possibility of a new beginning. Hope becomes real through action and renewal."]};

 סדר העדיפויות","Awareness of mortality changes our priorities"]};
const CHRON1_INTERPRETATIONS={"4:10":["בקשתו של יעבץ מבטאת את האפשרות לדמיין חיים רחבים יותר מן המצב הקיים. תקווה אינה הבטחה להצלחה; היא הנכונות לבקש, להתאמץ ולפתוח פתח לשינוי.","Jabez imagines a life beyond his present constraints. Hope is no guarantee of success; it is the willingness to ask, strive, and remain open to change."],"4:9":["יעבץ נושא שם שנולד מתוך כאב, אך סיפורו אינו מסתיים בכאב. האדם אינו בוחר את נסיבות ראשיתו, אבל יכול לבחור כיצד לתת להן משמעות וכיצד לפעול מכאן והלאה.","Jabez receives a name born of sorrow, yet sorrow does not have the final word. We do not choose our beginnings, but we can choose what meaning to give them and how to act afterward."],"10:13":["מות שאול מוצג כתוצאה של הפרת אמון והתרחקות מחובותיו. ככל שאדם נושא באחריות גדולה יותר, כך מעשיו מחייבים בחינה מוסרית ולא רק מדידה של כוחו ומעמדו.","Saul’s downfall is linked to broken trust and neglected obligations. The greater a person’s authority, the more their actions require moral scrutiny, not merely admiration of power or status."],"10:14":["העברת המלוכה מזכירה ששלטון איננו בעלות פרטית או זכות מובטחת. הנהגה נבחנת בנאמנות לאחריות שלשמה ניתנה, והיא עלולה להישמט כשאחריות זו נזנחת.","The transfer of kingship reminds us that leadership is not private property or an unconditional entitlement. Its legitimacy depends on fidelity to the responsibilities for which it was entrusted."],"11:9":["הפסוק מתאר את דוד כמי שהולך וגדל, לא כמי שהגיע בבת אחת לשלמות. צמיחה אנושית נוצרת לאורך זמן מתוך התמדה, למידה ויחסים, ואינה נמדדת רק ברגע של הצלחה.","David’s greatness unfolds over time rather than appearing fully formed. Human growth emerges through persistence, learning, and relationships, not from a single moment of success."],"12:18":["דוד מוכן לקבל את הבאים אליו לשלום, אך אינו מתעלם מן האפשרות של מרמה. אמון בוגר אינו חשדנות מוחלטת וגם לא תמימות; הוא נכונות לשותפות לצד אחריות לבחון כוונות ומעשים.","David welcomes those who come in peace while recognizing the possibility of deceit. Mature trust is neither total suspicion nor naivety: it combines openness to cooperation with careful judgment."],"13:10":["פרשת עוזא מעוררת שאלה קשה על הפער בין רצון לסייע לבין אחריות לדרך הפעולה. גם כשמטרתנו ראויה, יש חשיבות לשיקול דעת, לגבולות ולתוצאות האפשריות של המעשה.","Uzzah’s story raises a difficult question about the gap between a wish to help and responsibility for how we act. Even worthy aims require judgment, boundaries, and attention to consequences."],"13:11":["תגובתו של דוד לאסון מלמדת שגם אדם מאמין או בעל סמכות יכול להזדעזע מאירוע שאינו מבין. הכרה בקושי אינה חולשה; היא תנאי למחשבה מוסרית שאינה מסתפקת בהצדקה מהירה.","David’s response to tragedy shows that even a person of faith or authority can be shaken by what they cannot explain. Acknowledging difficulty is not weakness; it is the beginning of serious moral reflection."],"14:2":["דוד מבין שמלכותו התרוממה בעבור ישראל. מכאן עולה עיקרון כללי: סמכות אינה תכלית לעצמה; הצדקתה נובעת מן האחריות שהיא נושאת כלפי האנשים המושפעים ממנה.","David understands that his kingship was established for Israel’s sake. Authority is not an end in itself; its justification lies in responsibility to those whose lives it affects."],"16:11":["הקריאה לבקש תמיד מצביעה על כך שהחיים הרוחניים אינם הישג חד־פעמי. גם מי שמצא דרך חייב להמשיך לשאול, להקשיב ולחדש את מחויבותו למה שחשוב לו.","The call to seek continually suggests that spiritual life is not a one-time achievement. Even those who have found a path must keep questioning, listening, and renewing their commitments."],"16:22":["האזהרה שלא לפגוע במשיחים ובנביאים מבטאת עיקרון של ריסון הכוח. עצם היכולת לפגוע באדם אינה מקנה רשות מוסרית לעשות זאת; חברה ראויה מגינה גם על מי שקולם אינו נוח לשלטון.","The warning against harming the anointed and the prophets expresses a principle of restrained power. The ability to harm does not create a moral right to do so; a just society protects even voices that unsettle authority."],"17:4":["דוד מבקש לבנות בית, אך נענה שלא הוא יעשה זאת. לעיתים בגרות פירושה להכיר בכך שהמטרה גדולה מן האדם, ולהסכים שאחרים ימשיכו את מה שהתחלנו.","David wishes to build a house but is told he will not be the builder. Maturity sometimes means accepting that a purpose is larger than oneself and allowing others to complete what we began."],"17:7":["הזכרת דוד כרועה צאן מלמדת שהמעמד הנוכחי אינו כל סיפורו של אדם. זיכרון ההתחלה עשוי לשמור על ענווה ולמנוע ממנהיג לראות את עצמו כנעלה על הציבור.","The reminder that David once tended sheep shows that present status is not a person’s whole story. Remembering humble beginnings can protect against arrogance and distance from others."],"17:16":["השאלה ״מי אני״ מבטאת הכרה בכך שלא כל הישג הוא פרי כוחו של היחיד. מי שמכיר בעזרה, במזל ובאמון שקיבל מסוגל להחזיק בהצלחה בלי להפוך אותה להתנשאות.","The question “Who am I?” recognizes that achievements are not solely the product of individual power. Awareness of help, circumstance, and trust makes it possible to succeed without arrogance."],"19:13":["הקריאה להתחזק למען העם מלווה בהכרה שהתוצאה אינה נתונה בידי הלוחמים בלבד. אחריות דורשת מאמץ ומסירות גם כאשר אין ודאות שהמעשה יצליח.","The call to stand firm for the people is paired with recognition that the outcome is not fully theirs to command. Responsibility demands effort and commitment even when success is uncertain."],"21:1":["ההסתה למנות את העם מזכירה שהחזקה בכוח אינה מבטיחה שיקול דעת. לעיתים הרצון למדוד ולשלוט באחרים גובר על השאלה אם המדידה עצמה משרתת מטרה ראויה.","The incitement to count the people reminds us that power does not guarantee sound judgment. The desire to measure and control can overshadow the question of whether the measurement serves a worthy purpose."],"21:8":["דוד אינו מסתפק בהסבר נסיבות המעשה אלא מודה שחטא. הודאה כזאת אינה מוחקת את הנזק, אך היא מאפשרת לאדם להפסיק להצדיק את עצמו ולהתחיל בתיקון.","David does not merely explain the circumstances of his act; he admits wrongdoing. Confession does not undo harm, but it allows a person to stop rationalizing and begin making amends."],"22:5":["דוד מכין משאבים למפעל שבנו עתיד לבצע. משמעותה של אחריות בין־דורית היא להשקיע גם במה שלא נזכה להשלים או לראות, משום שערכו אינו תלוי בתהילה האישית שלנו.","David prepares resources for a work his son will carry out. Intergenerational responsibility means investing in things we may never finish or witness, because their value does not depend on our personal acclaim."],"22:13":["העידוד להיות חזק ואמיץ מופיע לצד הדרישה לשמור משפטים וחוקים. אומץ ראוי אינו רק נכונות לפעול, אלא נכונות להכפיף את הכוח לעקרונות ולגבולות.","The call to be strong and courageous stands alongside a demand to uphold laws and judgments. Worthy courage is not mere boldness; it is strength governed by principles and limits."],"28:9":["דוד מבקש משלמה לעבוד בלב שלם ובנפש חפצה. מעשה חיצוני יכול להתבצע מתוך לחץ, אך מחויבות עמוקה נוצרת כאשר האדם מבין את ערכיו ובוחר בהם מרצונו.","David calls Solomon to serve with a whole heart and willing mind. Outward behavior can be compelled, but deep commitment grows when a person understands and freely chooses their values."],"28:20":["דוד אינו מבטיח לשלמה דרך נטולת פחד, אלא קורא לו לפעול למרות הפחד. עזרה מיטיבה אינה מחליפה את האדם בהחלטותיו; היא מעניקה לו ביטחון לשאת באחריות בעצמו.","David does not promise Solomon a life without fear; he urges him to act despite it. Good support does not take over another person’s decisions; it strengthens their capacity to carry responsibility."],"29:9":["העם שמח משום שהנתינה באה מלב שלם. כאשר אנשים תורמים מתוך רצון ולא מכפייה, המעשה מחזק לא רק את המטרה המשותפת אלא גם את תחושת השותפות והכבוד ההדדי.","The people rejoice because their gifts are freely offered. Voluntary generosity strengthens not only a shared project but also the sense of belonging and mutual respect among its participants."],"29:15":["דימוי החיים לצל מזכיר שהזמן שלנו מוגבל. דווקא משום שאין לאדם אחיזה קבועה בעולם, מתחדדת השאלה מה ראוי לעשות בזמן שניתן לו ומה יותיר לאחרים.","Life compared to a passing shadow reminds us that our time is limited. Because we cannot possess the world forever, the question of how to use our time and what to leave others becomes more urgent."]};

aming others. It requires acknowledging our own part in what has happened."], "9:18": ["הכרה בכך שלא הכול מגיע לנו בזכות היא תנאי לחמלה אמיתית. היא מאפשרת לראות גם את צורכיהם של אחרים.", "Recognizing that we are not entitled to everything is a foundation for compassion and attention to others."], "10:12": ["לפני שממהרים להשיב, יש ערך לעצם הרצון לברר את משמעות הדברים. ענווה מחשבתית פותחת דרך ללמידה.", "Before rushing to answer, we benefit from seeking understanding. Intellectual humility opens a path to learning."], "11:32": ["נסיבות קשות אינן מבטלות את האפשרות לפעול לפי ערכים. לעיתים דווקא הלחץ חושף את עומק המחויבות.", "Hard circumstances do not erase the possibility of acting on values. Pressure can reveal the depth of commitment."], "12:3": ["הבנה בעלת ערך אינה מסתפקת בהצלחתו של היחיד. היא מסייעת לאחרים למצוא דרך צודקת וטובה יותר.", "Valuable understanding does not end with individual achievement. It helps others find a better and more just path."], "12:13": ["סבלנות אינטלקטואלית מאפשרת להמשיך לחפש בלי לדרוש תשובה מיידית לכל שאלה. הכרה במגבלות הידיעה אינה ויתור על החיפוש.", "Intellectual patience lets us keep seeking without demanding instant answers. Recognizing uncertainty is not abandoning inquiry."]};

const LAMENTATIONS_INTERPRETATIONS={"1:1": ["הבדידות העמוקה ביותר אינה רק היעדר אנשים סביבנו, אלא התחושה שהקשרים שהעניקו לנו מקום בעולם חדלו להחזיק אותנו.", "The deepest loneliness is not merely being alone, but feeling that the relationships which gave us a place in the world have disappeared."], "1:2": ["משבר חושף את ההבדל בין קשר המבוסס על נוחות לבין נאמנות העומדת גם מול כאב ומחיר אישי.", "A crisis reveals the difference between convenient companionship and loyalty that endures pain and personal cost."], "1:9": ["אדם וחברה נדרשים להביט מעבר לצורך המיידי. הימנעות מחשיבה על השלכות מעשינו עלולה להפוך הצלחה זמנית לשבר.", "People and societies must look beyond immediate needs. Ignoring consequences can turn short-term success into collapse."], "1:12": ["אדישות לסבל שאינו שלנו מצמצמת את האנושיות המשותפת. עצם ההקשבה יכולה להיות ראשיתה של אחריות.", "Indifference to pain we do not share diminishes our common humanity. Attentive listening can be the beginning of responsibility."], "1:16": ["היכולת להתאבל ולבטא כאב מעידה על קשר למה שאבד. רגישות היא תנאי לחמלה, ולא היפוכה של עוצמה.", "The ability to mourn reveals our bond with what was lost. Sensitivity makes compassion possible and is not the opposite of strength."], "2:11": ["חברה נבחנת ביכולתה לראות את הפגיעים ביותר גם כשהיא עצמה במשבר. מצוקת ילדים מחייבת מעשה ולא רק צער.", "A society is tested by its care for the most vulnerable even in crisis. Children’s suffering calls for action, not sorrow alone."], "2:13": ["לא כל פצע נרפא בהשוואה או בנחמה מהירה. לעיתים הכרה בהיקף האובדן היא הדרך המכבדת ביותר לעמוד לצד הסובל.", "Not every wound yields to comparisons or quick comfort. Sometimes acknowledging the scale of loss is the most respectful response."], "2:14": ["אמירה מרגיעה שאינה נוגעת באמת עשויה להעניק הקלה רגעית אך למנוע התמודדות עם הגורמים למשבר.", "Reassurance detached from truth may briefly soothe, yet prevent us from confronting the causes of a crisis."], "3:21": ["הזיכרון אינו רק ארכיון של כאב. האפשרות לזכור גם חסד ומשמעות מאפשרת לאדם לדמיין עתיד מעבר לאובדן.", "Memory is more than an archive of pain. Recalling kindness and meaning can help us imagine a future beyond loss."], "3:22": ["החיים האנושיים אינם נשענים רק על הישגים אלא גם על חסד שמאפשר לקום לאחר כישלון.", "Human life rests not only on achievement, but on compassion that makes it possible to rise after failure."], "3:23": ["העבר אינו נמחק, אך כל יום מאפשר תגובה אחרת אליו. התחדשות אינה שכחה אלא בחירה להמשיך.", "The past is not erased, but each day offers a different response to it. Renewal is not forgetting; it is choosing to continue."], "3:25": ["המתנה אינה תמיד כניעה. כשהיא מלווה בהתמדה ובכוונה, היא יכולה לשמור על אפשרות התיקון גם כשאין פתרון מיידי.", "Waiting is not always surrender. Joined with persistence and purpose, patience can preserve the possibility of repair."], "3:26": ["רצון לתוצאה מהירה עלול להפוך את האכזבה לייאוש. יש תהליכים שבהם התמדה שקטה חשובה לא פחות מן הפעולה הנראית.", "Demanding instant results can turn disappointment into despair. Some forms of change require quiet endurance."], "3:27": ["אין צורך להאדיר סבל כדי ללמוד ממנו. ערכו האפשרי טמון בדרך שבה אדם מגיב אליו ולא בעצם הכאב.", "Suffering need not be glorified to yield insight. Its possible meaning lies in our response, not in pain itself."], "3:31": ["הכרה באפשרות של שינוי מונעת מן האדם לזהות את עצמו רק עם הרגע הקשה ביותר בחייו.", "The possibility of change prevents us from defining ourselves solely by the hardest moment of our lives."], "3:33": ["גם כאשר ענישה או גבולות נחוצים, אין הצדקה להפוך את סבלו של האחר למטרה בפני עצמה.", "Even when consequences or boundaries are necessary, another person’s suffering should not become an end in itself."], "3:35": ["מצב קשה אינו מבטל את זכויות האדם. דווקא כאשר הכוח מרוכז והפחד גובר נדרשת מחויבות עמוקה להגינות.", "Hard times do not cancel human rights. When power concentrates and fear rises, fairness matters all the more."], "3:40": ["קל לזהות אשמה אצל אחרים. תיקון אמיתי מתחיל בנכונות לבחון ביושר את הבחירות שלנו ולשנותן.", "It is easy to locate fault elsewhere. Genuine repair begins by examining our own choices and changing them."], "3:49": ["כאב עמוק אינו כפוף ללוח זמנים חיצוני. מתן מקום לאבל הוא חלק מן הכבוד לחיים ולקשרים שאבדו.", "Deep grief does not follow an external timetable. Making room for mourning honors the lives and bonds that were lost."], "4:1": ["מה שנראה יציב ומפואר עשוי להשתנות במהירות. ענווה נולדת מההכרה בשבריריותם של הישגים חיצוניים.", "What seems secure and splendid can change quickly. Humility grows from recognizing the fragility of outward achievements."], "4:3": ["היחס לתלויים בנו מגלה את אופיינו המוסרי. גם מחסור ופחד אינם מבטלים את האחריות לדאוג לחלשים.", "How we treat those who depend on us reveals our moral character. Scarcity and fear do not erase our duty of care."], "4:5": ["הרגל לשפע עלול ליצור אשליה שהמציאות תישאר כפי שהיא. חוסן נבנה גם ביכולת להסתגל ולא רק לצבור.", "A life of abundance can create the illusion of permanence. Resilience depends on adaptability, not accumulation alone."], "5:1": ["הדרישה לזכור אינה בהכרח דרישה לנקמה. פעמים רבות היא מבטאת צורך שהכאב ייראה ושסיפור הנפגע לא יימחק.", "The demand to remember is not necessarily a call for revenge. Often it is a plea that suffering be seen and not erased."], "5:7": ["אנשים נושאים לעיתים בתוצאות של בחירות שלא עשו. ההכרה בעוול ההיסטורי צריכה להוביל לאחריות משותפת ולא לייאוש.", "People sometimes bear the costs of choices they never made. Recognizing inherited injustice should inspire shared responsibility, not despair."], "5:15": ["שמחה אינה רק רגש פרטי; היא צומחת מתוך טקסים, קשרים ותחושת שייכות. כשהם נפגעים, נחשפת חשיבותם.", "Joy is not merely private feeling; it grows from shared practices, relationships, and belonging. Their loss reveals their value."], "5:21": ["השיבה אל חיים ראויים אינה רק החזרת העבר. היא דורשת נכונות פנימית לבנות יחס חדש לעצמנו ולאחרים.", "Returning to a worthy life is more than restoring the past. It requires an inner willingness to change our relationships and conduct."]};

const HOSEA_INTERPRETATIONS={"2:1": ["שייכות אינה חייבת להיבנות על אחידות מלאה. בני אדם יכולים לשוב ולראות את המשותף גם אחרי שנים של מרחק ומחלוקת.", "Belonging need not depend on complete agreement. People can rediscover what unites them after long periods of division."], "2:21": ["קשר יציב אינו מתקיים רק בזכות רגשות עזים. הוא דורש התנהגות עקבית, הוגנות ונכונות לשאת באחריות גם כשקשה.", "Lasting bonds require more than strong feelings. They depend on consistency, fairness, and responsibility when circumstances are difficult."], "4:1": ["כאשר אמון, אמת ודאגה לאחר נעלמים מן החיים הציבוריים, גם מערכות חזקות לכאורה מאבדות את הבסיס המוסרי שלהן.", "When honesty, trust, and concern for others disappear from public life, even seemingly strong institutions lose their moral foundation."], "4:6": ["לא כל חוסר ידיעה הוא תמים. לעיתים בני אדם נמנעים מללמוד דווקא מפני שהידע יחייב אותם לשנות את התנהגותם.", "Not all ignorance is innocent. Sometimes people avoid learning because knowledge would require them to change their behavior."], "6:3": ["הכרה באמת אינה רגע חד פעמי אלא תהליך. אדם נעשה טוב יותר כשהוא ממשיך לחפש, ללמוד ולתקן גם אחרי שכבר נדמה לו שהבין.", "Recognizing truth is not a single event but an ongoing process. Growth requires continuing to seek, learn, and repair."], "6:6": ["למעשה חיצוני אין ערך מוסרי מלא כאשר הוא מנותק מן היחס לאנשים. נאמנות לערכים נבחנת בדרך שבה אנו נוהגים בזולת.", "An outward act loses its moral substance when detached from how we treat people. Values are tested in our conduct toward others."], "6:9": ["אפשר להצהיר על עקרונות נעלים ובכל זאת לנהוג באכזריות. הפער בין הצהרה למעשה הוא מבחן היושרה האמיתי.", "People may proclaim noble principles while acting cruelly. The gap between words and actions reveals the truth about integrity."], "7:8": ["הסתגלות לסביבה עשויה להביא יתרונות, אך כאשר היא מחייבת ויתור על ערכים יסודיים, המחיר הפנימי עלול להיות גבוה.", "Adapting can bring advantages, but when it requires surrendering core values, the inner cost may be great."], "7:9": ["אדם עשוי לאבד מכוחו ומכיוונו בלי להרגיש. מודעות עצמית מחייבת לבחון לא רק משברים גלויים אלא גם שחיקה איטית.", "People can lose strength and direction without noticing. Self-awareness means attending to slow erosion, not only obvious crises."], "8:7": ["החלטות שנראות שוליות מצטברות ומשפיעות על עתיד שלם. אחריות מחייבת לחשוב על התוצאות האפשריות מעבר לרגע הנוכחי.", "Choices that seem minor can accumulate into far-reaching consequences. Responsibility requires thinking beyond the present moment."], "10:12": ["מוסר אינו רק השקפת עולם אלא עבודה יומיומית. כשאדם מתרגל לפעול ביושר ובחסד הוא יוצר תנאים לחיים טובים יותר.", "Ethics is not merely a worldview but daily practice. Repeated acts of fairness and kindness cultivate a better life."], "10:13": ["כוח יכול להשיג ציות זמני אך אינו יוצר אמון. חברה הבונה את עתידה רק על עוצמה מזניחה את היסודות שמחזיקים אותה לאורך זמן.", "Force may win temporary obedience but cannot create trust. A society built only on power neglects the foundations of endurance."], "11:4": ["לא כל שינוי מושג בכפייה. יחס אנושי, סבלנות וקשר של אמון עשויים להניע בני אדם יותר מאיומים ועונשים.", "Not every change comes through coercion. Patience, care, and trust may move people more deeply than threats or punishment."], "12:7": ["עסקה אינה הוגנת רק מפני שהיא חוקית. כאשר צד אחד מנצל חוסר ידע או חולשה של האחר, האמון החברתי נפגע.", "A transaction is not fair merely because it is legal. Exploiting another person’s weakness or ignorance damages social trust."], "12:10": ["לעיתים רעיון עמוק דורש משל ודימוי ולא הוראה ישירה. חוכמה כוללת גם יכולת להקשיב למשמעות שמאחורי המילים.", "Some truths are conveyed through image and metaphor rather than direct command. Wisdom includes hearing meaning beyond literal words."], "13:4": ["עצמאות אינה מחייבת ניתוק מכל קשר. הכרה בתלות הדדית יכולה לחזק את חירות האדם במקום לצמצם אותה.", "Independence need not mean severing every bond. Recognizing interdependence can strengthen rather than diminish freedom."], "13:14": ["הכרת ה const EZEKIEL_INTERPRETATIONS={"1:3":["היכולת להכיר במי שתומך בנו היא יסוד האחריות. כפיות טובה אינה רק חוסר נימוס, אלא כשל בהבנת התלות ההדדית שבין בני אדם.","Recognizing those who sustain us is the beginning of responsibility. Ingratitude reflects a failure to understand human interdependence."],"3:19":["חברה נבחנת בדרך שבה בעלי הכוח נוהגים במי שאינו יכול להתגונן. ניצול חולשה הוא עדות לכשל מוסרי של החזק.","A society is judged by how the powerful treat those unable to defend themselves. Exploiting vulnerability reveals a moral failure."],"11:19":["אדם אינו יכול להטיל את אחריותו המוסרית על דור אחר. כל דור וכל אדם נדרשים לבחון את בחירותיהם בעצמם.","No person can transfer moral responsibility to another generation. Each person must answer for their own choices."],"12:2":["כאשר עוול נעשה להרגל, האדם מפסיק לראות בו עוול. שחיקה מוסרית מתחילה באדישות הקטנה של היומיום.","When injustice becomes routine, we cease to recognize it. Moral erosion begins with everyday indifference."],"14:14":["זכותם של אחרים לפעול בצדק אינה פוטרת אותנו מן האחריות לפעול בעצמנו. יושרה אינה נכס שאפשר לשאול מאדם אחר.","The integrity of others cannot relieve us of our own duty to act. Conscience is not something we can borrow."],"16:49":["התחייבות מוסרית משמעותית דווקא כאשר העמידה בה אינה נוחה. ערכה של נאמנות מתברר במבחן הקושי.","A moral commitment matters most when honoring it is difficult. Loyalty is revealed through sacrifice."],"18:4":["העבר משפיע על האדם, אך אינו גוזר עליו עתיד קבוע. האפשרות לתקן מעשים מעניקה משמעות לאחריות אישית.","The past shapes us but need not dictate our future. The possibility of change gives personal responsibility its meaning."],"18:20":["אי אפשר להצדיק מעשה רע רק באמצעות ייחוסו למשפחה או לחברה. לצד השפעת הנסיבות נשמרת אחריותו של האדם לבחירותיו.","Family and society shape our choices, but they cannot fully excuse wrongdoing. Each person remains answerable for their actions."],"18:23":["שאיפה לתיקון מוסרי שונה מן הרצון לראות אדם נכשל. חברה מוסרית מעדיפה שינוי והתפכחות על פני נקמה.","Seeking justice is different from enjoying another's suffering. A moral society values reform over revenge."],"18:32":["לאדם ניתנת אפשרות להפסיק הרגלים הרסניים ולבחור בדרך חדשה. תקווה אמיתית נשענת גם על נכונות לפעול.","We can interrupt destructive patterns and choose a different path. Genuine hope includes a willingness to act."],"22:7":["הגינות אינה נבחנת רק ביחסים בין שווים. דווקא היחס לגר, ליתום ולמי שאין לו כוח חושף את אופייה המוסרי של חברה.","Fairness is tested not only among equals. Treatment of outsiders and the powerless reveals a society's moral character."],"22:12":["ערכים נשגבים מאבדים ממשמעותם כאשר חיי היומיום מלאים בניצול ובזלזול. מוסר מתחיל במעשים הקרובים ביותר.","Noble ideals ring hollow when everyday life is marked by exploitation. Ethics begins with ordinary actions."],"24:7":["מנהיגות מוסרית אינה רק חזרה על רצון הציבור. לעיתים תפקידה להציב אמת לא נוחה מול לחץ חברתי.","Moral leadership is not simply echoing public opinion. Sometimes it means speaking an unwelcome truth against social pressure."],"28:8":["אדם המעדיף תחושת ביטחון כוזבת על פני בירור המציאות דוחה את ההתמודדות עם הסכנה, אך אינו מבטל אותה.","Choosing comforting illusions over reality postpones confrontation with danger without removing it."],"33:11":["מעשים קודמים אינם מבטיחים צדק בהווה, וכישלונות קודמים אינם שוללים תיקון. כל בחירה חדשה נבחנת לגופה.","Past virtue does not guarantee present justice, and past failure does not prevent reform. Each new choice matters."],"33:15":["חרטה מקבלת משמעות כאשר היא מובילה להשבת מה שנלקח ולהפסקת הפגיעה. מילים לבדן אינן מחזירות אמון.","Remorse becomes meaningful when it leads to restitution and an end to harm. Words alone do not rebuild trust."],"34:4":["סמכות נועדה לשרת את מי שתלוי בה. כאשר מנהיג דואג רק לעצמו, הוא מפר את עצם ההצדקה לכוח שניתן לו.","Authority exists to serve those who depend on it. A leader who serves only themselves undermines the legitimacy of their power."],"34:16":["אחריות חברתית מחייבת לחפש את מי שאבד, לחזק את החלש ולדאוג לפצוע. הצלחת החזקים אינה מספיקה.","Social responsibility means seeking the lost, strengthening the weak, and caring for the injured. The success of the strong is not enough."],"34:18":["אין די בכך שאדם נהנה ממשאב כלשהו; עליו להימנע מלפגוע באפשרותם של אחרים ליהנות ממנו. חירות ללא התחשבות הופכת לשליטה.","Enjoying a resource does not entitle us to destroy others' access to it. Freedom without consideration becomes domination."],"36:26":["שינוי עמוק אינו רק החלפת כללים. הוא דורש רגישות חדשה לסבל הזולת ונכונות לראות את המציאות בעיניים אחרות.","Deep change is more than replacing rules. It requires renewed sensitivity to others' suffering and a different way of seeing."],"37:3":["גם כאשר העתיד נראה חסום, היכולת לדמיין התחדשות היא כוח אנושי ממשי. תקווה אינה הכחשת השבר אלא סירוב לראות בו סוף.","Even when the future seems closed, imagining renewal is a human strength. Hope does not deny loss; it refuses to make loss the end."],"37:14":["ייאוש מצמצם את אפשרויות הפעולה. האמונה ששינוי עדיין אפשרי מחזירה לאדם את הרצון לבנות מחדש.","Despair narrows our options. Believing that change remains possible restores the will to rebuild."],"43:8":["אפשר לפתוח פרק חדש בלי להתכחש למחויבויות שכבר נוצרו. תיקון העתיד דורש גם חשבון נפש על העבר.","A new beginning does not erase earlier obligations. Building a better future also requires reckoning with the past."],"47:8":["מוסדות חשובים נמדדים ביכולתם לשרת בני אדם. כאשר הסמל נעשה חשוב מן האדם, המטרה המוסרית הולכת לאיבוד.","Institutions matter insofar as they serve people. When a symbol becomes more important than human dignity, their moral purpose is lost."]};

const ISAIAH_INTERPRETATIONS={"1:17": ["הטוב אינו רק תחושה פנימית. הוא מחייב לימוד, תיקון עוול והגנה על מי שאין לו כוח.", "Goodness requires more than good intentions: it demands learning, correcting injustice, and defending the powerless."], "1:18": ["גם לאחר טעות חמורה אפשר להשתנות. האחריות למעשה נשארת, אך היא אינה שוללת אפשרות לתיקון.", "Even serious wrongdoing need not define a person forever; responsibility and the possibility of change coexist."], "2:4": ["החזון אינו רק הפסקת מלחמות, אלא הפניית היכולת האנושית מהרס ליצירה ולחיים.", "Peace is more than ending war: it redirects human skill and resources from destruction toward life."], "2:22": ["כל אדם מוגבל ופגיע. לכן אין למסור את המצפון ואת שיקול הדעת בידי אדם אחר ללא ביקורת.", "Every person is finite and vulnerable; conscience and judgment should never be surrendered blindly."], "5:20": ["כאשר קוראים לרע טוב ולטוב רע, השפה מפסיקה לחשוף את המציאות והופכת לכלי להסתרתה.", "Calling evil good corrupts language itself, allowing wrongdoing to masquerade as virtue."], "6:8": ["השאלה אינה רק מה העולם דורש מאיתנו, אלא האם נסכים להיות מי שפועל בתוכו.", "Purpose is found not only in hearing a call, but in choosing to respond and act."], "9:5": ["תקווה מדינית אינה נבנית רק מניצחון; היא תלויה בנכונות להפסיק לראות במלחמה גורל קבוע.", "Political hope requires imagining a future in which war is no longer treated as inevitable."], "11:6": ["עולם מתוקן הוא עולם שבו גם מי שעלול להיפגע יכול לחיות ללא פחד לצד החזק ממנו.", "A just world is one in which the vulnerable can live safely alongside the powerful."], "11:9": ["ידע לבדו אינו מבטיח טוב. החוכמה נמדדת גם ביכולתה להפחית פגיעה ולבנות חיים משותפים.", "Knowledge becomes wisdom when it restrains harm and enables people to live together."], "12:2": ["הפחד אינו נעלם תמיד, אך תחושת משען מאפשרת לאדם לפעול גם בתנאי אי־ודאות.", "Fear may remain, but trust gives people the courage to act amid uncertainty."], "25:4": ["עוצמה אינה רק היכולת לגבור על אחרים; היא גם היכולת להיות מחסה למי שאין לו הגנה.", "Strength is not merely power over others, but the ability to shelter those without protection."], "25:8": ["החזון של קץ הדמעות מכיר בכאב האנושי ומסרב לקבל אותו כאופק היחיד של החיים.", "The hope that tears may end acknowledges suffering without accepting it as life's final horizon."], "26:3": ["שלווה אינה היעדר משברים, אלא יכולת לשמור על כיוון פנימי גם כשהעולם משתנה.", "Peace of mind can mean holding to a guiding trust even when circumstances change."], "26:4": ["אמונה אינה רק תגובה לרגע של הצלחה; היא עמדה שמבקשת להחזיק גם בתקופות קשות.", "Deep trust is not simply a response to success; it seeks to endure through hardship."], "28:16": ["כשהכול מתערער, השאלה החשובה היא על מה בנינו את הביטחון שלנו מלכתחילה.", "In times of crisis, the decisive question is what we chose as the foundation of our confidence."], "30:15": ["לעיתים היכולת לעצור, להקשיב ולהימנע מפעולה פזיזה חזקה יותר מתגובה מיידית.", "Sometimes restraint, attention, and patience are stronger than immediate action."], "32:17": ["שלווה חברתית אינה יכולה להישען רק על שתיקה. היא זקוקה ליחסים הוגנים בין בני אדם.", "Lasting peace rests on justice, not merely on silence or the absence of open conflict."], "35:3": ["חברה אנושית נבחנת בשאלה אם היא מחזקת את מי שכוחותיו אזלו.", "A humane society is judged by whether it restores strength to those who have lost it."], "35:4": ["האומץ מתחיל כשאדם מכיר בסכנה ובכל זאת אינו מוותר על האפשרות לפעול.", "Courage begins when danger is acknowledged but does not dictate every choice."], "35:10": ["הזיכרון של כאב אינו שולל אפשרות לשמחה מחודשת; החיים יכולים להשתנות.", "Past suffering does not eliminate the possibility of renewed joy and a different future."], "40:8": ["מה שחולף אינו בהכרח חסר ערך, אך הוא מזכיר לנו להבחין בין הצלחה רגעית לבין עקרונות הראויים לנאמנות מתמשכת.", "What passes is not necessarily worthless, but it challenges us to distinguish fleeting success from principles worthy of lasting commitment."], "40:29": ["אדם אינו מוגדר רק לפי כוחו הנוכחי. דווקא ההכרה בעייפות פותחת אפשרות לתמיכה ולהתחדשות.", "A person's value is not measured by present strength; recognizing exhaustion can open the way to renewal."], "40:31": ["לא כל התקדמות נראית מיד. המתנה שיש בה תקווה עשויה לאפשר לאדם לשוב ולפעול.", "Not every advance is immediate; hopeful patience can restore the capacity to act."], "41:10": ["תחושת נוכחות ותמיכה אינה מעלימה סכנות, אך היא משנה את האופן שבו מתמודדים איתן.", "Supportive presence does not erase danger, but can transform how we face it."], "42:3": ["הכוח המוסרי הגדול אינו חייב להיות דרמטי. לפעמים הוא מתבטא בהימנעות מפגיעה במי שכבר נפגע.", "Moral strength may appear in the quiet refusal to crush someone who is already wounded."], "42:6": ["אור אינו מיועד רק למי שקרוב אלינו. ערך אנושי אמיתי מסוגל לפנות גם אל האחר.", "A genuine moral calling is not confined to one's own community; it reaches beyond familiar boundaries."], "43:1": ["קריאה בשם מבטאת הכרה באדם כיחיד ולא כמספר או כחלק מהמון.", "To call someone by name is to recognize a unique person rather than an anonymous member of a crowd."], "43:2": ["התקווה אינה מבטיחה שלא נעבור באש ובמים, אלא שאפשר לעבור דרכם מבלי לאבד את עצמנו.", "Hope does not promise escape from every trial; it points to the possibility of enduring them."], "43:19": ["כשאדם רואה רק את הדרכים הישנות, הוא עלול להחמיץ נתיב חדש שנפתח לפניו.", "When we see only familiar paths, we may miss a new possibility emerging before us."], "44:22": ["הכרה באשמה חשובה, אך אם אין אפשרות לשוב ולתקן, האדם נותר כבול למעשהו.", "Accountability matters, but without a path to return and repair, guilt becomes a permanent prison."], "45:7": ["העולם אינו נחלק תמיד לטוב פשוט ולרע פשוט. הבנת הניגודים דורשת ענווה ויכולת להכיר במה שאיננו שולטים בו.", "The world is not always divided into simple good and evil. Understanding its contrasts requires humility about what lies beyond our control."], "45:22": ["הפנייה לכל קצווי הארץ מעוררת מחשבה על אחריות ואפשרות לתיקון שמעבר לגבולות זהות.", "A call to all the earth suggests that moral responsibility and renewal need not stop at group boundaries."], "49:15": ["נאמנות אמיתית אינה תלויה רק ברגש חולף. היא מתבטאת במחויבות להמשיך לראות את האחר גם כאשר הנסיבות משתנות.", "Genuine loyalty does not rest on passing feelings alone; it means continuing to recognize another person as circumstances change."], "49:16": ["החשש להישכח נוגע בלב הקיום. הכרה מתמשכת מעניקה לאדם תחושת שייכות וערך.", "The fear of being forgotten touches human existence; enduring recognition offers belonging and worth."], "50:4": ["לדיבור יש כוח להחליש או לחזק. חוכמה כוללת גם ידיעה מתי ואיך לעודד אדם עייף.", "Speech can wound or sustain; wisdom includes knowing when and how to strengthen someone who is weary."], "52:7": ["בשורת שלום אינה רק מידע; היא עשויה להשיב לאנשים יכולת לדמיין עתיד אחר.", "Good news of peace is more than information: it can restore people's capacity to imagine a different future."], "53:4": ["מראה חיצוני של כאב אינו מגלה את מלוא סיפורו. חמלה דורשת זהירות בשיפוט.", "The appearance of suffering never tells the whole story; compassion requires humility in judgment."], "53:5": ["הכאב של הזולת אינו רק עובדה להתבונן בה. הוא מזמין בירור של אחריותנו, של גבולות ההקרבה ושל האפשרות לרפא מבלי להצדיק את הסבל.", "Another person’s pain is more than something to observe; it raises questions of responsibility, sacrifice, and healing without glorifying suffering."], "54:10": ["קשר עמוק אינו מבטיח שהעולם יישאר יציב; הוא נמדד ביכולת להחזיק גם בעת טלטלה.", "A lasting bond is not proved by stable circumstances but by fidelity when circumstances collapse."], "54:13": ["לימוד אינו רק העברת ידע. הוא קשור ליכולת של דור צעיר לחיות בביטחון ובשלווה.", "Education is more than transmitting knowledge; it also concerns the security and peace of the next generation."], "54:17": ["אדם וחברה אינם יכולים למנוע כל איום, אך יכולים לבנות יכולת לעמוד מולו.", "Individuals and communities cannot prevent every threat, but they can cultivate the capacity to withstand it."], "55:6": ["לא כל אפשרות לתקן נשארת פתוחה תמיד. ההווה מטיל עלינו אחריות לפעול בזמן.", "The chance to change may not remain open forever; the present creates an obligation to act in time."], "55:8": ["העובדה שאיננו מבינים הכול אינה סיבה להפסיק לחשוב, אלא הזמנה לבחון את ביטחוננו.", "Not understanding everything is not a reason to stop thinking, but an invitation to question our certainty."], "55:9": ["מה שנראה מובן מאליו מנקודת מבט אחת עשוי להיראות אחרת כשמרחיבים את המבט.", "What seems obvious from one vantage point may change when seen within a larger horizon."], "55:12": ["האדם אינו מוכרח להמשיך באותה דרך רק מפני שכך נהג בעבר. שינוי דורש אומץ להיפרד מהרגלים ישנים ולדמיין עתיד אחר.", "We need not remain on a path simply because we have followed it before. Change requires courage to leave old habits and imagine a different future."], "56:7": ["בית תפילה לכל העמים מציע שחיי רוח יכולים לפתוח דלת לאחר במקום לבנות רק גבולות.", "A house of prayer for all peoples suggests that spiritual life can welcome others rather than only mark boundaries."], "57:15": ["דווקא מי שמכיר בכוחו יכול לבחור להיות קרוב לשפל הרוח במקום להתרחק ממנו.", "Those with greatness or power can choose solidarity with the humble rather than distance from them."], "57:19": ["שלום שאינו מגיע למי שמחוץ למעגל הקרוב נשאר חלקי בלבד.", "Peace remains incomplete if it reaches only those already near or familiar to us."], "58:6": ["מעשה פולחני מאבד ממשמעותו המוסרית אם הוא מתקיים לצד ניצול ודיכוי של אחרים.", "Ritual loses moral force when it coexists with exploitation and oppression."], "58:7": ["הזדהות עם רעב אינה מספיקה כאשר אפשר לחלוק לחם ולשנות מציאות.", "Sympathy for hunger is incomplete when one can share food and change another's reality."], "58:10": ["העזרה לאחר אינה רק העברת משאבים; היא יכולה לשנות את האופן שבו האדם רואה את עולמו.", "Helping another person is not only a transfer of resources; it can transform the giver's own outlook."], "60:1": ["אין די בציפייה שהמציאות תשתנה מעצמה. התקווה נעשית משמעותית כשהיא מעוררת את האדם לקום, לבחור ולפעול.", "Waiting for circumstances to improve is not enough. Hope gains meaning when it moves us to rise, choose, and act."], "60:18": ["ביטחון אינו רק חומות חזקות; הוא מציאות שבה בני אדם אינם חיים תחת איום מתמיד.", "Security is more than strong defenses; it is a life no longer organized around constant threat."], "61:1": ["הכרזה על חירות מקבלת משמעות כאשר היא מגיעה לעניים, לשבויים ולשבורי הלב.", "A promise of freedom gains meaning when it reaches the poor, the captive, and the brokenhearted."], "61:3": ["השאיפה להחליף אפר בפאר אינה מחיקת העבר, אלא יצירת חיים שיש בהם יופי גם אחריו.", "Replacing ashes with beauty need not erase the past; it imagines meaningful life beyond loss."], "65:17": ["החזון של שמים וארץ חדשים מערער על ההנחה שהמציאות הקיימת היא האפשרות היחידה.", "The vision of a new heaven and earth challenges the assumption that the present order is the only possible one."], "66:2": ["מי שסבור שכבר הבין הכול מתקשה לשמוע. לב עניו מאפשר למפגש עם דבר חדש לשנות אותנו.", "Those certain they know everything struggle to listen; humility allows new insight to change us."]};
let isaiahPhilosophyLoaded=false,isaiahLoading=null;
async function loadIsaiahPhilosophy(){
 if(isaiahPhilosophyLoaded)return;
 if(isaiahLoading)return isaiahLoading;
 isaiahLoading=(async()=>{
  const all=[];
  const chapters=Object.keys(ISAIAH_PHILOSOPHY_VERSES).map(Number);
  for(let offset=0;offset<chapters.length;offset+=5){
   const batch=await Promise.all(chapters.slice(offset,offset+5).map(async n=>{
    try{
     const d=await getJSON(base(n,'ישעיהו')+'/chapter.json');
     const verses=d.verses||[],he=d.ai_explanation||[],en=d.ai_explanation_en||[],eng=d.english||[],ideas=d.ideas||[];
     return (ISAIAH_PHILOSOPHY_VERSES[n]||[]).filter(v=>verses[v-1]).map(v=>{
      const idea=ideas.find(a=>v>=a.start_verse&&v<=a.end_verse)||{};
      const title=ISAIAH_TITLES[n+':'+v];
      const interpretation=ISAIAH_INTERPRETATIONS[n+':'+v];
      if(!title?.[0]||!title?.[1]||!interpretation?.[0]||!interpretation?.[1])return null;
      return {book:'ישעיהו',topic:'רעיונות פילוסופיים',chapter:n,verse:v,
       ref:n+':'+v,quote:verses[v-1],quoteEn:eng[v-1]||'',
       explain:interpretation[0],
       explainEn:interpretation[1],
       source:'philosophical_interpretation',ideaTitle:title[0],ideaTitleEn:title[1],
       ideaNumber:Math.max(1,ideas.indexOf(idea)+1)};
     }).filter(Boolean);
    }catch(e){console.warn('ישעיהו chapter '+n,e);return []}
   }));
   all.push(...batch.flat());
  }
  if(!all.length)throw Error('לא ניתן לקרוא את פסוקי ישעיהו מ-GitHub');
  for(let i=ITEMS.length-1;i>=0;i--)if(ITEMS[i].book==='ישעיהו')ITEMS.splice(i,1);
  ITEMS.push(...all);isaiahPhilosophyLoaded=true;return all;
 })();
 try{return await isaiahLoading}finally{isaiahLoading=null}
}

e for the voiceless"], "30:20": ["כבוד אנושי אינו נעלם עם המעמד", "Human dignity survives loss of status"], "31:1": ["אחריות מוסרית מתחילה במבט", "Moral responsibility begins with how we look"], "31:15": ["שוויון אנושי קודם להבדלי מעמד", "Human equality precedes social rank"], "32:8": ["חוכמה אינה נחלת גיל מסוים", "Wisdom is not owned by any age"], "34:12": ["צדק הוא תנאי לאמון בסמכות", "Justice is essential to trust in authority"], "38:4": ["ענווה אינטלקטואלית פותחת אופקים", "Intellectual humility opens horizons"], "40:4": ["הודאה במגבלות אינה תבוסה", "Acknowledging limits is not defeat"], "42:5": ["ידיעה על דבר שונה ממפגש עמו", "Knowing about something differs from encountering it"], "42:7": ["ביטחון עצמי אינו ערובה לאמת", "Confidence is no guarantee of truth"]};
const JOB_INTERPRETATIONS={"1:21": ["כל מה שאדם מחזיק בו עלול להשתנות או להיעלם. הכרת הארעיות אינה מבטלת את האהבה לחיים, אלא מזכירה שאין לנו שליטה מוחלטת בהם.", "What we possess may change or vanish. Recognizing impermanence need not diminish love of life; it reminds us that control is never absolute."], "2:10": ["הציפייה לקבל רק טוב הופכת כל משבר לסתירה בלתי נסבלת. בגרות אנושית כוללת את היכולת להתמודד עם כאב בלי לוותר על החיפוש אחר משמעות.", "Expecting only good makes every crisis seem unbearable. Maturity means facing pain without abandoning the search for meaning."], "3:11": ["כאשר הכאב עמוק, השאלה מדוע לחיות אינה טיעון מופשט אלא זעקה אנושית. ההקשבה לזעקה חשובה יותר מתשובה מהירה.", "In deep pain, asking why one should live is a human cry, not an abstract argument. Listening matters more than offering quick answers."], "3:25": ["דאגה מתמשכת משנה את האופן שבו אנו חווים את העולם. הכרה בפחד היא התחלה של חירות, גם כאשר אי אפשר לבטל את הסכנה.", "Persistent anxiety shapes our experience of the world. Naming fear is a first step toward freedom even when danger remains."], "4:7": ["הנטייה להסיק מן האסון על אשמת הנפגע מספקת תחושת סדר מדומה. צדק מחייב לבחון עובדות ולא להפוך כאב לראיה לאשמה.", "Treating misfortune as proof of wrongdoing offers a false sense of order. Justice demands evidence rather than blaming those who suffer."], "5:7": ["הקושי אינו תמיד חריגה מן החיים הרגילים. ההכרה בפגיעות המשותפת יכולה להוליד סולידריות במקום שיפוטיות.", "Hardship is not always an exception to ordinary life. Recognizing shared vulnerability can foster solidarity instead of judgment."], "6:14": ["בשעת משבר אדם זקוק קודם כול לנוכחות שאינה נוטשת אותו. טיעון נכון לכאורה עלול להכאיב כאשר הוא מחליף הקשבה.", "In crisis, people first need someone who will stay with them. Even a plausible argument can wound when it replaces listening."], "6:24": ["ויכוח ראוי אינו מאבק על ניצחון אלא הזדמנות לתיקון ההבנה. מי שמבקש הוכחה לטעותו מראה פתיחות ולא חולשה.", "Good debate seeks better understanding rather than victory. Asking to be shown our error demonstrates openness, not weakness."], "7:17": ["השאלה מהו האדם מזכירה שגם חיים קטנים לכאורה מעוררים שאלות גדולות. הכבוד האנושי אינו זקוק לתואר או למעמד.", "The question of what a human being is reminds us that even seemingly small lives carry immense meaning. Dignity needs no title."], "8:8": ["חיי היחיד קצרים ביחס להיסטוריה. ההכרה בכך מעודדת ללמוד מן הדורות הקודמים בלי לוותר על ביקורת עצמאית.", "An individual life is brief beside history. This encourages learning from earlier generations while retaining independent judgment."], "9:22": ["תוצאות החיים אינן מחלקות תמיד גמול לפי צדק. לכן אין לזהות עושר עם צדקות או אובדן עם אשמה.", "Outcomes do not always distribute rewards justly. Wealth must not be equated with virtue, nor loss with guilt."], "10:1": ["המצוקה עלולה לגרום לאדם להאשים את עצמו ללא ראיות. חמלה עצמית מחייבת להבחין בין אחריות אמיתית לבין ייאוש.", "Distress can lead people to blame themselves without evidence. Self-compassion distinguishes real responsibility from despair."], "12:12": ["השנים מעניקות נקודת מבט, אך גם בעלי ניסיון יכולים לטעות. חוכמה נשמרת כאשר היא ממשיכה לשאול.", "Years of experience offer perspective but not infallibility. Wisdom endures when it remains willing to ask questions."], "13:15": ["אמון עמוק אינו מבטיח ביטחון בתוצאה. הוא יכול להתבטא בנכונות להתמודד עם הספק מבלי לוותר על יושרה.", "Deep trust cannot guarantee outcomes. It may instead mean facing uncertainty while remaining true to conscience."], "14:1": ["דווקא מפני שהזמן מוגבל, מעשים קטנים ויחסים אנושיים מקבלים משמעות. הארעיות יכולה לעורר אחריות ולא רק עצב.", "Because time is limited, ordinary acts and relationships matter. Impermanence can awaken responsibility as well as sadness."], "14:7": ["דימוי העץ המתחדש מציע אפשרות לצמיחה אחרי פגיעה. תקווה אינה הבטחה אלא פתיחות לעתיד שעדיין לא נודע.", "The renewing tree suggests growth after injury. Hope is not a guarantee but openness to an unknown future."], "16:2": ["עצות כלליות אינן מרפאות כאב שאינו מוכר למייעץ. נחמה מתחילה בהכרה בייחודו של סבל הזולת.", "Generic advice cannot heal pain the adviser has not understood. Comfort begins by acknowledging the particular suffering of another."], "19:21": ["כאשר אדם מאבד כוח ומעמד, מתגלה אם הקשר עמו נשען על תועלת או על מחויבות אנושית.", "When someone loses status or strength, we discover whether friendship rests on usefulness or enduring human concern."], "21:7": ["קיומם של רשעים מצליחים מערער הסברים פשוטים של שכר ועונש. חשיבה מוסרית חייבת לעמוד גם מול מציאות שאינה נוחה לתיאוריה.", "The success of the wicked challenges simple accounts of reward and punishment. Moral thought must confront facts that resist theory."], "23:10": ["משבר יכול לחשוף תכונות שלא ידענו על קיומן. אין בכך הצדקה לסבל, אלא הכרה באפשרות לצמוח גם בתוכו.", "Hardship can reveal qualities we did not know we possessed. This does not justify suffering; it recognizes the possibility of growth within it."], "27:5": ["לחץ חברתי אינו הופך טענה כוזבת לאמת. נאמנות למצפון מחייבת לפעמים לשלם מחיר של בדידות.", "Social pressure cannot turn a false claim into truth. Fidelity to conscience may carry the cost of loneliness."], "28:12": ["אפשר לצבור ידע ומשאבים ועדיין להחמיץ את השאלה כיצד נכון לחיות. חוכמה דורשת שיפוט מוסרי, לא רק איסוף עובדות.", "One can accumulate facts and resources yet fail to ask how to live well. Wisdom requires ethical judgment, not merely information."], "28:28": ["הבנה אמיתית נבחנת ביכולת להתרחק ממעשה מזיק. ידע שאינו משנה התנהגות נותר חלקי.", "Understanding is tested by the ability to refrain from harm. Knowledge that never changes conduct remains incomplete."], "29:15": ["חברה מוסרית אינה מסתפקת בשמירה על זכויות החזקים. היא מעניקה הגנה גם למי שמתקשה לדרוש אותה.", "A just society protects not only the powerful but also those who struggle to make their voices heard."], "30:20": ["אובדן כבוד ציבורי אינו מוחק את ערכו של האדם. דווקא ברגעי השפלה נבחנת חובתה של החברה לשמור על כבודו.", "Losing public esteem does not erase human worth. The duty to respect dignity matters most in moments of humiliation."], "31:1": ["היחס לאחר מתחיל עוד לפני המעשה הגלוי. משמעת עצמית כוללת את האופן שבו אנו בוחרים לראות בני אדם.", "Our treatment of others begins before visible action. Self-discipline includes how we choose to regard another person."], "31:15": ["ההכרה במוצא אנושי משותף מערערת את הרעיון שמעמד מעניק לאדם ערך רב יותר. סמכות אינה מתירה ניצול.", "A shared human origin challenges the idea that rank determines worth. Authority never licenses exploitation."], "32:8": ["ניסיון חשוב, אך תובנה יכולה להגיע גם מן הצעיר. שיחה טובה נותנת מקום לטיעון ולא רק לוותק.", "Experience matters, but insight can come from the young. Good conversation weighs arguments rather than seniority."], "34:12": ["כוח לבדו אינו מקנה לגיטימיות. אמון בסמכות נשען על האפשרות לדרוש ממנה דין וחשבון.", "Power alone cannot confer legitimacy. Trust in authority depends on its willingness to be held accountable."], "38:4": ["העולם גדול מן הידע האישי שלנו. הכרה בכך אינה מבטלת חקירה, אלא מאפשרת לשאול שאלות מדויקות יותר.", "The world exceeds our individual knowledge. Admitting this does not end inquiry; it allows us to ask better questions."], "40:4": ["אין חובה להשיב על כל שאלה. לפעמים שתיקה היא ביטוי לאחריות כלפי אמת שטרם הבנו.", "We need not answer every question. Sometimes silence is a responsible response to truths we do not yet understand."], "42:5": ["ידע מתווך יכול להישאר מרוחק. ניסיון אישי משנה לעיתים את משמעותן של אמונות ותיקות.", "Indirect knowledge may remain distant. Personal experience can transform the meaning of long-held beliefs."], "42:7": ["דיבור נחרץ בשם הצדק עלול להחמיץ את המציאות המורכבת. גם מי שמבקש להגן על האמת חייב לבחון את דבריו.", "Confident claims made in the name of justice can miss complex realities. Even defenders of truth must examine their words."]};

 }catch(e){console.warn('איוב chapter '+n,e);return []}
 }));all.push(...batch.flat())}
 if(!all.length)throw Error('לא ניתן לקרוא את פסוקי איוב מ-GitHub');

}

async function assignImages(){
 const generation=++imageLoadGeneration,book=activeBook;
 let manifest;
 try{manifest=await fixedImageManifest()}catch(err){console.error('Fixed image manifest unavailable',err);return}
 if(generation!==imageLoadGeneration||book!==activeBook)return;
 const items=ITEMS.map((item,i)=>({item,i})).filter(x=>x.item.book===book);
 for(const {i} of items)imageAssignments.delete(i);
 const used=new Set();
 for(const {item,i} of items){
  const names=manifest[book]?.[String(item.chapter)]||[];
  if(!names.length)continue;
  const choices=names.map(imageDetails);
  // A filename's verse range has priority; a unique filename is preferred.
  // The first file usually covers the chapter's opening verses.
  const verse=Number(item.verse)||1,number=Number(item.ideaNumber)||0;
  const scored=choices.map(f=>{
   const next=choices[f.index+1];
   const hi=f.hi===9999&&next&&next.lo>1?next.lo-1:f.hi;
   const covered=verse>=f.lo&&verse<=hi;
   const distance=verse<f.lo?f.lo-verse:verse>hi?verse-hi:0;
   return {f,score:(covered?0:100+distance*8)+(number&&number===f.number?-15:0)+(used.has(f.name)?1000:0)};
  }).sort((a,b)=>a.score-b.score);
  const chosen=scored[0]?.f;
  if(chosen){used.add(chosen.name);imageAssignments.set(i,{url:manifestImageURL(book,item.chapter,chosen.name),name:chosen.name,matched:true});}
 }

}

// Three short, randomly selected piano-like notes at each verse/idea transition.
// Synthesized locally with a percussive attack, decaying harmonics and a soft release.
let organAudioContext=null;
let previousOrganNote=-1;
function playRandomOrganNote(){
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!organAudioContext)organAudioContext=new AudioContextClass();
  const ctx=organAudioContext;
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const notes=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];
  const picked=[];
  for(let n=0;n<3;n++){
   const choices=notes.map((_,i)=>i).filter(i=>i!==previousOrganNote&&!picked.includes(i));
   const index=choices[Math.floor(Math.random()*choices.length)];
   picked.push(index);
   previousOrganNote=index;
  }
  const start=ctx.currentTime+0.015;
  picked.forEach((index,n)=>{
   const at=start+n*0.25;
   const base=notes[index];
   // Piano envelope: sharp hammer strike followed by natural exponential decay.
   const envelope=ctx.createGain();
   envelope.gain.setValueAtTime(0.0001,at);
   envelope.gain.exponentialRampToValueAtTime(0.16,at+0.004);
   envelope.gain.exponentialRampToValueAtTime(0.075,at+0.065);
   envelope.gain.exponentialRampToValueAtTime(0.018,at+0.33);
   envelope.gain.exponentialRampToValueAtTime(0.0001,at+0.72);
   envelope.connect(ctx.destination);
   const harmonics=[[1,1],[2,0.38],[3,0.17],[4,0.085],[5,0.035]];
   let remaining=harmonics.length;
   harmonics.forEach(([partial,level])=>{
    const oscillator=ctx.createOscillator();
    const partialGain=ctx.createGain();
    oscillator.type='sine';
    oscillator.frequency.value=base*partial*(1+0.00018*partial*partial);
    partialGain.gain.value=level;
    oscillator.connect(partialGain);
    partialGain.connect(envelope);
    oscillator.start(at);
    oscillator.stop(at+0.73);
    oscillator.onended=()=>{
     oscillator.disconnect();partialGain.disconnect();
     if(--remaining===0)envelope.disconnect();
    };
   });
  });
 }catch(err){console.debug('Piano notes unavailable',err)}
}

    const nums=[...new Set(ITEMS.filter(x=>x.book===book).map(x=>x.chapter))];

    }catch(e){$('content').textContent='שגיאה בטעינת הפירושים: '+e.message;return}}if(book==='מיכה'||book==='קהלת'){const nums=[...new Set(ITEMS.filter(x=>x.book===book).map(x=>x.chapter))];await Promise.all(nums.map(n=>loadChapter(n,book)));}activeBook=book;selected=ITEMS.findIndex(x=>x.book===book);$('bookMenu').classList.remove('open');$('ideasMenu').hidden=true;$('heading').textContent=uiLanguage==='he'?'רעיונות פילוסופיים — '+book:'Philosophical Ideas — '+({מיכה:'Micah',אסתר:'Esther',בראשית:'Genesis',שמות:'Exodus',ויקרא:'Leviticus',במדבר:'Numbers',יהושע:'Joshua','שמואל א':'First Samuel','שמואל ב':'Second Samuel','מלכים א':'First Kings','מלכים ב':'Second Kings',ישעיהו:'Isaiah',ירמיהו:'Jeremiah',יחזקאל:'Ezekiel',הושע:'Hosea',יואל:'Joel',עמוס:'Amos',עובדיה:'Obadiah',יונה:'Jonah',דניאל:'Daniel',נחמיה:'Nehemiah',רות:'Ruth','דברי הימים א':'First Chronicles','דברי הימים ב':'Second Chronicles','תהילים':'Psalms','שיר השירים':'Song of Songs',קהלת:'Ecclesiastes'}[book]);refreshIdeaOptions();render();window.scrollTo(0,0);if(!['בראשית','שמות','ויקרא','במדבר','דברים','יהושע','שופטים','שמואל א','שמואל ב','מלכים א','מלכים ב','ישעיהו','ירמיהו','יחזקאל','הושע','יואל','עמוס','עובדיה','יונה','איכה','עזרא','דניאל','נחמיה','רות','משלי','דברי הימים א','דברי הימים ב','תהילים','שיר השירים'].includes(book))Promise.all([...new Set(ITEMS.filter(x=>x.book===book).map(x=>x.chapter))].map(n=>loadChapter(n,book))).then(()=>render());}

// Navigate among ideas in the current book, using the idea visible on screen.
function navigateIdea(direction){
 const indices=ITEMS.map((item,i)=>item.book===activeBook?i:-1).filter(i=>i>=0);
 if(!indices.length)return;
 const visible=currentlyVisibleQuote();
 let at=indices.indexOf(visible);
 if(at<0)at=indices.indexOf(selected);
 if(at<0)at=0;
 const next=at+direction;
 if(next<0||next>=indices.length)return;
 stop();
 $('ideasMenu').hidden=true;
 $('bookMenu').classList.remove('open');
 selected=indices[next];
 playRandomOrganNote();
 updateSelected(false);
 requestAnimationFrame(()=>scrollQuoteToTop(selected));
}

// Image refresh is explicit and bounded. Never observe DOM changes here:
// rendering a missing image previously caused an endless API retry loop.
let lastImageRenderKey='';
function refreshImagesAfterRender(){
 const book=activeBook;
 const items=ITEMS.filter(x=>x.book===book);
 const key=book+'|'+items.map(x=>x.chapter+':'+x.verse).join(',');
 if(key===lastImageRenderKey)return;
 lastImageRenderKey=key;
 refreshAllImages();
}
