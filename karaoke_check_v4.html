<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת גבולות קריוקי V5</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0;padding:20px}h1{color:#ffd65a}
button{font-size:20px;padding:12px 20px;border:0;border-radius:12px;background:#ffd65a;font-weight:bold}
#status{margin:18px 0;font-size:18px}.bad{border:2px solid #f66;border-radius:12px;padding:12px;margin:12px 0;background:#241313}
.ok{color:#6f6}.verse{margin:6px 0;line-height:1.5}.small{color:#bbb;font-size:14px}
</style></head><body>
<h1>בדיקת גבולות פסוקים בקריוקי — V5</h1>
<p>מציג רק מקרים שבהם לא ניתן למפות את רצף הפסוקים ברצף הקריוקי לפי הסדר. הבדלי ניקוד, פיסוק, מקפים וכתיב קטן אינם שגיאה.</p>
<button id="run">בדוק את כל התנ״ך</button><div id="status"></div><div id="out"></div>
<script>
const ROOT='https://raw.githubusercontent.com/naftali24/BIBLE/main/';
const BOOKS=[['בראשית',50],['שמות',40],['ויקרא',27],['במדבר',36],['דברים',34],['יהושע',24],['שופטים',21],['שמואל א',31],['שמואל ב',24],['מלכים א',22],['מלכים ב',25],['ישעיהו',66],['ירמיהו',52],['יחזקאל',48],['הושע',14],['יואל',4],['עמוס',9],['עובדיה',1],['יונה',4],['מיכה',7],['נחום',3],['חבקוק',3],['צפניה',3],['חגי',2],['זכריה',14],['מלאכי',3],['תהילים',150],['משלי',31],['איוב',42],['שיר השירים',8],['רות',4],['איכה',5],['קהלת',12],['אסתר',10],['דניאל',12],['עזרא',10],['נחמיה',13],['דברי הימים א',29],['דברי הימים ב',36]];
const pad=n=>String(n).padStart(3,'0'),status=document.getElementById('status'),out=document.getElementById('out');
function hebLetters(s){
 return String(s||'')
  .normalize('NFD')
  .replace(/[\u0591-\u05C7]/g,'')
  .replace(/\{\s*[פס]\s*\}/g,'')
  .replace(/[^\u05D0-\u05EA]/g,'');
}
function wordsOfVerse(s){
 // Compare continuous Hebrew letters only: punctuation, maqaf/dashes,
 // cantillation, vowels and spacing cannot create false errors.
 const x=hebLetters(s);
 return x?[x]:[];
}
async function get(url,optional=false){const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});if(!r.ok){if(optional)return null;throw Error('HTTP '+r.status)}return r.json()}
function compare(verses,words){
 const kw=words.map(w=>hebLetters(w?.hebrew??w?.h??'')).filter(Boolean);
 let cursor=0;
 const issues=[];
 function sigWords(v){return String(v||'').split(/\s+/).map(hebLetters).filter(Boolean)}
 function same(a,b){
   if(a===b)return true;
   if(!a||!b)return false;
   // tolerate tiny spelling differences, but never reorder words
   if(a.length>=4&&b.length>=4){
     if(a.includes(b)||b.includes(a))return true;
     let d=Math.abs(a.length-b.length); if(d>1)return false;
     let i=0,j=0,ed=0;
     while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}ed++;if(ed>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}
     return true;
   }
   return false;
 }
 for(let vi=0;vi<verses.length;vi++){
   const vw=sigWords(verses[vi]); if(!vw.length)continue;
   // Find the beginning of this verse near the current karaoke cursor.
   let found=-1;
   for(let q=cursor;q<Math.min(kw.length,cursor+12);q++){
     if(same(vw[0],kw[q])){found=q;break}
   }
   if(found<0){issues.push({verse:vi+1,expected:vw[0],got:kw[cursor]||'(סוף הקריוקי)'});break}
   let p=found,ok=true;
   for(const vword of vw){
     if(p>=kw.length){ok=false;break}
     if(same(vword,kw[p])){p++;continue}
     // tolerate a source maqaf/spacing difference: one side may combine two words
     if(p+1<kw.length && same(vword,kw[p]+kw[p+1])){p+=2;continue}
     ok=false;break;
   }
   if(!ok){issues.push({verse:vi+1,expected:vw[Math.max(0,p-found)]||vw[0],got:kw[p]||'(סוף הקריוקי)'});break}
   cursor=p;
 }
 return issues;
}

document.getElementById('run').onclick=async()=>{
 out.innerHTML='';let checked=0,bad=0,missing=0;const total=BOOKS.reduce((n,x)=>n+x[1],0);
 for(const [book,count] of BOOKS)for(let ch=1;ch<=count;ch++){
  status.textContent='בודק '+book+' '+ch+' — '+checked+'/'+total;
  const base=ROOT+encodeURIComponent(book)+'/chapter_'+pad(ch)+'/';
  try{
   const [d,ra]=await Promise.all([get(base+'chapter.json'),get(base+'readalong_words.json',true)]);
   checked++;if(!ra||!Array.isArray(ra.words)){missing++;continue}
   const verses=d.verses||d.hebrew||d.hebrew_verses||[];
   const issues=compare(verses,ra.words);
   if(issues.length){bad++;const el=document.createElement('div');el.className='bad';
    el.innerHTML='<b>'+book+' — פרק '+ch+'</b><div class="small">נמצאה בעיית גבול/רצף</div>'+
      issues.slice(0,8).map(x=>'<div class="verse">פסוק '+x.verse+': צפוי „'+x.expected+'” | בקריוקי „'+x.got+'”</div>').join('');
    out.appendChild(el)}
  }catch(e){checked++}
 }
 status.innerHTML='הסתיים. <b>'+bad+' שגיאות</b>.';
 if(!bad)out.innerHTML='<div class="ok">לא נמצאו שגיאות.</div>';
};
document.getElementById('run').click();
</script></body></html>
