<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תנ״ך בתלת־ממד — נגן ניסיון</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#160d08;color:#f8e8c4;font:18px Arial,sans-serif}header{padding:12px;text-align:center;background:#28180c;color:#ffda80}h1{font-size:clamp(23px,5vw,36px);margin:3px}main{max-width:1100px;margin:auto;padding:12px}.stage{position:relative;aspect-ratio:16/9;background:radial-gradient(ellipse at 50% 75%,#ab783b 0%,#493f51 25%,#121b35 65%,#030612 100%);overflow:hidden;border:2px solid #b28a43;border-radius:16px}.sea{position:absolute;bottom:-20%;left:-5%;width:110%;height:48%;background:repeating-radial-gradient(ellipse at center,#4c8eaa 0%,#204967 14%,#122a46 25%);transform:perspective(300px) rotateX(52deg);animation:water 8s ease-in-out infinite alternate}.light{position:absolute;left:50%;top:38%;width:8%;aspect-ratio:1;border-radius:50%;background:#ffe4a1;filter:blur(16px);box-shadow:0 0 100px 50px #ffc55d80;opacity:.12;transform:translate(-50%,-50%);transition:opacity 3s,box-shadow 3s}.stage.day .light{opacity:1;box-shadow:0 0 140px 90px #ffc55d99}.stage.day{background:linear-gradient(#23365e,#8b82a0 55%,#d69d69)}.stage.dawn{background:linear-gradient(#07122b,#425e89 55%,#aa6d4c)}@keyframes water{to{transform:perspective(300px) rotateX(48deg) translateY(10px)}}.scene-label{position:absolute;top:12px;right:12px;background:#0008;padding:6px 12px;border-radius:9px}.note{position:absolute;bottom:8px;left:10px;font-size:12px;background:#0009;padding:5px}.verse{min-height:100px;text-align:center;font-size:clamp(23px,4.2vw,38px);line-height:1.7;padding:14px 5px}.word{padding:2px;border-radius:5px}.word.on{background:#ffdf45;color:#1a1000;box-shadow:0 0 8px #ffdb4a}button,select{border:0;border-radius:10px;background:linear-gradient(#ffe28a,#d99a21);color:#241600;padding:10px 15px;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.5}.controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:9px}input[type=range]{width:min(520px,85vw);accent-color:#e8bd53}.bar{display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap;padding:10px}section{margin-top:14px;padding:13px;background:#2a1b10;border:1px solid #85632b;border-radius:13px}#panel{line-height:1.6;white-space:pre-wrap}small{color:#e7c78e}.error{color:#ffb5a3}body.en{direction:ltr}body.en .verse{direction:ltr}</style><style>
/* Genesis 1:1 depth animation from the repository's original artwork */
.stage{isolation:isolate}
.depth-art{position:absolute;inset:-9%;background-image:url('../בראשית/chapter_001/images/idea_01.jpg');background-size:cover;background-position:center;transform:scale(1.12);animation:depthCamera 19s ease-in-out infinite alternate;z-index:0;will-change:transform;filter:contrast(1.07) saturate(1.12)}
.depth-vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 47%,transparent 32%,#0008 100%),linear-gradient(180deg,#0005,transparent 40%,#0006)}
.depth-haze{position:absolute;inset:-20%;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 70% 40%,#f9d48c2c,transparent 45%);animation:hazeMove 12s ease-in-out infinite alternate;mix-blend-mode:screen}
.depth-particles{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:radial-gradient(circle,#fff8 1px,transparent 2px),radial-gradient(circle,#ffe5a766 1px,transparent 2px);background-size:113px 97px,167px 131px;animation:particleDrift 20s linear infinite;opacity:.6}
.stage .depth-art~.sea,.stage .depth-art~.light{display:none}
.stage .scene-label,.stage .note{z-index:5}
.stage:not(.first-scene) .depth-art,.stage:not(.first-scene) .depth-vignette,.stage:not(.first-scene) .depth-haze,.stage:not(.first-scene) .depth-particles{display:none}
.stage.first-scene .sea,.stage.first-scene .light{display:none}
@keyframes depthCamera{0%{transform:scale(1.12) translate3d(-2%,1%,0)}100%{transform:scale(1.32) translate3d(2%,-2%,0)}}
@keyframes hazeMove{to{transform:translate3d(-12%,7%,0);opacity:.4}}
@keyframes particleDrift{to{background-position:90px -130px,-120px -60px}}
@media(prefers-reduced-motion:reduce){.depth-art,.depth-haze,.depth-particles{animation:none!important}}
</style></head><body>
<header><h1 id="title">תנ״ך בתלת־ממד — נגן ניסיון</h1><small id="sub">בראשית א׳, פסוקים 1–5</small></header><main>
<div id="stage" class="stage first-scene"><div class="depth-art" aria-hidden="true"></div><div class="depth-vignette"></div><div class="depth-haze"></div><div class="depth-particles"></div><div class="light"></div><div class="sea"></div><span id="scene" class="scene-label">בראשית 1:1</span><span class="note" id="note">תנועת עומק מהתמונה המקורית — לא סרט תלת־ממדי מלא</span></div>
<div id="verse" class="verse">טוען פסוקים...</div>
<div class="controls"><button id="prev">◀ פסוק קודם</button><button id="play">▶ נגן</button><button id="next">פסוק הבא ▶</button><button id="lang">English</button><button id="full">⛶ מסך מלא</button></div>
<div class="bar"><span id="clock">0:00</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="מיקום הקריינות"><span id="status">מוכן</span></div>
<div class="controls"><button id="explain">פירוש</button><button id="question">שאלות</button><button id="info">מקורות</button></div>
<section><div id="panel">לחץ על נגן כדי להתחיל. התמונה היא הדמיית תנועה בלבד, לא סרט תלת־ממדי שהופק.</div></section>
<audio id="audio" preload="metadata"></audio></main>
<script>
const base='../בראשית/chapter_001/', el=id=>document.getElementById(id);let chapter,ra,questions,lang='he',active=0,playing=false,wordVerses=[],heTimes=[],enTimes=[];
const audio=el('audio');const fetchJSON=async p=>{let r=await fetch(base+p);if(!r.ok)throw Error(p+' HTTP '+r.status);return r.json()};
const plain=x=>typeof x==='string'?x:JSON.stringify(x??'');
function buildWords(){let a=[],cur=[];for(let w of ra.words||[]){if(Number(w.position)===0&&cur.length){a.push(cur);cur=[]}cur.push(w);if(String(w.hebrew||'').includes('׃')){a.push(cur);cur=[]}}if(cur.length)a.push(cur);wordVerses=a;heTimes=a.map(v=>Number(v[0]?.start)||0);enTimes=(chapter.times_en||[]).map(x=>Number(x.start??x)||0)}
function times(){return lang==='he'?heTimes:enTimes}
function setSource(){audio.pause();playing=false;el('play').textContent='▶ '+(lang==='he'?'נגן':'Play');audio.src=lang==='he'?'https://mechon-mamre.org/mp3/t0101.mp3':chapter.audio_en_url;audio.load();el('status').textContent=lang==='he'?'מוכן':'Ready'}
function wordsFor(i){if(lang==='he')return(wordVerses[i]||[]).map(w=>({text:w.hebrew,start:Number(w.start),end:Number(w.end)}));return String(chapter.english?.[i]||'').split(/\s+/).map(t=>({text:t,start:-1,end:-1}))}
function render(){let ws=wordsFor(active),t=audio.currentTime;el('verse').replaceChildren(...ws.flatMap((w,i)=>{let span=document.createElement('span');span.className='word'+(lang==='he'&&t>=w.start&&t<w.end?' on':'');span.textContent=w.text;return[i?document.createTextNode(' '):document.createTextNode(''),span]}));el('scene').textContent=(lang==='he'?'בראשית':'Genesis')+' 1:'+(active+1);el('stage').className='stage '+(active===0?'first-scene':active>=4?'dawn':active>=2?'day':'');el('sub').textContent=(lang==='he'?'בראשית א׳, פסוק ':'Genesis 1, verse ')+(active+1);el('seek').max=audio.duration||100;el('seek').value=t;el('clock').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function update(){let ts=times(),t=audio.currentTime;for(let i=0;i<5;i++)if(t>=ts[i]&&(i===4||t<ts[i+1])){active=i;break}render()}
function jump(i){active=Math.max(0,Math.min(4,i));audio.currentTime=times()[active]||0;render()}
el('play').onclick=async()=>{try{if(audio.paused){await audio.play();playing=true;el('play').textContent='⏸ '+(lang==='he'?'השהה':'Pause')}else{audio.pause();playing=false;el('play').textContent='▶ '+(lang==='he'?'נגן':'Play')}}catch(e){el('status').textContent='השמע נחסם: '+e.message}};
el('prev').onclick=()=>jump(active-1);el('next').onclick=()=>jump(active+1);el('seek').oninput=e=>{audio.currentTime=Number(e.target.value);update()};
el('lang').onclick=()=>{lang=lang==='he'?'en':'he';document.body.classList.toggle('en',lang==='en');document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';el('lang').textContent=lang==='he'?'English':'עברית';el('title').textContent=lang==='he'?'תנ״ך בתלת־ממד — נגן ניסיון':'3D Bible — Player Prototype';el('note').textContent=lang==='he'?'הדמיית תנועה — סרט תלת־ממדי יתווסף בהמשך':'Depth animation from original artwork — not full 3D video';setSource();jump(0)};
el('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
el('explain').onclick=()=>{let ideas=chapter.ideas||[];let matching=ideas.filter(x=>{let a=Number(x.verse_start??x.start_verse??x.from_verse??x.verse??0),b=Number(x.verse_end??x.end_verse??x.to_verse??a);return a<=active+1&&b>=active+1});el('panel').textContent=matching.length?matching.map(x=>plain(lang==='he'?(x.explanation_he||x.explanation||x.summary||x.title):(x.explanation_en||x.summary_en||x.title_en||x.explanation))).join('\n\n'):(lang==='he'?'אין פירוש ממופה לפסוק זה בתצוגת הניסיון.':'No mapped explanation for this verse in this prototype.')};
el('question').onclick=()=>{let p=questions?.paragraphs||[];el('panel').textContent=lang==='en'?'English questions will be connected in the next version.':(p.length?'קובץ השאלות נטען. דוגמת נתונים:\n'+JSON.stringify(p[0],null,2).slice(0,1600):'לא נמצאו שאלות')};
el('info').onclick=()=>el('panel').textContent='נתונים: GitHub BIBLE / בראשית / chapter_001. הקריינות מגיעה ממקורות חיצוניים. אין להעתיק או להפיץ מחדש את השמע ללא בדיקת זכויות.';
audio.addEventListener('timeupdate',update);audio.addEventListener('ended',()=>{el('play').textContent='▶ נגן';el('status').textContent='הסתיים'});audio.addEventListener('error',()=>el('status').textContent='לא ניתן לטעון את השמע ממקורו');
(async()=>{try{[chapter,ra,questions]=await Promise.all([fetchJSON('chapter.json'),fetchJSON('readalong_words.json'),fetchJSON('questions.json')]);buildWords();if(wordVerses.length<5)throw Error('חסרים תזמוני פסוקים');setSource();jump(0);el('status').textContent='נתונים נטענו';}catch(e){el('status').className='error';el('status').textContent='שגיאה בטעינת נתונים';el('panel').textContent=e.message}})();
</script></body></html>
