<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INSTALL BIBLE BY IDEAS</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0d0803">
<style>
body{margin:0;background:#0d0803;color:#fff3c4;font-family:Arial;text-align:center;padding:40px 20px}
h1{color:#ffe58a}button{font-size:20px;font-weight:bold;padding:14px 24px;border-radius:14px;border:1px solid #d89b18;background:#2b1a08;color:#fff3c4}
</style></head><body>
<h1>BIBLE BY IDEAS</h1><p>Press INSTALL.</p><button id="go">INSTALL</button><p id="msg"></p>
<script>
let deferred=null;
const go=document.getElementById('go'), msg=document.getElementById('msg');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;msg.textContent='Ready to install';});
window.addEventListener('appinstalled',()=>{msg.textContent='INSTALLED';go.style.display='none';setTimeout(()=>window.close(),800);});
go.onclick=async()=>{
 if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;}
 else msg.textContent='If already installed, no install prompt will appear.';
};
if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js',{scope:'./'});
</script></body></html>
