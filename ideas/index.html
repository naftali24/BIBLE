'use strict';
const BOOKS=[["בראשית", 50], ["שמות", 40], ["ויקרא", 27], ["במדבר", 36], ["דברים", 34], ["יהושע", 24], ["שופטים", 21], ["שמואל א", 31], ["שמואל ב", 24], ["מלכים א", 22], ["מלכים ב", 25], ["ישעיהו", 66], ["ירמיהו", 52], ["יחזקאל", 48], ["הושע", 14], ["יואל", 4], ["עמוס", 9], ["עובדיה", 1], ["יונה", 4], ["מיכה", 7], ["נחום", 3], ["חבקוק", 3], ["צפניה", 3], ["חגי", 2], ["זכריה", 14], ["מלאכי", 3], ["תהילים", 150], ["משלי", 31], ["איוב", 42], ["שיר השירים", 8], ["רות", 4], ["איכה", 5], ["קהלת", 12], ["אסתר", 10], ["דניאל", 12], ["עזרא", 10], ["נחמיה", 13], ["דברי הימים א", 29], ["דברי הימים ב", 36]];
const BASE='https://raw.githubusercontent.com/naftali24/BIBLE/main/';
const chapterList=BOOKS.flatMap(([book,count])=>Array.from({length:count},(_,n)=>({book,chapter:n+1,key:book+'/chapter_'+String(n+1).padStart(3,'0')})));
const feed=document.getElementById('feed'),dialog=document.getElementById('navigation'),position=document.getElementById('position');
let previousObserver=null,loadingPrevious=false,stripBook=null;
let generation=0,controller=null,currentIndex=0,selectedBook=BOOKS[0][0],loadingNext=false,nextObserver=null;
const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const url=path=>BASE+path.split('/').map(encodeURIComponent).join('/');
async function getJson(path,signal){const r=await fetch(url(path),{signal,cache:'no-store'});if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e;}return r.json();}

function remember(index){currentIndex=index;const item=chapterList[index];position.textContent=item.book+' · פרק '+item.chapter;try{localStorage.setItem('tanakhIdeasChapter',item.key)}catch{}history.replaceState(null,'','#'+encodeURIComponent(item.key));}
// Each card aligns once, after the user's scroll gesture settles.
let lastAlignedCard=null,alignTimer=null,autoAlign=false,lastScrollTop=0,scrollDirection=1;
function mainVisibleCard(){
 const top=feed.getBoundingClientRect().top,h=feed.clientHeight;
 return [...feed.querySelectorAll('.idea,.notice')].map(card=>{const r=card.getBoundingClientRect(),y=r.top-top;return {card,y,visible:Math.max(0,Math.min(h,y+r.height)-Math.max(0,y))};}).filter(x=>x.visible>0).sort((a,b)=>b.visible-a.visible)[0];
}
function syncCurrentCard(){const hit=mainVisibleCard();if(!hit)return;const index=Number(hit.card.dataset.index);remember(index);}
function alignNewIdea(){
 if(autoAlign||loadingPrevious)return;
 const hit=mainVisibleCard();if(!hit||hit.card===lastAlignedCard)return;
 const {card,y}=hit;lastAlignedCard=card;syncCurrentCard();
 if(Math.abs(y)<3)return;
 autoAlign=true;feed.scrollTo({top:Math.max(0,feed.scrollTop+y),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
}
feed.addEventListener('scroll',()=>{const delta=feed.scrollTop-lastScrollTop;if(Math.abs(delta)>1&&!autoAlign&&!loadingPrevious)scrollDirection=Math.sign(delta);lastScrollTop=feed.scrollTop;syncCurrentCard();if(scrollDirection<0&&!loadingPrevious){const previous=feed.querySelector('.previous');if(previous&&previous.getBoundingClientRect().bottom>feed.getBoundingClientRect().top)previous.querySelector('button')?.click();}clearTimeout(alignTimer);alignTimer=setTimeout(()=>{if(autoAlign){autoAlign=false;return;}alignNewIdea();},180);},{passive:true});
for(const event of ['wheel','touchstart','pointerdown'])feed.addEventListener(event,()=>{autoAlign=false;},{passive:true});
const visibleObserver=new IntersectionObserver(()=>syncCurrentCard(),{root:feed,threshold:[0.3,0.6]});
function summaries(data,images){if(Array.isArray(data)){if(data.length!==images.length)throw new Error('מספר הסיכומים אינו תואם למספר תמונות הרעיונות ('+data.length+' לעומת '+images.length+').');return data;}if(data&&Array.isArray(data.ideas)){return images.map(name=>{const id=Number(name.match(/^idea_(\d+)/i)?.[1]);const entry=data.ideas.find(x=>x.idea_id===id||x.image_file==='images/'+name);if(!entry)throw new Error('לא נמצא סיכום לתמונה '+name);return entry;});}throw new Error('מבנה קובץ הסיכומים אינו מוכר.');}
let currentLanguage='he',versesMode=false;
/* Always start the app with verses hidden. The user's verse choice may
   persist while navigating chapters during this session, but not on launch. */
try{localStorage.setItem('bibleIdeasVersesMode','false');}catch{}
function setVersesMode(enabled){versesMode=Boolean(enabled);try{localStorage.setItem('bibleIdeasVersesMode',String(versesMode));}catch{}if(!versesMode)stopAudio();feed.querySelectorAll('.idea').forEach(article=>{article.verseState.open=versesMode;refreshVerses(article);});}
const chapterData=new Map(),hebrewVerses=new Map(),wordData=new Map(),audioSources=new Map();
function getWordData(item){if(!wordData.has(item.key))wordData.set(item.key,getJson(item.key+'/readalong_words.json').catch(e=>{wordData.delete(item.key);throw e;}));return wordData.get(item.key);}
function readHebrewWords(data){const out=[];let parts=[];for(const word of data.words||[]){const text=String(word.hebrew||'').trim();if(!text)continue;parts.push(text);if(text.includes('׃')){out.push(parts.join(' '));parts=[];}}if(parts.length)out.push(parts.join(' '));return out;}
async function getVerses(item,lang){const details=chapterData.get(item.key)||{};if(lang==='en')return details.english||[];if(Array.isArray(details.verses))return details.verses;if(!hebrewVerses.has(item.key)){const pending=getWordData(item).then(data=>{const rows=readHebrewWords(data);if(!rows.length)throw new Error('Missing verses');return rows;}).catch(e=>{hebrewVerses.delete(item.key);throw e;});hebrewVerses.set(item.key,pending);}return hebrewVerses.get(item.key);}
async function refreshVerses(article){const state=article.verseState;if(!state)return;const {overlay,toggle,verseLabel,from,to,item}=state;const lang=currentLanguage,request=++state.request;verseLabel.textContent=(lang==='he'?'פסוקים ':'Verses ')+(from>0?(from===to?from:from+'–'+to):'');toggle.setAttribute('aria-pressed',String(state.open));toggle.setAttribute('aria-label',lang==='he'?(state.open?'הסתר פסוקים':'הצג פסוקים'):(state.open?'Hide verses':'Show verses'));overlay.hidden=!state.open;if(!state.open)return;overlay.lang=lang;overlay.textContent=lang==='he'?'טוען פסוקים…':'Loading verses…';try{const rows=await getVerses(item,lang);if(request!==state.request||!state.open)return;if(!(from>0&&to>=from)||rows.length<to)throw new Error('Missing range');renderVerseText(state,rows,lang);overlay.scrollTop=0;}catch(e){if(request===state.request&&state.open)overlay.textContent=lang==='he'?'לא ניתן לטעון את הפסוקים. סגור ופתח כדי לנסות שוב.':'Unable to load verses. Close and reopen to retry.';}}
function renderVerseText(state,rows,lang){
 state.overlay.replaceChildren();
 for(let verse=state.from;verse<=state.to;verse++){
 const value=rows[verse-1],text=typeof value==='string'?value:(value?.text||value?.hebrew||'');
 if(lang==='en'){const line=node('span',text,'karaoke-line');line.dataset.verse=verse;state.overlay.append(line);}
 else{const words=text.trim().split(/\s+/);words.forEach((text,i)=>{const span=node('span',text,'karaoke-word');span.dataset.verse=verse;span.dataset.word=i;state.overlay.append(span,document.createTextNode(' '));});}
 }
}
const audioPlayer=new Audio();audioPlayer.preload='metadata';
let audioSession=null,audioToken=0,audioFrame=0;
function stopAudio(){audioToken++;audioPlayer.pause();cancelAnimationFrame(audioFrame);if(audioSession){const {state}=audioSession;state.audioButton.textContent='▶';state.audioButton.setAttribute('aria-pressed','false');state.audioButton.setAttribute('aria-label',currentLanguage==='he'?'נגן קריוקי':'Play karaoke');state.overlay.querySelectorAll('.karaoke-active').forEach(el=>el.classList.remove('karaoke-active'));}audioSession=null;}
function englishCues(details,from,to){const times=details.times_en||[];return Array.from({length:to-from+1},(_,n)=>{const verse=from+n,t=times[verse-1],next=times[verse];const start=Number(typeof t==='object'?t?.start:t);const end=Number((typeof t==='object'?t?.end:undefined)??details.times_en_end?.[verse-1]??(typeof next==='object'?next?.start:next));return {verse,start,end};}).filter(c=>Number.isFinite(c.start)&&Number.isFinite(c.end)&&c.end>c.start);}
function hebrewCues(data,from,to){let verse=1,wordIndex=0;const cues=[];for(const word of data.words||[]){const text=String(word.hebrew||'').trim();if(!text)continue;const count=text.split(/\s+/).length;if(verse>=from&&verse<=to){const start=Number(word.start),end=Number(word.end);if(Number.isFinite(start)&&Number.isFinite(end)&&end>start)cues.push({verse,word:wordIndex,count,start,end});}wordIndex+=count;if(text.includes('׃')){verse++;wordIndex=0;}}return cues;}
async function getAudioSource(item,lang){const details=chapterData.get(item.key)||{};if(lang==='en'){if(!details.audio_en_url)throw new Error('No English recording');return details.audio_en_url;}if(details.audio_he_url||details.audio_url)return details.audio_he_url||details.audio_url;if(!audioSources.has(item.key)){audioSources.set(item.key,fetch(url(item.key+'/audio_url.txt')).then(async r=>{if(!r.ok)throw new Error('Audio URL unavailable');const value=(await r.text()).trim();if(!/^https?:\/\//.test(value))throw new Error('Invalid audio URL');return value;}).catch(e=>{audioSources.delete(item.key);throw e;}));}return audioSources.get(item.key);}
function updateKaraoke(){const session=audioSession;if(!session)return;const time=audioPlayer.currentTime;if(time>=session.end){stopAudio();return;}const cue=session.cues.find(c=>time>=c.start&&time<c.end);if(cue!==session.active){session.state.overlay.querySelectorAll('.karaoke-active').forEach(el=>el.classList.remove('karaoke-active'));session.active=cue;if(cue){const selector=session.lang==='en'?'.karaoke-line[data-verse="'+cue.verse+'"]':'.karaoke-word[data-verse="'+cue.verse+'"]';const all=[...session.state.overlay.querySelectorAll(selector)];const targets=session.lang==='en'?all:all.filter(el=>Number(el.dataset.word)>=cue.word&&Number(el.dataset.word)<cue.word+cue.count);targets.forEach(el=>el.classList.add('karaoke-active'));const el=targets[0],box=session.state.overlay;if(el){const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();if(r.top<b.top||r.bottom>b.bottom)box.scrollTop+=r.top-b.top-12;}}}audioFrame=requestAnimationFrame(updateKaraoke);}

function createCard(item,index,image,summary,number,total){if(typeof summary.summary_he!=='string'||typeof summary.summary_en!=='string'||!summary.summary_he.trim()||!summary.summary_en.trim())throw new Error('חסר סיכום בעברית או באנגלית ברעיון '+number);const article=node('article',undefined,'idea');article.dataset.index=index;const from=Number(summary.start_verse),to=Number(summary.end_verse);const verses=from>0?(to>from?'פסוקים '+from+'–'+to:'פסוק '+from):'';article.dataset.verses=verses;const caption=node('div',undefined,'caption');caption.append(node('span',item.book+' · פרק '+item.chapter,'chapter-label'),node('span','רעיון '+number+' מתוך '+total));const tools=node('span',undefined,'verse-tools'),verseLabel=node('span',verses),toggle=node('button','▤','verse-toggle');toggle.type='button';toggle.setAttribute('aria-pressed','false');toggle.setAttribute('aria-label','הצג או הסתר פסוקים');const audioButton=node('button','▶','audio-toggle');audioButton.type='button';audioButton.setAttribute('aria-label','נגן קריוקי');audioButton.setAttribute('aria-pressed','false');tools.append(verseLabel,toggle,audioButton);caption.append(tools);const frame=node('div',undefined,'picture-frame'),overlay=node('p',undefined,'verse-overlay');overlay.hidden=true;overlay.id='verses-'+index+'-'+number;toggle.setAttribute('aria-controls',overlay.id);article.verseState={item,from,to:to||from,overlay,toggle,verseLabel,audioButton,open:versesMode,request:0};audioButton.onclick=()=>toggleAudio(article);toggle.onclick=()=>setVersesMode(!versesMode);const img=node('img',undefined,'picture');img.src=url(item.key+'/images/'+image);img.alt=item.book+', פרק '+item.chapter+', תמונת רעיון '+number;img.loading=number===1?'eager':'lazy';img.decoding='async';img.addEventListener('error',()=>{img.hidden=true;article.insertBefore(node('p','לא ניתן לטעון את התמונה. בדוק את החיבור ונסה שוב.','status'),caption.nextSibling)});const text=node('div',undefined,'summary');const he=node('p',summary.summary_he,'he function addNext(index,token){if(token!==generation)return;const end=node('section',undefined,'next');if(index>=chapterList.length-1){end.append(node('p','הגעת לסוף התנ״ך'),node('button','בחר פרק אחר'));end.lastChild.onclick=openBookMenu;feed.append(end);return;}const next=chapterList[index+1];end.append(node('p','↓ המשך אל '+next.book+' · פרק '+next.chapter));const button=node('button','טען את הפרק הבא');end.append(button);feed.append(end);let started=false;async function advance(){if(started||token!==generation)return;started=true;nextObserver?.disconnect();button.disabled=true;button.textContent='טוען את הפרק הבא…';const ok=await renderChapter(index+1,token,controller.signal);if(!ok)return;end.remove();addNext(index+1,token);}button.onclick=advance;nextObserver=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))advance();},{root:feed,threshold:0.7});nextObserver.observe(end);}

function showBook(book){

let deferredIdeasInstall=null;

  const b=document.getElementById('install-ideas'); if(b)b.textContent='✓ INSTALLED';
