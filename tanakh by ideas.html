const BUILTIN_CHILDREN_GENESIS_1={"ideas":[{"idea_id":1,"children_he":"לִפְנֵי שֶׁהָעוֹלָם הָיָה כְּמוֹ שֶׁאֲנַחְנוּ מַכִּירִים אוֹתוֹ, הַכֹּל הָיָה חָשׁוּךְ וְלֹא מְסֻדָּר. הַסִּפּוּר מְלַמֵּד שֶׁגַּם מִבִּלְבּוּל גָּדוֹל יָכוֹל לְהִוָּצֵר סֵדֶר.","children_en":"Before the world looked the way we know it, everything was dark and without order. The story teaches us that order can grow out of confusion."},{"idea_id":2,"children_he":"אֱלֹהִים אָמַר שֶׁיִּהְיֶה אוֹר, וְהָאוֹר הוֹפִיעַ. כְּשֶׁמַּבְדִּילִים בֵּין אוֹר לְחֹשֶׁךְ, אֶפְשָׁר לָדַעַת מָתַי יוֹם וּמָתַי לַיְלָה. לִפְעָמִים גַּם בַּחַיִּים שֶׁלָּנוּ צָרִיךְ לַעֲשׂוֹת סֵדֶר כְּדֵי לְהָבִין דְּבָרִים.","children_en":"God said there should be light, and light appeared. Separating light from darkness made day and night. Sometimes we also need to organize things to understand them."},{"idea_id":3,"children_he":"בְּסִפּוּר הַבְּרִיאָה, הָרָקִיעַ מַפְרִיד בֵּין מַיִם שֶׁמֵּעַלָיו לְמַיִם שֶׁמִּתַּחְתָּיו. הַהַפְרָדָה הַזֹּאת מַזְכִּירָה לָנוּ שֶׁכְּשֶׁכָּל דָּבָר נִמְצָא בִּמְקוֹמוֹ, קַל יוֹתֵר לְהָבִין אֶת הָעוֹלָם.","children_en":"In the creation story, the sky separates waters above from waters below. When things have their own place, the world becomes easier to understand."},{"idea_id":4,"children_he":"כְּשֶׁהַמַּיִם נֶאֶסְפוּ לְמָקוֹם אֶחָד, נִרְאֲתָה הַיַּבָּשָׁה. אַחַר כָּךְ צָמְחוּ צְמָחִים וְזְרָעִים. זֶרַע קָטָן יָכוֹל לִגְדֹּל לְצֶמַח גָּדוֹל. גַּם דָּבָר קָטָן שֶׁאֲנַחְנוּ מַתְחִילִים יָכוֹל לִצְמֹחַ.","children_en":"When the waters gathered, dry land appeared. Plants and seeds began to grow. A tiny seed can become a big plant, just as a small beginning can become something wonderful."},{"idea_id":5,"children_he":"בַּשָּׁמַיִם מוֹפִיעִים הַשֶּׁמֶשׁ, הַיָּרֵחַ וְהַכּוֹכָבִים. בִּזְכוּתָם אֲנַחְנוּ מַבְחִינִים בֵּין יוֹם לְלַיְלָה וְעוֹקְבִים אַחֲרֵי הַזְּמַן. הַזְּמַן עוֹזֵר לָנוּ לְתַכְנֵן מָתַי לִלְמֹד, לְשַׂחֵק וְלָנוּחַ.","children_en":"The sun, moon, and stars help us tell day from night and follow time. Time helps us plan when to learn, play, and rest."},{"idea_id":6,"children_he":"אֱלֹהִים בָּרָא דָּגִים וְעוֹד יְצוּרִים בַּמַּיִם, וְצִפֳּרִים שֶׁעוֹפוֹת בַּשָּׁמַיִם. כָּל יְצוּר חַי שׁוֹנֶה מֵחֲבֵרוֹ, וּלְכֻלָּם יֵשׁ מָקוֹם בָּעוֹלָם. כְּדַאי לָנוּ לִשְׁמֹר עַל בַּעֲלֵי הַחַיִּים.","children_en":"God created fish and other sea creatures, and birds that fly in the sky. Every living creature is different, and each has a place in the world. We should care for animals."},{"idea_id":7,"children_he":"עַל הַיַּבָּשָׁה הוֹפִיעוּ חַיּוֹת גְּדוֹלוֹת וּקְטַנּוֹת. כָּל חַיָּה נִרְאֵית וּמִתְנַהֶגֶת אַחֶרֶת. הַשֹּׁנִי בֵּינֵיהֶן מַרְאֶה כַּמָּה מְגֻוָּן הָעוֹלָם שֶׁלָּנוּ.","children_en":"Large and small animals appeared on land. Each kind looks and behaves differently. Their differences show how varied our world is."},{"idea_id":8,"children_he":"בְּסִפּוּר הַבְּרִיאָה, בְּנֵי הָאָדָם נִבְרְאוּ בְּצֶלֶם אֱלֹהִים. זֶה מְלַמֵּד שֶׁלְּכָל אָדָם יֵשׁ עֵרֶךְ וְכָבוֹד. אֲנַחְנוּ יְכוֹלִים לִבְחֹר מַה לַּעֲשׂוֹת, וְלָכֵן חָשׁוּב לִבְחֹר לַעֲשׂוֹת טוֹב וְלִשְׁמֹר עַל הָעוֹלָם.","children_en":"The story says people were made in the image of God. That teaches us that every person deserves respect. We can make choices, so we should choose to do good and care for the world."},{"idea_id":9,"children_he":"אֱלֹהִים נָתַן לָאָדָם צְמָחִים וּפֵרוֹת לְמַאֲכָל. הַסִּפּוּר מַזְכִּיר לָנוּ שֶׁהָאֹכֶל שֶׁלָּנוּ מַגִּיעַ מֵהַטֶּבַע, וְשֶׁכְּדַאי לְהַעֲרִיךְ אוֹתוֹ וְלֹא לְבַזְבֵּז.","children_en":"God gave people plants and fruit for food. This reminds us that our food comes from nature and that we should appreciate it instead of wasting it."},{"idea_id":10,"children_he":"גַּם לְבַעֲלֵי הַחַיִּים נִתַּן מָזוֹן מִן הַצְּמָחִים. בְּתֵאוּר הָרִאשׁוֹן שֶׁל הָעוֹלָם, הַיְצוּרִים חַיִּים זֶה לְצַד זֶה. הַתְּמוּנָה הַזֹּאת מְזַכֶּרֶת לָנוּ שֶׁשָּׁלוֹם וְדַאֲגָה לַאֲחֵרִים הֵם דְּבָרִים חֲשׁוּבִים.","children_en":"Animals were also given plants for food. The first picture of the world shows living things side by side. It reminds us how important peace and caring for others can be."},{"idea_id":11,"children_he":"בְּסוֹף הַיּוֹם הַשִּׁשִּׁי אֱלֹהִים רָאָה אֶת כָּל מַה שֶּׁבָּרָא וְאָמַר שֶׁהַכֹּל טוֹב מְאֹד. הַסִּפּוּר מַזְמִין אוֹתָנוּ לְהִסְתַּכֵּל עַל הָעוֹלָם, לִרְאוֹת בּוֹ אֶת הַטּוֹב וְלִשְׁמֹר עָלָיו.","children_en":"At the end of the sixth day, God looked at everything he had made and called it very good. The story invites us to notice what is good in the world and help protect it."}]};

function englishCues(details,from,to){const times=details.times_en||[];return Array.from({length:to-from+1},(_,n)=>{const verse=from+n,t=times[verse-1],next=times[verse];const start=Number(typeof t==='object'?t?.start:t);const end=Number((typeof t==='object'?t?.end:undefined)??details.times_en_end?.[verse-1]??(typeof next==='object'?next?.start:next));return {verse,start,end};}).filter(c=>Number.isFinite(c.start)&&Number.isFinite(c.end)&&c.end>c.start);}

<script id="story-final-refinement-script">(()=>{
const nav=document.getElementById('storyArrows');
if(nav){const b=nav.querySelectorAll('button');if(b[0]){b[0].textContent='▲';b[0].title='סיפור קודם';b[0].setAttribute('aria-label','סיפור קודם');}if(b[1]){b[1].textContent='▼';b[1].title='סיפור הבא';b[1].setAttribute('aria-label','סיפור הבא');}}
const kids=document.getElementById('topKidsSwitch');
if(kids){const paint=()=>{kids.textContent=childrenMode?'🧒':'🧔';kids.title=childrenMode?(currentLanguage==='he'?'לילדים':'For Kids'):(currentLanguage==='he'?'למבוגרים':'For Adults');kids.setAttribute('aria-label',kids.title);kids.classList.toggle('bearded-adult',!childrenMode);};
const obs=new MutationObserver(paint);obs.observe(kids,{childList:true});
// The older controller updates the label: replace after it, without triggering a mutation loop.
const oldText=Object.getOwnPropertyDescriptor(Node.prototype,'textContent');
obs.disconnect();
const originalClick=kids.onclick;kids.onclick=(event)=>{originalClick?.call(kids,event);queueMicrotask(paint);};
const lang=document.getElementById('language-toggle');lang?.addEventListener('click',()=>setTimeout(paint,20));
paint();
}
const chapter=document.getElementById('dockChapter');
// The dock caption is controlled by its single update loop below; no competing MutationObserver.
// Browsers generally reject fullscreen without a user gesture. Try once at 100ms;
// then request it on the next deliberate tap if the browser blocked the first attempt.
let tried=false;const enter=()=>{if(document.fullscreenElement||!document.documentElement.requestFullscreen)return;document.documentElement.requestFullscreen().catch(()=>{});};
setTimeout(()=>{tried=true;enter();},100);
document.addEventListener('pointerdown',function once(e){if(!tried||document.fullscreenElement)return;enter();document.removeEventListener('pointerdown',once,true);},true);
})();</script>

<script id="story-corrections-controller">(()=>{
 const dock=document.getElementById('storyImageDock');if(!dock)return;
 const photo=dock.querySelector('.dock-photo');
 const overlay=document.createElement('div');overlay.id='dockVerseOverlay';overlay.hidden=true;photo.append(overlay);
 const chapter=document.getElementById('dockChapter');const arrows=document.querySelectorAll('#storyArrows button');
 // Navigation buttons keep their original opposite-side ordering.
 const kids=document.getElementById('topKidsSwitch');
 function update(){
  if(kids){const icon=childrenMode?'🧒':'🧔';if(kids.textContent!==icon)kids.textContent=icon;kids.classList.toggle('bearded-adult',!childrenMode);kids.title=childrenMode?'לילדים / For Kids':'למבוגרים / For Adults';kids.setAttribute('aria-label',kids.title);}
  const cards=[...document.querySelectorAll('#feed .idea')];if(!cards.length)return;
  const feed=document.getElementById('feed'),top=feed.getBoundingClientRect().top+Math.min(55,feed.clientHeight/3);
  const card=cards.find(c=>{const r=c.getBoundingClientRect();return r.top<=top&&r.bottom>top})||cards.find(c=>c.getBoundingClientRect().bottom>top)||cards.at(-1);
  const state=card?.verseState;if(!state)return;
  const original=state.overlay;
  const visible=Boolean(state.open&&!original.hidden);
  if(overlay.hidden===visible)overlay.hidden=!visible;
  if(visible){overlay.lang=original.lang||currentLanguage;
   if(overlay.innerHTML!==original.innerHTML){const previousScroll=overlay.scrollTop;overlay.innerHTML=original.innerHTML;overlay.scrollTop=previousScroll;}
  }else if(overlay.innerHTML)overlay.replaceChildren();
  const en=document.body.dataset.language==='en';const item=state.item;
  const names=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','1 Samuel','2 Samuel','1 Kings','2 Kings','Isaiah','Jeremiah','Ezekiel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Psalms','Proverbs','Job','Song of Songs','Ruth','Lamentations','Ecclesiastes','Esther','Daniel','Ezra','Nehemiah','1 Chronicles','2 Chronicles'];
  const book=en?(names[BOOKS.findIndex(x=>x[0]===item.book)]||item.book):item.book;
  const range=state.from===state.to?String(state.from):state.from+'–'+state.to;
  const desired=(en?`${book} · Chapter ${item.chapter} · Verses ${range}`:`${book} · פרק ${item.chapter} · פסוקים ${range}`)+".";
  chapter.dir=en?'ltr':'rtl';chapter.style.unicodeBidi='isolate';
  if(chapter.textContent!==desired)chapter.textContent=desired;
  // Do not let the dock's own controls fall behind the displayed verses.
  const verseButton=document.getElementById('dockVerses');if(verseButton)verseButton.setAttribute('aria-pressed',String(visible));
 }
 setInterval(update,120);update();
})();</script>

<script id="android-nav-and-fullscreen-20261024">(()=>{
'use strict';
const labels=()=>{
 const en=document.body.dataset.language==='en';
 const buttons=document.querySelectorAll('#storyArrows button');
 if(buttons[0]){const t=en?'Previous':'קודם';buttons[0].textContent='▲';buttons[0].title=t;buttons[0].setAttribute('aria-label',t);}
 if(buttons[1]){const t=en?'Next':'הבא';buttons[1].textContent='▼';buttons[1].title=t;buttons[1].setAttribute('aria-label',t);}
};
new MutationObserver(labels).observe(document.body,{attributes:true,attributeFilter:['data-language']});
labels();
// Android Chrome forbids requestFullscreen without a user gesture.
// Request on the earliest interaction, not only on chapter selection.
const request=()=>{
 if(document.fullscreenElement || !document.documentElement.requestFullscreen)return;
 try{const result=document.documentElement.requestFullscreen({navigationUI:'hide'});result?.catch?.(()=>{});}catch(e){}
};
for(const type of ['pointerdown','touchend','keydown']){
 document.addEventListener(type,request,{capture:true,passive:true});
}
// Browsers allowing automatic fullscreen can enter on load; Android Chrome normally blocks this.
setTimeout(request,100);
})();</script>

<script id="audio-only-story-behavior">(()=>{

const photo=document.querySelector('#storyImageDock .dock-photo');
if(!photo)return;
photo.addEventListener('click',event=>{
 if(event.target.closest('button'))return;
 event.stopPropagation();
 // A tap on the image or its verse text pauses the current recording.
 if(typeof audioSession!=='undefined'&&audioSession&&!audioPlayer.paused){
  audioPlayer.pause();cancelAnimationFrame(audioFrame);audioSession.paused=true;
  audioSession.state.audioButton.textContent='▶';
  const dock=document.getElementById('dockAudio');if(dock)dock.textContent='▶';
 }
});
// Synchronize the fixed audio button with pause and resume.
const dockAudio=document.getElementById('dockAudio');
if(dockAudio){
 audioPlayer.addEventListener('pause',()=>{if(audioSession)dockAudio.textContent='▶';});

 audioPlayer.addEventListener('ended',()=>{dockAudio.textContent='▶';});
}
})();</script>

<script id="karaoke-always-reveal-verses">(()=>{

 },{capture:true});

 const st=card?.verseState;if(!st||st.item.book!=='בראשית')return null;

}

function getProgress(card,points){let p=progress.get(card);if(!p){p={order:points.map((_,i)=>i).filter(i=>points[i]?.label&&points[i]?.question),current:0,solved:new Set(),wrong:new Set(),done:false};for(let i=p.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p.order[i],p.order[j]]=[p.order[j],p.order[i]];}progress.set(card,p);}return p}

 };

<script id="github-three-level-quiz-controller">(()=>{
'use strict';
const btn=document.getElementById('openIntegratedGame'),modal=document.getElementById('githubQuizDialog');
const bar=document.createElement('div');bar.id='quizDifficulty';
const levels=[['easy','קל','Easy'],['medium','בינוני','Medium'],['challenge','קשה','Hard']];
let level=null,queue=[],idx=0,loading=0,answered=false;
const resultsByLanguage={he:{correct:0,wrong:0,completed:new Map()},en:{correct:0,wrong:0,completed:new Map()}};
let chosenIdea=null, observedIdea=null, quizLanguage=null;
const languageKey=()=>en()?'en':'he';
const results=()=>resultsByLanguage[languageKey()];
const en=()=>document.body.dataset.language==='en';
const question=document.getElementById('githubQuizQuestion');
const answers=document.getElementById('githubQuizAnswers');
const explanation=document.getElementById('githubQuizExplanation');
const next=document.getElementById('githubQuizNext');
const progress=document.getElementById('githubQuizProgress');
const scoreboard=document.getElementById('githubQuizHeading');
const qtext=q=>q.question||q.q||'';
function updateScore(){
 const {correct,wrong}=results();const total=correct+wrong,grade=total?Math.round(100*correct/total):0;
 scoreboard.innerHTML=en()?`<span class=quiz-success>✓ Correct: ${correct}</span><span class=quiz-failure>✗ Wrong: ${wrong}</span><span class=quiz-grade>★ Score: ${grade}</span>`:`<span class=quiz-success>✓ הצלחות: ${correct}</span><span class=quiz-failure>✗ שגיאות: ${wrong}</span><span class=quiz-grade>★ ציון: ${grade}</span>`;
}
function paintLevels(){
 bar.style.direction=en()?'ltr':'rtl';
 bar.querySelectorAll('button').forEach(b=>{
  const row=levels.find(x=>x[0]===b.dataset.level);
  b.textContent=en()?row[2]:row[1];
  b.classList.toggle('active',level===b.dataset.level);
  const done=results().completed.get(ideaKey())?.has(b.dataset.level)||false;
  b.disabled=done; b.title=done?(en()?'Already completed for this idea':'הרמה כבר הושלמה ברעיון הזה'):'';
  b.style.opacity=done?'0.42':'1';
 });
}
function current(){
 const card=typeof mainVisibleCard==='function'?mainVisibleCard()?.card:null;
 return {item:card?.verseState?.item,from:card?.verseState?.from,to:card?.verseState?.to};
}
function ideaKey(){
 const x=current();return x.item?`${x.item.key}:${x.from}:${x.to}`:null;
}
function exitOnIdeaChange(){
 const key=ideaKey();if(!key)return;
 if(observedIdea===null){observedIdea=key;return;}
 if(key!==observedIdea){
  observedIdea=key;loading++;level=null;
  if(modal.open)modal.close();
  document.body.classList.remove('quiz-choosing');
  paintLevels();
 }
}
setInterval(exitOnIdeaChange,180);
function clearQuestion(){
 answers.replaceChildren();explanation.textContent='';next.hidden=true;progress.textContent='';
}
function chooseLevel(){
 level=null;paintLevels();clearQuestion();
 question.textContent=en()?'Choose a difficulty level above to start':'בחר רמת קושי למעלה כדי להתחיל';
 updateScore();
}
async function start(){
 const ticket=++loading,x=current();quizLanguage=languageKey();
 queue=[];idx=0;answered=false;clearQuestion();updateScore();
 question.textContent=en()?'Loading questions…':'טוען שאלות מגיטהאב…';
 if(!x.item){
  question.textContent=en()?'Select a story to play.':'יש לבחור סיפור כדי לשחק.';return;
 }
 try{
  const data=await getJson(x.item.key+'/'+(en()?'questions_en.json':'questions.json'));
  if(ticket!==loading||!modal.open)return;
  const paragraphs=(data?.paragraphs||[]).filter(p=>{
   const first=Number(p.start_verse??p.from??p.verse??0);
   const last=Number(p.end_verse??p.to??first);
   return first<=x.to&&last>=x.from;
  });
  queue=paragraphs.flatMap(p=>(p[level]||[]).map(q=>({...q})))
   .filter(q=>qtext(q)&&Array.isArray(q.answers)&&q.answers.length>=2&&Number.isInteger(Number(q.correct)));
  if(!queue.length){question.textContent=en()?'No questions for this story and level.':'אין שאלות ברמה הזאת לסיפור הנוכחי.';return;}
  render();
 }catch(err){if(ticket===loading)question.textContent=en()?'Could not load questions from GitHub.':'לא ניתן לטעון שאלות מגיטהאב.';}
}
function render(){
 const q=queue[idx];answered=false;clearQuestion();updateScore();
 progress.textContent=(en()?'Question ':'שאלה ')+(idx+1)+' / '+queue.length;
 question.textContent=qtext(q);
 q.answers.forEach((a,n)=>{
  const b=document.createElement('button');b.type='button';b.textContent=(n+1)+'. '+a;
  b.onclick=()=>{
   if(answered||quizLanguage!==languageKey())return;answered=true;
   answers.querySelectorAll('button').forEach((v,i)=>{v.disabled=true;if(i===Number(q.correct))v.classList.add('correct');});
   if(n===Number(q.correct))results().correct++;else{results().wrong++;b.classList.add('wrong');}
   updateScore();explanation.textContent=q.explanation||'';
   next.hidden=false;next.textContent=idx===queue.length-1?(en()?'Finish':'סיום'):(en()?'Next question':'השאלה הבאה');
  };
  answers.append(b);
 });
}
for(const [key] of levels){
 const b=document.createElement('button');b.type='button';b.dataset.level=key;
 b.onclick=()=>{const idea=ideaKey();if(!idea||results().completed.get(idea)?.has(key))return;chosenIdea=idea;quizLanguage=languageKey();level=key;paintLevels();if(!modal.open)modal.show();start();};
 bar.append(b);
}
document.body.appendChild(bar);
next.onclick=()=>{
 idx++;
 if(idx<queue.length)render();
 else{
  clearQuestion();updateScore();
  if(chosenIdea&&level&&quizLanguage){const completed=resultsByLanguage[quizLanguage].completed;if(!completed.has(chosenIdea))completed.set(chosenIdea,new Set());completed.get(chosenIdea).add(level);}
  level=null;paintLevels();
  const allDone=chosenIdea&&results().completed.get(chosenIdea)?.size>=3;
  question.textContent=allDone?(en()?'Finished! You can move to the next story.':'סיימת! אפשר לעבור לסיפור הבא.'):(en()?'Finished! Choose another available difficulty or continue to the next idea.':'סיימת! אפשר לבחור רמת קושי אחרת או לעבור לרעיון הבא.');
 }
};
btn.addEventListener('click',e=>{
 e.preventDefault();e.stopImmediatePropagation();
 if(modal.open){modal.close();return;}
 if(typeof stopAudio==='function')stopAudio();
 const idea=ideaKey();observedIdea=idea;
 if(idea&&results().completed.get(idea)?.size===3){return;}
 document.body.classList.add('quiz-choosing');
 chooseLevel();
},true);
document.getElementById('githubQuizClose').onclick=()=>modal.close();
modal.addEventListener('close',()=>{loading++;document.body.classList.remove('quiz-choosing');level=null;paintLevels();});
// Switching language switches to an independent question set, score and completed levels.
function onLanguageChange(){
 const lang=languageKey();
 if(quizLanguage&&quizLanguage!==lang){
  loading++;quizLanguage=null;chosenIdea=null;level=null;
  if(modal.open)modal.close();
  document.body.classList.remove('quiz-choosing');
 }
 paintLevels();updateScore();
}
const languageObserver=new MutationObserver(onLanguageChange);
languageObserver.observe(document.body,{attributes:true,attributeFilter:['data-language']});
document.getElementById('language-toggle')?.addEventListener('click',()=>setTimeout(onLanguageChange,0));
paintLevels();updateScore();
})();</script>

<script id="gpt-first-launch-script">
(()=>{
 const button=document.getElementById('owlOpenAi'),guide=document.getElementById('gptFirstGuide');
 const msg=document.getElementById('gptGuideMessage'),count=document.getElementById('gptCountdown'),cancel=document.getElementById('gptGuideCancel'),launch=document.getElementById('gptGuideOpen');
 let introShownThisOpening=false,pending=false,timer=null,popup=null;
 function positionButton(){
   const kids=document.getElementById('topKidsSwitch');if(!kids)return;
   const r=kids.getBoundingClientRect();
   // Beside the child/adult icon, on its left in the RTL header.
   button.parentElement.style.left=Math.max(3,Math.round(r.left-button.offsetWidth-4))+'px';
   button.parentElement.style.top=Math.round(r.top)+'px';
 }
 function positionGuide(){
   const dock=document.querySelector('#storyImageDock .dock-photo')||document.getElementById('storyImageDock');
   const r=dock?.getBoundingClientRect()||{left:10,top:80,width:innerWidth-20,height:innerHeight*.55};
   guide.style.left=Math.max(5,r.left+8)+'px';guide.style.top=Math.max(5,r.top+8)+'px';
   guide.style.width=Math.max(200,Math.min(innerWidth-10,r.width-16))+'px';
   guide.style.height=Math.max(150,Math.min(innerHeight-12,r.height-16))+'px';
 }
 const GPT_BOOK_NAMES_EN = ["Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy", "Joshua", "Judges", "1 Samuel", "2 Samuel", "1 Kings", "2 Kings", "Isaiah", "Jeremiah", "Ezekiel", "Hosea", "Joel", "Amos", "Obadiah", "Jonah", "Micah", "Nahum", "Habakkuk", "Zephaniah", "Haggai", "Zechariah", "Malachi", "Psalms", "Proverbs", "Job", "Song of Songs", "Ruth", "Lamentations", "Ecclesiastes", "Esther", "Daniel", "Ezra", "Nehemiah", "1 Chronicles", "2 Chronicles"];
 function getPrompt(){
  const feed=document.getElementById('feed'),cards=[...feed.querySelectorAll('.idea')];
  const y=feed.getBoundingClientRect().top+Math.min(55,feed.clientHeight/3);
  const card=cards.find(c=>{const r=c.getBoundingClientRect();return r.top<=y&&r.bottom>y})||cards.find(c=>c.getBoundingClientRect().bottom>y)||cards[0];
  if(!card)return null;
  const chapter=chapterList[Number(card.dataset.index)];
  const verses=card.dataset.verses||'',idea=card.dataset.storyNumber||'1';
  if(document.body.dataset.language==='en'){
    const bookIndex=BOOKS.findIndex(entry=>entry[0]===chapter.book);
    const book=GPT_BOOK_NAMES_EN[bookIndex]||chapter.book;
    const title=card.querySelector('.en-title')?.textContent?.trim()||'';
    const explanation=card.querySelector('.summary .en:not(.child-explanation)')?.textContent?.trim()||'';
    const verseNumbers=(verses.match(/[0-9]+/g)||[]).join('–');
    return 'I am studying the Bible: '+book+', chapter '+chapter.chapter+(verseNumbers?', verses '+verseNumbers:'')+', idea '+idea+'.\nIdea title: '+title+'.\n'+(explanation?'Explanation: '+explanation.slice(0,700)+'\n':'')+'Tell me briefly a surprising and accurate scientific, historical, or philosophical fact related to this idea. Distinguish established facts from interpretation, and let me ask follow-up questions. Please answer in English.';
  }
  const title=card.querySelector('.he-title')?.textContent?.trim()||'';
  const explanation=card.querySelector('.summary .he:not(.child-explanation)')?.textContent?.trim()||'';
  return 'אני לומד תנ״ך: '+chapter.book+' פרק '+chapter.chapter+', '+verses+', רעיון '+idea+'.\nשם הרעיון: '+title+'.\n'+(explanation?'הסבר הרעיון: '+explanation.slice(0,700)+'\n':'')+'ספר לי בקצרה עובדה מדעית, היסטורית או פילוסופית מפתיעה ומדויקת הקשורה לרעיון הזה. הבחֵן בין עובדות לפרשנות, ואפשר לי לשאול שאלות המשך.';
 }
 function copyPrompt(prompt){navigator.clipboard?.writeText(prompt).catch(()=>{});}
 // The browser only permits reliable new-tab navigation during a real user gesture.
 // Never navigate the current Tanakh window away.
 function openGPT(prompt){
   copyPrompt(prompt);
   const target='https://chatgpt.com/?q='+encodeURIComponent(prompt);
   const opened=window.open(target,'_blank');
   if(!opened){
     // A normal link is offered as an additional user-initiated fallback.
     launch.hidden=false;
     launch.textContent=document.body.dataset.language==='en'?'Tap again to open GPT':'לחץ שוב לפתיחת GPT';
     msg.textContent=document.body.dataset.language==='en'?'The browser blocked the new tab. Please allow pop-ups for this site or tap again. Your Tanakh page remains open.':'הדפדפן חסם את הכרטיסייה החדשה. אפשר חלונות קופצים לאתר או לחץ שוב. התנ״ך נשאר פתוח.';
     guide.style.display='flex';
     return false;
   }
   return true;
 }
 function stop(){clearInterval(timer);timer=null;pending=false;guide.style.display='none';launch.hidden=true;}
 cancel.addEventListener('click',stop);
 let preparedPrompt=null;
 launch.addEventListener('click',()=>{
   if(!preparedPrompt)return;
   // User gesture: this runs synchronously from the click, not from a timer.
   if(openGPT(preparedPrompt)){introShownThisOpening=true;stop();}
 });
 button.addEventListener('click',()=>{
   if(pending)return;
   const prompt=getPrompt();if(!prompt){alert('יש להמתין לטעינת הסיפור.');return;}
   preparedPrompt=prompt;
   const en=document.body.dataset.language==='en';guide.lang=en?'en':'he';
   if(introShownThisOpening){
     // Even on later presses, use a direct click to open the new tab.
     openGPT(prompt);return;
   }
   pending=true;let remaining=7;count.textContent=String(remaining);
   count.hidden=false;launch.hidden=true;
   msg.textContent=en?'In 7 seconds, you can open GPT. To return here, use the square Recent Apps button at the bottom of your phone.':'בעוד 7 שניות אפשר יהיה לפתוח את GPT. כדי לחזור לכאן השתמש בכפתור האפליקציות המרובע בסרגל התחתון של הפלאפון.';
   cancel.textContent=en?'Cancel':'ביטול';positionGuide();guide.style.display='flex';
   timer=setInterval(()=>{
     remaining--;count.textContent=String(remaining);
     if(remaining<=0){clearInterval(timer);timer=null;pending=false;count.hidden=true;
       msg.textContent=en?'GPT will open a question about the verse concerning a scientific, historical, or philosophical fact.':'תיפתח ב־GPT שאלה על הפסוק, על עובדה מדעית, היסטורית או פילוסופית.';
       launch.textContent=en?'Open GPT now':'פתח GPT עכשיו';launch.hidden=false;
     }
   },1000);
 });
 window.addEventListener('resize',()=>{positionButton();if(pending)positionGuide()});
 setTimeout(positionButton,100);setTimeout(positionButton,900);
})();
</script>
