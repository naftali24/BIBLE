e":"https://whitelevy.fas.harvard.edu/unearthing-qurayyah-i-report-2015-2019-excavation-seasons"},{"type":"F","he":"בקוראיה יוצרו כלי החרס המעוטרים שכונו בעבר ״קרמיקה מדיינית״.","en":"Qurayyah produced painted pottery formerly called “Midianite ware.”","source":"https://whitelevy.fas.harvard.edu/unearthing-qurayyah-i-report-2015-2019-excavation-seasons"},{"type":"F","he":"כלים מטיפוס זה נמצאו גם במקדש המצרי בתמנע ובאתרים בדרום הלבנט.","en":"This pottery also occurs at Timna's Egyptian shrine and at southern Levantine sites.","source":"https://whitelevy.fas.harvard.edu/unearthing-qurayyah-i-report-2015-2019-excavation-seasons"},{"type":"U","he":"קשרים חומריים בין האתרים אינם מוכיחים את מקום מגורי משה או את זהות יתרו.","en":"Material connections between sites do not establish Moses's residence or Jethro's identity.","source":"https://www.sefaria.org/Exodus.2.15?lang=bi"}],"quote":{"he":"וַיִּשְׁמַע פַּרְעֹה אֶת הַדָּבָר הַזֶּה, וַיְבַקֵּשׁ לַהֲרֹג אֶת מֹשֶׁה. וַיִּבְרַח מֹשֶׁה מִפְּנֵי פַרְעֹה, וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן וַיֵּשֶׁב עַל הַבְּאֵר.","en":"Now when Pharaoh heard this thing, he sought to slay Moses. But Moses fled from the face of Pharaoh, and dwelt in the land of Midian: and he sat down by a well."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_002/images/idea_06_v15-17.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 2 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מדין.","en":"Artistic illustration for Exodus 2 only. Its landscape and buildings are not identified views of Midian."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/2-8a404ea2c7dffbb559210a23398121de.mp3?version_id=1","start":134.46,"end":145.44},"he":{"url":"https://mechon-mamre.org/mp3/t0202.mp3","start":152.82,"end":165.35}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-3-1-horeb","book":"שמות","chapter":3,"verse":1,"title":{"he":"חורב — הר ומסורת זיהוי","en":"Horeb: a mountain and a tradition of identification"},"placeKey":"horeb","facts":[{"type":"B","he":"משה מגיע בסיפור אל ״הר האלהים חרבה״ בעת רעיית הצאן.","en":"In the narrative Moses reaches Horeb, the mountain of God, while tending sheep.","source":"https://www.sefaria.org/Exodus.3.1?lang=bi"},{"type":"U","he":"ג׳בל מוסא בדרום סיני הוא זיהוי מסורתי של ההר; אין זיהוי ארכאולוגי מוסכם.","en":"Jebel Musa in southern Sinai is a traditional identification; there is no agreed archaeological identification.","source":"https://whc.unesco.org/en/list/954/"},{"type":"F","he":"מנזר סנטה קתרינה שוכן למרגלות ההר המסורתי בתוך נוף הררי תלול.","en":"Saint Catherine's Monastery stands below the traditional mountain in steep mountainous terrain.","source":"https://whc.unesco.org/en/list/954/"},{"type":"F","he":"המנזר הוקם במאה השישית לספירה, הרבה אחרי התקופות המוצעות ליציאת מצרים.","en":"The monastery was founded in the sixth century CE, long after proposed Exodus periods.","source":"https://whc.unesco.org/en/list/954/"},{"type":"F","he":"ג׳בל מוסא וג׳בל צפצפה יוצרים גוש הררי המופרד מסביבתו בעמקים.","en":"Jebel Musa and Jebel Sufsafa form a mountain unit separated from its surroundings by valleys.","source":"https://www.jstor.org/stable/j.ctt1fzhf4v.8"},{"type":"U","he":"מסורת הסנה שבמתחם המנזר אינה זיהוי בוטני או ארכאולוגי של הסנה המקראי.","en":"The monastery's burning-bush tradition is not a botanical or archaeological identification of the biblical bush.","source":"https://www.sefaria.org/Exodus.3.2?lang=bi"}],"quote":{"he":"וּמֹשֶׁה, הָיָה רֹעֶה אֶת צֹאן יִתְרוֹ חֹתְנוֹ. כֹּהֵן מִדְיָן. וַיִּנְהַג אֶת הַצֹּאן אַחַר הַמִּדְבָּר, וַיָּבֹא אֶל הַר הָאֱלֹהִים חֹרֵבָה.","en":"Now Moses kept the flock of Jethro his father in law, the priest of Midian: and he led the flock to the backside of the desert, and came to the mountain of God, even to Horeb."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_003/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 3 בלבד. הנוף והמבנים אינם תיעוד מזוהה של חורב.","en":"Artistic illustration for Exodus 3 only. Its landscape and buildings are not identified views of Horeb."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/3-5a922db8b1c3e465d0274b919269bd28.mp3?version_id=1","start":2.88,"end":14.42},"he":{"url":"https://mechon-mamre.org/mp3/t0203.mp3","start":3.89,"end":13.85}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-9-26-goshenLandscape","book":"שמות","chapter":9,"verse":26,"title":{"he":"גושן — נוף הדלתה שנקבר","en":"Goshen: a buried delta landscape"},"placeKey":"goshenLandscape","facts":[{"type":"U","he":"תחום גושן אינו ידוע; ממצאי מזרח הדלתה נותנים רקע אזורי ולא מפה מדויקת שלה.","en":"Goshen's extent is unknown; eastern delta finds offer regional context rather than its precise map.","source":"https://classic.net.bible.org/dictionary.php?word=Goshen"},{"type":"F","he":"המרחב העירוני של אווריס מכוסה כיום ברובו בשדות חקלאיים.","en":"Most of ancient Avaris's urban area is now covered by agricultural fields.","source":"https://vias.univie.ac.at/en/projects/tell-el-daba/"},{"type":"F","he":"תעלת דידאמון וכביש מודרני חצו במאה העשרים את שטח היישוב הקדום.","en":"The Didamun canal and a modern road cut across the ancient settlement in the twentieth century.","source":"https://vias.univie.ac.at/en/projects/tell-el-daba/"},{"type":"F","he":"מחקר נמל אווריס בוחן את הקשר בין שיט בנהר למסחר ימי.","en":"Research on Avaris's harbour examines connections between river transport and maritime trade.","source":"https://www.oeaw.ac.at/oeai/forschung/praehistorie-wana-archaeologie/archaeologie-in-aegypten-und-sudan/der-hafen-von-tell-el-dabʿa"},{"type":"F","he":"במתחם פולחן באווריס נמצאו מקדשים מטיפוסים מצריים ולבנטיניים זה לצד זה.","en":"An Avaris cult precinct contained Egyptian and Levantine temple types side by side.","source":"https://www.oeaw.ac.at/oeai/forschung/praehistorie-wana-archaeologie/archaeologie-in-aegypten-und-sudan/tell-el-dabʿa-archaeologische-relikte-von-tempelritualen-im-sakralbezirk-a-ii-und-ihre-kulturhistorische-zuordnung"},{"type":"B","he":"היעדר הברד בגושן הוא חלק מסיפור המכות; אין להסיק אותו מחפירות אווריס.","en":"Goshen's exemption from hail belongs to the plague narrative; it cannot be inferred from Avaris's excavations.","source":"https://www.sefaria.org/Exodus.9.26?lang=bi"}],"quote":{"he":"רַק בְּאֶרֶץ גֹּשֶׁן, אֲשֶׁר שָׁם בְּנֵי יִשְׂרָאֵל. לֹא הָיָה, בָּרָד.","en":"Only in the land of Goshen, where the children of Israel were, was there no hail."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_009/images/idea_05_v22-26.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 9 בלבד. הנוף והמבנים אינם תיעוד מזוהה של גושן.","en":"Artistic illustration for Exodus 9 only. Its landscape and buildings are not identified views of Goshen."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/9-c2a9626d63ebe0c9945cafd1d797b348.mp3?version_id=1","start":235.96,"end":241.04},"he":{"url":"https://mechon-mamre.org/mp3/t0209.mp3","start":255.68,"end":260.6}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-12-37-succothEgypt","book":"שמות","chapter":12,"verse":37,"title":{"he":"סוכות — מסדרון ואדי תומילאת","en":"Succoth: the Wadi Tumilat corridor"},"placeKey":"succothEgypt","facts":[{"type":"U","he":"סוכות של יציאת מצרים מקושרת במחקר לת׳כו שבמזרח הדלתה; הזיהוי המדויק שנוי במחלוקת.","en":"Exodus's Succoth is associated with Tjeku in the eastern delta; the exact identification is disputed.","source":"https://biblia.com/books/lbd/offset/9763013"},{"type":"F","he":"ואדי תומילאת הוא מסדרון מזרחי מן הדלתה לעבר אזור אגמי התעלה.","en":"Wadi Tumilat is an eastward corridor from the delta toward the canal-lakes region.","source":"https://iris.cnr.it/handle/20.500.14243/349398"},{"type":"F","he":"תל א־מסחוטה נמצא בקצה המזרחי של הוואדי, בנקודת קשר לתנועה אל הלבנט.","en":"Tell el-Maskhuta stands in the eastern wadi at a connection toward the Levant.","source":"https://iris.cnr.it/handle/20.500.14243/349398"},{"type":"F","he":"בוואדי נחפרה בעת העתיקה תעלת שיט הקשורה למערכת ״תעלת הפרעונים״.","en":"An ancient navigable canal in the wadi belonged to the “Canal of the Pharaohs” system.","source":"https://iris.cnr.it/handle/20.500.14243/588344"},{"type":"F","he":"בדיקות משקעים באתר מבחינות בין תקופות של פעילות נהר לבין מישור סחף יציב יותר.","en":"Sediment studies distinguish phases of river activity from more stable alluvial-plain conditions.","source":"https://iris.cnr.it/handle/20.500.14243/588344"},{"type":"U","he":"תעלת הפרעונים ותעלת סואץ המודרנית אינן אותו תוואי; אין לצייר את התעלה המודרנית במסלול המקראי.","en":"The Pharaohs' Canal and modern Suez Canal are different routes; the modern canal must not appear on a biblical itinerary.","source":"https://iris.cnr.it/handle/20.500.14243/588344"}],"quote":{"he":"וַיִּסְעוּ בְנֵי יִשְׂרָאֵל מֵרַעְמְסֵס, סֻכֹּתָה, כְּשֵׁשׁ מֵאוֹת אֶלֶף רַגְלִי הַגְּבָרִים, לְבַד מִטָּף.","en":"And the children of Israel journeyed from Rameses to Succoth, about six hundred thousand on foot that were men, beside children."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_012/images/idea_11_v37-39.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 12 בלבד. הנוף והמבנים אינם תיעוד מזוהה של סוכות.","en":"Artistic illustration for Exodus 12 only. Its landscape and buildings are not identified views of Succoth."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/12-954d46a79f8dec51e758c9815a5f220d.mp3?version_id=1","start":375.02,"end":383.72},"he":{"url":"https://mechon-mamre.org/mp3/t0212.mp3","start":402.17,"end":410.14}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-13-17-philistineRoad","book":"שמות","chapter":13,"verse":17,"title":{"he":"דרך ארץ פלשתים — החוף המבוצר","en":"Way of the Philistines: the fortified coastal route"},"placeKey":"philistineRoad","facts":[{"type":"F","he":"דרך החוף הצפונית של סיני חיברה את מזרח הדלתה עם דרום כנען.","en":"Northern Sinai's coastal route connected the eastern delta with southern Canaan.","source":"https://www.cambridge.org/core/books/abs/amenhotep-iii/international-trade-in-princesses-and-other-goods/4C77CF27023D8B628E837EA44C37062C"},{"type":"F","he":"המצרים כינו את הציר הצבאי באזור ״דרכי חורוס״.","en":"The Egyptians called the military corridor in this region the “Ways of Horus.”","source":"https://www.cambridge.org/core/books/abs/amenhotep-iii/international-trade-in-princesses-and-other-goods/4C77CF27023D8B628E837EA44C37062C"},{"type":"F","he":"לאורך הציר פעלו מצודות ותחנות פיקוח על תנועה בגבול.","en":"Forts and control stations regulated movement along the frontier corridor.","source":"https://www.cambridge.org/core/books/abs/amenhotep-iii/international-trade-in-princesses-and-other-goods/4C77CF27023D8B628E837EA44C37062C"},{"type":"F","he":"תל חבואה מזוהה עם ת׳ארו, מרכז ביצורים מצרי במזרח הדלתה ובצפון סיני.","en":"Tell Heboua is identified with Tjaru, an Egyptian fortified centre at the delta–Sinai frontier.","source":"https://arce.org/event/arce-dc-egypts-eastern-gate-the-discovery-of-a-new-kingdom-fortress-in-north-sinai-by-dr-mohamed-abd-el-maksoud/"},{"type":"F","he":"בתל אל־בורג, אתר אחר באזור הגבול, נחפרו שרידי מצודה מן הממלכה החדשה.","en":"Tell el-Borg, a separate frontier site, yielded New Kingdom fortress remains.","source":"https://www.cambridge.org/core/books/abs/amenhotep-iii/international-trade-in-princesses-and-other-goods/4C77CF27023D8B628E837EA44C37062C"},{"type":"B","he":"המקרא מתאר הימנעות מדרך זו מחשש למלחמה; המצודות מספקות רקע, לא אימות למסלול מסוים.","en":"The Bible describes avoiding this road because of warfare; the forts provide context, not proof of a particular itinerary.","source":"https://www.sefaria.org/Exodus.13.17?lang=bi"}],"quote":{"he":"וַיְהִי, בְּשַׁלַּח פַּרְעֹה אֶת הָעָם, וְלֹא נָחָם אֱלֹהִים דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים, כִּי קָרוֹב הוּא: כִּי אָמַר אֱלֹהִים.\"פֶּן יִנָּחֵם הָעָם בִּרְאֹתָם מִלְחָמָה. וְשָׁבוּ מִצְרָיְמָה.״","en":"And it came to pass, when Pharaoh had let the people go, that God led them not through the way of the land of the Philistines, although that was near; for God said, Lest peradventure the people repent when they see war, and they return to Egypt:"},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_013/images/idea_05_v17-18.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 13 בלבד. הנוף והמבנים אינם תיעוד מזוהה של דרך ארץ פלשתים.","en":"Artistic illustration for Exodus 13 only. Its landscape and buildings are not identified views of Way of the Philistines."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/13-43b4be2463c44969a8cfcc503d4cb636.mp3?version_id=1","start":180.62,"end":196.84},"he":{"url":"https://mechon-mamre.org/mp3/t0213.mp3","start":161.8,"end":183.73}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-14-21-seaCrossing","book":"שמות","chapter":14,"verse":21,"title":{"he":"חציית הים — זיהוי שאינו מוסכם","en":"Crossing the sea: an unsettled identification"},"placeKey":"seaCrossing","facts":[{"type":"B","he":"הפסוק מתאר רוח קדים עזה הנושבת כל הלילה וים שנבקע.","en":"The verse describes a strong east wind blowing all night and a divided sea.","source":"https://www.sefaria.org/Exodus.14.21?lang=bi"},{"type":"F","he":"ים סוף המודרני מתפצל בצפונו למפרץ סואץ ולמפרץ אילת.","en":"The modern Red Sea divides northward into the gulfs of Suez and Aqaba.","source":"https://yalebiblestudy.org/courses/exodus/lessons/crossing-of-the-sea-study-guide/"},{"type":"F","he":"מפרץ סואץ נמצא ממערב לסיני, ואילו מפרץ אילת ממזרח לחצי האי.","en":"The Gulf of Suez lies west of Sinai; the Gulf of Aqaba lies east of the peninsula.","source":"https://yalebiblestudy.org/courses/exodus/lessons/crossing-of-the-sea-study-guide/"},{"type":"B","he":"במלכים א׳ ט׳ השם ״ים סוף״ משמש גם לים שליד עציון גבר בארץ אדום.","en":"In First Kings 9, Yam Suph also names the sea beside Ezion-geber in Edom.","source":"https://www.sefaria.org/1_Kings.9.26?lang=bi"},{"type":"U","he":"במחקר הוצעו גם אגמים וביצות במזרח מצרים, ולא רק אחד משני המפרצים.","en":"Research has also proposed lakes and marshes in eastern Egypt, not only the two gulfs.","source":"https://yalebiblestudy.org/courses/exodus/lessons/crossing-of-the-sea-study-guide/"},{"type":"U","he":"תיאור הרוח אינו מזהה לבדו גוף מים מסוים, ולא נקבע אתר חצייה ארכאולוגי מוסכם.","en":"The wind description cannot identify a specific water body; no archaeological crossing site is agreed upon.","source":"https://yalebiblestudy.org/courses/exodus/lessons/crossing-of-the-sea-study-guide/"}],"quote":{"he":"וַיֵּט מֹשֶׁה אֶת יָדוֹ, עַל הַיָּם, וַיּוֹלֶךְ יְהוָה אֶת הַיָּם בְּרוּחַ קָדִים עַזָּה כָּל הַלַּיְלָה, וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה. וַיִּבָּקְעוּ, הַמָּיִם.","en":"And Moses stretched out his hand over the sea; and the Lord caused the sea to go back by a strong east wind all that night, and made the sea dry land, and the waters were divided."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_014/images/idea_06_v21-22.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 14 בלבד. הנוף והמבנים אינם תיעוד מזוהה של חציית הים.","en":"Artistic illustration for Exodus 14 only. Its landscape and buildings are not identified views of Crossing the sea."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/14-c105bdbf864fcb3d79c84582b9de47c9.mp3?version_id=1","start":195.48,"end":208.14},"he":{"url":"https://mechon-mamre.org/mp3/t0214.mp3","start":214.65,"end":229.81}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-15-27-elim","book":"שמות","chapter":15,"verse":27,"title":{"he":"אילים — נווה ותחנת דרך","en":"Elim: an oasis and a way station"},"placeKey":"elim","facts":[{"type":"B","he":"הפסוק מתאר באילים שתים־עשרה עינות מים ושבעים תמרים; אלה נתוני הסיפור המקראי.","en":"The verse describes twelve springs and seventy palms at Elim; these are details of the biblical account.","source":"https://www.sefaria.org/Exodus.15.27?lang=bi"},{"type":"U","he":"ואדי ע׳רנדל בסיני הוא זיהוי מסורתי לאילים, ולא זיהוי שהוכח בכתובת עתיקה.","en":"Wadi Gharandel in Sinai is a traditional identification of Elim, not one established by an ancient inscription.","source":"https://www.loc.gov/pictures/item/2019695636/"},{"type":"F","he":"מקור המים וחורשת הדקלים בע׳רנדל שימשו תחנת דרך לעולי רגל ולנוסעים בסיני.","en":"Gharandel's spring and palm grove served as a way station for pilgrims and travellers in Sinai.","source":"https://www.loc.gov/pictures/item/2019695636/"},{"type":"F","he":"במרחב הוואדי תועדו שרידי התיישבות נבטית ומוצב מן התקופה הרומית.","en":"The wadi area has documented Nabataean settlement remains and a Roman-period outpost.","source":"https://www.loc.gov/pictures/item/2019695636/"},{"type":"F","he":"תועדו גם שרידי התיישבות נזירית ומערות התבודדות מן התקופה הביזנטית.","en":"Byzantine monastic settlement remains and hermit caves have also been documented.","source":"https://www.loc.gov/pictures/item/2019695636/"},{"type":"U","he":"אין לבלבל בין ואדי ע׳רנדל בסיני לבין עין ע׳רנדל שבערבה הירדנית, שבו מצודה רומית אחרת.","en":"Sinai's Wadi Gharandel must not be confused with Ayn Gharandal in Jordan's Arabah, which has a different Roman fort.","source":"https://www.cambridge.org/core/journals/journal-of-roman-archaeology/article/abs/late-roman-fort-at-ayn-gharandal-jordan-interim-report-on-the-20092014-field-seasons/BC8A2AC8B5B8CE6D8E8FD137B183BBD2"}],"quote":{"he":"וַיָּבֹאוּ אֵילִמָה--וְשָׁם שְׁתֵּים עֶשְׂרֵה עֵינֹת מַיִם, וְשִׁבְעִים תְּמָרִים; וַיַּחֲנוּ-שָׁם, עַל-הַמָּיִם.","en":"And they came to Elim, where were twelve wells of water, and threescore and ten palm trees: and they encamped there by the waters."},"quoteSourceHe":"https://mechon-mamre.org/p/pt/pt0215.htm","era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/To_Sinai_via_the_desert._Wady_Gharandel%2C_palms_of_Elim._LOC_matpc.01949.jpg/960px-To_Sinai_via_the_desert._Wady_Gharandel%2C_palms_of_Elim._LOC_matpc.01949.jpg?utm_campaign=index&utm_content=thumbnail&utm_source=commons.wikimedia.org","kind":"archive photograph","source":"https://www.loc.gov/pictures/item/2019695636/","rights":"No known restrictions on publication; Matson Collection, Library of Congress; American Colony Photo Department, approximately 1900–1920.","caption":{"he":"תצלום ארכיוני של ואדי ע׳רנדל בסיני, בערך 1900–1920. אוסף מטסון, ספריית הקונגרס. זיהוי המקום עם אילים משוער.","en":"Archival photograph of Wadi Gharandel, Sinai, approximately 1900–1920. Matson Collection, Library of Congress. Identification with Elim is tentative."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/15-7860d846d04bf93efb4bbf626c73d939.mp3?version_id=1","start":235.66,"end":252.8},"he":{"url":"https://mechon-mamre.org/mp3/t0215.mp3","start":236.78,"end":244.58}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-16-1-wildernessSin","book":"שמות","chapter":16,"verse":1,"title":{"he":"מדבר סין — שתי הצעות שונות","en":"Wilderness of Sin: two different proposals"},"placeKey":"wildernessSin","facts":[{"type":"B","he":"הכתוב ממקם את מדבר סין בין אילים לסיני, ולא נותן את גבולותיו.","en":"The text places the Wilderness of Sin between Elim and Sinai without defining its boundaries.","source":"https://www.sefaria.org/Exodus.16.1?lang=bi"},{"type":"F","he":"מדבר סין נבדל ממדבר צין שבמרחב קדש והנגב הצפוני; אלה שני שמות מקראיים שונים.","en":"The Wilderness of Sin differs from Zin in the Kadesh–northern Negev region; they are distinct biblical names.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Wilderness-Sin"},{"type":"U","he":"אחת ההצעות היא דבת א־רמלה, אזור חולי בפנים חצי האי סיני.","en":"One proposal is Debbet er-Ramleh, a sandy tract in the Sinai interior.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Wilderness-Sin"},{"type":"U","he":"הצעה אחרת היא מישור אל־מרח׳ה בחוף המערבי של סיני; היא אינה אותו אתר.","en":"Another proposal is the el-Markha plain on Sinai's western coast; this is a different location.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Wilderness-Sin"},{"type":"F","he":"דבת א־רמלה נמצאת במרחב שבין סרביט אל־ח׳אדם לשולי רמת א־תיה.","en":"Debbet er-Ramleh lies in the area between Serabit el-Khadim and the edge of the et-Tih plateau.","source":"https://www.openbible.info/geo/modern/mc53c05/debbet-er-ramleh"},{"type":"B","he":"במדבר ל״ג מונה את דפקה ואלוש אחרי מדבר סין ולפני רפידים, ומוסיף תחנות למסלול שבשמות.","en":"Numbers 33 lists Dophkah and Alush after Sin and before Rephidim, adding stations to the Exodus itinerary.","source":"https://www.sefaria.org/Numbers.33.12?lang=bi"}],"quote":{"he":"וַיִּסְעוּ, מֵאֵילִם, וַיָּבֹאוּ כָּל עֲדַת בְּנֵי יִשְׂרָאֵל אֶל מִדְבַּר סִין, אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי. בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי, לְצֵאתָם מֵאֶרֶץ מִצְרָיִם.","en":"And they took their journey from Elim, and all the congregation of the children of Israel came unto the wilderness of Sin, which is between Elim and Sinai, on the fifteenth day of the second month after their departing out of the land of Egypt."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_016/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 16 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מדבר סין.","en":"Artistic illustration for Exodus 16 only. Its landscape and buildings are not identified views of Wilderness of Sin."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/16-11460291b70c92464ba6932c09c13787.mp3?version_id=1","start":2.88,"end":18.38},"he":{"url":"https://mechon-mamre.org/mp3/t0216.mp3","start":4.28,"end":16.98}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-17-1-rephidim","book":"שמות","chapter":17,"verse":1,"title":{"he":"רפידים — ההצעה בוואדי פיראן","en":"Rephidim: the Wadi Feiran proposal"},"placeKey":"rephidim","facts":[{"type":"U","he":"רפידים זוהתה במסורת נוצרית עם אזור פיראן בדרום סיני; הזיהוי משוער.","en":"Christian tradition associated Rephidim with the Feiran area of southern Sinai; the identification is tentative.","source":"https://www.jstor.org/stable/j.ctt1fzhf4v.9"},{"type":"F","he":"נווה פיראן נמצא מצפון להר סרבל, העולה מעל סביבתו.","en":"Feiran oasis lies north of Mount Serbal, which towers above it.","source":"https://www.loc.gov/item/2019705673/"},{"type":"F","he":"אגן ואדי פיראן משלב מעלה הררי תלול עם חלק תחתון מתון יותר.","en":"The Feiran basin combines a steep mountainous upper zone with gentler lower terrain.","source":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12711903/"},{"type":"F","he":"במעלה האגן מצויים סלעי גרניט וסלעים מותמרים; בחלקו התחתון נחשפים גם סלעי משקע.","en":"The upper basin contains granite and metamorphic rocks; sedimentary rocks also appear downstream.","source":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12711903/"},{"type":"F","he":"היישוב הביזנטי פאראן שימש מרכז עירוני ובישופי ליד הנווה.","en":"Byzantine Pharan was an urban and episcopal centre beside the oasis.","source":"https://www.jstor.org/stable/j.ctt1fzhf4v.9"},{"type":"B","he":"הפסוק מתאר מחסור במים ברפידים; נווה פיראן המאוחר אינו הוכחה למים שבקעו מן הצור.","en":"The verse describes a water shortage; later Feiran does not prove the water-from-the-rock event.","source":"https://www.sefaria.org/Exodus.17.1?lang=bi"}],"quote":{"he":"וַיִּסְעוּ כָּל עֲדַת בְּנֵי יִשְׂרָאֵל מִמִּדְבַּר סִין, לְמַסְעֵיהֶם. עַל פִּי יְהוָה. וַיַּחֲנוּ, בִּרְפִידִים, וְאֵין מַיִם, לִשְׁתֹּת הָעָם.","en":"And all the congregation of the children of Israel journeyed from the wilderness of Sin, after their journeys, according to the commandment of the Lord, and pitched in Rephidim: and there was no water for the people to drink."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_017/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 17 בלבד. הנוף והמבנים אינם תיעוד מזוהה של רפידים.","en":"Artistic illustration for Exodus 17 only. Its landscape and buildings are not identified views of Rephidim."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/17-512f719c039e14398af55070ec6bb42d.mp3?version_id=1","start":2.88,"end":14.74},"he":{"url":"https://mechon-mamre.org/mp3/t0217.mp3","start":3.55,"end":13.69}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-19-2-sinaiCamp","book":"שמות","chapter":19,"verse":2,"title":{"he":"מדבר סיני — רמה, עמקים ומחנה","en":"Sinai wilderness: massifs, valleys and a camp"},"placeKey":"sinaiCamp","facts":[{"type":"U","he":"מיקום המחנה ״נגד ההר״ אינו ידוע; התיאור המסורתי בדרום סיני הוא הצעת זיהוי.","en":"The camp “before the mountain” is unlocated; the southern Sinai setting is a traditional proposal.","source":"https://whc.unesco.org/en/list/954/"},{"type":"F","he":"הרי דרום סיני בנויים בחלקם מסלעי יסוד וסלעים מותמרים קדומים.","en":"Southern Sinai's mountains include ancient igneous and metamorphic rocks.","source":"https://www.keybiodiversityareas.org/en/site/factsheet/6211/site"},{"type":"F","he":"ג׳בל קתרינה גבוה מג׳בל מוסא; הפסגה הגבוהה ביותר אינה בהכרח ההר שבמסורת.","en":"Jebel Katherina is higher than Jebel Musa; the highest summit is not necessarily the traditionally identified mountain.","source":"https://www.keybiodiversityareas.org/en/site/factsheet/6211/site"},{"type":"F","he":"מערכת ואדיות עמוקים מבתרת את גושי ההרים בדרום סיני.","en":"Deep wadis dissect the mountain massifs of southern Sinai.","source":"https://www.keybiodiversityareas.org/en/site/factsheet/6211/site"},{"type":"F","he":"חלק מאגני הניקוז פונים מערבה למפרץ סואץ ואחרים מזרחה למפרץ אילת.","en":"Some drainage basins run west to the Gulf of Suez and others east to the Gulf of Aqaba.","source":"https://www.keybiodiversityareas.org/en/site/factsheet/6211/site"},{"type":"B","he":"הבחנת הכתוב בין המחנה להר חשובה: זיהוי פסגה לבדה אינו מזהה את שטח חניית העם.","en":"The text distinguishes camp from mountain: identifying a summit alone does not locate the people's camping area.","source":"https://www.sefaria.org/Exodus.19.2?lang=bi"}],"quote":{"he":"וַיִּסְעוּ מֵרְפִידִים, וַיָּבֹאוּ מִדְבַּר סִינַי, וַיַּחֲנוּ, בַּמִּדְבָּר. וַיִּחַן שָׁם יִשְׂרָאֵל, נֶגֶד הָהָר.","en":"For they were departed from Rephidim, and were come to the desert of Sinai, and had pitched in the wilderness; and there Israel camped before the mount."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_019/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 19 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מדבר סיני.","en":"Artistic illustration for Exodus 19 only. Its landscape and buildings are not identified views of Sinai wilderness."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/19-1b1a8b211cab34139e25deba863a4eb5.mp3?version_id=1","start":12.28,"end":22.6},"he":{"url":"https://mechon-mamre.org/mp3/t0219.mp3","start":13.79,"end":22.63}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-13-21-hamath","book":"במדבר","chapter":13,"verse":21,"title":{"he":"לבוא חמת — מרחב צפוני","en":"Lebo-hamath: a northern region"},"placeKey":"hamath","facts":[{"type":"U","he":"״לבוא חמת״ עשוי לציין כניסה למרחב חמת או שם מקום; אין לצמצמו אוטומטית לעיר חמה.","en":"“Lebo-hamath” may denote an approach to Hamath or a place-name; it should not automatically be reduced to Hama city.","source":"https://www.thetorah.com/article/defining-the-borders-of-the-land-of-canaan-numbers-34"},{"type":"F","he":"חמת הקדומה מזוהה עם חמה שבמערב סוריה, על נהר האורונטס.","en":"Ancient Hamath is identified with Hama in western Syria on the Orontes River.","source":"https://en.natmus.dk/historical-knowledge/historical-knowledge-the-world/the-lands-of-the-mediterranean/the-far-east/digital-hama-a-window-on-syrias-past/"},{"type":"F","he":"עמק האורונטס יוצר ציר צפון–דרום המקביל בקירוב לחוף הים התיכון.","en":"The Orontes Valley forms a roughly coast-parallel north-south corridor.","source":"https://en.natmus.dk/historical-knowledge/historical-knowledge-the-world/the-lands-of-the-mediterranean/the-far-east/digital-hama-a-window-on-syrias-past/"},{"type":"F","he":"בתל חמה נחשף רצף ארוך של יישוב, מכפרים נאוליתיים ועד תקופות מאוחרות.","en":"Hama's mound yielded a long settlement sequence from Neolithic villages to later periods.","source":"https://en.natmus.dk/historical-knowledge/historical-knowledge-the-world/the-lands-of-the-mediterranean/the-far-east/digital-hama-a-window-on-syrias-past/"},{"type":"F","he":"בחלקו הדרומי של התל נחפרה מצודה מתקופת הברזל, נפרדת משטחי החפירה של השלבים הקדומים.","en":"An Iron Age citadel was excavated in the mound's southern sector, separate from exposures of earlier phases.","source":"https://en.natmus.dk/historical-knowledge/historical-knowledge-the-world/the-lands-of-the-mediterranean/the-far-east/digital-hama-a-window-on-syrias-past/life-in-an-ancient-near-eastern-town/?force=desktop"},{"type":"B","he":"בפסוק זהו קצה צפוני של מרחב הסיור; אין בכך תיעוד ארכאולוגי למסע המרגלים.","en":"In the verse it is a northern limit of the reconnaissance region, not archaeological documentation of the scouts' journey.","source":"https://www.sefaria.org/Numbers.13.21?lang=bi"}],"quote":{"he":"וַיַּעֲלוּ, וַיָּתֻרוּ אֶת הָאָרֶץ, מִמִּדְבַּר צִן עַד רְחֹב, לְבֹא חֲמָת.","en":"So they went up, and searched the land from the wilderness of Zin unto Rehob, as men come to Hamath."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_013/images/idea_05_v21-24.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 13 בלבד. הנוף והמבנים אינם תיעוד מזוהה של לבוא חמת.","en":"Artistic illustration for Numbers 13 only. Its landscape and buildings are not identified views of Lebo-hamath."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/13-dee89847f61b50529d365b362d9b9708.mp3?version_id=1","start":114.96,"end":121.78}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-20-17-kingsHighway","book":"במדבר","chapter":20,"verse":17,"title":{"he":"דרך המלך — ציר הרמה בעבר הירדן","en":"King's Highway: Transjordan's plateau corridor"},"placeKey":"kingsHighway","facts":[{"type":"F","he":"הציר המכונה דרך המלך חיבר אזורים לאורך רמות עבר הירדן מצפון לדרום.","en":"The corridor called the King's Highway linked regions along the Transjordanian plateau north to south.","source":"https://international.visitjordan.com/uploads/brochures/biblical-english.pdf"},{"type":"F","he":"מואב ואדום נמצאות מדרום לגלעד ולעמון לאורך מרחב הדרכים הזה.","en":"Moab and Edom lie south of Gilead and Ammon along this road region.","source":"https://international.visitjordan.com/uploads/brochures/biblical-english.pdf"},{"type":"F","he":"דרך הרמה נבדלת מנתיבים נמוכים יותר לאורך בקעת הירדן והערבה.","en":"The plateau route differs from lower routes along the Jordan Valley and Arabah.","source":"https://tile.loc.gov/storage-services/master/frd/frdcstdy/jo/jordancountrystu00metz/jordancountrystu00metz.pdf"},{"type":"F","he":"קניון הארנון מבתר את הרמה, ולכן ציר אורך במרחב חייב להתמודד עם ירידה ועלייה תלולות.","en":"The Arnon gorge cuts the plateau, forcing a longitudinal route through steep descent and ascent.","source":"https://www.unesco.org/en/mab/mujib"},{"type":"B","he":"בקשת המעבר מבדילה בין הדרך לבין השדות, הכרמים והבארות שבשליטת אדום.","en":"The passage request distinguishes the road from fields, vineyards and wells controlled by Edom.","source":"https://www.sefaria.org/Numbers.20.17?lang=bi"},{"type":"U","he":"הכביש המודרני המכונה דרך המלך אינו הוכחה לתוואי זהה בכל תקופה עתיקה.","en":"Today's road named King's Highway does not establish an identical alignment in every ancient period.","source":"https://international.visitjordan.com/uploads/brochures/biblical-english.pdf"}],"quote":{"he":"״נַעְבְּרָה נָּא בְאַרְצֶךָ, לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם, וְלֹא נִשְׁתֶּה, מֵי בְאֵר: דֶּרֶךְ הַמֶּלֶךְ נֵלֵךְ לֹא נִטֶּה יָמִין וּשְׂמֹאול, עַד אֲשֶׁר נַעֲבֹר, גְּבֻלֶךָ.״","en":"Let us pass, I pray thee, through thy country: we will not pass through the fields, or through the vineyards, neither will we drink of the water of the wells: we will go by the king's high way, we will not turn to the right hand nor to the left, until we have passed thy borders."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_020/images/idea_03_v14-21.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 20 בלבד. הנוף והמבנים אינם תיעוד מזוהה של דרך המלך.","en":"Artistic illustration for Numbers 20 only. Its landscape and buildings are not identified views of King's Highway."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/20-a090dabdc0c65fa671b6621fd03cd2ba.mp3?version_id=1","start":159.44,"end":177.52}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-20-22-mountHor","book":"במדבר","chapter":20,"verse":22,"title":{"he":"הר ההר — המסורת בג׳בל הארון","en":"Mount Hor: the Jabal Harun tradition"},"placeKey":"mountHor","facts":[{"type":"U","he":"הר ההר מזוהה במסורת עם ג׳בל הארון, מדרום־מערב לפטרה; הזיהוי משוער.","en":"Mount Hor is traditionally identified with Jabal Harun southwest of Petra; this is tentative.","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/jordan/"},{"type":"F","he":"על רמה מתחת לפסגה נחפר מתחם נזירי ביזנטי ובו כנסייה וקפלה.","en":"A Byzantine monastic complex with a church and chapel was excavated on a plateau below the summit.","source":"https://journal.fi/arctos/article/download/85921/44796"},{"type":"F","he":"המתחם פעל כמרכז עלייה לרגל הקשור למסורת אהרן.","en":"The complex functioned as a pilgrimage centre associated with Aaron's tradition.","source":"https://journal.fi/arctos/article/download/85921/44796"},{"type":"F","he":"המבנה המוסלמי שעל הפסגה הוקם בתקופה הממלוכית במאה הארבע־עשרה.","en":"The Muslim shrine on the summit was erected in the fourteenth-century Mamluk period.","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/jordan/"},{"type":"F","he":"ממצאי החרס והזכוכית במתחם משקפים גם מעבר מן התקופה הביזנטית לתקופה האסלאמית הקדומה.","en":"Pottery and glass from the complex also reflect the Byzantine–Early Islamic transition.","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/jordan/"},{"type":"B","he":"מות אהרן בהר הוא מסורת מקראית; המנזר והמבנה המאוחר אינם זיהוי ארכאולוגי של קברו.","en":"Aaron's death on the mountain is biblical tradition; the monastery and later shrine do not archaeologically identify his grave.","source":"https://www.sefaria.org/Numbers.20.28?lang=bi"}],"quote":{"he":"וַיִּסְעוּ, מִקָּדֵשׁ. וַיָּבֹאוּ בְנֵי יִשְׂרָאֵל כָּל הָעֵדָה, הֹר הָהָר.","en":"And the children of Israel, even the whole congregation, journeyed from Kadesh, and came unto mount Hor."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_020/images/idea_04_v22-29.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 20 בלבד. הנוף והמבנים אינם תיעוד מזוהה של הר ההר.","en":"Artistic illustration for Numbers 20 only. Its landscape and buildings are not identified views of Mount Hor."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/20-a090dabdc0c65fa671b6621fd03cd2ba.mp3?version_id=1","start":212.48,"end":219.06}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-21-1-arad","book":"במדבר","chapter":21,"verse":1,"title":{"he":"ערד — עיר קדומה ומצודה מאוחרת","en":"Arad: an early town and a later fortress"},"placeKey":"arad","facts":[{"type":"F","he":"תל ערד נמצא בשולי בקעת ערד בנגב הצפוני, ממערב לעיר ערד המודרנית.","en":"Tel Arad lies on the edge of the Arad basin in the northern Negev, west of modern Arad.","source":"https://en.parks.org.il/reserve-park/tel-arad-national-park/"},{"type":"F","he":"העיר התחתית המבוצרת היא בעיקר מתקופת הברונזה הקדומה.","en":"The fortified lower town belongs mainly to the Early Bronze Age.","source":"https://en.parks.org.il/reserve-park/tel-arad-national-park/"},{"type":"F","he":"על התל הגבוה נבנו מצודות מתקופת ממלכת יהודה, המאוחרות לעיר התחתית.","en":"Fortresses of the kingdom of Judah occupy the upper mound, later than the lower town.","source":"https://en.parks.org.il/reserve-park/tel-arad-national-park/"},{"type":"F","he":"במצודה התגלה מקדש ובו מזבח, מצבות ומזבחות קטורת.","en":"The fortress yielded a temple with an altar, standing stones and incense altars.","source":"https://en.parks.org.il/reserve-park/tel-arad-national-park/"},{"type":"F","he":"אוסטרקונים מן המצודה כוללים מכתבים בעברית שנשלחו לאלישיב.","en":"Ostraca from the fortress include Hebrew letters addressed to Eliashib.","source":"https://en.parks.org.il/reserve-park/tel-arad-national-park/"},{"type":"U","he":"אין לאחד את העיר הקדומה, המצודה והמלחמה שבבמדבר לאותה שכבה ארכאולוגית.","en":"The early town, fortress and Numbers battle must not be collapsed into a single archaeological layer.","source":"https://www.sefaria.org/Numbers.21.1?lang=bi"}],"quote":{"he":"וַיִּשְׁמַע הַכְּנַעֲנִי מֶלֶךְ עֲרָד, יֹשֵׁב הַנֶּגֶב, כִּי בָּא יִשְׂרָאֵל, דֶּרֶךְ הָאֲתָרִים. וַיִּלָּחֶם, בְּיִשְׂרָאֵל, וַיִּשְׁבְּ מִמֶּנּוּ, שֶׁבִי.","en":"And when king Arad the Canaanite, which dwelt in the south, heard tell that Israel came by the way of the spies; then he fought against Israel, and took some of them prisoners."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_021/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 21 בלבד. הנוף והמבנים אינם תיעוד מזוהה של ערד.","en":"Artistic illustration for Numbers 21 only. Its landscape and buildings are not identified views of Arad."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/21-2cb067f0e97cf80f7dc2518e1460b17e.mp3?version_id=1","start":2.88,"end":17.7}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-21-13-arnon","book":"במדבר","chapter":21,"verse":13,"title":{"he":"נחל ארנון — הקניון החוצה את מואב","en":"Arnon: the gorge cutting through Moab"},"placeKey":"arnon","facts":[{"type":"F","he":"נחל ארנון מזוהה עם ואדי מוג׳יב בירדן, הנשפך אל ים המלח ממזרח.","en":"The Arnon is identified with Jordan's Wadi Mujib, entering the Dead Sea from the east.","source":"https://www.unesco.org/en/mab/mujib"},{"type":"F","he":"הקניון חוצה את רמת עבר הירדן ומפריד בין אזורי רמה מצפון ומדרום.","en":"The canyon cuts the Transjordanian plateau, separating upland areas to its north and south.","source":"https://www.unesco.org/en/mab/mujib"},{"type":"F","he":"המורדות יורדים בתלילות משדות הדגן שעל הרמה אל בקע ים המלח.","en":"The slopes descend steeply from the plateau's grain fields toward the Dead Sea rift.","source":"https://www.unesco.org/en/mab/mujib"},{"type":"F","he":"בתוך המערכת מצויים קטעי מצוקים וקניונים עמוקים, ובהם גם ערוץ ואדי הידאן.","en":"The system contains cliffs and deep gorges, including Wadi Hidan.","source":"https://www.unesco.org/en/mab/mujib"},{"type":"F","he":"הגובה וכמות המשקעים פוחתים בדרך כלל מן הרמה שממזרח לכיוון ים המלח.","en":"Elevation and rainfall generally decrease from the eastern plateau toward the Dead Sea.","source":"https://www.unesco.org/en/mab/mujib"},{"type":"B","he":"בפסוק הארנון משמש גבול בין מואב לאמורי; זהו שימוש מדיני בקניון טבעי.","en":"In the verse the Arnon separates Moab from the Amorites, using a natural gorge as a political boundary.","source":"https://www.sefaria.org/Numbers.21.13?lang=bi"}],"quote":{"he":"מִשָּׁם, נָסָעוּ, וַיַּחֲנוּ מֵעֵבֶר אַרְנוֹן אֲשֶׁר בַּמִּדְבָּר, הַיֹּצֵא מִגְּבֻל הָאֱמֹרִי: כִּי אַרְנוֹן גְּבוּל מוֹאָב, בֵּין מוֹאָב וּבֵין הָאֱמֹרִי.","en":"From thence they removed, and pitched on the other side of Arnon, which is in the wilderness that cometh out of the coasts of the Amorites: for Arnon is the border of Moab, between Moab and the Amorites."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"https://upload.wikimedia.org/wikipedia/commons/c/c2/Wadi_Mujib_Allahoun_JO.jpg?utm_campaign=index&utm_content=original&utm_source=commons.wikimedia.org","kind":"photograph","source":"https://commons.wikimedia.org/wiki/File:Wadi_Mujib_Allahoun_JO.jpg","rights":"Public domain, released worldwide by photographer Freedom's Falcon. Unmodified image.","caption":{"he":"תצלום ואדי מוג׳יב (ארנון), ירדן. צילום: Freedom’s Falcon, נחלת הכלל.","en":"Wadi Mujib (Arnon), Jordan. Photograph: Freedom’s Falcon; public domain."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/21-2cb067f0e97cf80f7dc2518e1460b17e.mp3?version_id=1","start":128.42,"end":140.8}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-21-26-heshbon","book":"במדבר","chapter":21,"verse":26,"title":{"he":"חשבון — מאגר מים ושאלת הזיהוי","en":"Heshbon: a reservoir and an identification problem"},"placeKey":"heshbon","facts":[{"type":"U","he":"חשבון מזוהה בדרך כלל עם תל חיסבאן שמצפון למידבא; התאמתו לעיר סיחון נידונה במחקר.","en":"Heshbon is usually identified with Tall Hisban north of Madaba; its fit with Sihon's city remains debated.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Heshbon"},{"type":"F","he":"התל נמצא ברמה החקלאית שממזרח לבקעת הירדן.","en":"The mound lies on the agricultural plateau east of the Jordan Valley.","source":"https://madabaplains.org/"},{"type":"F","he":"בחפירות נחשפו שכבות יישוב מתקופת הברזל ועד תקופות מאוחרות רבות.","en":"Excavations uncovered occupation from the Iron Age through many later periods.","source":"https://madabaplains.org/hisban/excavations/"},{"type":"F","he":"מאגר פתוח גדול הוא אחד המתקנים הבולטים מתקופת הברזל באתר.","en":"A large open-air reservoir is a prominent Iron Age installation at the site.","source":"https://www.madabamuseum.org/en/sites/Hisban"},{"type":"F","he":"גם שרידי מקדש רומי וכנסיות ביזנטיות מעידים על שימוש מחודש בתל.","en":"A Roman temple and Byzantine churches document later reuse of the mound.","source":"https://www.madabamuseum.org/en/sites/Hisban"},{"type":"U","he":"לא זוהה באתר בביטחון המרכז האמורי המתואר בסיפור; ריבוי השכבות אינו הוכחה לעיר סיחון.","en":"The narrative's Amorite centre has not been securely identified there; many layers do not prove Sihon's city.","source":"https://madabaplains.org/hisban/excavations/hesban-in-global-history/"}],"quote":{"he":"כִּי חֶשְׁבּוֹן. עִיר סִיחֹן מֶלֶךְ הָאֱמֹרִי, הִוא. וְהוּא נִלְחַם, בְּמֶלֶךְ מוֹאָב הָרִאשׁוֹן, וַיִּקַּח אֶת כָּל אַרְצוֹ מִיָּדוֹ, עַד אַרְנֹן.","en":"For Heshbon was the city of Sihon the king of the Amorites, who had fought against the former king of Moab, and taken all his land out of his hand, even unto Arnon."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_021/images/idea_04_v21-30.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 21 בלבד. הנוף והמבנים אינם תיעוד מזוהה של חשבון.","en":"Artistic illustration for Numbers 21 only. Its landscape and buildings are not identified views of Heshbon."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/21-2cb067f0e97cf80f7dc2518e1460b17e.mp3?version_id=1","start":241.4,"end":250.5}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-21-30-madaba","book":"במדבר","chapter":21,"verse":30,"title":{"he":"מידבא — רמה ועיר הפסיפסים","en":"Medeba: plateau and mosaic town"},"placeKey":"madaba","facts":[{"type":"F","he":"מידבא מזוהה עם מדבא שבירדן, על הרמה שמדרום־מערב לעמאן.","en":"Medeba is identified with Madaba in Jordan, on the plateau southwest of Amman.","source":"https://documents1.worldbank.org/curated/en/655381468088745132/pdf/381620JO0R20071000511.pdf"},{"type":"F","he":"שרידים עתיקים נמצאים בתוך המרקם העירוני המודרני, ולא רק בתל מבודד מחוץ לעיר.","en":"Ancient remains lie within the modern urban fabric, not only on an isolated outlying mound.","source":"https://documents1.worldbank.org/curated/en/655381468088745132/pdf/381620JO0R20071000511.pdf"},{"type":"F","he":"הפארק הארכאולוגי במדבא משלב רצפות פסיפס ושרידי מבנים בסביבתם העירונית.","en":"Madaba's archaeological park integrates mosaic floors and buildings within their urban setting.","source":"https://documents1.worldbank.org/curated/en/655381468088745132/pdf/381620JO0R20071000511.pdf"},{"type":"F","he":"מפת מידבא היא רצפת פסיפס מן המאה השישית לספירה בכנסיית גאורגיוס הקדוש.","en":"The Madaba Map is a sixth-century CE mosaic floor in Saint George's Church.","source":"https://www.octagonproject.org/news/madaba"},{"type":"F","he":"המפה מתארת מקומות בארץ הקודש ובסביבתה, ובהם ירושלים והירדן, במבט של התקופה הביזנטית.","en":"The map depicts the Holy Land and surrounding places, including Jerusalem and the Jordan, from a Byzantine perspective.","source":"https://www.octagonproject.org/news/madaba"},{"type":"B","he":"הפסיפס מאוחר לשיר על חשבון ומידבא שבבמדבר; אין להשתמש בו כמפת ממלכת סיחון.","en":"The mosaic postdates Numbers's poem about Heshbon and Medeba; it cannot serve as a map of Sihon's kingdom.","source":"https://www.sefaria.org/Numbers.21.30?lang=bi"}],"quote":{"he":"״וַנִּירָם אָבַד חֶשְׁבּוֹן עַד דִּיבֹן. וַנַּשִּׁים עַד נֹפַח, אֲשֶׁר עַד מֵידְבָא.״","en":"We have shot at them; Heshbon is perished even unto Dibon, and we have laid them waste even unto Nophah, which reacheth unto Medeba."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_021/images/idea_04_v21-30.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 21 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מידבא.","en":"Artistic illustration for Numbers 21 only. Its landscape and buildings are not identified views of Medeba."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/21-2cb067f0e97cf80f7dc2518e1460b17e.mp3?version_id=1","start":280.52,"end":291.88}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-21-33-bashan","book":"במדבר","chapter":21,"verse":33,"title":{"he":"הבשן — רמות בזלת וגבולות משתנים","en":"Bashan: basalt plateaus and changing limits"},"placeKey":"bashan","facts":[{"type":"F","he":"הבשן הוא מרחב שממזרח לכנרת ולירדן העליון, הכולל ברוב תיאורי המחקר את החורן וחלקים מן הגולן.","en":"Bashan lies east of the Sea of Galilee and upper Jordan, commonly including the Hauran and parts of the Golan.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Hauran"},{"type":"F","he":"מרחבי החורן והגולן כוללים רמות המכוסות בסלעי בזלת שמקורם בפעילות געשית.","en":"The Hauran and Golan include plateaus covered by volcanic basalt.","source":"https://www.gov.il/BlobFolder/reports/ben-nun-levanon-report-2023/he/report_GSI%2013%202023.pdf"},{"type":"F","he":"עמק הירמוך תוחם מדרום את הגולן ומפריד אותו מרמות שמדרום לו.","en":"The Yarmuk valley bounds the Golan
