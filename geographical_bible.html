n for Genesis 14 only. Its landscape and buildings are not identified views of Salem."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/14-a2eb270c860221a93f85f860dead72c8.mp3?version_id=1","start":169.32,"end":178.18},"he":{"url":"https://mechon-mamre.org/mp3/t0114.mp3","start":195.17,"end":202.6}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-16-7-shur","book":"בראשית","chapter":16,"verse":7,"title":{"he":"דרך שור — אל גבול מצרים","en":"Road to Shur: toward Egypt's border"},"placeKey":"shur","facts":[{"type":"B","he":"הגר נמצאת ליד מעיין ״בדרך שור״; הכתוב מצמיד נתיב מדברי למקור מים.","en":"Hagar is found at a spring on the road to Shur; the text links a desert route with water.","source":"https://www.sefaria.org/Genesis.16.7?lang=bi"},{"type":"U","he":"שור מציינת כנראה מרחב שממזרח לגבול מצרים; גבולותיה המדויקים משוערים.","en":"Shur probably denotes territory east of Egypt's frontier; its precise extent is uncertain.","source":"https://classic.net.bible.org/dictionary.php?word=Shur"},{"type":"F","he":"בצפון סיני משתרעים מישורים חוליים בין הדלתה לדרום כנען.","en":"Northern Sinai's sandy plains lie between the delta and southern Canaan.","source":"https://www.jewishvirtuallibrary.org/sinai"},{"type":"F","he":"המסדרון החופי בצפון סיני שונה מן המסיבים ההרריים בדרום חצי האי.","en":"Northern Sinai's coastal corridor differs from the mountainous massifs in the south.","source":"https://www.jewishvirtuallibrary.org/sinai"},{"type":"B","he":"גם בראשית כ״ה מתאר את שור כמרחב ״על פני מצרים״.","en":"Genesis 25 likewise places Shur opposite Egypt.","source":"https://www.sefaria.org/Genesis.25.18?lang=bi"},{"type":"U","he":"אין ממצא המאפשר לסמן בוודאות את המעיין שבו פגשה הגר את המלאך.","en":"No evidence securely identifies the spring where Hagar met the angel.","source":"https://classic.net.bible.org/dictionary.php?word=Shur"}],"quote":{"he":"וַיִּמְצָאָהּ מַלְאַךְ יְהוָה, עַל עֵין הַמַּיִם. בַּמִּדְבָּר: עַל הָעַיִן, בְּדֶרֶךְ שׁוּר.","en":"And the angel of the Lord found her by a fountain of water in the wilderness, by the fountain in the way to Shur."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_016/images/idea_05_v7-9.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 16 בלבד. הנוף והמבנים אינם תיעוד מזוהה של דרך שור.","en":"Artistic illustration for Genesis 16 only. Its landscape and buildings are not identified views of Road to Shur."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/16-2ba17bf83cd8c315a759dc25e4462447.mp3?version_id=1","start":80.72,"end":87.44},"he":{"url":"https://mechon-mamre.org/mp3/t0116.mp3","start":80.25,"end":87.3}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-19-23-zoar","book":"בראשית","chapter":19,"verse":23,"title":{"he":"צוער — נווה בדרום ים המלח","en":"Zoar: an oasis south of the Dead Sea"},"placeKey":"zoar","facts":[{"type":"U","he":"צוער מזוהה במסורת הגאוגרפית עם אזור ע׳ור א־צאפי בדרום־מזרח ים המלח.","en":"Zoar is traditionally associated with Ghor es-Safi southeast of the Dead Sea.","source":"https://library.biblicalarchaeology.org/article/death-at-the-dead-sea/"},{"type":"F","he":"מי ואדי אל־חסא מאפשרים חקלאות באזור ע׳ור א־צאפי הצחיח.","en":"Wadi al-Hasa's water supports agriculture in arid Ghor es-Safi.","source":"https://library.biblicalarchaeology.org/article/death-at-the-dead-sea/"},{"type":"F","he":"מפת מידבא מן המאה השישית לספירה מציגה באזור עיר בשם זוארה.","en":"The sixth-century CE Madaba mosaic map depicts a town named Zoara in this area.","source":"https://publication.doa.gov.jo/uploads/publications/62/ADAJ_1987_31-439-459.pdf"},{"type":"F","he":"בחורבת שייח׳ עיסא התגלו מבנים ופסיפסים של המרכז העירוני הביזנטי.","en":"Khirbet Sheikh Isa yielded buildings and mosaics of the Byzantine urban centre.","source":"https://library.biblicalarchaeology.org/article/death-at-the-dead-sea/"},{"type":"F","he":"מצבות באזור נושאות כתובות יווניות וארמיות יהודיות מן התקופה הביזנטית.","en":"Local funerary stelae bear Greek and Jewish Aramaic inscriptions from Byzantine times.","source":"https://publication.doa.gov.jo/uploads/publications/16/SHAJ_11-143-157.pdf"},{"type":"B","he":"הגעת לוט לצוער היא מסורת בראשית; השרידים הביזנטיים מאוחרים ואינם אימות לאירוע.","en":"Lot's arrival at Zoar belongs to Genesis tradition; the later Byzantine remains do not verify it.","source":"https://www.sefaria.org/Genesis.19.23?lang=bi"}],"quote":{"he":"הַשֶּׁמֶשׁ, יָצָא עַל הָאָרֶץ. וְלוֹט, בָּא צֹעֲרָה.","en":"The sun was risen upon the earth when Lot entered into Zoar."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_019/images/idea_06_v23-26.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 19 בלבד. הנוף והמבנים אינם תיעוד מזוהה של צוער.","en":"Artistic illustration for Genesis 19 only. Its landscape and buildings are not identified views of Zoar."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/19-206164718f9ac65dca92b1a76f2aaff4.mp3?version_id=1","start":248.44,"end":254.4},"he":{"url":"https://mechon-mamre.org/mp3/t0119.mp3","start":267.27,"end":272.98}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-19-24-sodom","book":"בראשית","chapter":19,"verse":24,"title":{"he":"סדום ועמורה — זהירות בזיהוי","en":"Sodom and Gomorrah: disputed identification"},"placeKey":"sodom","facts":[{"type":"B","he":"הסיפור קושר את סדום ועמורה לערי הכיכר ולמנוסת לוט אל צוער.","en":"The narrative connects Sodom and Gomorrah with the plain's towns and Lot's flight to Zoar.","source":"https://www.sefaria.org/Genesis.19.24?lang=bi"},{"type":"U","he":"אין הסכמה מחקרית על מיקומן של שתי הערים.","en":"There is no scholarly consensus on the two cities' locations.","source":"https://classic.net.bible.org/dictionary.php?word=Sodom"},{"type":"U","he":"באב א־ד׳רע ונומיירה שממזרח לים המלח הוצעו כזיהויים; אלה הצעות ולא שמות שהוכחו בכתובות מקומיות.","en":"Bab edh-Dhra and Numeira east of the Dead Sea have been proposed; local inscriptions have not established those names.","source":"https://moses.creighton.edu/vr/BabadhDhra/txt/intro.html"},{"type":"F","he":"בחפירות באב א־ד׳רע ונומיירה נמצאו יישובים מתקופת הברונזה הקדומה.","en":"Excavations at Bab edh-Dhra and Numeira revealed Early Bronze Age settlements.","source":"https://moses.creighton.edu/vr/BabadhDhra/txt/intro.html"},{"type":"F","he":"אגן ים המלח פעיל מבחינה טקטונית; עובדה גאולוגית זו אינה מזהה את ערי הסיפור.","en":"The Dead Sea basin is tectonically active; this geological fact does not identify the narrative's towns.","source":"https://science.nasa.gov/earth/earth-observatory/the-dead-sea-77592/"},{"type":"B","he":"החורבן בגפרית ואש הוא תיאור מקראי; אין להציגו כדוח חפירה או כתיארוך מוסכם.","en":"Destruction by sulphur and fire is a biblical account, not an excavation report or agreed date.","source":"https://www.sefaria.org/Genesis.19.24?lang=bi"}],"quote":{"he":"וַיהוָה, הִמְטִיר עַל סְדֹם וְעַל עֲמֹרָה. גָּפְרִית וָאֵשׁ: מֵאֵת יְהוָה, מִן הַשָּׁמָיִם.","en":"Then the Lord rained upon Sodom and upon Gomorrah brimstone and fire from the Lord out of heaven;"},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_019/images/idea_06_v23-26.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 19 בלבד. הנוף והמבנים אינם תיעוד מזוהה של סדום ועמורה.","en":"Artistic illustration for Genesis 19 only. Its landscape and buildings are not identified views of Sodom and Gomorrah."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/19-206164718f9ac65dca92b1a76f2aaff4.mp3?version_id=1","start":254.4,"end":264.46},"he":{"url":"https://mechon-mamre.org/mp3/t0119.mp3","start":275.24,"end":282.62}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-19-26-sedom","book":"בראשית","chapter":19,"verse":26,"title":{"he":"הר סדום — מלח סלע ונוף משתנה","en":"Mount Sedom: rock salt and a changing landscape"},"placeKey":"sedom","facts":[{"type":"F","he":"הר סדום נמצא לצד החוף הדרום־מערבי של ים המלח.","en":"Mount Sedom lies beside the southwestern Dead Sea coast.","source":"https://cris.huji.ac.il/en/publications/surface-landforms-of-mount-sedom-diapir-dead-sea-basin-israel/"},{"type":"F","he":"חלק מרכזי מן ההר בנוי ממלח סלע ולא מאבן גיר רגילה.","en":"Much of the mountain consists of rock salt rather than ordinary limestone.","source":"https://cris.huji.ac.il/en/publications/surface-landforms-of-mount-sedom-diapir-dead-sea-basin-israel/"},{"type":"F","he":"מלח העולה בתהליכים גאולוגיים עיוות שכבות סלע ויצר מבנה של דיאפיר.","en":"Geological salt rise deformed rock layers into a diapir.","source":"https://cris.huji.ac.il/en/publications/surface-landforms-of-mount-sedom-diapir-dead-sea-basin-israel/"},{"type":"F","he":"מי גשם ממיסים מלח ויוצרים מערות וערוצי המסה בהר.","en":"Rainwater dissolves salt, forming caves and dissolution channels.","source":"https://cris.huji.ac.il/en/publications/surface-landforms-of-mount-sedom-diapir-dead-sea-basin-israel/"},{"type":"U","he":"העמוד המכונה ״אשת לוט״ הוא זיהוי מסורתי של צורת סלע, לא זיהוי ארכאולוגי של אדם.","en":"The pillar called “Lot's wife” is a traditional rock identification, not archaeological identification of a person.","source":"https://cris.huji.ac.il/en/publications/surface-landforms-of-mount-sedom-diapir-dead-sea-basin-israel/"},{"type":"B","he":"הפסוק מספר על נציב מלח אך אינו מזכיר את הר סדום או עמוד מסוים הנראה כיום.","en":"The verse describes a salt pillar but names neither Mount Sedom nor any surviving column.","source":"https://www.sefaria.org/Genesis.19.26?lang=bi"}],"quote":{"he":"וַתַּבֵּט אִשְׁתּוֹ, מֵאַחֲרָיו. וַתְּהִי, נְצִיב מֶלַח.","en":"But his wife looked back from behind him, and she became a pillar of salt."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_019/images/idea_06_v23-26.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 19 בלבד. הנוף והמבנים אינם תיעוד מזוהה של הר סדום.","en":"Artistic illustration for Genesis 19 only. Its landscape and buildings are not identified views of Mount Sedom."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/19-206164718f9ac65dca92b1a76f2aaff4.mp3?version_id=1","start":273.56,"end":281.78},"he":{"url":"https://mechon-mamre.org/mp3/t0119.mp3","start":290.73,"end":295.38}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-20-1-gerar","book":"בראשית","chapter":20,"verse":1,"title":{"he":"גרר — בין המישור לנגב","en":"Gerar: between the plain and the Negev"},"placeKey":"gerar","facts":[{"type":"B","he":"הפסוק ממקם את נדודי אברהם בין קדש לשור ואת שהייתו בגרר.","en":"The verse places Abraham's movements between Kadesh and Shur and his stay at Gerar.","source":"https://www.sefaria.org/Genesis.20.1?lang=bi"},{"type":"U","he":"תל הרור הוא זיהוי מוצע לגרר; אין הסכמה מוחלטת על אתר העיר.","en":"Tel Haror is a proposed identification of Gerar; the city's site is not unanimously agreed.","source":"https://biblical-archaeology.org/en/locations/tel-haror/"},{"type":"F","he":"תל הרור נמצא בנגב המערבי, במרחב נחל גרר.","en":"Tel Haror lies in the western Negev, in the Nahal Gerar area.","source":"https://biblical-archaeology.org/en/locations/tel-haror/"},{"type":"F","he":"בתל הרור התגלו ביצורים מרשימים מתקופת הברונזה התיכונה.","en":"Tel Haror yielded substantial Middle Bronze Age fortifications.","source":"https://biblical-archaeology.org/en/locations/tel-haror/"},{"type":"F","he":"נחשף בו מתחם פולחני, ובו עדויות להקרבת בעלי חיים.","en":"A cult complex with evidence of animal sacrifice was excavated there.","source":"https://biblical-archaeology.org/en/locations/tel-haror/"},{"type":"U","he":"שרידי תל הרור אינם מוכיחים את זהות אבימלך או את אירועי אברהם ושרה.","en":"Tel Haror's remains do not establish Abimelech's identity or Abraham and Sarah's experiences.","source":"https://biblical-archaeology.org/en/locations/tel-haror/"}],"quote":{"he":"וַיִּסַּע מִשָּׁם אַבְרָהָם אַרְצָה הַנֶּגֶב, וַיֵּשֶׁב בֵּין קָדֵשׁ וּבֵין שׁוּר. וַיָּגָר, בִּגְרָר.","en":"And Abraham journeyed from thence toward the south country, and dwelled between Kadesh and Shur, and sojourned in Gerar."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_020/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 20 בלבד. הנוף והמבנים אינם תיעוד מזוהה של גרר.","en":"Artistic illustration for Genesis 20 only. Its landscape and buildings are not identified views of Gerar."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/20-dca3cc4c6457b8012eb391c01f914584.mp3?version_id=1","start":2.88,"end":11.56},"he":{"url":"https://mechon-mamre.org/mp3/t0120.mp3","start":1.59,"end":10.63}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-21-14-beersheba","book":"בראשית","chapter":21,"verse":14,"title":{"he":"מדבר באר שבע — גבול ההתיישבות","en":"Wilderness of Beersheba: the settlement margin"},"placeKey":"beersheba","facts":[{"type":"F","he":"בקעת באר שבע נמצאת בין הרי חברון מצפון לרמות הנגב מדרום.","en":"The Beersheba basin lies between the Hebron hills to the north and Negev uplands to the south.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"F","he":"נחל באר שבע ונחל חברון נפגשים בקרבת תל באר שבע.","en":"Nahal Beersheba and Nahal Hebron meet near Tel Beersheba.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"F","he":"הנחלים המקומיים אינם נהרות קבע; הזרימה בהם תלויה בגשם ובשיטפונות.","en":"The local streams are not perennial rivers; flow depends on rain and floods.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"F","he":"לס מכסה שטחים בבקעה ומאפשר עיבוד במקום שבו יש די משקעים או נגר.","en":"Loess covers parts of the basin, permitting cultivation where rain or runoff is sufficient.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"B","he":"סיפור הגר מדגיש התרוקנות חמת המים; באר היא משאב נפרד מערוץ נחל יבש.","en":"Hagar's empty waterskin highlights the difference between a well and a dry stream channel.","source":"https://www.sefaria.org/Genesis.21.14?lang=bi"},{"type":"U","he":"אין לזהות את הבאר שבסיפור עם אחת הבארות המוצגות כיום ללא ראיות נוספות.","en":"The narrative's well cannot be equated with a displayed modern-site well without further evidence.","source":"https://www.sefaria.org/Genesis.21.14?lang=bi"}],"quote":{"he":"וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר וַיִּקַּח לֶחֶם וְחֵמַת מַיִם וַיִּתֵּן אֶל הָגָר שָׂם עַל שִׁכְמָהּ, וְאֶת הַיֶּלֶד. וַיְשַׁלְּחֶהָ. וַתֵּלֶךְ וַתֵּתַע, בְּמִדְבַּר בְּאֵר שָׁבַע.","en":"And Abraham rose up early in the morning, and took bread, and a bottle of water, and gave it unto Hagar, putting it on her shoulder, and the child, and sent her away: and she departed, and wandered in the wilderness of Beersheba."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_021/images/idea_03_v14-16.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 21 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מדבר באר שבע.","en":"Artistic illustration for Genesis 21 only. Its landscape and buildings are not identified views of Wilderness of Beersheba."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/21-6250ba4806f604314f198ddc5d531a9d.mp3?version_id=1","start":104.02,"end":118.88},"he":{"url":"https://mechon-mamre.org/mp3/t0121.mp3","start":121.14,"end":138.52}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-21-21-paran","book":"בראשית","chapter":21,"verse":21,"title":{"he":"מדבר פארן — אזור שקשה לתחום","en":"Wilderness of Paran: an uncertain extent"},"placeKey":"paran","facts":[{"type":"B","he":"בראשית מציב את מגורי ישמעאל במדבר פארן, אך אינו מציין עיר או תחנה.","en":"Genesis places Ishmael in Paran's wilderness without naming a town or station.","source":"https://www.sefaria.org/Genesis.21.21?lang=bi"},{"type":"U","he":"פארן מזוהה עם מרחב בחצי האי סיני וסביבתו; תחומו המקראי שנוי במחלוקת.","en":"Paran is associated with the Sinai region; its biblical extent is disputed.","source":"https://classic.net.bible.org/dictionary.php?word=Paran"},{"type":"F","he":"סיני מחבר יבשתית את מצרים עם הלבנט ומשתרע בין מפרצי סואץ ואילת.","en":"Sinai connects Egypt with the Levant between the gulfs of Suez and Aqaba.","source":"https://www.jewishvirtuallibrary.org/sinai"},{"type":"F","he":"בצפון סיני מישורים חוליים, ובדרום גושי הרים גבוהים.","en":"Northern Sinai has sandy plains; the south contains high mountain massifs.","source":"https://www.jewishvirtuallibrary.org/sinai"},{"type":"B","he":"במדבר י׳ מבחין בין מדבר סיני למדבר פארן, ולכן אין לראות בהם שם יחיד לאותו מקום.","en":"Numbers 10 distinguishes Sinai's wilderness from Paran's, so the names should not be collapsed.","source":"https://www.sefaria.org/Numbers.10.12?lang=bi"},{"type":"U","he":"נחל פארן המודרני אינו קובע לבדו את גבולות המדבר המקראי.","en":"The modern Nahal Paran name cannot establish the ancient wilderness's boundaries.","source":"https://classic.net.bible.org/dictionary.php?word=Paran"}],"quote":{"he":"וַיֵּשֶׁב, בְּמִדְבַּר פָּארָן. וַתִּקַּח לוֹ אִמּוֹ אִשָּׁה, מֵאֶרֶץ מִצְרָיִם.","en":"And he dwelt in the wilderness of Paran: and his mother took him a wife out of the land of Egypt."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_021/images/idea_05_v19-21.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 21 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מדבר פארן.","en":"Artistic illustration for Genesis 21 only. Its landscape and buildings are not identified views of Wilderness of Paran."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/21-6250ba4806f604314f198ddc5d531a9d.mp3?version_id=1","start":173.18,"end":180.02},"he":{"url":"https://mechon-mamre.org/mp3/t0121.mp3","start":213.7,"end":220.96}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-21-31-beersheba","book":"בראשית","chapter":21,"verse":31,"title":{"he":"באר שבע — באר ומערכת אגירה","en":"Beersheba: a well and a storage system"},"placeKey":"beersheba","facts":[{"type":"F","he":"תל באר שבע נמצא ממזרח לעיר באר שבע המודרנית, ולא במרכז העיר של היום.","en":"Tel Beersheba lies east of modern Beersheba, rather than in today's city centre.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"F","he":"בכניסה לתל נמצאת באר עמוקה; מערכת האגירה החצובה היא מתקן נפרד ממנה.","en":"A deep well stands near the mound's entrance; the rock-cut storage system is a separate installation.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"F","he":"מפעל המים כולל פיר ירידה וחללי אגירה מטויחים.","en":"The water system includes a descent shaft and plastered storage chambers.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"F","he":"מתווה העיר מתקופת הברזל כולל רחובות, שער ובתי מגורים.","en":"The Iron Age town plan includes streets, a gate and houses.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"F","he":"אבני מזבח בעל ארבע קרנות נמצאו בשימוש משני ושוחזרו למזבח.","en":"Four-horned altar stones were found in reuse and reassembled.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"B","he":"סיפור השבועה מסביר את שם באר שבע; העיר החפורה אינה אימות ישיר להסכם אברהם ואבימלך.","en":"The oath narrative explains Beersheba's name; the excavated town does not directly verify Abraham's agreement.","source":"https://www.sefaria.org/Genesis.21.31?lang=bi"}],"quote":{"he":"עַל כֵּן, קָרָא לַמָּקוֹם הַהוּא. בְּאֵר שָׁבַע: כִּי שָׁם נִשְׁבְּעוּ, שְׁנֵיהֶם.","en":"Wherefore he called that place Beersheba; because there they sware both of them."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_021/images/idea_09_v31-31.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 21 בלבד. הנוף והמבנים אינם תיעוד מזוהה של באר שבע.","en":"Artistic illustration for Genesis 21 only. Its landscape and buildings are not identified views of Beersheba."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/21-6250ba4806f604314f198ddc5d531a9d.mp3?version_id=1","start":253.38,"end":259.56},"he":{"url":"https://mechon-mamre.org/mp3/t0121.mp3","start":315.78,"end":322.75}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-22-2-moriah","book":"בראשית","chapter":22,"verse":2,"title":{"he":"ארץ המוריה — מסורת ומרחק","en":"Land of Moriah: tradition and distance"},"placeKey":"mo tradition — no agreed dating"},"image":{"src":"בראשית/chapter_022/images/idea_02_v2-2.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 22 בלבד. הנוף והמבנים אינם תיעוד מזוהה של ארץ המוריה.","en":"Artistic illustration for Genesis 22 only. Its landscape and buildings are not identified views of Land of Moriah."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/22-09fdd60f95822517e17757fc46960121.mp3?version_id=1","start":15.12,"end":32.56},"he":{"url":"https://mechon-mamre.org/mp3/t0122.mp3","start":13.72,"end":31.68}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-23-19-machpelah","book":"בראשית","chapter":23,"verse":19,"title":{"he":"מערת המכפלה — אתר קבורה ומתחם מאוחר","en":"Machpelah: burial tradition and a later enclosure"},"placeKey":"machpelah","facts":[{"type":"B","he":"הפסוק ממקם את מערת השדה מול ממרא בחברון.","en":"The verse locates the field's cave opposite Mamre at Hebron.","source":"https://www.sefaria.org/Genesis.23.19?lang=bi"},{"type":"B","he":"תיאור הקנייה כולל שדה, מערה ועצים בגבול השטח, לא רק פתח קבר.","en":"The purchase description includes a field, cave and boundary trees, not just a tomb entrance.","source":"https://www.sefaria.org/Genesis.23.17?lang=bi"},{"type":"F","he":"המתחם המונומנטלי הקיים בחברון הוא מן התקופה הרומית הקדומה.","en":"The surviving monumental enclosure in Hebron dates to the early Roman period.","source":"https://whc.unesco.org/en/list/1565/"},{"type":"F","he":"בניית המתחם מאוחרת במאות שנים לעולם המתואר בסיפורי האבות.","en":"The enclosure's construction is centuries later than the world depicted in the patriarchal narratives.","source":"https://whc.unesco.org/en/list/1565/"},{"type":"F","he":"מרכז העיר העתיקה התפתח בעמק ליד המתחם, בעוד התל הקדום נמצא בתל רומיידה.","en":"The Old Town developed in the valley beside the enclosure, while the earlier mound is at Tell Rumeida.","source":"https://whc.unesco.org/en/list/1565/"},{"type":"U","he":"המסורת מזהה כאן את קברי האבות והאמהות; אין זיהוי ארכאולוגי מוסכם של הנקברים.","en":"Tradition locates the patriarchs' and matriarchs' graves here; the occupants have no agreed archaeological identification.","source":"https://whc.unesco.org/en/list/1565/"}],"quote":{"he":"וְאַחֲרֵי כֵן קָבַר אַבְרָהָם אֶת שָׂרָה אִשְׁתּוֹ, אֶל מְעָרַת שְׂדֵה הַמַּכְפֵּלָה עַל פְּנֵי מַמְרֵא. הִוא חֶבְרוֹן: בְּאֶרֶץ, כְּנָעַן.","en":"And after this, Abraham buried Sarah his wife in the cave of the field of Machpelah before Mamre: the same is Hebron in the land of Canaan."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_023/images/idea_07_v17-20.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 23 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מערת המכפלה.","en":"Artistic illustration for Genesis 23 only. Its landscape and buildings are not identified views of Machpelah."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/23-83a3622029380bff0b249832264a1d24.mp3?version_id=1","start":168.86,"end":179.18},"he":{"url":"https://mechon-mamre.org/mp3/t0123.mp3","start":190.87,"end":201.31}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-25-3-dedan","book":"בראשית","chapter":25,"verse":3,"title":{"he":"דדן — נווה על דרך השיירות","en":"Dedan: a caravan-route oasis"},"placeKey":"dedan","facts":[{"type":"U","he":"דדן המקראית מקושרת בדרך כלל לדדאן שבנווה אל־עולא בצפון־מערב ערב; רשימת היוחסין אינה כתובת מקומית.","en":"Biblical Dedan is commonly linked with Dadan in the AlUla oasis of northwestern Arabia; the genealogy is not a local inscription.","source":"https://www.experiencealula.com/en/places-to-go/dadan"},{"type":"F","he":"דדאן נמצאת בעמק אל־עולא ולא באתר הנבטי חגרא שמצפון לה.","en":"Dadan lies in the AlUla valley, distinct from the Nabataean site of Hegra farther north.","source":"https://www.experiencealula.com/en/places-to-go/dadan"},{"type":"F","he":"קברי סלע חצובים במצוקי אבן החול שמעל היישוב הקדום.","en":"Rock-cut tombs occupy sandstone cliffs above the ancient settlement.","source":"https://www.experiencealula.com/en/places-to-go/dadan"},{"type":"F","he":"תבליטי אריות מסמנים כמה מן הקברים הידועים באתר.","en":"Lion reliefs mark some of the site's best-known tombs.","source":"https://www.experiencealula.com/en/places-to-go/dadan"},{"type":"F","he":"כתובות דדאניות ולחיאניות מעידות על תרבויות מקומיות שקדמו לשלטון הנבטי באזור.","en":"Dadanitic and Lihyanite inscriptions attest local cultures preceding Nabataean rule in the region.","source":"https://cefrepa.cnrs.fr/wp-content/uploads/2024/04/Rapport-dactivite-2022.pdf"},{"type":"F","he":"מיקום הנווה שילב מקורות מים וחקלאות עם דרכי השיירות של מערב ערב.","en":"The oasis combined water and farming with western Arabian caravan routes.","source":"https://cefrepa.cnrs.fr/wp-content/uploads/2024/04/Rapport-dactivite-2022.pdf"}],"quote":{"he":"וְיָקְשָׁן יָלַד, אֶת שְׁבָא וְאֶת דְּדָן. וּבְנֵי דְדָן, הָיוּ אַשּׁוּרִם וּלְטוּשִׁם וּלְאֻמִּים.","en":"And Jokshan begat Sheba, and Dedan. And the sons of Dedan were Asshurim, and Letushim, and Leummim."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_025/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 25 בלבד. הנוף והמבנים אינם תיעוד מזוהה של דדן.","en":"Artistic illustration for Genesis 25 only. Its landscape and buildings are not identified views of Dedan."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/25-6fa59671dbd118d2695b83e7f6c0e5dc.mp3?version_id=1","start":15.24,"end":25.62},"he":{"url":"https://mechon-mamre.org/mp3/t0125.mp3","start":15.94,"end":24.34}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-25-3-sheba","book":"בראשית","chapter":25,"verse":3,"title":{"he":"שבא — סכר וחקלאות בדרום ערב","en":"Sheba: dam and agriculture in South Arabia"},"placeKey":"sheba","facts":[{"type":"U","he":"השם שבא מקושר לממלכת סבא בדרום ערב; רשימות היוחסין אינן מפה מדויקת של גבולותיה.","en":"Sheba is associated with South Arabia's kingdom of Saba; genealogies do not map its precise borders.","source":"https://whc.unesco.org/en/list/1700/"},{"type":"F","he":"מאריב, בתימן של ימינו, הייתה מרכז של ממלכת סבא.","en":"Marib, in present-day Yemen, was a centre of the Sabaean kingdom.","source":"https://whc.unesco.org/en/list/1700/"},{"type":"F","he":"סכר מאריב הוביל מים למערכת תעלות השקיה מצפון לעיר ומדרומה.","en":"Marib's dam fed irrigation canals north and south of the city.","source":"https://whc.unesco.org/en/list/1700/"},{"type":"F","he":"ההשקיה אפשרה פיתוח נווה חקלאי רחב בתוך סביבה צחיחה.","en":"Irrigation sustained an extensive agricultural oasis in an arid environment.","source":"https://whc.unesco.org/en/list/1700/"},{"type":"F","he":"העיר המבוצרת סירוואח נמצאת ממערב למאריב, כחלק מאותה מערכת שלטונית.","en":"The fortified town of Sirwah west of Marib formed part of the same political system.","source":"https://whc.unesco.org/en/list/1700/"},{"type":"F","he":"השליטה בסחר הבשמים חיברה את סבא לנתיבים שהובילו צפונה לים התיכון.","en":"Control of incense trade linked Saba with routes leading north toward the Mediterranean.","source":"https://whc.unesco.org/en/list/1700/"}],"quote":{"he":"וְיָקְשָׁן יָלַד, אֶת שְׁבָא וְאֶת דְּדָן. וּבְנֵי דְדָן, הָיוּ אַשּׁוּרִם וּלְטוּשִׁם וּלְאֻמִּים.","en":"And Jokshan begat Sheba, and Dedan. And the sons of Dedan were Asshurim, and Letushim, and Leummim."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_025/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 25 בלבד. הנוף והמבנים אינם תיעוד מזוהה של שבא.","en":"Artistic illustration for Genesis 25 only. Its landscape and buildings are not identified views of Sheba."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/25-6fa59671dbd118d2695b83e7f6c0e5dc.mp3?version_id=1","start":15.24,"end":25.62},"he":{"url":"https://mechon-mamre.org/mp3/t0125.mp3","start":15.94,"end":24.34}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-26-17-gerarWells","book":"בראשית","chapter":26,"verse":17,"title":{"he":"נחל גרר — בארות במצע הנחל","en":"Gerar valley: wells in a streambed"},"placeKey":"gerarWells","facts":[{"type":"B","he":"יצחק חונה בנחל גרר לאחר שעזב את היישוב גרר.","en":"Isaac camps in Gerar's valley after leaving the settlement.","source":"https://www.sefaria.org/Genesis.26.17?lang=bi"},{"type":"U","he":"הקישור בין נחל גרר המודרני לנחל שבבראשית הוא משוער, גם אם שניהם במערב הנגב.","en":"Equating modern Nahal Gerar with Genesis’s valley is tentative, even though both belong to the western Negev.","source":"https://www.kkl.org.il/travel/trips/1838/"},{"type":"F","he":"נחל גרר נמצא בנגב המערבי וניקוזו פונה למערכת נחל הבשור.","en":"Nahal Gerar lies in the western Negev and drains toward the Besor system.","source":"https://www.kkl.org.il/travel/kkl_shar_grar/"},{"type":"F","he":"במקטעים של אפיק גרר נחשפים מים הקשורים לאקוויפר המקומי.","en":"In stretches of the Gerar channel, groundwater from the local aquifer reaches the surface.","source":"https://www.kkl.org.il/travel/kkl_shar_grar/"},{"type":"F","he":"עצי אשל וקנים גדלים במקטעים הלחים, השונים מן הגבעות היבשות מסביב.","en":"Tamarisks and reeds occupy moist stretches, contrasting with the surrounding dry hills.","source":"https://www.kkl.org.il/travel/kkl_shar_grar/"},{"type":"U","he":"מקומן של בארות עשק, שטנה ורחובות אינו ידוע בוודאות; שמות מודרניים אינם אימות.","en":"The wells Esek, Sitnah and Rehoboth are not securely located; modern names are not verification.","source":"https://www.sefaria.org/Genesis.26.20?lang=bi"}],"quote":{"he":"וַיֵּלֶךְ מִשָּׁם, יִצְחָק. וַיִּחַן בְּנַחַל גְּרָר, וַיֵּשֶׁב שָׁם.","en":"And Isaac departed thence, and pitched his tent in the valley of Gerar, and dwelt there."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_026/images/idea_04_v17-22.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 26 בלבד. הנוף והמבנים אינם תיעוד מזוהה של נחל גרר.","en":"Artistic illustration for Genesis 26 only. Its landscape and buildings are not identified views of Gerar valley."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/26-f6da20606755e93e74221d0564ff56e5.mp3?version_id=1","start":147.2,"end":153.54},"he":{"url":"https://mechon-mamre.org/mp3/t0126.mp3","start":181.31,"end":187.15}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-28-19-bethel2","book":"בראשית","chapter":28,"verse":19,"title":{"he":"בית אל — מצבה ושם מקום","en":"Bethel: a standing stone and a place-name"},"placeKey":"bethel2","facts":[{"type":"B","he":"הסיפור מוסר שהשם הקודם היה לוז, ומפרש את בית אל באמצעות החוויה הדתית.","en":"The narrative gives Luz as the earlier name and explains Bethel through the religious experience.","source":"https://www.sefaria.org/Genesis.28.19?lang=bi"},{"type":"B","he":"יעקב מציב אבן ויוצק שמן; הכתוב מתאר מצבה פתוחה ולא מבנה מקדש מפורט.","en":"Jacob erects a stone and pours oil; the text describes a standing stone, not a detailed temple building.","source":"https://www.sefaria.org/Genesis.28.18?lang=bi"},{"type":"U","he":"הזיהוי בביתין מבוסס על שילוב שם, מיקום ומסורות מאוחרות, לא על כתובת של יעקב.","en":"The Beitin identification combines name, location and later traditions, not an inscription by Jacob.","source":"https://biblical-archaeology.org/en/locations/בית-אל/"},{"type":"F","he":"ביתין יושבת בנוף גיר הררי; טרשים ואבנים זמינים בפני השטח.","en":"Beitin occupies limestone hill country, where rock outcrops and surface stones are common.","source":"https://journals.sagepub.com/doi/10.1177/03090892241235196"},{"type":"F","he":"בניית הכפר על התל מקשה להפריד בין שרידי תקופות שונות.","en":"Building over the mound complicates separation of remains from different periods.","source":"https://biblical-archaeology.org/en/locations/בית-אל/"},{"type":"U","he":"לא נמצאה אבן שניתן לזהות בביטחון עם מצבת יעקב.","en":"No stone can be securely identified as Jacob's standing stone.","source":"https://journals.sagepub.com/doi/10.1177/03090892241235196"}],"quote":{"he":"וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא, בֵּית אֵל. וְאוּלָם לוּז שֵׁם הָעִיר, לָרִאשֹׁנָה.","en":"And he called the name of that place Bethel: but the name of that city was called Luz at the first."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_028/images/idea_06_v18-19.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 28 בלבד. הנוף והמבנים אינם תיעוד מזוהה של בית אל.","en":"Artistic illustration for Genesis 28 only. Its landscape and buildings are not identified views of Bethel."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/28-d04f9e45cb702f05f832c54b08436e4a.mp3?version_id=1","start":204.78,"end":212.16},"he":{"url":"https://mechon-mamre.org/mp3/t0128.mp3","start":218.31,"end":225.71}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-31-21-gilead","book":"בראשית","chapter":31,"verse":21,"title":{"he":"הגלעד — הרים ממזרח לירדן","en":"Gilead: highlands east of the Jordan"},"placeKey":"gilead","facts":[{"type":"F","he":"הגלעד הוא אזור הררי ממזרח לבקעת הירדן.","en":"Gilead is a hill region east of the Jordan Valley.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Gilead"},{"type":"F","he":"נהר היבוק חוצה את אזור הגלעד ומבתר אותו בקניון עמוק.","en":"The Jabbok crosses Gilead and cuts it with a deep gorge.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Gilead"},{"type":"F","he":"מורדות הגלעד עולים בתלילות מן הבקעה אל רמות גבוהות יותר.","en":"Gilead's slopes rise steeply from the valley toward higher uplands.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Gilead"},{"type":"F","he":"חלקים מן הגלעד גשומים יחסית ומשלבים חורש, חקלאות ומרעה.","en":"Parts of Gilead are comparatively well watered, combining woodland, farming and grazing.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Gilead"},{"type":"B","he":"״הנהר״ במסע יעקב מזוהה בדרך כלל עם הפרת; הפסוק אינו מציין את מעבר החצייה.","en":"“The river” in Jacob's journey is usually understood as the Euphrates; the crossing point is not named.","source":"https://www.sefaria.org/Genesis.31.21?lang=bi"},{"type":"U","he":"אין מיקום מוסכם לגל האבנים של יעקב ולבן; אין לסמן אתר גלעד יחיד לכל הסיפור.","en":"Jacob and Laban's stone heap has no agreed location; the whole account should not be reduced to one point.","source":"https://www.sefaria.org/Genesis.31.47?lang=bi"}],"quote":{"he":"וַיִּבְרַח הוּא וְכָל אֲשֶׁר לוֹ, וַיָּקָם וַיַּעֲבֹר אֶת הַנָּהָר. וַיָּשֶׂם אֶת פָּנָיו, הַר הַגִּלְעָד.","en":"So he fled with all that he had; and he rose up, and passed over the river, and set his face toward the mount Gilead."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_031/images/idea_05_v19-21.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 31 בלבד. הנוף והמבנים אינם תיעוד מזוהה של הגלעד.","en":"Artistic illustration for Genesis 31 only. Its landscape and buildings are not identified views of Gilead."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/31-bcc1861aaf8182aa5e08cefe9c627a32.mp3?version_id=1","start":153.78,"end":160.9},"he":{"url":"https://mechon-mamre.org/mp3/t0131.mp3","start":210.83,"end":220.39}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-32-3-mahanaim","book":"בראשית","chapter":32,"verse":3,"title":{"he":"מחניים — שתי גבעות וזיהוי משוער","en":"Mahanaim: twin hills and a tentative identification"},"placeKey":"mahanaim","facts":[{"type":"U","he":"מחניים הוצעה לזיהוי עם התל המערבי בתלול א־דהב שבעמק הזרקא; אין הסכמה מלאה.","en":"Mahanaim has been proposed for the western Tulul adh-Dhahab mound in the Zarqa Valley; consensus is lacking.","source":"https://www.tandfonline.com/doi/full/10.1080/03344355.2024.2385148"},{"type":"F","he":"תלול א־דהב מורכב משתי גבעות בצדי נוף הנהר של הגלעד.","en":"Tulul adh-Dhahab comprises two hills in Gilead's river landscape.","source":"https://publication.doa.gov.jo/uploads/publications/26/ADAJ_2013_57.pdf"},{"type":"F","he":"העמק נמצא ממזרח לבקעת הירדן, סמוך לציר המוביל אל פנים הגלעד.","en":"The valley lies east of the Jordan Valley on an approach into inland Gilead.","source":"https://publication.doa.gov.jo/uploads/publications/26/ADAJ_2013_57.pdf"},{"type":"F","he":"באתר התגלו אבני בנייה מעוטרות בתבליטים מן האלף הראשון לפנה״ס.","en":"The site yielded decorated building stones with first-millennium BCE reliefs.","source":"https://www.tandfonline.com/doi/full/10.1080/03344355.2024.2385148"},{"type":"U","he":"פירוש האבנים כשרידי מבנה מנהל ישראלי הוא הצעה מחקרית, לא כתובת המוכיחה את שם העיר.","en":"Interpreting the stones as an Israelite administrative residence is a hypothesis, not an inscription establishing the town's name.","source":"https://www.tandfonline.com/doi/full/10.1080/03344355.2024.2385148"},{"type":"B","he":"בראשית מסביר את השם באמצעות מפגש יעקב עם מלאכים; שתי גבעות אינן אימות להסבר השם.","en":"Genesis explains the name through Jacob's angelic encounter; twin hills do not verify that explanation.","source":"https://www.sefaria.org/Genesis.32.3?lang=bi"}],"quote":{"he":"וַיֹּאמֶר יַעֲקֹב כַּאֲשֶׁר רָאָם.\"מַחֲנֵה אֱלֹהִים זֶה\". וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא, מַחֲנָיִם.","en":"And when Jacob saw them, he said, This is God's host: and he called the name of that place Mahanaim."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_032/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 32 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מחניים.","en":"Artistic illustration for Genesis 32 only. Its landscape and buildings are not identified views of Mahanaim."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/32-6aea27853bd1cfcb1095ffd839f91dfc.mp3?version_id=1","start":15.96,"end":22.38},"he":{"url":"https://mechon-mamre.org/mp3/t0132.mp3","start":18.22,"end":27.74}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-32-23-jabbok","book":"בראשית","chapter":32,"verse":23,"title":{"he":"מעבר יבוק — חציית הקניון","en":"Jabbok ford: crossing the gorge"},"placeKey":"jabbok","facts":[{"type":"F","he":"היבוק מזוהה עם נהר זרקא בירדן.","en":"The Jabbok is identified with Jordan's Zarqa River.","source":"https://classic.net.bible.org/dictionary.php?word=Jabbok"},{"type":"F","he":"הזרקא הוא יובל מזרחי של הירדן, ולא חלק מן האפיק הראשי שלו.","en":"The Zarqa is an eastern tributary of the Jordan, not a section of its main channel.","source":"https://tile.loc.gov/storage-services/master/frd/frdcstdy/jo/jordancountrystu00metz/jordancountrystu00metz.pdf"},{"type":"F","he":"בדרכו מערבה הנהר חוצה את הגלעד בערוץ עמוק.","en":"On its westward course the river cuts through Gilead in a deep channel.","source":"https://classic.net.bible.org/dictionary.php?word=Jabbok"},{"type":"F","he":"הנהר מגיע אל הירדן מדרום לשפך הירמוך ומצפון לים המלח.","en":"The river reaches the Jordan south of the Yarmuk confluence and north of the Dead Sea.","source":"https://tile.loc.gov/storage-services/master/frd/frdcstdy/jo/jordancountrystu00metz/jordancountrystu00metz.pdf"},{"type":"B","he":"בפסוק יעקב מעביר בלילה את משפחתו; הסיפור מתרחש במעבר ולא בעיר.","en":"Jacob takes his family across at night; the setting is a crossing rather than a town.","source":"https://www.sefaria.org/Genesis.32.23?lang=bi"},{"type":"U","he":"מקום המעבר המדויק אינו ידוע; זיהוי הנהר אינו מזהה אוטומטית את נקודת החצייה.","en":"The exact ford is unknown; identifying the river does not identify the crossing.","source":"https://classic.net.bible.org/dictionary.php?word=Jabbok"}],"quote":{"he":"וַיָּקָם בַּלַּיְלָה הוּא, וַיִּקַּח אֶת שְׁתֵּי נָשָׁיו וְאֶת שְׁתֵּי שִׁפְחֹתָיו, וְאֶת אַחַד עָשָׂר, יְלָדָיו. וַיַּעֲבֹר, אֵת מַעֲבַר יַבֹּק.","en":"And he rose up that night, and took his two wives, and his two womenservants, and his eleven sons, and passed over the ford Jabbok."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_032/images/idea_05_v23-24.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 32 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מעבר יבוק.","en":"Artistic illustration for Genesis 32 only. Its landscape and buildings are not identified views of Jabbok ford."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/32-6aea27853bd1cfcb1095ffd839f91dfc.mp3?version_id=1","start":203.06,"end":208.54},"he":{"url":"https://mechon-mamre.org/mp3/t0132.mp3","start":235.24,"end":246.56}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-32-32-penuel","book":"בראשית","chapter":32,"verse":32,"title":{"he":"פנואל — מקום בגלעד התחתון","en":"Penuel: a site in lower Gilead"},"placeKey":"penuel","facts":[{"type":"B","he":"פנואל מופיעה מיד לאחר מעבר היבוק והמאבק הלילי.","en":"Penuel appears immediately after the Jabbok crossing and the night struggle.","source":"https://www.sefaria.org/Genesis.32.32?lang=bi"},{"type":"U","he":"תלול א־דהב בעמק הזרקא הוצעו לפנואל; ההצעה אינה זיהוי ודאי.","en":"Tulul adh-Dhahab in the Zarqa Valley has been proposed for Penuel; this is tentative.","source":"https://publication.doa.gov.jo/uploads/publications/26/ADAJ_2013_57.pdf"},{"type":"F","he":"שני התלים של תלול א־דהב נמצאים בעמק הזרקא, ממזרח לבקעת הירדן.","en":"The two Tulul adh-Dhahab mounds lie in the Zarqa Valley east of the Jordan Valley.","source":"https://publication.doa.gov.jo/uploads/publications/26/ADAJ_2013_57.pdf"},{"type":"F","he":"בעמק נוצרו מעברים מוגבלים בין אפיק הנהר למדרונות שסביבו.","en":"The valley forms restricted passages between the river channel and surrounding slopes.","source":"https://publication.doa.gov.jo/uploads/publications/26/ADAJ_2013_57.pdf"},{"type":"F","he":"בחפירות תלול א־דהב נמצאו שרידי בנייה וממצא מן האלף הראשון לפנה״ס.","en":"Tulul adh-Dhahab excavations yielded architecture and finds of the first millennium BCE.","source":"https://publication.doa.gov.jo/uploads/publications/26/ADAJ_2013_57.pdf"},{"type":"U","he":"הממצאים באתר אינם מוכיחים את המאבק המתואר בבראשית או את האבן שעליה התרחש.","en":"The finds do not establish the Genesis struggle or identify a particular spot where it occurred.","source":"https://www.sefaria.org/Genesis.32.32?lang=bi"}],"quote":{"he":"וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ, כַּאֲשֶׁר עָבַר אֶת פְּנוּאֵל. וְהוּא צֹלֵעַ, עַל יְרֵכוֹ.","en":"And as he passed over Penuel the sun rose upon him, and he halted upon his thigh."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_032/images/idea_08_v32-32.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 32 בלבד. הנוף והמבנים אינם תיעוד מזוהה של פנואל.","en":"Artistic illustration for Genesis 32 only. Its landscape and buildings are not identified views of Penuel."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/32-6aea27853bd1cfcb1095ffd839f91dfc.mp3?version_id=1","start":276.38,"end":293.88},"he":{"url":"https://mechon-mamre.org/mp3/t0132.mp3","start":318.48,"end":324.06}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-33-17-succoth","book":"בראשית","chapter":33,"verse":17,"title":{"he":"סוכות — העמק שממזרח לירדן","en":"Succoth: the valley east of the Jordan"},"placeKey":"succoth","facts":[{"type":"B","he":"בסיפור יעקב בונה בית וסוכות למקנה, בניגוד למחנה־הדרך הקודם.","en":"Jacob builds a house and livestock shelters, contrasting with the preceding travel camp.","source":"https://www.sefaria.org/Genesis.33.17?lang=bi"},{"type":"U","he":"סוכות מזוהה לעיתים עם תל דיר עלא בעמק הירדן המזרחי; הזיהוי אינו ודאי.","en":"Succoth is sometimes identified with Tell Deir Alla in the eastern Jordan Valley; this is uncertain.","source":"https://classic.net.bible.org/dictionary.php?word=Succoth"},{"type":"F","he":"תל דיר עלא נמצא בקרבת מוצא עמק היבוק אל בקעת הירדן.","en":"Tell Deir Alla lies near where the Jabbok valley opens into the Jordan Valley.","source":"https://www.livius.org/sources/content/deir-alla-inscription/"},{"type":"F","he":"באתר דיר עלא נמצאה כתובת דיו על טיח המזכירה את בלעם בן בעור.","en":"Deir Alla yielded an ink-on-plaster inscription mentioning Balaam son of Beor.","source":"https://www.livius.org/sources/content/deir-alla-inscription/"},{"type":"F","he":"הכתובת היא מן האלף הראשון לפנה״ס ואינה תיעוד של יעקב.","en":"The inscription dates to the first millennium BCE and does not document Jacob.","source":"https://www.livius.org/sources/content/deir-alla-inscription/"},{"type":"U","he":"אין לזהות את סוכות זו עם סוכות שבמסע יציאת מצרים רק בשל השם הזהה.","en":"This Succoth must not be equated with the Exodus station merely because the names match.","source":"https://classic.net.bible.org/dictionary.php?word=Succoth"}],"quote":{"he":"וְיַעֲקֹב נָסַע סֻכֹּתָה, וַיִּבֶן לוֹ בָּיִת. וּלְמִקְנֵהוּ עָשָׂה סֻכֹּת, עַל כֵּן קָרָא שֵׁם הַמָּקוֹם סֻכּוֹת.","en":"And Jacob journeyed to Succoth, and built him an house, and made booths for his cattle: therefore the name of the place is called Succoth."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_033/images/idea_05_v17-17.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 33 בלבד. הנוף והמבנים אינם תיעוד מזוהה של סוכות.","en":"Artistic illustration for Genesis 33 only. Its landscape and buildings are not identified views of Succoth."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/33-5c2e3e7466b6a9001ed0fc76ae4d99da.mp3?version_id=1","start":143.14,"end":152.42},"he":{"url":"https://mechon-mamre.org/mp3/t0133.mp3","start":158.87,"end":168.34}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-35-19-bethlehem","book":"בראשית","chapter":35,"verse":19,"title":{"he":"אפרת ובית לחם — הדרך על ההר","en":"Ephrath and Bethlehem: the highland road"},"placeKey":"bethlehem","facts":[{"type":"F","he":"בית לחם נמצאת בהרי יהודה מדרום לירושלים.","en":"Bethlehem lies in the Judean hills south of Jerusalem.","source":"https://whc.unesco.org/en/list/1433/"},{"type":"F","he":"סביבתה משלבת רכסים, מדרונות ועמקים חקלאיים.","en":"Its surroundings combine ridges, slopes and cultivated valleys.","source":"https://whc.unesco.org/en/list/1433/"},{"type":"F","he":"מדרגות חקלאיות במרחב בית לחם מאפשרות עיבוד במדרונות.","en":"Agricultural terraces around Bethlehem allow cultivation on slopes.","source":"https://whc.unesco.org/en/list/1492/"},{"type":"F","he":"בבתיר, ממערב לבית לחם, השתמרו מדרגות אבן ותעלות השקיה הניזונות ממעיינות.","en":"At Battir west of Bethlehem, stone terraces and spring-fed irrigation channels survive.","source":"https://whc.unesco.org/en/list/1492/"},{"type":"B","he":"הפסוק מזהה את אפרת עם בית לחם וממקם את קבורת רחל בדרך אליה.","en":"The verse equates Ephrath with Bethlehem and places Rachel's burial on the approach road.","source":"https://www.sefaria.org/Genesis.35.19?lang=bi"},{"type":"U","he":"הקבר המסורתי בצפון בית לחם הוא אתר מסורת; אין זיהוי ארכאולוגי מוסכם של קבורת רחל.","en":"The traditional tomb north of Bethlehem is a site of veneration; Rachel's burial has no agreed archaeological identification.","source":"https://classic.net.bible.org/dictionary.php?word=Rachel"}],"quote":{"he":"וַתָּמָת, רָחֵל. וַתִּקָּבֵר בְּדֶרֶךְ אֶפְרָתָה, הִוא בֵּית לָחֶם.","en":"And Rachel died, and was buried in the way to Ephrath, which is Bethlehem."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_035/images/idea_04_v16-20.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 35 בלבד. הנוף והמבנים אינם תיעוד מזוהה של אפרת ובית לחם.","en":"Artistic illustration for Genesis 35 only. Its landscape and buildings are not identified views of Ephrath and Bethlehem."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/35-7c8e4134caac9b1a3579e25b7db119d7.mp3?version_id=1","start":178.46,"end":184.1},"he":{"url":"https://mechon-mamre.org/mp3/t0135.mp3","start":199.11,"end":204.4}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-36-8-edom","book":"בראשית","chapter":36,"verse":8,"title":{"he":"שעיר ואדום — רמה מעבר לערבה","en":"Seir and Edom: highlands beyond the Arabah"},"placeKey":"edom","facts":[{"type":"F","he":"לב אדום נמצא ברמות שממזרח לערבה, בדרום ירדן.","en":"Edom's heartland lies in the highlands east of the Arabah in southern Jordan.","source":"https://www.biblegateway.com/resources/eastons-bible-dictionary/Edom"},{"type":"F","he":"המדרונות המערביים יורדים בתלילות אל הערבה.","en":"The western slopes descend steeply into the Arabah.","source":"https://www.biblegateway.com/resources/eastons-bible-dictionary/Edom"},{"type":"F","he":"נחלים עמוקים מבתרים את הרמה ומגבילים את דרכי החצייה.","en":"Deep wadis dissect the plateau and constrain crossing routes.","source":"https://www.biblegateway.com/resources/eastons-bible-dictionary/Edom"},{"type":"F","he":"באזור פינאן שבערבה הירדנית התגלו מכרות, סיגים ואתרי הפקת נחושת קדומים.","en":"The Faynan region of Jordan’s Arabah contains mines, slag and ancient copper-production sites.","source":"https://www.pnas.org/doi/10.1073/pnas.0804950105"},{"type":"B","he":"הפרק מקשר את עשו להר שעיר ולאדום באמצעות מסורת יוחסין.","en":"The chapter connects Esau with Mount Seir and Edom through genealogical tradition.","source":"https://www.sefaria.org/Genesis.36.8?lang=bi"},{"type":"U","he":"מפת ממלכת אדום מתקופת הברזל אינה מפת נדודי עשו; אין להחיל את גבולותיה אוטומטית על הסיפור.","en":"An Iron Age Edomite kingdom map is not Esau's itinerary; its borders cannot automatically be applied to the story.","source":"https://www.biblegateway.com/resources/eastons-bible-dictionary/Edom"}],"quote":{"he":"וַיֵּשֶׁב עֵשָׂו בְּהַר שֵׂעִיר, עֵשָׂו הוּא אֱדוֹם.","en":"Thus dwelt Esau in mount Seir: Esau is Edom."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_036/images/idea_02_v6-8.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 36 בלבד. הנוף והמבנים אינם תיעוד מזוהה של שעיר ואדום.","en":"Artistic illustration for Genesis 36 only. Its landscape and buildings are not identified views of Seir and Edom."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/36-8d8c259077b7f12ef7443e62cced573f.mp3?version_id=1","start":57.22,"end":62},"he":{"url":"https://mechon-mamre.org/mp3/t0136.mp3","start":69.66,"end":74.88}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-37-17-dothan","book":"בראשית","chapter":37,"verse":17,"title":{"he":"דותן — תל, מעיין ושיירה","en":"Dothan: mound, spring and caravan"},"placeKey":"dothan","facts":[{"type":"F","he":"תל דותן נמצא בעמק דותן, מדרום־מערב לג׳נין.","en":"Tell Dothan lies in the Dothan Valley southwest of Jenin.","source":"https://biblical-archaeology.org/en/locations/דותן/"},{"type":"F","he":"מעיין נמצא במדרונו הדרום־מערבי של התל.","en":"A spring lies on the mound's southwestern slope.","source":"https://biblical-archaeology.org/en/locations/דותן/"},{"type":"F","he":"בחפירות נמצאו שכבות יישוב מתקופות הברונזה והברזל.","en":"Excavations revealed Bronze and Iron Age occupation layers.","source":"https://biblical-archaeology.org/en/locations/דותן/"},{"type":"F","he":"ממצאי מגורים וביצורים מעידים על יישוב עירוני, לא רק על מקום מרעה.","en":"Domestic remains and fortifications indicate an urban settlement, not merely grazing land.","source":"https://biblical-archaeology.org/en/locations/דותן/"},{"type":"B","he":"השיירה בסיפור מגיעה מגלעד בדרכה למצרים; כך מתחבר העמק לרשת תנועה רחבה.","en":"The narrative's caravan comes from Gilead toward Egypt, linking the valley to a wider movement network.","source":"https://www.sefaria.org/Genesis.37.25?lang=bi"},{"type":"U","he":"הבור המכונה ״בור יוסף״ הוא זיהוי מסורתי, ללא הוכחה שזה הבור שבסיפור.","en":"The so-called Joseph's pit is a traditional identification without proof that it is the narrative's pit.","source":"https://biblical-archaeology.org/en/locations/דותן/"}],"quote":{"he":"וַיֹּאמֶר הָאִישׁ.\"נָסְעוּ מִזֶּה. כִּי שָׁמַעְתִּי אֹמְרִים נֵלְכָה דֹּתָיְנָה\". וַיֵּלֶךְ יוֹסֵף אַחַר אֶחָיו, וַיִּמְצָאֵם בְּדֹתָן.","en":"And the man said, They are departed hence; for I heard them say, Let us go to Dothan. And Joseph went after his brethren, and found them in Dothan."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_037/images/idea_05_v12-17.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 37 בלבד. הנוף והמבנים אינם תיעוד מזוהה של דותן.","en":"Artistic illustration for Genesis 37 only. Its landscape and buildings are not identified views of Dothan."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/37-3dea4fc31c3b941be6b9c6765eb6682a.mp3?version_id=1","start":148.02,"end":157.16},"he":{"url":"https://mechon-mamre.org/mp3/t0137.mp3","start":170.93,"end":182.14}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-38-1-adullam","book":"בראשית","chapter":38,"verse":1,"title":{"he":"עדולם — הירידה מן ההר לשפלה","en":"Adullam: descent from hills to foothills"},"placeKey":"adullam","facts":[{"type":"F","he":"עדולם נמצאת במרחב שפלת יהודה, ממערב להרי חברון.","en":"Adullam lies in the Judean Shephelah west of the Hebron hills.","source":"https://www.daat.ac.il/encyclopedia/value.asp?id1=3690"},{"type":"U","he":"הזיהוי המקובל הוא באזור חורבת עיד אל־מיה ותל שייח׳ מדכור.","en":"The customary identification is near Khirbet Id el-Miyeh and Tell esh-Sheikh Madhkur.","source":"https://www.daat.ac.il/encyclopedia/value.asp?id1=3690"},{"type":"F","he":"השפלה מורכבת מגבעות נמוכות מן ההר ומעמקים המחברים ביניהן.","en":"The Shephelah consists of hills lower than the highlands and connecting valleys.","source":"https://www.kkl.org.il/bike/trips/2701/"},{"type":"F","he":"בסביבת עדולם בורות, מערות ומתקנים חקלאיים חצובים.","en":"The Adullam area contains cisterns, caves and rock-cut agricultural installations.","source":"https://www.kkl.org.il/bike/trips/2701/"},{"type":"F","he":"בתי בד וגיתות באזור מעידים על עיבוד זיתים וענבים בתקופות שונות.","en":"Oil presses and winepresses document olive and grape processing in different periods.","source":"https://www.kkl.org.il/bike/trips/2701/"},{"type":"B","he":"״וירד יהודה״ מתאים למעבר מן ההר אל השפלה, אך אינו מוסר מסלול מפורט.","en":"“Judah went down” fits movement from highlands to foothills without specifying an exact route.","source":"https://www.sefaria.org/Genesis.38.1?lang=bi"}],"quote":{"he":"וַיְהִי בָּעֵת הַהִוא, וַיֵּרֶד יְהוּדָה מֵאֵת אֶחָיו. וַיֵּט עַד אִישׁ עֲדֻלָּמִי, וּשְׁמוֹ חִירָה.","en":"And it came to pass at that time, that Judah went down from his brethren, and turned in to a certain Adullamite, whose name was Hirah."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_038/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 38 בלבד. הנוף והמבנים אינם תיעוד מזוהה של עדולם.","en":"Artistic illustration for Genesis 38 only. Its landscape and buildings are not identified views of Adullam."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/38-e649e5e57ea44ee69943bcf1473b7992.mp3?version_id=1","start":2.88,"end":13.64},"he":{"url":"https://mechon-mamre.org/mp3/t0138.mp3","start":2.07,"end":10.12}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-41-45-on","book":"בראשית","chapter":41,"verse":45,"title":{"he":"און — הליופוליס וגבול הדלתה","en":"On: Heliopolis at the delta margin"},"placeKey":"on","facts":[{"type":"F","he":"און מזוהה עם הליופוליס הקדומה, באזור מטריה בצפון־מזרח קהיר.","en":"On is identified with ancient Heliopolis in the Matariya area of northeastern Cairo.","source":"https://www.museoegizio.it/en/discover/funded-projects/the-excavations-of-the-italian-archaeological-mission-at-heliopolis-1903-1906"},{"type":"F","he":"שם העיר המצרי הקדום היה אִיוּנוּ.","en":"The ancient Egyptian city's name was Iunu.","source":"https://www.museoegizio.it/en/discover/funded-projects/the-excavations-of-the-italian-archaeological-mission-at-heliopolis-1903-1906"},{"type":"F","he":"הליופוליס הייתה מרכז דתי חשוב; חפירות המשלחת האיטלקית נערכו בה בשנים 1903–1906.","en":"Heliopolis was a major religious centre; the Italian mission excavated there in 1903–1906.","source":"https://www.museoegizio.it/en/discover/funded-projects/the-excavations-of-the-italian-archaeological-mission-at-heliopolis-1903-1906"},{"type":"F","he":"המחקר משווה מפות ותיעוד חפירות ישן עם שכונות קהיר המכסות כיום את האתר.","en":"Research compares historical excavation records and maps with Cairo neighbourhoods now covering the site.","source":"https://www.museoegizio.it/en/discover/funded-projects/the-excavations-of-the-italian-archaeological-mission-at-heliopolis-1903-1906"},{"type":"F","he":"הליופוליס המודרנית שהוקמה במאה העשרים אינה זהה לגרעין העיר הפרעונית.","en":"The modern Heliopolis district founded in the twentieth century is distinct from the pharaonic city's core.","source":"https://egymonuments.gov.eg/en/archaeological-sites/heliopolis"},{"type":"B","he":"הפסוק מכנה את פוטי פרע ״כהן און״; הוא אינו נותן כתובת לביתו או לבית אסנת.","en":"The verse calls Potiphera a priest of On without locating his or Asenath's house.","source":"https://www.sefaria.org/Genesis.41.45?lang=bi"}],"quote":{"he":"וַיִּקְרָא פַרְעֹה שֵׁם יוֹסֵף, צָפְנַת פַּעְנֵחַ, וַיִּתֶּן לוֹ אֶת אָסְנַת בַּת פּוֹטִי פֶרַע כֹּהֵן אֹן, לְאִשָּׁה. וַיֵּצֵא יוֹסֵף, עַל אֶרֶץ מִצְרָיִם.","en":"And Pharaoh called Joseph's name Zaphnathpaaneah; and he gave him to wife Asenath the daughter of Potipherah priest of On. And Joseph went out over all the land of Egypt."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_041/images/idea_12_v40-45.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 41 בלבד. הנוף והמבנים אינם תיעוד מזוהה של און.","en":"Artistic illustration for Genesis 41 only. Its landscape and buildings are not identified views of On."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/41-c001378da34a2170d5ecd97660c104ac.mp3?version_id=1","start":384.5,"end":399.22},"he":{"url":"https://mechon-mamre.org/mp3/t0141.mp3","start":479.51,"end":493.63}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-45-10-goshen","book":"בראשית","chapter":45,"verse":10,"title":{"he":"גושן — מחוז במזרח הדלתה","en":"Goshen: a district in the eastern delta"},"placeKey":"goshen","facts":[{"type":"U","he":"גושן ממוקמת בדרך כלל במזרח דלתת הנילוס, אך גבולותיה אינם ידועים.","en":"Goshen is generally placed in the eastern Nile Delta, but its boundaries are unknown.","source":"https://classic.net.bible.org/dictionary.php?word=Goshen"},{"type":"F","he":"הדלתה היא מניפת סחף שבה הנילוס התפצל בעבר לזרועות רבות.","en":"The delta is an alluvial fan where the Nile formerly divided into numerous branches.","source":"https://documents1.worldbank.org/curated/en/402661468248083855/pdf/455240PUB0indi101Official0Use0Only1.pdf"},{"type":"F","he":"תל א־דבע שבמזרח הדלתה מזוהה עם אווריס, עיר שהייתה בירת החיקסוס.","en":"Tell el-Dab'a in the eastern delta is Avaris, once the Hyksos capital.","source":"https://vias.univie.ac.at/en/projects/tell-el-daba/"},{"type":"F","he":"באווריס נמצאו עדויות לקהילה ממוצא לבנטיני לצד מאפיינים מצריים.","en":"Avaris yielded evidence of a Levantine-origin community alongside Egyptian features.","source":"https://vias.univie.ac.at/en/projects/tell-el-daba/"},{"type":"B","he":"המקרא מקשר את גושן למקנה של משפחת יעקב ולקרבה אל יוסף.","en":"The Bible connects Goshen with Jacob's family's livestock and proximity to Joseph.","source":"https://www.sefaria.org/Genesis.46.34?lang=bi"},{"type":"U","he":"ממצאי אווריס אינם מזהים את משפחת יעקב או את גבול גושן.","en":"Avaris's finds identify neither Jacob's family nor Goshen's boundary.","source":"https://classic.net.bible.org/dictionary.php?word=Goshen"}],"quote":{"he":"״וְיָשַׁבְתָּ בְאֶרֶץ גֹּשֶׁן, וְהָיִיתָ קָרוֹב אֵלַי. אַתָּה וּבָנֶיךָ וּבְנֵי בָנֶיךָ. וְצֹאנְךָ וּבְקָרְךָ, וְכָל אֲשֶׁר לָךְ.״","en":"And thou shalt dwell in the land of Goshen, and thou shalt be near unto me, thou, and thy children, and thy children's children, and thy flocks, and thy herds, and all that thou hast:"},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_045/images/idea_03_v9-13.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 45 בלבד. הנוף והמבנים אינם תיעוד מזוהה של גושן.","en":"Artistic illustration for Genesis 45 only. Its landscape and buildings are not identified views of Goshen."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/45-55d58c5d683c572a8723f9b07688852a.mp3?version_id=1","start":103.04,"end":115.76},"he":{"url":"https://mechon-mamre.org/mp3/t0145.mp3","start":116.26,"end":129.1}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-47-11-rameses","book":"בראשית","chapter":47,"verse":11,"title":{"he":"ארץ רעמסס — עיר וזרוע נילוס","en":"Land of Rameses: city and Nile branch"},"placeKey":"rameses","facts":[{"type":"U","he":"ארץ רעמסס שבפסוק מקושרת בדרך כלל למרחב פי־רעמסס במזרח הדלתה.","en":"The verse's land of Rameses is usually associated with the Pi-Ramesses region of the eastern delta.","source":"https://www.iae-egyptology.org/archives/696"},{"type":"F","he":"פי־רעמסס מזוהה עם קנטיר, צפונית לתל א־דבע.","en":"Pi-Ramesses is identified with Qantir, north of Tell el-Dab'a.","source":"https://www.iae-egyptology.org/archives/696"},{"type":"F","he":"הבירה הרעמססית ניצלה זרוע נילוס מזרחית לתנועה ולהובלת אספקה.","en":"The Ramesside capital used an eastern Nile branch for movement and provisioning.","source":"https://www.iae-egyptology.org/archives/696"},{"type":"F","he":"אווריס ופי־רעמסס הן מרכזים מתקופות שונות באותו אזור רחב; אין לראות בהן עיר זהה בכל זמן.","en":"Avaris and Pi-Ramesses were centres of different periods in the same broad area, not an unchanged single city.","source":"https://vias.univie.ac.at/en/projects/tell-el-daba/"},{"type":"F","he":"חפירות וגאופיזיקה באזור קנטיר גילו חלקים ממרחב ארמונות ומתקני מרכבות.","en":"Excavation and geophysics at Qantir revealed parts of a palace landscape and chariot facilities.","source":"https://www.iae-egyptology.org/archives/696"},{"type":"U","he":"שם רעמסס בבראשית אינו מספק כשלעצמו תאריך היסטורי ליוסף.","en":"The name Rameses in Genesis does not by itself establish Joseph's historical date.","source":"https://www.sefaria.org/Genesis.47.11?lang=bi"}],"quote":{"he":"וַיּוֹשֵׁב יוֹסֵף, אֶת אָבִיו וְאֶת אֶחָיו, וַיִּתֵּן לָהֶם אֲחֻזָּה בְּאֶרֶץ מִצְרַיִם, בְּמֵיטַב הָאָרֶץ בְּאֶרֶץ רַעְמְסֵס. כַּאֲשֶׁר, צִוָּה פַרְעֹה.","en":"And Joseph placed his father and his brethren, and gave them a possession in the land of Egypt, in the best of the land, in the land of Rameses, as Pharaoh had commanded."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_047/images/idea_02_v7-12.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 47 בלבד. הנוף והמבנים אינם תיעוד מזוהה של ארץ רעמסס.","en":"Artistic illustration for Genesis 47 only. Its landscape and buildings are not identified views of Land of Rameses."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/47-b8e61944031134383cdba934901e5c0f.mp3?version_id=1","start":94.88,"end":104.58},"he":{"url":"https://mechon-mamre.org/mp3/t0147.mp3","start":115.25,"end":128.27}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-49-13-zebulun","book":"בראשית","chapter":49,"verse":13,"title":{"he":"זבולון וצידון — ברכה מול מפת נחלות","en":"Zebulun and Sidon: poetry and allotment maps"},"placeKey":"zebulun","facts":[{"type":"B","he":"הברכה מתארת את זבולון בזיקה לחוף, לאוניות ולצידון.","en":"The blessing associates Zebulun with the coast, ships and Sidon.","source":"https://www.sefaria.org/Genesis.49.13?lang=bi"},{"type":"F","he":"צידון נמצאת בחוף לבנון מצפון לגליל.","en":"Sidon lies on Lebanon's coast north of Galilee.","source":"https://www.unesco.org/sites/default/files/medias/fichiers/2025/06/Enhanced-Protection-List-2024_Eng_compressed.pdf"},{"type":"B","he":"רשימת גבולות זבולון ביהושע י״ט אינה מציגה אותו תיאור של חוף צידון.","en":"Joshua 19's Zebulun boundary list does not reproduce this depiction of Sidon's coast.","source":"https://www.sefaria.org/Joshua.19.10?lang=bi"},{"type":"U","he":"הפער בין השירה לרשימת הגבולות מחייב להימנע מציור גבול מדויק על סמך הברכה לבדה.","en":"The difference between poem and boundary list prevents drawing an exact border from the blessing alone.","source":"https://classic.net.bible.org/dictionary.php?word=Zebulun"},{"type":"F","he":"הגליל התחתון מחבר עמקים פנימיים עם מעברים אל מישור החוף.","en":"Lower Galilee links inland valleys with passages toward the coastal plain.","source":"https://classic.net.bible.org/dictionary.php?word=Zebulun"},{"type":"U","he":"האזכור הימי יכול לשקף קשר כלכלי או דימוי ספרותי; הוא אינו הוכחה לחפירת נמל זבולוני.","en":"The maritime wording may reflect economic links or poetic imagery; it does not establish an excavated Zebulunite port.","source":"https://classic.net.bible.org/dictionary.php?word=Zebulun"}],"quote":{"he":"״זְבוּלֻן לְחוֹף יַמִּים יִשְׁכֹּן. וְהוּא לְחוֹף אֳנִיֹּת, וְיַרְכָתוֹ עַל צִידֹן.״","en":"Zebulun shall dwell at the haven of the sea; and he shall be for an haven of ships; and his border shall be unto Zidon."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_049/images/idea_06_v13-13.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 49 בלבד. הנוף והמבנים אינם תיעוד מזוהה של זבולון וצידון.","en":"Artistic illustration for Genesis 49 only. Its landscape and buildings are not identified views of Zebulun and Sidon."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/49-ed00690a9c129cf0000afd4ed1322bf2.mp3?version_id=1","start":127.88,"end":135.42},"he":{"url":"https://mechon-mamre.org/mp3/t0149.mp3","start":118.99,"end":127.19}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-1-11-pithom","book":"שמות","chapter":1,"verse":11,"title":{"he":"פיתום — שני אתרים מוצעים בוואדי","en":"Pithom: two proposed sites in a wadi"},"placeKey":"pithom","facts":[{"type":"U","he":"פיתום הוצעה לזיהוי הן בתל א־רטאבה והן בתל א־מסחוטה שבוואדי תומילאת.","en":"Pithom has been proposed at both Tell el-Retaba and Tell el-Maskhuta in Wadi Tumilat.","source":"https://www.archeologia.uw.edu.pl/tell-el-retaba-egipska-twierdza-w-wadi-toumilat/"},{"type":"F","he":"תל א־רטאבה נמצא בחלקו המרכזי של הוואדי, בנתיב שחיבר את מצרים ללבנט.","en":"Tell el-Retaba lies in the wadi's central part on a route linking Egypt with the Levant.","source":"https://www.archeologia.uw.edu.pl/tell-el-retaba-egipska-twierdza-w-wadi-toumilat/"},{"type":"F","he":"בתל א־רטאבה נחפרו שרידי מבצר מן הממלכה החדשה ויישוב מאוחר יותר.","en":"Tell el-Retaba yielded New Kingdom fortress remains and a later settlement.","source":"https://www.archeologia.uw.edu.pl/tell-el-retaba-egipska-twierdza-w-wadi-toumilat/"},{"type":"F","he":"תל א־מסחוטה נמצא בחלקו המזרחי של הוואדי, ממערב לאסמאעיליה.","en":"Tell el-Maskhuta lies in the eastern wadi west of Ismailia.","source":"https://iris.cnr.it/handle/20.500.14243/588344"},{"type":"F","he":"השם המצרי פר־אתום, ״בית אתום״, מופיע בהקשר של תל א־מסחוטה.","en":"The Egyptian name Per-Atum, “house of Atum,” occurs in connection with Tell el-Maskhuta.","source":"https://iris.cnr.it/handle/20.500.14243/588344"},{"type":"B","he":"״ערי מסכנות״ הוא תיאור מקראי; עצם גילוי מחסן אינו מזהה את הפועלים שבספר שמות.","en":"“Store cities” is the biblical description; finding a storehouse does not identify the workers in Exodus.","source":"https://www.sefaria.org/Exodus.1.11?lang=bi"}],"quote":{"he":"וַיָּשִׂימוּ עָלָיו שָׂרֵי מִסִּים, לְמַעַן עַנֹּתוֹ בְּסִבְלֹתָם. וַיִּבֶן עָרֵי מִסְכְּנוֹת, לְפַרְעֹה. אֶת פִּתֹם, וְאֶת רַעַמְסֵס.","en":"Therefore they did set over them taskmasters to afflict them with their burdens. And they built for Pharaoh treasure cities, Pithom and Raamses."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_001/images/idea_02_v8-12.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 1 בלבד. הנוף והמבנים אינם תיעוד מזוהה של פיתום.","en":"Artistic illustration for Exodus 1 only. Its landscape and buildings are not identified views of Pithom."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/1-ad601a0c698ba8c6bbb57f3f0b47c8f2.mp3?version_id=1","start":68.98,"end":78.4},"he":{"url":"https://mechon-mamre.org/mp3/t0201.mp3","start":69.19,"end":79.93}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-1-11-ramesesWorkshops","book":"שמות","chapter":1,"verse":11,"title":{"he":"רעמסס — סדנאות ובסיס מרכבות","en":"Rameses: workshops and a chariot base"},"placeKey":"ramesesWorkshops","facts":[{"type":"F","he":"בקנטיר, אתר פי־רעמסס, התגלו מתקני יציקת ברונזה גדולים.","en":"Qantir, the site of Pi-Ramesses, yielded large bronze-casting installations.","source":"https://cris.unibo.it/handle/11585/904670"},{"type":"F","he":"נמצאו גם עדויות לייצור זכוכית ולצביעתה, ובהן זכוכית אדומה.","en":"Evidence of glass production and colouring includes red glass.","source":"https://cris.unibo.it/handle/11585/904670"},{"type":"F","he":"סדנאות פאיאנס יצרו פריטי עיטור אדריכלי וחפצים קטנים.","en":"Faience workshops produced architectural decoration and small objects.","source":"https://cris.unibo.it/handle/11585/904670"},{"type":"F","he":"מתחם המרכבות כלל סדנאות, מגרש אימונים ואורוות לסוסים.","en":"The chariotry complex included workshops, a training ground and horse stables.","source":"https://cris.unibo.it/handle/11585/904670"},{"type":"F","he":"טביעות פרסות שנשמרו במצע בוצי מתעדות פעילות סוסים במקום.","en":"Hoofprints preserved in muddy ground record horses' activity at the site.","source":"https://piramesse-exhibition.de/en/pferde-fuer-den-pharao/"},{"type":"U","he":"הממצאים מלמדים על בירה מלכותית ותעשייה; הם אינם מזהים את בני ישראל כפועליה.","en":"The finds document a royal capital and industry; they do not identify Israelites as its workers.","source":"https://www.sefaria.org/Exodus.1.11?lang=bi"}],"quote":{"he":"וַיָּשִׂימוּ עָלָיו שָׂרֵי מִסִּים, לְמַעַן עַנֹּתוֹ בְּסִבְלֹתָם. וַיִּבֶן עָרֵי מִסְכְּנוֹת, לְפַרְעֹה. אֶת פִּתֹם, וְאֶת רַעַמְסֵס.","en":"Therefore they did set over them taskmasters to afflict them with their burdens. And they built for Pharaoh treasure cities, Pithom and Raamses."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_001/images/idea_02_v8-12.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 1 בלבד. הנוף והמבנים אינם תיעוד מזוהה של רעמסס.","en":"Artistic illustration for Exodus 1 only. Its landscape and buildings are not identified views of Rameses."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/1-ad601a0c698ba8c6bbb57f3f0b47c8f2.mp3?version_id=1","start":68.98,"end":78.4},"he":{"url":"https://mechon-mamre.org/mp3/t0201.mp3","start":69.19,"end":79.93}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-2-3-nileBank","book":"שמות","chapter":2,"verse":3,"title":{"he":"שפת היאור — גדות, דלתה וסוף","en":"Nile bank: channels, delta and reeds"},"placeKey":"nileBank","facts":[{"type":"B","he":"משה מונח בסיפור ב״סוף על שפת היאור״, כלומר בסביבת גדת מים וצמחייה.","en":"The story places Moses among reeds at the Nile's edge, a vegetated waterside setting.","source":"https://www.sefaria.org/Exodus.2.3?lang=bi"},{"type":"F","he":"לדלתת הנילוס שתי זרועות מודרניות עיקריות: רוזטה ודמיאט.","en":"The modern Nile Delta has two main branches: Rosetta and Damietta.","source":"https://www.nasa.gov/image-article/nile-delta-pictured-from-international-space-station/"},{"type":"F","he":"במזרח הדלתה עבר בעבר הענף הפלוסי, שכיום אינו נהר פעיל כפי שהיה בעת העתיקה.","en":"The Pelusiac branch formerly crossed the eastern delta and is no longer an active ancient-style river channel.","source":"https://vias.univie.ac.at/en/projects/tell-el-daba/"},{"type":"F","he":"אווריס הקדומה השתרעה לצד אותו ענף, שקישר את המרחב לנתיבי שיט.","en":"Ancient Avaris extended along that branch, connecting the area to navigable waterways.","source":"https://vias.univie.ac.at/en/projects/tell-el-daba/"},{"type":"F","he":"הענף הקדום באזור אווריס נסתם בסחף במהלך האלף הראשון לפנה״ס.","en":"The ancient branch in the Avaris area silted up during the first millennium BCE.","source":"https://vias.univie.ac.at/en/projects/tell-el-daba/"},{"type":"U","he":"אי אפשר לסמן את מקום התיבה על אחת הזרועות המודרניות; הסיפור אינו מוסר כתובת.","en":"The basket cannot be plotted on a particular modern branch; the story supplies no precise location.","source":"https://www.sefaria.org/Exodus.2.3?lang=bi"}],"quote":{"he":"וְלֹא יָכְלָה עוֹד, הַצְּפִינוֹ, וַתִּקַּח לוֹ תֵּבַת גֹּמֶא, וַתַּחְמְרָה בַחֵמָר וּבַזָּפֶת. וַתָּשֶׂם בָּהּ אֶת הַיֶּלֶד, וַתָּשֶׂם בַּסּוּף עַל שְׂפַת הַיְאֹר.","en":"And when she could not longer hide him, she took for him an ark of bulrushes, and daubed it with slime and with pitch, and put the child therein; and she laid it in the flags by the river's brink."},"era":{"he":"מסורת יציאת מצרים והמדבר — ללא תיארוך מוסכם","en":"Exodus and wilderness tradition — no agreed dating"},"image":{"src":"שמות/chapter_002/images/idea_02_v3-4.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק שמות 2 בלבד. הנוף והמבנים אינם תיעוד מזוהה של שפת היאור.","en":"Artistic illustration for Exodus 2 only. Its landscape and buildings are not identified views of Nile bank."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/EXO/2-8a404ea2c7dffbb559210a23398121de.mp3?version_id=1","start":15.54,"end":28.74},"he":{"url":"https://mechon-mamre.org/mp3/t0202.mp3","start":15.64,"end":29.41}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"exodus-2-15-midian","book":"שמות","chapter":2,"verse":15,"title":{"he":"מדין — נאות צפון־מערב ערב","en":"Midian: oases of northwestern Arabia"},"placeKey":"midian","facts":[{"type":"U","he":"מדין מקושרת בדרך כלל לצפון־מערב ערב הסעודית; גבולותיה במקרא אינם מדויקים.","en":"Midian is generally associated with northwestern Saudi Arabia; its biblical boundaries are imprecise.","source":"https://www.israeliarchaeology.org/מסע-בעקבות-קוּרָאיָה-עיר-מִדְיָן/"},{"type":"F","he":"קוראיה היא נווה קדום במחוז תבוכ, בפנים היבשה ממזרח לחוף ים סוף.","en":"Qurayyah is an ancient oasis in Tabuk province, inland east of the Red Sea coast.","source":"https://www.israeliarchaeology.org/מסע-בעקבות-קוּרָאיָה-עיר-מִדְיָן/"},{"type":"F","he":"היישוב הקבוע בקוראיה התבסס על מערכת לאיסוף מי נגר עילי.","en":"Permanent settlement at Qurayyah relied on a surface-water harvesting system.","sourc
