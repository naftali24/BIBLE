'use strict';
const ATLAS={"books":{"בראשית":"Genesis","שמות":"Exodus","ויקרא":"Leviticus","במדבר":"Numbers","דברים":"Deuteronomy","יהושע":"Joshua","שופטים":"Judges","שמואל א":"1 Samuel","שמואל ב":"2 Samuel","מלכים א":"1 Kings","מלכים ב":"2 Kings","ישעיהו":"Isaiah","ירמיהו":"Jeremiah","יחזקאל":"Ezekiel","הושע":"Hosea","יואל":"Joel","עמוס":"Amos","עובדיה":"Obadiah","יונה":"Jonah","מיכה":"Micah","נחום":"Nahum","חבקוק":"Habakkuk","צפניה":"Zephaniah","חגי":"Haggai","זכריה":"Zechariah","מלאכי":"Malachi","תהילים":"Psalms","משלי":"Proverbs","איוב":"Job","שיר השירים":"Song of Songs","רות":"Ruth","איכה":"Lamentations","קהלת":"Ecclesiastes","אסתר":"Esther","דניאל":"Daniel","עזרא":"Ezra","נחמיה":"Nehemiah","דברי הימים א":"1 Chronicles","דברי הימים ב":"2 Chronicles"},"events":[{"id":"genesis-2-10-eden","book":"בראשית","chapter":2,"verse":10,"title":{"he":"גן עדן — נהרות שאינם מפה","en":"Eden: rivers beyond a map"},"placeKey":"eden","facts":[{"type":"B","he":"הפסוק מתאר נהר היוצא מעדן ומתפצל לארבעה ראשים.","en":"The verse describes a river leaving Eden and dividing into four branches.","source":"https://www.sefaria.org/Genesis.2.10?lang=bi"},{"type":"B","he":"שניים מארבעת השמות הם חדקל ופרת, נהרות מוכרים במסופוטמיה.","en":"Two of the four names are Tigris and Euphrates, familiar Mesopotamian rivers.","source":"https://www.sefaria.org/Genesis.2.10?lang=bi"},{"type":"U","he":"פישון אינו מזוהה בוודאות; אין בסיס לסמן אותו כנהר מודרני מסוים.","en":"Pishon is unidentified; assigning it to a particular modern river is uncertain.","source":"https://classic.net.bible.org/passage.php?passage=Gen+2%3A10&theme=false"},{"type":"U","he":"גם זיהוי הגיחון שבסיפור שנוי במחלוקת; אין לזהותו אוטומטית עם מעיין ירושלים.","en":"The narrative's Gihon is disputed; it cannot automatically be equated with Jerusalem's spring.","source":"https://classic.net.bible.org/passage.php?passage=Gen+2%3A10&theme=false"},{"type":"B","he":"חוילה נזכרת בהקשר של זהב, בדולח ואבן שוהם, ולא באמצעות גבול הניתן למדידה.","en":"Havilah is described through gold, bdellium and onyx rather than measurable boundaries.","source":"https://www.sefaria.org/Genesis.2.11?lang=bi"},{"type":"U","he":"מקום הגן אינו ידוע; שמות שני הנהרות לבדם אינם מאפשרים לשחזר את ארבעת האפיקים.","en":"Eden's location is unknown; two river names cannot reconstruct all four channels.","source":"https://classic.net.bible.org/passage.php?passage=Gen+2%3A10&theme=false"}],"quote":{"he":"וְנָהָר יֹצֵא מֵעֵדֶן, לְהַשְׁקוֹת אֶת הַגָּן. וּמִשָּׁם, יִפָּרֵד, וְהָיָה, לְאַרְבָּעָה רָאשִׁים.","en":"And a river went out of Eden to water the garden; and from thence it was parted, and became into four heads."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_002/images/idea_04_v10-14.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 2 בלבד. הנוף והמבנים אינם תיעוד מזוהה של גן עדן.","en":"Artistic illustration for Genesis 2 only. Its landscape and buildings are not identified views of Eden."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/2-e7404531a3e84e887f8d3b86ce7bcba1.mp3?version_id=1","start":89.62,"end":96.86},"he":{"url":"https://mechon-mamre.org/mp3/t0102.mp3","start":102.0,"end":111.62}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-2-14-tigris","book":"בראשית","chapter":2,"verse":14,"title":{"he":"חדקל — ממזרח לאשור","en":"Tigris: east of Asshur"},"placeKey":"tigris","facts":[{"type":"F","he":"חדקל מזוהה עם נהר הטיגריס, הזורם מטורקיה דרך עיראק.","en":"Hiddekel is the Tigris, flowing from Türkiye through Iraq.","source":"https://education.nationalgeographic.org/resource/tigris-river/"},{"type":"F","he":"בניגוד לפרת המערבי, החדקל עובר בצדה המזרחי של מסופוטמיה.","en":"Unlike the western Euphrates, the Tigris follows eastern Mesopotamia.","source":"https://education.nationalgeographic.org/resource/tigris-river/"},{"type":"F","he":"העיר אשור הקדומה נמצאת על גדת החדקל בצפון מסופוטמיה.","en":"Ancient Ashur stands on the Tigris in northern Mesopotamia.","source":"https://whc.unesco.org/en/list/1130/"},{"type":"F","he":"ממערב ומדרום לאשור מצוי נוף גבעות, וממזרח לה עובר הנהר.","en":"Hills lie west and south of Ashur; the river runs to its east.","source":"https://whc.unesco.org/en/list/1130/"},{"type":"F","he":"אזור אשור נמצא במפגש בין חקלאות בעל לחקלאות השקיה.","en":"Ashur lies near the transition between rain-fed and irrigated farming.","source":"https://whc.unesco.org/en/list/1130/"},{"type":"B","he":"תיאור החדקל כזורם ״קדמת אשור״ משתמש בעיר או בארץ כנקודת התמצאות.","en":"Calling the Tigris east of Asshur uses a city or region as a geographical reference.","source":"https://www.sefaria.org/Genesis.2.14?lang=bi"}],"quote":{"he":"וְשֵׁם הַנָּהָר הַשְּׁלִישִׁי חִדֶּקֶל, הוּא הַהֹלֵךְ קִדְמַת אַשּׁוּר. וְהַנָּהָר הָרְבִיעִי, הוּא פְרָת.","en":"And the name of the third river is Hiddekel: that is it which goeth toward the east of Assyria. And the fourth river is Euphrates."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_002/images/idea_04_v10-14.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 2 בלבד. הנוף והמבנים אינם תיעוד מזוהה של חדקל.","en":"Artistic illustration for Genesis 2 only. Its landscape and buildings are not identified views of Tigris."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/2-e7404531a3e84e887f8d3b86ce7bcba1.mp3?version_id=1","start":115.02,"end":124.66},"he":{"url":"https://mechon-mamre.org/mp3/t0102.mp3","start":135.7,"end":144.93}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-2-14-euphrates","book":"בראשית","chapter":2,"verse":14,"title":{"he":"פרת — ציר מים במסופוטמיה","en":"Euphrates: Mesopotamia's water corridor"},"placeKey":"euphrates","facts":[{"type":"F","he":"הפרת נוצר מענפים שמקורם בהרי מזרח טורקיה.","en":"The Euphrates forms from branches rising in eastern Türkiye's mountains.","source":"https://www.govinfo.gov/content/pkg/GOVPUB-D5_400-PURL-LPS51514/pdf/GOVPUB-D5_400-PURL-LPS51514.pdf"},{"type":"F","he":"הנהר עובר מטורקיה לסוריה ומשם לעיראק.","en":"It flows from Türkiye through Syria into Iraq.","source":"https://www.govinfo.gov/content/pkg/GOVPUB-D5_400-PURL-LPS51514/pdf/GOVPUB-D5_400-PURL-LPS51514.pdf"},{"type":"F","he":"בדרום עיראק הפרת והחדקל מתאחדים למערכת השט אל־ערב.","en":"In southern Iraq the Euphrates and Tigris join the Shatt al-Arab system.","source":"https://www.govinfo.gov/content/pkg/GOVPUB-D5_400-PURL-LPS51514/pdf/GOVPUB-D5_400-PURL-LPS51514.pdf"},{"type":"F","he":"במישור הדרומי, ערוצים ותעלות אפשרו חקלאות באזור שחון.","en":"In the southern plain, channels and canals supported farming in an arid environment.","source":"https://whc.unesco.org/en/list/1481/"},{"type":"F","he":"שינויי אפיק וסחף שינו את הקשר בין ערי שומר לנתיבי המים.","en":"Channel shifts and sedimentation altered Sumerian cities' access to waterways.","source":"https://whc.unesco.org/en/list/1481/"},{"type":"B","he":"בבראשית ט״ו הפרת משמש גם קצה מרחב ההבטחה; זה תיאור מקראי, לא גבול מדיני מודרני.","en":"Genesis 15 also uses the Euphrates to delimit the promised territory, not a modern political border.","source":"https://www.sefaria.org/Genesis.15.18?lang=bi"}],"quote":{"he":"וְשֵׁם הַנָּהָר הַשְּׁלִישִׁי חִדֶּקֶל, הוּא הַהֹלֵךְ קִדְמַת אַשּׁוּר. וְהַנָּהָר הָרְבִיעִי, הוּא פְרָת.","en":"And the name of the third river is Hiddekel: that is it which goeth toward the east of Assyria. And the fourth river is Euphrates."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_002/images/idea_04_v10-14.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 2 בלבד. הנוף והמבנים אינם תיעוד מזוהה של פרת.","en":"Artistic illustration for Genesis 2 only. Its landscape and buildings are not identified views of Euphrates."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/2-e7404531a3e84e887f8d3b86ce7bcba1.mp3?version_id=1","start":115.02,"end":124.66},"he":{"url":"https://mechon-mamre.org/mp3/t0102.mp3","start":135.7,"end":144.93}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-8-4-ararat","book":"בראשית","chapter":8,"verse":4,"title":{"he":"הרי אררט — אזור ולא פסגה","en":"Mountains of Ararat: a region, not a peak"},"placeKey":"ararat","facts":[{"type":"B","he":"בראשית אומר ״הרי אררט״ בלשון רבים ואינו מציין פסגה מסוימת.","en":"Genesis says “mountains of Ararat” in the plural and names no individual summit.","source":"https://www.sefaria.org/Genesis.8.4?lang=bi"},{"type":"F","he":"אררט קשורה לשם אוררטו, ממלכה באזור הרמה הארמנית.","en":"Ararat is associated with Urartu, a kingdom in the Armenian highlands.","source":"https://jewishvirtuallibrary.org/jsource/judaica/ejud_0002_0002_0_01234.html"},{"type":"F","he":"אגם ואן נמצא בלב המרחב ההיסטורי של אוררטו.","en":"Lake Van lies within Urartu's historical heartland.","source":"https://jewishvirtuallibrary.org/jsource/judaica/ejud_0002_0002_0_01234.html"},{"type":"U","he":"זיהוי מקום הנחיתה עם ההר הנקרא כיום אררט הוא מסורת, לא מסקנה מן הפסוק.","en":"Equating the landing place with today's Mount Ararat is tradition, not specified by the verse.","source":"https://jewishvirtuallibrary.org/jsource/judaica/ejud_0002_0002_0_01234.html"},{"type":"F","he":"הר אררט המודרני הוא הר געש במזרח טורקיה, ולא שם לכל הרמה.","en":"Modern Mount Ararat is a volcano in eastern Türkiye, not the name of the entire highland region.","source":"https://jewishvirtuallibrary.org/jsource/judaica/ejud_0002_0002_0_01234.html"},{"type":"U","he":"מסורות אחרות מציעות הרים אחרים; אין אתר נחיתה ארכאולוגי מוסכם.","en":"Other traditions propose other mountains; no archaeological landing site is agreed upon.","source":"https://jewishvirtuallibrary.org/jsource/judaica/ejud_0002_0002_0_01234.html"}],"quote":{"he":"וַתָּנַח הַתֵּבָה בַּחֹדֶשׁ הַשְּׁבִיעִי, בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ, עַל, הָרֵי אֲרָרָט.","en":"And the ark rested in the seventh month, on the seventeenth day of the month, upon the mountains of Ararat."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_008/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 8 בלבד. הנוף והמבנים אינם תיעוד מזוהה של הרי אררט.","en":"Artistic illustration for Genesis 8 only. Its landscape and buildings are not identified views of Mountains of Ararat."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/8-babf5ab77c3d971d72c29f47956cf400.mp3?version_id=1","start":31.26,"end":38.28},"he":{"url":"https://mechon-mamre.org/mp3/t0108.mp3","start":33.51,"end":40.57}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-10-10-uruk","book":"בראשית","chapter":10,"verse":10,"title":{"he":"ארך — אורוכ והעיר המוקדמת","en":"Erech: Uruk and early urbanism"},"placeKey":"uruk","facts":[{"type":"F","he":"ארך מזוהה עם אורוכ, אתר בדרום עיראק.","en":"Erech is identified with Uruk in southern Iraq.","source":"https://whc.unesco.org/en/list/1481/"},{"type":"F","he":"אורוכ הקדומה שכנה ליד אפיק של הפרת שהתייבש מאז.","en":"Ancient Uruk lay beside a Euphrates channel that has since dried up.","source":"https://whc.unesco.org/document/169029"},{"type":"F","he":"באלף הרביעי לפנה״ס הייתה אורוכ מרכז מרכזי להתפתחות העירוניות.","en":"In the fourth millennium BCE Uruk was a major centre of urban development.","source":"https://whc.unesco.org/document/169029"},{"type":"F","he":"מתחם אאנה היה אזור מקדשים, ובו נמצאו לוחות כתב מוקדמים.","en":"The Eanna temple precinct yielded early written tablets.","source":"https://whc.unesco.org/document/169029"},{"type":"F","he":"שרידי תעלות מלמדים שהמים עברו גם בתוך המרחב העירוני.","en":"Canal remains show that waterways crossed the urban landscape.","source":"https://whc.unesco.org/document/169029"},{"type":"B","he":"הפסוק מונה את ארך עם בבל ואכד בארץ שנער, וכך ממקם אותה במרחב דרום מסופוטמיה.","en":"The verse groups Erech with Babel and Akkad in Shinar, placing it in southern Mesopotamia.","source":"https://www.sefaria.org/Genesis.10.10?lang=bi"}],"quote":{"he":"וַתְּהִי רֵאשִׁית מַמְלַכְתּוֹ בָּבֶל, וְאֶרֶךְ וְאַכַּד וְכַלְנֵה, בְּאֶרֶץ, שִׁנְעָר.","en":"And the beginning of his kingdom was Babel, and Erech, and Accad, and Calneh, in the land of Shinar."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_010/images/idea_03_v8-12.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 10 בלבד. הנוף והמבנים אינם תיעוד מזוהה של ארך.","en":"Artistic illustration for Genesis 10 only. Its landscape and buildings are not identified views of Erech."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/10-c19d7dd1216c573e45dbef8066d1f284.mp3?version_id=1","start":64.52,"end":71.78},"he":{"url":"https://mechon-mamre.org/mp3/t0110.mp3","start":68.65,"end":76.0}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-10-11-nineveh","book":"בראשית","chapter":10,"verse":11,"title":{"he":"נינוה — עיר על החדקל","en":"Nineveh: a city on the Tigris"},"placeKey":"nineveh","facts":[{"type":"F","he":"נינוה נמצאת בגדה המזרחית של החדקל, מול מרחב מוסול בעיראק.","en":"Nineveh lies on the Tigris's eastern bank in the Mosul area of Iraq.","source":"https://archeologie.culture.gouv.fr/en/nineveh"},{"type":"F","he":"תלי קויונג׳יק ונבי יונס הם חלקים מרכזיים באתר הקדום.","en":"Kuyunjik and Nebi Yunus are major mounds within the ancient site.","source":"https://archeologie.culture.gouv.fr/en/nineveh"},{"type":"F","he":"סנחריב הרחיב את העיר והפך אותה לבירת אשור במאה השביעית לפנה״ס.","en":"Sennacherib enlarged the city and made it Assyria's capital in the seventh century BCE.","source":"https://archeologie.culture.gouv.fr/en/nineveh"},{"type":"F","he":"בארמונות נינוה נמצאו תבליטים המתעדים מסעות מלחמה ונופים כבושים.","en":"Nineveh's palaces yielded reliefs recording campaigns and conquered landscapes.","source":"https://archeologie.culture.gouv.fr/en/nineveh"},{"type":"F","he":"ספריית אשורבניפל כללה אלפי לוחות חרס ובהם טקסטים מסופוטמיים.","en":"Ashurbanipal's library contained thousands of clay tablets with Mesopotamian texts.","source":"https://archeologie.culture.gouv.fr/en/nineveh"},{"type":"B","he":"בראשית י׳ מזכיר את נינוה במסגרת ערי אשור; הוא אינו מתאר את גבולות העיר המאוחרת.","en":"Genesis 10 lists Nineveh among Assyrian cities without describing the later city's boundaries.","source":"https://www.sefaria.org/Genesis.10.11?lang=bi"}],"quote":{"he":"מִן הָאָרֶץ הַהִוא, יָצָא אַשּׁוּר. וַיִּבֶן, אֶת נִינְוֵה, וְאֶת רְחֹבֹת עִיר, וְאֶת כָּלַח.","en":"Out of that land went forth Asshur, and builded Nineveh, and the city Rehoboth, and Calah,"},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_010/images/idea_03_v8-12.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 10 בלבד. הנוף והמבנים אינם תיעוד מזוהה של נינוה.","en":"Artistic illustration for Genesis 10 only. Its landscape and buildings are not identified views of Nineveh."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/10-c19d7dd1216c573e45dbef8066d1f284.mp3?version_id=1","start":71.78,"end":78.72},"he":{"url":"https://mechon-mamre.org/mp3/t0110.mp3","start":76.51,"end":84.28}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-10-11-nimrud","book":"בראשית","chapter":10,"verse":11,"title":{"he":"כלח — נמרוד שעל החדקל","en":"Calah: Nimrud on the Tigris"},"placeKey":"nimrud","facts":[{"type":"F","he":"כלח מזוהה עם נמרוד, מדרום לנינוה בצפון עיראק.","en":"Calah is identified with Nimrud, south of Nineveh in northern Iraq.","source":"https://oracc.museum.upenn.edu/nimrud/ancientkalhu/thecity/index.html"},{"type":"F","he":"האתר הוקם סמוך למפגש מרחב החדקל והזב הגדול.","en":"The site occupied the region near the Tigris and Greater Zab confluence.","source":"https://oracc.museum.upenn.edu/nimrud/ancientkalhu/thecity/index.html"},{"type":"F","he":"אשורנצירפל השני הפך את כלח לבירתו במאה התשיעית לפנה״ס.","en":"Ashurnasirpal II made Calah his capital in the ninth century BCE.","source":"https://oracc.museum.upenn.edu/nimrud/ancientkalhu/thecity/index.html"},{"type":"F","he":"בארמון הצפון־מערבי התגלו תבליטי אבן ופסלי שוורים מכונפים.","en":"The Northwest Palace yielded stone reliefs and winged bull sculptures.","source":"https://oracc.museum.upenn.edu/nimrud/ancientkalhu/thecity/index.html"},{"type":"F","he":"שנהבי נמרוד מעידים על קשרי החצר האשורית עם אזורי המזרח הקדום.","en":"Nimrud's ivories reflect Assyrian court connections across the ancient Near East.","source":"https://oracc.museum.upenn.edu/nimrud/ancientkalhu/thecity/index.html"},{"type":"B","he":"שם האתר המודרני ״נמרוד״ אינו הוכחה שהדמות המקראית בנתה אותו.","en":"The modern name Nimrud does not prove construction by the biblical figure.","source":"https://www.sefaria.org/Genesis.10.11?lang=bi"}],"quote":{"he":"מִן הָאָרֶץ הַהִוא, יָצָא אַשּׁוּר. וַיִּבֶן, אֶת נִינְוֵה, וְאֶת רְחֹבֹת עִיר, וְאֶת כָּלַח.","en":"Out of that land went forth Asshur, and builded Nineveh, and the city Rehoboth, and Calah,"},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_010/images/idea_03_v8-12.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 10 בלבד. הנוף והמבנים אינם תיעוד מזוהה של כלח.","en":"Artistic illustration for Genesis 10 only. Its landscape and buildings are not identified views of Calah."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/10-c19d7dd1216c573e45dbef8066d1f284.mp3?version_id=1","start":71.78,"end":78.72},"he":{"url":"https://mechon-mamre.org/mp3/t0110.mp3","start":76.51,"end":84.28}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-10-19-sidon","book":"בראשית","chapter":10,"verse":19,"title":{"he":"צידון — גבול צפוני וחוף","en":"Sidon: a northern coastal marker"},"placeKey":"sidon","facts":[{"type":"F","he":"צידון היא עיר חוף בלבנון, מצפון לצור.","en":"Sidon is a coastal city in Lebanon, north of Tyre.","source":"https://www.unesco.org/sites/default/files/medias/fichiers/2025/06/Enhanced-Protection-List-2024_Eng_compressed.pdf"},{"type":"F","he":"מפרצים ואיים סמוכים סיפקו לעיר תנאים לפעילות נמלית.","en":"Nearby bays and islets supported the city's harbours.","source":"https://www.unesco.org/sites/default/files/medias/fichiers/2025/06/Enhanced-Protection-List-2024_Eng_compressed.pdf"},{"type":"F","he":"צידון הייתה עיר־מדינה פיניקית, ולא שם נרדף לכל פיניקיה.","en":"Sidon was a Phoenician city-state, not a synonym for all Phoenicia.","source":"https://www.unesco.org/sites/default/files/medias/fichiers/2025/06/Enhanced-Protection-List-2024_Eng_compressed.pdf"},{"type":"F","he":"בחפירות העיר נמצאו מקדשים וקבורות מתקופות הברונזה והברזל.","en":"Excavations revealed temples and burials from the Bronze and Iron Ages.","source":"https://www.unesco.org/sites/default/files/medias/fichiers/2025/06/Enhanced-Protection-List-2024_Eng_compressed.pdf"},{"type":"F","he":"מצודת הים הנראית כיום היא צלבנית, מאוחרת בהרבה לעולם בראשית.","en":"Today's Sea Castle is Crusader, much later than the world depicted in Genesis.","source":"https://www.unesco.org/sites/default/files/medias/fichiers/2025/06/Enhanced-Protection-List-2024_Eng_compressed.pdf"},{"type":"B","he":"צידון משמשת בפסוק נקודת קצה צפונית בתיאור תחום הכנעני לאורך החוף.","en":"In the verse Sidon marks a northern endpoint of Canaanite coastal territory.","source":"https://www.sefaria.org/Genesis.10.19?lang=bi"}],"quote":{"he":"וַיְהִי גְּבוּל הַכְּנַעֲנִי, מִצִּידֹן. בֹּאֲכָה גְרָרָה, עַד עַזָּה: בֹּאֲכָה סְדֹמָה וַעֲמֹרָה, וְאַדְמָה וּצְבֹיִם. עַד לָשַׁע.","en":"And the border of the Canaanites was from Sidon, as thou comest to Gerar, unto Gaza; as thou goest, unto Sodom, and Gomorrah, and Admah, and Zeboim, even unto Lasha."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_010/images/idea_03_v8-12.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 10 בלבד. הנוף והמבנים אינם תיעוד מזוהה של צידון.","en":"Artistic illustration for Genesis 10 only. Its landscape and buildings are not identified views of Sidon."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/10-c19d7dd1216c573e45dbef8066d1f284.mp3?version_id=1","start":115.92,"end":129.84},"he":{"url":"https://mechon-mamre.org/mp3/t0110.mp3","start":127.53,"end":139.46}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-10-19-gaza","book":"בראשית","chapter":10,"verse":19,"title":{"he":"עזה — צומת בין כנען למצרים","en":"Gaza: junction between Canaan and Egypt"},"placeKey":"gaza","facts":[{"type":"F","he":"עזה נמצאת במישור החוף הדרומי, סמוך לנתיב היבשתי אל צפון סיני.","en":"Gaza lies on the southern coastal plain near the land corridor into northern Sinai.","source":"https://www.cambridge.org/core/journals/antiquity/article/new-investigations-in-gazas-heritage-landscapes-the-gaza-maritime-archaeology-project-gazamap/FAA9865684690BE34FB228AA7ECB4B78"},{"type":"F","he":"נחל עזה נשפך לים התיכון מדרום לעיר ומנקז מרחב גדול בפנים הארץ.","en":"Wadi Gaza reaches the Mediterranean south of the city, draining a large inland catchment.","source":"https://www.cambridge.org/core/journals/antiquity/article/new-investigations-in-gazas-heritage-landscapes-the-gaza-maritime-archaeology-project-gazamap/FAA9865684690BE34FB228AA7ECB4B78"},{"type":"F","he":"תל א־סכן נמצא מדרום לעזה, סמוך לנחל, ובו בניית לבנים מתקופת הברונזה הקדומה.","en":"Tell es-Sakan south of Gaza, beside the wadi, preserves Early Bronze Age mudbrick architecture.","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/sakan-tell-es/"},{"type":"U","he":"תל א־עג׳ול אינו מזוהה כיום בדרך כלל עם גרעין עזה הקדומה; אין להחליף ביניהם.","en":"Tell el-Ajjul is not generally identified with ancient Gaza's core; the sites should not be interchanged.","source":"https://jscholarship.library.jhu.edu/bitstream/1774.2/60776/1/ARICO-DISSERTATION-2017.pdf"},{"type":"F","he":"שינויי חוף וסחף שינו את היחס בין התלים שמדרום לעזה לבין הים.","en":"Coastal change and sedimentation altered the relationship between the southern mounds and the sea.","source":"https://www.cambridge.org/core/journals/antiquity/article/new-investigations-in-gazas-heritage-landscapes-the-gaza-maritime-archaeology-project-gazamap/FAA9865684690BE34FB228AA7ECB4B78"},{"type":"B","he":"הפסוק משתמש בעזה כציון גבול של מרחב הכנעני, ולא כגבול של מדינה מודרנית.","en":"The verse uses Gaza as a marker of Canaanite territory, not a modern state's frontier.","source":"https://www.sefaria.org/Genesis.10.19?lang=bi"}],"quote":{"he":"וַיְהִי גְּבוּל הַכְּנַעֲנִי, מִצִּידֹן. בֹּאֲכָה גְרָרָה, עַד עַזָּה: בֹּאֲכָה סְדֹמָה וַעֲמֹרָה, וְאַדְמָה וּצְבֹיִם. עַד לָשַׁע.","en":"And the border of the Canaanites was from Sidon, as thou comest to Gerar, unto Gaza; as thou goest, unto Sodom, and Gomorrah, and Admah, and Zeboim, even unto Lasha."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_010/images/idea_03_v8-12.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 10 בלבד. הנוף והמבנים אינם תיעוד מזוהה של עזה.","en":"Artistic illustration for Genesis 10 only. Its landscape and buildings are not identified views of Gaza."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/10-c19d7dd1216c573e45dbef8066d1f284.mp3?version_id=1","start":115.92,"end":129.84},"he":{"url":"https://mechon-mamre.org/mp3/t0110.mp3","start":127.53,"end":139.46}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-11-2-shinar","book":"בראשית","chapter":11,"verse":2,"title":{"he":"שנער — מישור של סחף","en":"Shinar: an alluvial plain"},"placeKey":"shinar","facts":[{"type":"B","he":"שנער היא הארץ שבה הפסוק ממקם את בקעת בבל.","en":"Shinar is the land in which the verse locates Babel's plain.","source":"https://www.sefaria.org/Genesis.11.2?lang=bi"},{"type":"F","he":"זיהויה המקובל הוא בדרום מסופוטמיה, בתחום עיראק של ימינו.","en":"It is generally associated with southern Mesopotamia, in present-day Iraq.","source":"https://classic.net.bible.org/dictionary.php?word=Shinar"},{"type":"F","he":"זהו מישור סחף של הפרת והחדקל, בניגוד לרמות ההרריות מצפון.","en":"It is an alluvial Tigris-Euphrates plain, unlike the highlands to the north.","source":"https://whc.unesco.org/en/list/1481/"},{"type":"F","he":"בוץ הנהרות וקנים היו חומרי בנייה מקומיים בנוף הדלתה.","en":"River mud and reeds supplied local building materials in the delta landscape.","source":"https://whc.unesco.org/en/list/1481/"},{"type":"B","he":"הפסוק הבא מדגיש לבנים וחמר במקום אבן וטיט; זו התאמה ספרותית לחומרי המישור.","en":"The next verse contrasts brick and bitumen with stone and mortar, fitting the plain's materials.","source":"https://www.sefaria.org/Genesis.11.3?lang=bi"},{"type":"U","he":"אין לזהות את כל שנער עם נקודה יחידה על מפה; מדובר בארץ ולא רק בעיר.","en":"Shinar should not be plotted as one point: it is a region rather than a single city.","source":"https://classic.net.bible.org/dictionary.php?word=Shinar"}],"quote":{"he":"וַיְהִי, בְּנָסְעָם מִקֶּדֶם. וַיִּמְצְאוּ בִקְעָה בְּאֶרֶץ שִׁנְעָר, וַיֵּשְׁבוּ שָׁם.","en":"And it came to pass, as they journeyed from the east, that they found a plain in the land of Shinar; and they dwelt there."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_011/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 11 בלבד. הנוף והמבנים אינם תיעוד מזוהה של שנער.","en":"Artistic illustration for Genesis 11 only. Its landscape and buildings are not identified views of Shinar."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/11-0eb64f0216ba05dbaa3f1e2256158cd5.mp3?version_id=1","start":7.32,"end":13.78},"he":{"url":"https://mechon-mamre.org/mp3/t0111.mp3","start":11.1,"end":18.24}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-11-9-babylon","book":"בראשית","chapter":11,"verse":9,"title":{"he":"בבל — עיר, נהר וזיקורת","en":"Babylon: city, river and ziggurat"},"placeKey":"babylon","facts":[{"type":"F","he":"בבל שוכנת מדרום לבגדאד, סמוך לעיר חילה בעיראק.","en":"Babylon lies south of Baghdad, near Hillah in Iraq.","source":"https://whc.unesco.org/en/list/278/"},{"type":"F","he":"הפרת עבר במרקם העיר הקדומה והשפיע על חלוקתה ועל התנועה בה.","en":"The Euphrates crossed the ancient city, shaping its layout and circulation.","source":"https://whc.unesco.org/en/list/278/"},{"type":"F","he":"באתר נשמרו שרידי חומות, שערים, ארמונות ומקדשים.","en":"The site preserves remains of walls, gates, palaces and temples.","source":"https://whc.unesco.org/en/list/278/"},{"type":"F","he":"השרידים המונומנטליים הידועים קשורים בעיקר לבבל של האלף הראשון לפנה״ס.","en":"Its best-known monumental remains largely belong to first-millennium BCE Babylon.","source":"https://whc.unesco.org/en/list/278/"},{"type":"U","he":"הזיקורת אֶתֶמֶנַנְכִּי הוצעה כרקע למגדל בבל; הקישור הוא השערה מחקרית.","en":"The Etemenanki ziggurat has been proposed as background for Babel's tower; the connection is a hypothesis.","source":"https://whc.unesco.org/en/list/278/"},{"type":"B","he":"סיפור בלילת הלשונות הוא מסורת מקראית ואינו מסקנה מחפירות העיר.","en":"The confusion of languages is biblical tradition, not a conclusion established by excavation.","source":"https://www.sefaria.org/Genesis.11.9?lang=bi"}],"quote":{"he":"עַל כֵּן קָרָא שְׁמָהּ, בָּבֶל, כִּי שָׁם בָּלַל יְהוָה, שְׂפַת כָּל הָאָרֶץ. וּמִשָּׁם הֱפִיצָם יְהוָה, עַל פְּנֵי כָּל הָאָרֶץ.","en":"Therefore is the name of it called Babel; because the Lord did there confound the language of all the earth: and from thence did the Lord scatter them abroad upon the face of all the earth."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_011/images/idea_03_v7-9.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 11 בלבד. הנוף והמבנים אינם תיעוד מזוהה של בבל.","en":"Artistic illustration for Genesis 11 only. Its landscape and buildings are not identified views of Babylon."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/11-0eb64f0216ba05dbaa3f1e2256158cd5.mp3?version_id=1","start":68.62,"end":80.38},"he":{"url":"https://mechon-mamre.org/mp3/t0111.mp3","start":87.73,"end":100.85}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-11-28-ur","book":"בראשית","chapter":11,"verse":28,"title":{"he":"אור כשדים — זיהוי ומרחק מן הים","en":"Ur of the Chaldeans: identification and a changing shoreline"},"placeKey":"ur","facts":[{"type":"U","he":"אור כשדים מזוהה בדרך כלל עם תל אל־מוקייר בדרום עיראק; הקישור לסיפור אברהם אינו מוכח.","en":"Ur of the Chaldeans is commonly identified with Tell el-Muqayyar in southern Iraq; its link to Abraham is unproven.","source":"https://classic.net.bible.org/dictionary.php?word=Ur"},{"type":"F","he":"העיר השומרית אור השתלבה בנוף קדום של ביצות ונתיבי מים.","en":"Sumerian Ur belonged to an ancient landscape of marshes and waterways.","source":"https://whc.unesco.org/en/list/1481/"},{"type":"F","he":"הסחף ושינויי אפיקי הנהרות הרחיקו את האתר מנתיבי מים שהיו פעילים בעת העתיקה.","en":"Sedimentation and channel shifts separated the site from once-active waterways.","source":"https://whc.unesco.org/document/169029"},{"type":"F","he":"במרגלות הזיקורת נמצאו שברי לבנים מזוגגות מן המקדש שבראשה, המתוארכים לתקופה הבבלית המאוחרת.","en":"Glazed brick fragments from the ziggurat’s summit shrine were found at its foot and date to the Late Babylonian period.","source":"https://www.britishmuseum.org/collection/object/W_1924-0920-242"},{"type":"F","he":"בית הקברות המלכותי הניב תכשיטים וחפצים מחומרים שיובאו ממרחקים.","en":"The Royal Cemetery yielded jewellery and objects using materials imported from afar.","source":"https://www.metmuseum.org/art/collection/search/322903"},{"type":"B","he":"״כשדים״ הוא הכינוי המקראי; אין ללמוד ממנו שכל שכבות אור הן מתקופה אחת.","en":"“Chaldeans” is the biblical designation; it does not date all of Ur's occupation layers to one period.","source":"https://www.sefaria.org/Genesis.11.28?lang=bi"}],"quote":{"he":"וַיָּמָת הָרָן, עַל פְּנֵי תֶּרַח אָבִיו, בְּאֶרֶץ מוֹלַדְתּוֹ, בְּאוּר כַּשְׂדִּים.","en":"And Haran died before his father Terah in the land of his nativity, in Ur of the Chaldees."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_011/images/idea_07_v28-28.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 11 בלבד. הנוף והמבנים אינם תיעוד מזוהה של אור כשדים.","en":"Artistic illustration for Genesis 11 only. Its landscape and buildings are not identified views of Ur of the Chaldeans."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/11-0eb64f0216ba05dbaa3f1e2256158cd5.mp3?version_id=1","start":170.46,"end":176.58},"he":{"url":"https://mechon-mamre.org/mp3/t0111.mp3","start":239.18,"end":244.7}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-11-31-haran","book":"בראשית","chapter":11,"verse":31,"title":{"he":"חרן — צומת בצפון מסופוטמיה","en":"Haran: a junction in Upper Mesopotamia"},"placeKey":"haran","facts":[{"type":"F","he":"חרן מזוהה עם חראן בדרום־מזרח טורקיה, מדרום לשנלאורפה.","en":"Haran is identified with Harran in southeastern Türkiye, south of Şanlıurfa.","source":"https://whc.unesco.org/en/tentativelists/1400/"},{"type":"F","he":"העיר נמצאת במישור של צפון מסופוטמיה, ולא בדרום עיראק של אור.","en":"It lies in Upper Mesopotamia's plain, rather than Ur's southern Iraqi setting.","source":"https://whc.unesco.org/en/tentativelists/1400/"},{"type":"F","he":"דרכים מן הים התיכון אל פנים מסופוטמיה עברו במרחב חרן.","en":"Routes from the Mediterranean toward inland Mesopotamia crossed the Harran region.","source":"https://whc.unesco.org/en/tentativelists/1400/"},{"type":"F","he":"חרן נזכרת בתעודות מארי, ולכן שמה מוכר גם מחוץ למקרא.","en":"Harran appears in Mari documents, providing an extra-biblical attestation of its name.","source":"https://whc.unesco.org/en/tentativelists/1400/"},{"type":"F","he":"בתי הבוץ בעלי הגגות החרוטיים מייצגים אדריכלות מקומית; אין לזהותם כבתי משפחת אברהם.","en":"Its conical mudbrick houses represent local architecture, not identifiable houses of Abraham's family.","source":"https://whc.unesco.org/en/tentativelists/1400/"},{"type":"B","he":"הפסוק מחלק את מסע המשפחה לשני שלבים: אור–חרן ובהמשך חרן–כנען.","en":"The verse divides the family journey into stages: Ur–Haran, followed later by Haran–Canaan.","source":"https://www.sefaria.org/Genesis.11.31?lang=bi"}],"quote":{"he":"וַיִּקַּח תֶּרַח אֶת אַבְרָם בְּנוֹ, וְאֶת לוֹט בֶּן הָרָן בֶּן בְּנוֹ, וְאֵת שָׂרַי כַּלָּתוֹ, אֵשֶׁת אַבְרָם בְּנוֹ. וַיֵּצְאוּ אִתָּם מֵאוּר כַּשְׂדִּים, לָלֶכֶת אַרְצָה כְּנַעַן, וַיָּבֹאוּ עַד חָרָן, וַיֵּשְׁבוּ שָׁם.","en":"And Terah took Abram his son, and Lot the son of Haran his son's son, and Sarai his daughter in law, his son Abram's wife; and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt there."},"era":{"he":"מסורות ראשית — ללא תיארוך מוסכם","en":"Primeval traditions — no agreed dating"},"image":{"src":"בראשית/chapter_011/images/idea_09_v31-31.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 11 בלבד. הנוף והמבנים אינם תיעוד מזוהה של חרן.","en":"Artistic illustration for Genesis 11 only. Its landscape and buildings are not identified views of Haran."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/11-0eb64f0216ba05dbaa3f1e2256158cd5.mp3?version_id=1","start":192.08,"end":208.94},"he":{"url":"https://mechon-mamre.org/mp3/t0111.mp3","start":263.27,"end":283.11}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-12-6-shechem","book":"בראשית","chapter":12,"verse":6,"title":{"he":"שכם — המעבר בין שני ההרים","en":"Shechem: the passage between two mountains"},"placeKey":"shechem","facts":[{"type":"F","he":"שכם הקדומה מזוהה עם תל בלאטה, ממזרח לגרעין העיר שכם של היום.","en":"Ancient Shechem is identified with Tell Balata, east of today's Nablus urban centre.","source":"https://whc.unesco.org/en/tentativelists/6949/"},{"type":"F","he":"התל נמצא בעמק שבין הר גריזים מדרום להר עיבל מ d","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-12-8-bethel","book":"בראשית","chapter":12,"verse":8,"title":{"he":"בית אל והעי — כיוונים על הרכס","en":"Bethel and Ai: directions on the ridge"},"placeKey":"bethel","facts":[{"type":"U","he":"בית אל מזוהה בדרך כלל עם ביתין, מצפון לירושלים; קיימות הצעות חלופיות.","en":"Bethel is usually identified with Beitin north of Jerusalem; alternatives exist.","source":"https://biblical-archaeology.org/en/locations/בית-אל/"},{"type":"F","he":"ביתין נמצאת באזור ההר המרכזי, סמוך לציר האורך ירושלים–שכם.","en":"Beitin lies in the central highlands near the Jerusalem–Shechem north-south corridor.","source":"https://journals.sagepub.com/doi/10.1177/03090892241235196"},{"type":"B","he":"״מים״ בפסוק מציין מערב; בית אל נמצאת ממערב למחנה אברם בסיפור.","en":"“Seaward” in the verse means west: Bethel lies west of Abram's camp in the narrative.","source":"https://www.sefaria.org/Genesis.12.8?lang=bi"},{"type":"B","he":"העי נמצאת ממזרח למחנה; הכתוב ממקם את האוהל ביניהן, לא בתוך אחת הערים.","en":"Ai lies east of the camp; the text places the tent between the towns, not within either one.","source":"https://www.sefaria.org/Genesis.12.8?lang=bi"},{"type":"F","he":"בחפירות ביתין נמצאו שרידי יישוב מתקופות שונות; חלק מן התל מכוסה בבנייה מודרנית.","en":"Beitin excavations revealed multiple occupation periods; modern building covers part of the mound.","source":"https://biblical-archaeology.org/en/locations/בית-אל/"},{"type":"U","he":"קשיי פרסום וסטרטיגרפיה בחפירות הישנות מגבילים שחזור של אתר הפולחן.","en":"Problems with publication and stratigraphy in earlier excavations limit reconstruction of the cult site.","source":"https://journals.sagepub.com/doi/10.1177/03090892241235196"}],"quote":{"he":"וַיַּעְתֵּק מִשָּׁם הָהָרָה, מִקֶּדֶם לְבֵית אֵל. וַיֵּט אָהֳלֹה. בֵּית אֵל מִיָּם, וְהָעַי מִקֶּדֶם, וַיִּבֶן שָׁם מִזְבֵּחַ לַיהוָה, וַיִּקְרָא בְּשֵׁם יְהוָה.","en":"And he removed from thence unto a mountain on the east of Bethel, and pitched his tent, having Bethel on the west, and Hai on the east: and there he builded an altar unto the Lord, and called upon the name of the Lord."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_012/images/idea_03_v6-8.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 12 בלבד. הנוף והמבנים אינם תיעוד מזוהה של בית אל והעי.","en":"Artistic illustration for Genesis 12 only. Its landscape and buildings are not identified views of Bethel and Ai."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/12-0337100d2a8ef9241962813652d39734.mp3?version_id=1","start":75.96,"end":90.84},"he":{"url":"https://mechon-mamre.org/mp3/t0112.mp3","start":93.18,"end":111.06}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-12-9-negev","book":"בראשית","chapter":12,"verse":9,"title":{"he":"הנגב — דרומה אל אזור היובש","en":"Negev: south toward the drylands"},"placeKey":"negev","facts":[{"type":"F","he":"הנגב הוא המרחב הדרומי שבין אזור באר שבע למדבריות הדרום.","en":"The Negev is the southern region extending from the Beersheba area into the southern deserts.","source":"https://www.lib.cet.ac.il/pages/item.asp?item=5057"},{"type":"F","he":"כמויות הגשם פוחתות בדרך כלל מדרום הר חברון לעבר פנים הנגב.","en":"Rainfall generally decreases from the southern Hebron hills toward the inner Negev.","source":"https://www.lib.cet.ac.il/pages/item.asp?item=5057"},{"type":"F","he":"נחלי הנגב הם ברובם ערוצי אכזב העלולים לשאת שיטפונות קצרים.","en":"Most Negev streams are ephemeral channels capable of brief flash floods.","source":"https://www.lib.cet.ac.il/pages/item.asp?item=5057"},{"type":"F","he":"בקעת באר שבע נוחה יותר לחקלאות מן הרמות המדבריות שמדרום לה.","en":"The Beersheba basin is more suitable for cultivation than the desert uplands to its south.","source":"https://en.parks.org.il/reserve-park/tel-beer-sheva-national-park/"},{"type":"B","he":"״הנגבה״ מציינת תנועה דרומה וגם מזכירה את שם האזור.","en":"“Negevward” denotes movement south and also evokes the region's name.","source":"https://www.sefaria.org/Genesis.12.9?lang=bi"},{"type":"U","he":"הנגב המקראי אינו חופף בהכרח לכל שטח הנגב המוגדר במפות ישראל כיום.","en":"The biblical Negev need not match the full area labelled Negev on modern maps.","source":"https://www.lib.cet.ac.il/pages/item.asp?item=5057"}],"quote":{"he":"וַיִּסַּע אַבְרָם, הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה.","en":"And Abram journeyed, going on still toward the south."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_012/images/idea_04_v9-9.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 12 בלבד. הנוף והמבנים אינם תיעוד מזוהה של הנגב.","en":"Artistic illustration for Genesis 12 only. Its landscape and buildings are not identified views of Negev."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/12-0337100d2a8ef9241962813652d39734.mp3?version_id=1","start":90.84,"end":94.14},"he":{"url":"https://mechon-mamre.org/mp3/t0112.mp3","start":111.06,"end":115.65}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-12-10-nile","book":"בראשית","chapter":12,"verse":10,"title":{"he":"מצרים — חקלאות נהר מול גשם","en":"Egypt: river farming and rainfall"},"placeKey":"nile","facts":[{"type":"F","he":"עמק הנילוס הוא רצועת קרקע פורייה בתוך מרחב מדברי.","en":"The Nile Valley is a strip of fertile land within a desert region.","source":"https://documents1.worldbank.org/curated/en/402661468248083855/pdf/455240PUB0indi101Official0Use0Only1.pdf"},{"type":"F","he":"הנילוס זורם צפונה ונפתח לדלתה לפני הים התיכון.","en":"The Nile flows north and spreads into a delta before reaching the Mediterranean.","source":"https://documents1.worldbank.org/curated/en/402661468248083855/pdf/455240PUB0indi101Official0Use0Only1.pdf"},{"type":"F","he":"לפני הסכרים המודרניים הצפה עונתית השקתה שדות והשקיעה סחף.","en":"Before modern dams, seasonal flooding watered fields and deposited sediment.","source":"https://documents1.worldbank.org/curated/en/402661468248083855/pdf/455240PUB0indi101Official0Use0Only1.pdf"},{"type":"F","he":"גשמי הרמות שמדרום למצרים השפיעו על זרימת הנילוס גם כשבמצרים עצמה כמעט לא ירד גשם.","en":"Rainfall in highlands south of Egypt influenced Nile flow even when Egypt itself received little rain.","source":"https://documents1.worldbank.org/curated/en/402661468248083855/pdf/455240PUB0indi101Official0Use0Only1.pdf"},{"type":"B","he":"ירידת אברם למצרים בעת רעב מציבה זה מול זה את חקלאות כנען ואת עמק הנהר.","en":"Abram's descent during famine contrasts Canaan's farming landscape with the river valley.","source":"https://www.sefaria.org/Genesis.12.10?lang=bi"},{"type":"U","he":"תלות בנהר לא מנעה רעב במצרים; הפסוק אינו מאפשר לזהות שנות בצורת מסוימות.","en":"River dependence did not eliminate Egyptian famines; the verse cannot identify particular drought years.","source":"https://www.sefaria.org/Genesis.12.10?lang=bi"}],"quote":{"he":"וַיְהִי רָעָב, בָּאָרֶץ. וַיֵּרֶד אַבְרָם מִצְרַיְמָה לָגוּר שָׁם, כִּי כָבֵד הָרָעָב בָּאָרֶץ.","en":"And there was a famine in the land: and Abram went down into Egypt to sojourn there; for the famine was grievous in the land."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_012/images/idea_05_v10-10.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 12 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מצרים.","en":"Artistic illustration for Genesis 12 only. Its landscape and buildings are not identified views of Egypt."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/12-0337100d2a8ef9241962813652d39734.mp3?version_id=1","start":94.14,"end":101.46},"he":{"url":"https://mechon-mamre.org/mp3/t0112.mp3","start":117.89,"end":127.43}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-13-10-jordan","book":"בראשית","chapter":13,"verse":10,"title":{"he":"כיכר הירדן — מים בתוך אזור צחיח","en":"Jordan plain: water within an arid landscape"},"placeKey":"jordan","facts":[{"type":"F","he":"הירדן התחתון זורם מן הכנרת דרומה אל ים המלח.","en":"The lower Jordan flows south from the Sea of Galilee to the Dead Sea.","source":"https://tile.loc.gov/storage-services/master/frd/frdcstdy/jo/jordancountrystu00metz/jordancountrystu00metz.pdf"},{"type":"F","he":"מישור ההצפה של הנהר נמוך מן המדרגות הרחבות של הבקעה.","en":"The river's floodplain lies below the valley's broader terraces.","source":"https://tile.loc.gov/storage-services/master/frd/frdcstdy/jo/jordancountrystu00metz/jordancountrystu00metz.pdf"},{"type":"F","he":"מעיינות כגון מעיין יריחו מאפשרים נאות מדבר סמוך לבקעה השחונה.","en":"Springs such as Jericho's support oases beside the arid valley.","source":"https://whc.unesco.org/en/list/1687/"},{"type":"F","he":"הפרשי הגובה בין ההר לבקעה יוצרים מעבר חד באקלים ובצומח.","en":"Elevation differences between the hills and valley create sharp climatic and vegetation changes.","source":"https://tile.loc.gov/storage-services/master/frd/frdcstdy/jo/jordancountrystu00metz/jordancountrystu00metz.pdf"},{"type":"B","he":"הפסוק מתאר את הכיכר כ״כולה משקה״ לפני חורבן סדום; זהו תיאור המספר של הנוף הקדום.","en":"The verse describes the plain as well watered before Sodom's destruction: the narrator's depiction of an earlier landscape.","source":"https://www.sefaria.org/Genesis.13.10?lang=bi"},{"type":"U","he":"אי אפשר להסיק מן התיאור את גבולות הכיכר המדויקים או את מקומן של כל עריה.","en":"The description cannot fix the plain's exact boundaries or locate every town.","source":"https://www.sefaria.org/Genesis.13.10?lang=bi"}],"quote":{"he":"וַיִּשָּׂא לוֹט אֶת עֵינָיו, וַיַּרְא אֶת כָּל כִּכַּר הַיַּרְדֵּן, כִּי כֻלָּהּ, מַשְׁקֶה. לִפְנֵי שַׁחֵת יְהוָה, אֶת סְדֹם וְאֶת עֲמֹרָה, כְּגַן יְהוָה כְּאֶרֶץ מִצְרַיִם, בֹּאֲכָה צֹעַר.","en":"And Lot lifted up his eyes, and beheld all the plain of Jordan, that it was well watered every where, before the Lord destroyed Sodom and Gomorrah, even as the garden of the Lord, like the land of Egypt, as thou comest unto Zoar."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_013/images/idea_04_v10-13.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 13 בלבד. הנוף והמבנים אינם תיעוד מזוהה של כיכר הירדן.","en":"Artistic illustration for Genesis 13 only. Its landscape and buildings are not identified views of Jordan plain."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/13-26ca5693d4a5d1ab453dae0b0a55c6b1.mp3?version_id=1","start":73.24,"end":88.34},"he":{"url":"https://mechon-mamre.org/mp3/t0113.mp3","start":87.85,"end":104.09}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-13-18-hebron","book":"בראשית","chapter":13,"verse":18,"title":{"he":"חברון — יישוב הררי וממרא","en":"Hebron: a highland settlement and Mamre"},"placeKey":"hebron","facts":[{"type":"F","he":"חברון נמצאת בהרי יהודה מדרום לירושלים, בגובה רב מעל בקעת באר שבע.","en":"Hebron lies in the Judean hills south of Jerusalem, high above the Beersheba basin.","source":"https://whc.unesco.org/en/tentativelists/6949/"},{"type":"F","he":"תל רומיידה הוא אתר היישוב הקדום, השונה ממרכז העיר העתיקה המאוחרת.","en":"Tell Rumeida is the early settlement mound, distinct from the later Old Town centre.","source":"https://whc.unesco.org/en/list/1565/"},{"type":"F","he":"העיר התפתחה בין גבעות ובעמק הסמוך למתחם מערת המכפלה.","en":"The city developed across hills and the valley beside the Machpelah enclosure.","source":"https://whc.unesco.org/en/list/1565/"},{"type":"F","he":"אבן גיר מקומית שימשה לבנייה בעיר בתקופות שונות.","en":"Local limestone supplied building stone in different periods.","source":"https://whc.unesco.org/en/list/1565/"},{"type":"B","he":"הפסוק מקשר את אלוני ממרא לחברון; זהו ציון אזורי ולא קואורדינטה לעץ מסוים.","en":"The verse associates Mamre's trees with Hebron, giving a regional landmark rather than a tree's coordinates.","source":"https://www.sefaria.org/Genesis.13.18?lang=bi"},{"type":"U","he":"אתרי ממרא שהתקדשו בתקופות מאוחרות אינם הוכחה למקום אוהלו של אברם.","en":"Later sacred sites at Mamre do not establish the location of Abram's tent.","source":"https://whc.unesco.org/en/tentativelists/6949/"}],"quote":{"he":"וַיֶּאֱהַל אַבְרָם, וַיָּבֹא וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא. אֲשֶׁר בְּחֶבְרוֹן. וַיִּבֶן שָׁם מִזְבֵּחַ, לַיהוָה.","en":"Then Abram removed his tent, and came and dwelt in the plain of Mamre, which is in Hebron, and built there an altar unto the Lord."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_013/images/idea_06_v18-18.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 13 בלבד. הנוף והמבנים אינם תיעוד מזוהה של חברון.","en":"Artistic illustration for Genesis 13 only. Its landscape and buildings are not identified views of Hebron."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/13-26ca5693d4a5d1ab453dae0b0a55c6b1.mp3?version_id=1","start":144.04,"end":159.96},"he":{"url":"https://mechon-mamre.org/mp3/t0113.mp3","start":173.49,"end":183.52}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-14-1-elam","book":"בראשית","chapter":14,"verse":1,"title":{"he":"עילם — בין מסופוטמיה לזגרוס","en":"Elam: between Mesopotamia and the Zagros"},"placeKey":"elam","facts":[{"type":"F","he":"עילם השתרעה בדרום־מערב איראן, ממזרח למישור מסופוטמיה.","en":"Elam occupied southwestern Iran, east of the Mesopotamian plain.","source":"https://www.iranicaonline.org/articles/elam-i/"},{"type":"F","he":"שושן הייתה מרכז עילמי חשוב במישור שושן שבשולי הזגרוס.","en":"Susa was a major Elamite centre in the Susiana plain at the Zagros margin.","source":"https://whc.unesco.org/en/list/1455/"},{"type":"F","he":"תלי שושן נמצאים בגדה המזרחית של נהר שאוור.","en":"Susa's principal mounds stand on the eastern bank of the Shavur River.","source":"https://whc.unesco.org/en/list/1455/"},{"type":"F","he":"מיקום שושן קישר בין תרבויות מישור מסופוטמיה לרמה האיראנית.","en":"Susa's position connected Mesopotamian plain cultures with the Iranian plateau.","source":"https://whc.unesco.org/en/list/1455/"},{"type":"F","he":"בשושן נחפרו שכבות יישוב ומבני מנהל, מגורים וארמונות מתקופות שונות.","en":"Susa yielded successive settlement layers and administrative, residential and palatial buildings.","source":"https://whc.unesco.org/en/list/1455/"},{"type":"U","he":"כדרלעומר שבבראשית לא זוהה בביטחון עם מלך עילמי המוכר מן הכתובות.","en":"Genesis's Chedorlaomer has not been securely identified with an Elamite king known from inscriptions.","source":"https://www.biblegateway.com/resources/encyclopedia-of-the-bible/Chedorlaomer"}],"quote":{"he":"וַיְהִי, בִּימֵי אַמְרָפֶל מֶלֶךְ שִׁנְעָר, אַרְיוֹךְ, מֶלֶךְ אֶלָּסָר. כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם, וְתִדְעָל מֶלֶךְ גּוֹיִם.","en":"And it came to pass in the days of Amraphel king of Shinar, Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations;"},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_014/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 14 בלבד. הנוף והמבנים אינם תיעוד מזוהה של עילם.","en":"Artistic illustration for Genesis 14 only. Its landscape and buildings are not identified views of Elam."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/14-a2eb270c860221a93f85f860dead72c8.mp3?version_id=1","start":2.88,"end":13.72},"he":{"url":"https://mechon-mamre.org/mp3/t0114.mp3","start":2.98,"end":13.14}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-14-3-deadsea","book":"בראשית","chapter":14,"verse":3,"title":{"he":"עמק השדים — ים המלח והאספלט","en":"Valley of Siddim: the Dead Sea and bitumen"},"placeKey":"deadsea","facts":[{"type":"F","he":"ים המלח הוא אגם מלוח באגן סגור שאין ממנו מוצא לים.","en":"The Dead Sea is a saline lake in a closed basin with no outlet to the ocean.","source":"https://science.nasa.gov/earth/earth-observatory/the-dead-sea-77592/"},{"type":"F","he":"האידוי במרחב החם והיבש מרכז מלחים במי האגם.","en":"Evaporation in the hot, dry environment concentrates salts in the lake.","source":"https://science.nasa.gov/earth/earth-observatory/the-dead-sea-77592/"},{"type":"F","he":"אגן ים המלח מצוי לאורך מערכת ההעתקים של בקע הירדן.","en":"The basin lies along the Jordan Rift fault system.","source":"https://science.nasa.gov/earth/earth-observatory/the-dead-sea-77592/"},{"type":"F","he":"באזור מוכרות הופעות אספלט טבעי, חומר שונה ממלח הסלע.","en":"Natural bitumen occurs in the region and is distinct from rock salt.","source":"https://www.nature.com/articles/s41598-020-64209-8"},{"type":"B","he":"בראשית י״ד מזהה את עמק השדים עם ים המלח ומזכיר ״בארות חמר״.","en":"Genesis 14 identifies Siddim with the Salt Sea and mentions bitumen pits.","source":"https://www.sefaria.org/Genesis.14.10?lang=bi"},{"type":"U","he":"אין הסכמה על אתר הקרב או על צורת החוף בזמן המתואר בסיפור.","en":"The battle site and the shoreline at the narrative's time are not established.","source":"https://www.sefaria.org/Genesis.14.3?lang=bi"}],"quote":{"he":"כָּל אֵלֶּה, חָבְרוּ, אֶל עֵמֶק, הַשִּׂדִּים: הוּא, יָם הַמֶּלַח.","en":"All these were joined together in the vale of Siddim, which is the salt sea."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_014/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 14 בלבד. הנוף והמבנים אינם תיעוד מזוהה של עמק השדים.","en":"Artistic illustration for Genesis 14 only. Its landscape and buildings are not identified views of Valley of Siddim."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/14-a2eb270c860221a93f85f860dead72c8.mp3?version_id=1","start":26.6,"end":31.9},"he":{"url":"https://mechon-mamre.org/mp3/t0114.mp3","start":27.09,"end":33.06}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-14-7-kadesh","book":"בראשית","chapter":14,"verse":7,"title":{"he":"קדש — נווה מדבר ומצודות","en":"Kadesh: oasis and fortresses"},"placeKey":"kadesh","facts":[{"type":"U","he":"קדש ברנע מזוהה בדרך כלל עם תל אל־קודיראת בצפון־מזרח סיני; הזיהוי משוער.","en":"Kadesh-barnea is commonly identified with Tell el-Qudeirat in northeastern Sinai; the identification is tentative.","source":"https://publications.iaa.org.il/iaareports/44/"},{"type":"F","he":"תל אל־קודיראת נמצא בנווה מדבר, בניגוד לשטחים הצחיחים סביבו.","en":"Tell el-Qudeirat occupies an oasis contrasting with the surrounding arid terrain.","source":"https://publications.iaa.org.il/iaareports/44/"},{"type":"F","he":"החפירות חשפו שרידי מצודות מתקופת הברזל שנבנו זו מעל זו.","en":"Excavations revealed superimposed Iron Age fortress remains.","source":"https://publications.iaa.org.il/iaareports/44/"},{"type":"F","he":"בין כלי החרס נמצאו כלים המכונים ״חרסי הנגב״, לצד כלים עשויים באובניים.","en":"The pottery includes so-called Negebite ware alongside wheel-made vessels.","source":"https://publications.iaa.org.il/iaareports/44/"},{"type":"U","he":"מחקר מחודש חלק על פירוש חלק מהשלבים כמצודות נפרדות; הכרונולוגיה והבנייה נידונות במחקר.","en":"A reassessment disputed interpreting some phases as separate fortresses; chronology and architecture remain debated.","source":"https://cris.tau.ac.il/en/publications/kadesh-barnea-a-reevaluation-of-its-archaeology-and-history/"},{"type":"B","he":"בראשית מכנה את התחנה ״עין משפט היא קדש״; המצודות אינן אימות למסע המלכים שבסיפור.","en":"Genesis calls the station “En-mishpat, that is Kadesh”; the forts do not verify the kings' campaign.","source":"https://www.sefaria.org/Genesis.14.7?lang=bi"}],"quote":{"he":"וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל עֵין מִשְׁפָּט, הִוא קָדֵשׁ, וַיַּכּוּ, אֶת כָּל שְׂדֵה הָעֲמָלֵקִי. וְגַם, אֶת הָאֱמֹרִי, הַיֹּשֵׁב, בְּחַצְצֹן תָּמָר.","en":"And they returned, and came to Enmishpat, which is Kadesh, and smote all the country of the Amalekites, and also the Amorites, that dwelt in Hazezontamar."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_014/images/idea_02_v5-7.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 14 בלבד. הנוף והמבנים אינם תיעוד מזוהה של קדש.","en":"Artistic illustration for Genesis 14 only. Its landscape and buildings are not identified views of Kadesh."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/14-a2eb270c860221a93f85f860dead72c8.mp3?version_id=1","start":57,"end":69.14},"he":{"url":"https://mechon-mamre.org/mp3/t0114.mp3","start":68.44,"end":80.26}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-14-7-hazazon","book":"בראשית","chapter":14,"verse":7,"title":{"he":"חצצון תמר — זיקה לעין גדי","en":"Hazazon-tamar: a link with En-gedi"},"placeKey":"hazazon","facts":[{"type":"U","he":"דברי הימים ב׳ כ׳ מזהה את חצצון תמר עם עין גדי; החלת הזיהוי על בראשית היא פרשנות מקראית.","en":"Second Chronicles 20 equates Hazazon-tamar with En-gedi; applying this to Genesis is a biblical interpretation.","source":"https://www.sefaria.org/2_Chronicles.20.2?lang=bi"},{"type":"F","he":"עין גדי נמצאת במורדות מדבר יהודה, בצדו המערבי של ים המלח.","en":"En-gedi lies on the Judean Desert slopes west of the Dead Sea.","source":"https://www.parks.org.il/reserve-park/שמורת-טבע-עין-גדי/"},{"type":"F","he":"ארבעה מעיינות עיקריים מזינים את נווה עין גדי.","en":"Four main springs feed the En-gedi oasis.","source":"https://www.parks.org.il/trip/david/"},{"type":"F","he":"נחל דוד ונחל ערוגות מקיימים מקטעים זורמים גם בעונה היבשה.","en":"Nahal David and Nahal Arugot maintain flowing stretches in the dry season.","source":"https://www.parks.org.il/trip/david/"},{"type":"F","he":"ליד מעיין עין גדי התגלו שרידי מקדש כלקוליתי, הקדום לתקופת המלוכה.","en":"Near En-gedi spring are remains of a Chalcolithic temple predating the monarchy.","source":"https://www.parks.org.il/reserve-park/שמורת-טבע-עין-גדי/"},{"type":"F","he":"מעלות תלולים עולים מן הנווה אל רמת המדבר, וממחישים את הקושי בתנועה מן החוף להר.","en":"Steep ascents connect the oasis to the desert plateau, illustrating difficult movement from shore to uplands.","source":"https://www.parks.org.il/reserve-park/שמורת-טבע-עין-גדי/"}],"quote":{"he":"וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל עֵין מִשְׁפָּט, הִוא קָדֵשׁ, וַיַּכּוּ, אֶת כָּל שְׂדֵה הָעֲמָלֵקִי. וְגַם, אֶת הָאֱמֹרִי, הַיֹּשֵׁב, בְּחַצְצֹן תָּמָר.","en":"And they returned, and came to Enmishpat, which is Kadesh, and smote all the country of the Amalekites, and also the Amorites, that dwelt in Hazezontamar."},"era":{"he":"מסורת האבות — ללא תיארוך מוסכם","en":"Patriarchal tradition — no agreed dating"},"image":{"src":"בראשית/chapter_014/images/idea_02_v5-7.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק בראשית 14 בלבד. הנוף והמבנים אינם תיעוד מזוהה של חצצון תמר.","en":"Artistic illustration for Genesis 14 only. Its landscape and buildings are not identified views of Hazazon-tamar."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/GEN/14-a2eb270c860221a93f85f860dead72c8.mp3?version_id=1","start":57,"end":69.14},"he":{"url":"https://mechon-mamre.org/mp3/t0114.mp3","start":68.44,"end":80.26}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"genesis-14-14-dan","book":"בראשית","chapter":14,"verse":14,"title":{"he":"דן — מעיינות ושערי לבנים","en":"Dan: springs and mudbrick gates"},"placeKey":"dan","facts":[{"type":"F","he":"תל דן נמצא בצפון עמק החולה, סמוך למעיינות הדן.","en":"Tel Dan lies in the northern Hula Valley beside the Dan springs.","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/dan/"},{"type":"F","he":"הדן הוא אחד ממקורות הירדן, ולכן סביב התל נוף עשיר במים.","en":"The Dan is a Jordan headwater, giving the mound a water-rich setting.","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/dan/"},{"type":"F","he":"בתל השתמר שער קשתות מלבני בוץ מתקופת הברונזה התיכונה.","en":"The mound preserves a mudbrick arched gate from the Middle Bronze Age.","source":"https://en.parks.org.il/reserve-park/tel-dan-nature-reserve/"},{"type":"F","he":"מתחם פולחן וביצורים מתקופת הברזל נחשפו בחפירות.","en":"Excavations uncovered an Iron Age cult complex and fortifications.","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/dan/"},{"type":"F","he":"שברי כתובת ארמית שנמצאו בתל מזכירים את ״בית דוד״.","en":"Fragments of an Aramaic inscription from the mound mention the “House of David.”","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/dan/"},{"type":"B","he":"ה
