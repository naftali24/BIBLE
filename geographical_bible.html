,"chapter":32,"verse":34,"title":{"he":"דיבון — עיר מואבית וכתובת מישע","en":"Dibon: a Moabite town and Mesha's inscription"},"placeKey":"dibon","facts":[{"type":"F","he":"דיבון מזוהה עם דיבאן בירדן, ברמה שממזרח לים המלח ומצפון לארנון.","en":"Dibon is identified with Dhiban in Jordan, on the plateau east of the Dead Sea and north of the Arnon.","source":"https://www.si.edu/object/moabite-stone-or-mesha-stele-cast%3Anmnhanthropology_8010378"},{"type":"F","he":"כתובת מישע התגלתה בדיבאן במאה התשע־עשרה.","en":"The Mesha Stele was discovered at Dhiban in the nineteenth century.","source":"https://collections.louvre.fr/en/ark%3A/53355/cl010120339"},{"type":"F","he":"המצבה עשויה בזלת ונושאת כתובת בשפה המואבית.","en":"The stele is basalt and bears an inscription in Moabite.","source":"https://collections.louvre.fr/en/ark%3A/53355/cl010120339"},{"type":"F","he":"הכתובת מתוארכת למאה התשיעית לפנה״ס ומציגה את ניצחונות מישע מנקודת מבטו.","en":"The ninth-century BCE text presents Mesha's victories from his own perspective.","source":"https://collections.louvre.fr/en/ark%3A/53355/cl010120339"},{"type":"F","he":"למרגלות תל דיבאן נבנה מאגר מטויח שהשתמש בשקע טבעי בסלע.","en":"A plastered reservoir at the foot of Dhiban’s mound incorporated a natural bedrock depression.","source":"https://www.sbl-site.org/assets/pdfs/pubs/9780884143482_OA.pdf"},{"type":"B","he":"במדבר מונה את דיבון בין ערי גד; הכתובת המאוחרת אינה תיעוד של הקמת העיר בידי השבט.","en":"Numbers lists Dibon among Gad's towns; the later inscription does not document its founding by the tribe.","source":"https://www.sefaria.org/Numbers.32.34?lang=bi"}],"quote":{"he":"וַיִּבְנוּ בְנֵי גָד, אֶת דִּיבֹן וְאֶת עֲטָרֹת, וְאֵת, עֲרֹעֵר.","en":"And the children of Gad built Dibon, and Ataroth, and Aroer,"},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_032/images/idea_06_v34-38.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 32 בלבד. הנוף והמבנים אינם תיעוד מזוהה של דיבון.","en":"Artistic illustration for Numbers 32 only. Its landscape and buildings are not identified views of Dibon."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/32-4ce2594cb5e2eb780a04facaabd2e534.mp3?version_id=1","start":306.46,"end":310.96},"he":{"url":"https://firebasestorage.googleapis.com/v0/b/tanakh-read-along.appspot.com/o/t0432.mp3?alt=media","start":282.37,"end":286.92}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-32-34-ataroth","book":"במדבר","chapter":32,"verse":34,"title":{"he":"עטרות — מקדש ומזבח כתוב","en":"Ataroth: a temple and an inscribed altar"},"placeKey":"ataroth","facts":[{"type":"U","he":"עטרות מזוהה עם חורבת עטרוז שבמרכז ירדן; הזיקה נתמכת גם בכתובת מישע.","en":"Ataroth is identified with Khirbat Ataruz in central Jordan, with support from the Mesha Stele.","source":"https://www.tandfonline.com/doi/full/10.1080/00758914.2019.1620010"},{"type":"F","he":"בחפירות התגלה מתחם מקדש מתקופת הברזל.","en":"Excavations revealed an Iron Age temple complex.","source":"https://www.tandfonline.com/doi/full/10.1080/00758914.2019.1620010"},{"type":"F","he":"במתחם נמצא מזבח אבן גלילי ועליו שתי כתובות.","en":"A cylindrical stone altar bearing two inscriptions was found in the complex.","source":"https://www.tandfonline.com/doi/abs/10.1080/00758914.2019.1619971"},{"type":"F","he":"הכתובות כתובות מואבית ומשלבות גם סימני מספרים היראטיים ממסורת הכתב המצרי.","en":"The Moabite inscriptions also use hieratic numerals from Egyptian writing tradition.","source":"https://www.tandfonline.com/doi/abs/10.1080/00758914.2019.1619971"},{"type":"F","he":"המבנה המאוחר נבנה על שרידי אדריכלות קדומה יותר, ולכן אין מדובר בשלב יישוב יחיד.","en":"The later cult building overlays earlier architecture, showing more than one occupation phase.","source":"https://www.tandfonline.com/doi/full/10.1080/00758914.2019.1620010"},{"type":"U","he":"הקישור בין שינויי הבנייה לכיבוש מישע הוא פירוש מחקרי; אין להסיק שכל שינוי הוא אירוע הנזכר בכתובת.","en":"Linking building changes to Mesha's conquest is an interpretation; not every alteration can be equated with an inscribed event.","source":"https://www.tandfonline.com/doi/full/10.1080/00758914.2019.1620010"}],"quote":{"he":"וַיִּבְנוּ בְנֵי גָד, אֶת דִּיבֹן וְאֶת עֲטָרֹת, וְאֵת, עֲרֹעֵר.","en":"And the children of Gad built Dibon, and Ataroth, and Aroer,"},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_032/images/idea_06_v34-38.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 32 בלבד. הנוף והמבנים אינם תיעוד מזוהה של עטרות.","en":"Artistic illustration for Numbers 32 only. Its landscape and buildings are not identified views of Ataroth."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/32-4ce2594cb5e2eb780a04facaabd2e534.mp3?version_id=1","start":306.46,"end":310.96},"he":{"url":"https://firebasestorage.googleapis.com/v0/b/tanakh-read-along.appspot.com/o/t0432.mp3?alt=media","start":282.37,"end":286.92}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-33-35-ezion","book":"במדבר","chapter":33,"verse":35,"title":{"he":"עציון גבר — ראש מפרץ אילת","en":"Ezion-geber: head of the Gulf of Aqaba"},"placeKey":"ezion","facts":[{"type":"B","he":"עציון גבר מופיעה ברשימת תחנות המסע; מלכים א׳ קושר אותה לים סוף ליד אילת.","en":"Ezion-geber appears in the itinerary; First Kings associates it with the Red Sea near Elath.","source":"https://www.sefaria.org/1_Kings.9.26?lang=bi"},{"type":"U","he":"תל אל־ח׳ליפה שבראש מפרץ אילת הוצע כזיהוי; אין ודאות שהוא עציון גבר המקראית.","en":"Tell el-Kheleifeh at the gulf's head has been proposed; identification with biblical Ezion-geber is uncertain.","source":"https://www.jstor.org/stable/10.5615/j.ctt2jc9px"},{"type":"F","he":"התל נמצא סמוך לחוף הצפוני של המפרץ, בין מרחבי אילת ועקבה של ימינו.","en":"The mound lies near the gulf's northern shore between modern Eilat and Aqaba.","source":"https://www.jstor.org/stable/10.5615/j.ctt2jc9px"},{"type":"F","he":"בתל נחפרו ביצורים וחללים ששימשו לאחסון במתחם בנוי מלבני בוץ.","en":"Excavations revealed fortifications and storage spaces in a mudbrick compound.","source":"https://www.jstor.org/stable/10.5615/j.ctt2jc9px"},{"type":"F","he":"מחקר מחודש בדק מחדש את תיארוך כלי החרס, הכתובות והאדריכלות מחפירות גליק.","en":"A reassessment re-examined pottery dating, inscriptions and architecture from Glueck's excavations.","source":"https://www.jstor.org/stable/10.5615/j.ctt2jc9px"},{"type":"U","he":"הייחוס המוקדם של שרידים באתר למפעל שלמה אינו מסקנה שיש לקבל ללא ביקורת כרונולוגית.","en":"Early attribution of remains to Solomon cannot be accepted without chronological scrutiny.","source":"https://www.jstor.org/stable/10.5615/j.ctt2jc9px"}],"quote":{"he":"וַיִּסְעוּ, מֵעַבְרֹנָה. וַיַּחֲנוּ, בְּעֶצְיֹן גָּבֶר.","en":"And they departed from Ebronah, and encamped at Eziongaber."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_033/images/idea_07_v31-36.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 33 בלבד. הנוף והמבנים אינם תיעוד מזוהה של עציון גבר.","en":"Artistic illustration for Numbers 33 only. Its landscape and buildings are not identified views of Ezion-geber."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/33-70a01bda0830575db835bc95cf88a44d.mp3?version_id=1","start":190.74,"end":195.2}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-34-5-brookEgypt","book":"במדבר","chapter":34,"verse":5,"title":{"he":"נחל מצרים — ואדי אל־עריש והחלופות","en":"Brook of Egypt: Wadi el-Arish and alternatives"},"placeKey":"brookEgypt","facts":[{"type":"U","he":"נחל מצרים מזוהה לרוב עם ואדי אל־עריש, אך הוצעו גם הבשור וזרוע מזרחית של הנילוס.","en":"The Brook of Egypt is often identified with Wadi el-Arish, but the Besor and an eastern Nile branch have also been proposed.","source":"https://www.thetorah.com/article/defining-the-borders-of-the-land-of-canaan-numbers-34"},{"type":"F","he":"ואדי אל־עריש מנקז חלקים נרחבים של מרכז סיני וצפונו.","en":"Wadi el-Arish drains extensive parts of central and northern Sinai.","source":"https://doi.org/10.1016/j.jafrearsci.2020.104056"},{"type":"F","he":"יובליו העליונים אוספים מים מרמות א־תיה ואל־עגמה.","en":"Its upper tributaries collect runoff from the et-Tih and el-Egma plateaus.","source":"https://www.mdpi.com/2073-4441/15/9/1797/xml"},{"type":"F","he":"האפיק הראשי פונה צפונה ונשפך לים התיכון באזור העיר אל־עריש.","en":"The main channel runs north to the Mediterranean at el-Arish.","source":"https://doi.org/10.1016/j.jafrearsci.2020.104056"},{"type":"F","he":"זהו אגן מדברי שבו זרימה עונתית ושיטפונות, בניגוד לנהר הנילוס הזורם דרך קבע.","en":"It is an arid drainage basin with intermittent flow and floods, unlike the perennial Nile.","source":"https://doi.org/10.1016/j.jafrearsci.2020.104056"},{"type":"U","he":"השם ״נחל מצרים״ אינו מבטיח זהות עם ״נהר מצרים״ שבבראשית ט״ו; ההבחנה נידונה במחקר.","en":"“Brook of Egypt” need not be identical with Genesis 15's “River of Egypt”; the distinction is debated.","source":"https://www.thetorah.com/article/defining-the-borders-of-the-land-of-canaan-numbers-34"}],"quote":{"he":"״וְנָסַב הַגְּבוּל מֵעַצְמוֹן נַחְלָה מִצְרָיִם. וְהָיוּ תוֹצְאֹתָיו, הַיָּמָּה.״","en":"And the border shall fetch a compass from Azmon unto the river of Egypt, and the goings out of it shall be at the sea."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"במדבר/chapter_034/images/idea_02_v3-5.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק במדבר 34 בלבד. הנוף והמבנים אינם תיעוד מזוהה של נחל מצרים.","en":"Artistic illustration for Numbers 34 only. Its landscape and buildings are not identified views of Brook of Egypt."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/34-5f2c96fb54a4ce6d3bd4a868756242ae.mp3?version_id=1","start":44.62,"end":52.34}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"numbers-34-11-kinneret","book":"במדבר","chapter":34,"verse":11,"title":{"he":"ים כנרת — אגם מים מתוקים בגבול","en":"Sea of Chinnereth: a freshwater boundary lake"},"placeKey":"kinneret","facts":[{"type":"F","he":"ים כנרת הוא אגם מים מתוקים בבקע הירדן, מצפון לים המלח.","en":"The Sea of Chinnereth is a freshwater lake in the Jordan Rift north of the Dead Sea.","source":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9301567/"},{"type":"F","he":"הירדן נכנס לאגם מצפון ויוצא ממנו בדרום.","en":"The Jordan enters the lake from the north and leaves to the south.","source":"https://tile.loc.gov/storage-services/master/frd/frdcstdy/jo/jordancountrystu00metz/jordancountrystu00metz.pdf"},{"type":"F","he":"מי הנהר, גשם ישיר ונגר מן המדרונות הם מקורות מים שונים של האגם.","en":"River inflow, direct rain and slope runoff are distinct water sources for the lake.","source":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9301567/"},{"type":"F","he":"התאדות מסלקת מים מן האגם; היא שונה מזרימה החוצה דרך הירדן.","en":"Evaporation removes lake water through a different process from outflow along the Jordan.","source":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9301567/"},{"type":"F","he":"לכנרת חילופי שכבות מים עונתיים; בקיץ נוצרה הפרדה בין מים חמים למים עמוקים וקרים יותר.","en":"The lake has seasonal stratification; summer separates warm surface water from cooler deep water.","source":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9301567/"},{"type":"B","he":"הגבול בפסוק נוגע בצדו המזרחי של האגם; אין פירושו שהאגם עצמו היה קו חוף מודרני קבוע.","en":"The verse's boundary meets the lake's eastern side; this does not imply an unchanging modern shoreline.","source":"https://www.sefaria.org/Numbers.34.11?lang=bi"}],"quote":{"he":"״וְיָרַד הַגְּבֻל מִשְּׁפָם הָרִבְלָה מִקֶּדֶם לָעָיִן. וְיָרַד הַגְּבֻל, וּמָחָה עַל כֶּתֶף יָם כִּנֶּרֶת קֵדְמָה.״","en":"And the coast shall go down from Shepham to Riblah, on the east side of Ain; and the border shall descend, and shall reach unto the side of the sea of Chinnereth eastward:"},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"https://assets.science.nasa.gov/dynamicimage/assets/science/esd/eo/images/imagerecords/40000/40147/ISS020-E-031066_lrg.jpg","kind":"astronaut photograph","source":"https://science.nasa.gov/earth/earth-observatory/lake-tiberias-sea-of-galilee-northern-israel-40147/","rights":"NASA/ISS Expedition 20, ISS020-E-31066; astronaut image freely available for public use. NASA source image already enhanced for publication; no additional alteration.","caption":{"he":"הכנרת בתצלום מתחנת החלל, 15 באוגוסט 2009. NASA, משלחת 20. זהו נוף מודרני, לא מפת גבולות עתיקה.","en":"Sea of Galilee photographed from the ISS, 15 August 2009. NASA, Expedition 20. A modern landscape, not an ancient boundary map."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/NUM/34-5f2c96fb54a4ce6d3bd4a868756242ae.mp3?version_id=1","start":90.58,"end":101.78}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-2-8-elath","book":"דברים","chapter":2,"verse":8,"title":{"he":"אילת — מפגש ערבה ומפרץ","en":"Elath: where the Arabah meets the gulf"},"placeKey":"elath","facts":[{"type":"B","he":"הפסוק מזכיר יחד את אילת ועציון גבר בהקשר הדרך שבקצה הערבה.","en":"The verse names Elath and Ezion-geber together in the context of the Arabah route.","source":"https://www.sefaria.org/Deuteronomy.2.8?lang=bi"},{"type":"F","he":"מפרץ אילת מפריד בין דרום סיני שממערב לו לבין צפון־מערב ערב שממזרח.","en":"The Gulf of Aqaba separates southern Sinai to the west from northwestern Arabia to the east.","source":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2020TC006443"},{"type":"F","he":"המפרץ נמצא בקצה הדרומי של מערכת העתק ים המלח.","en":"The gulf occupies the southern end of the Dead Sea fault system.","source":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2020TC006443"},{"type":"F","he":"קרקעית המפרץ מחולקת לאגנים טקטוניים, ולא למישור אחיד.","en":"The gulf floor is divided into tectonic basins rather than a uniform plain.","source":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2020TC006443"},{"type":"F","he":"מיפוי קרקעית הים מזהה העתקים של תנועה אופקית לצד העתקים המשנים את גובה הקרקעית.","en":"Seafloor mapping identifies strike-slip faults alongside faults producing vertical displacement.","source":"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2020TC006443"},{"type":"U","he":"שם העיר אילת המודרנית אינו קובע לבדו את גבולות אילת המקראית או את מיקום נמלה.","en":"Modern Eilat's name alone establishes neither ancient Elath's boundaries nor its harbour location.","source":"https://www.sefaria.org/Deuteronomy.2.8?lang=bi"}],"quote":{"he":"וַנַּעֲבֹר מֵאֵת אַחֵינוּ בְנֵי עֵשָׂו, הַיֹּשְׁבִים בְּשֵׂעִיר, מִדֶּרֶךְ הָעֲרָבָה, מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר. וַנֵּפֶן, וַנַּעֲבֹר, דֶּרֶךְ, מִדְבַּר מוֹאָב.","en":"And when we passed by from our brethren the children of Esau, which dwelt in Seir, through the way of the plain from Elath, and from Eziongaber, we turned and passed by the way of the wilderness of Moab."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_002/images/idea_01_v1-8.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 2 בלבד. הנוף והמבנים אינם תיעוד מזוהה של אילת.","en":"Artistic illustration for Deuteronomy 2 only. Its landscape and buildings are not identified views of Elath."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/2-d6df9c93f6fe4c2ac8bd9567cad8ddb0.mp3?version_id=1","start":61.58,"end":73.94},"he":{"url":"https://mechon-mamre.org/mp3/t0502.mp3","start":62.43,"end":75.28}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-3-9-hermon","book":"דברים","chapter":3,"verse":9,"title":{"he":"חרמון — הר גיר ושלג","en":"Hermon: limestone and snow"},"placeKey":"hermon","facts":[{"type":"F","he":"החרמון בנוי ברובו מסלעי גיר ודולומיט, בניגוד לכיסוי הבזלת ברמת הגולן שמדרום.","en":"Hermon is largely limestone and dolomite, unlike the basalt cover of the Golan to its south.","source":"https://ikinneret.org.il/wp-content/uploads/2021/09/ארץ-הכינרת-33.pdf"},{"type":"F","he":"מבנה הרכס הוא קמר שסוע בהעתקים; הוא אינו חרוט געשי.","en":"The range is a faulted anticline, not a volcanic cone.","source":"https://ikinneret.org.il/wp-content/uploads/2021/09/ארץ-הכינרת-33.pdf"},{"type":"F","he":"המסה של סלעי הגיר יוצרת נוף קארסטי, ובהם טרשים וחללים תת־קרקעיים.","en":"Limestone dissolution creates karst terrain, including rock pavements and underground cavities.","source":"https://ikinneret.org.il/wp-content/uploads/2021/09/ארץ-הכינרת-33.pdf"},{"type":"F","he":"גשם ושלג המחלחלים בהר מזינים בין היתר את מעיינות הדן שלמרגלותיו.","en":"Rain and snow infiltrating the mountain feed, among other sources, the Dan springs at its foot.","source":"https://en.parks.org.il/reserve-park/tel-dan-nature-reserve/"},{"type":"F","he":"פסגת הרכס גבוהה מן השלוחות הדרומיות ומאתר החרמון הישראלי.","en":"The range's summit is higher than its southern spurs and the Israeli Hermon visitor site.","source":"https://ikinneret.org.il/wp-content/uploads/2021/09/ארץ-הכינרת-33.pdf"},{"type":"B","he":"הפסוק מוסר שני כינויים לחרמון: שִׂרְיֹן אצל הצידונים ושְׂנִיר אצל האמורי.","en":"The verse supplies two names for Hermon: Sirion among Sidonians and Senir among Amorites.","source":"https://www.sefaria.org/Deuteronomy.3.9?lang=bi"}],"quote":{"he":"צִידֹנִים יִקְרְאוּ לְחֶרְמוֹן, שִׂרְיֹן. וְהָאֱמֹרִי, יִקְרְאוּ לוֹ שְׂנִיר.","en":"(Which Hermon the Sidonians call Sirion; and the Amorites call it Shenir;)"},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_003/images/idea_03_v8-11.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 3 בלבד. הנוף והמבנים אינם תיעוד מזוהה של חרמון.","en":"Artistic illustration for Deuteronomy 3 only. Its landscape and buildings are not identified views of Hermon."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/3-c3c013d25eec857d1b99215ef8b2f934.mp3?version_id=1","start":78.32,"end":83.2},"he":{"url":"https://mechon-mamre.org/mp3/t0503.mp3","start":83.6,"end":89.31}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-3-11-rabbah","book":"דברים","chapter":3,"verse":11,"title":{"he":"רבת בני עמון — תל המצודה בעמאן","en":"Rabbath-ammon: Amman's citadel hill"},"placeKey":"rabbah","facts":[{"type":"F","he":"רבת בני עמון מזוהה עם עמאן שבירדן.","en":"Rabbath-ammon is identified with Amman in Jordan.","source":"https://www.doa.gov.jo/EN/ListDetails/Archeological_Sites/1157/2"},{"type":"F","he":"ג׳בל אל־קלעה, תל המצודה, מתנשא מעל מרכז העיר והעמקים שסביבו.","en":"Jabal al-Qalaa, the citadel hill, rises above downtown and the surrounding valleys.","source":"https://www.doa.gov.jo/EN/ListDetails/Archeological_Sites/1157/2"},{"type":"F","he":"בתל התגלו שרידים מתקופות הברונזה, הברזל, התקופה הקלאסית והתקופות האסלאמיות.","en":"The hill yielded Bronze Age, Iron Age, classical and Islamic remains.","source":"https://www.doa.gov.jo/EN/ListDetails/Archeological_Sites/1157/2"},{"type":"F","he":"בתקופת הברזל פעל בו מרכז שלטוני עמוני, ובתקופה ההלניסטית נקראה העיר פילדלפיה.","en":"It was an Ammonite political centre in the Iron Age; in Hellenistic times the city was called Philadelphia.","source":"https://www.doa.gov.jo/EN/ListDetails/Archeological_Sites/1157/2"},{"type":"F","he":"מקדש הרקולס והארמון האומיי הנראים באתר שייכים לתקופות מאוחרות ושונות.","en":"The visible Temple of Hercules and Umayyad palace belong to distinct later periods.","source":"https://www.doa.gov.jo/EN/ListDetails/Archeological_Sites/1157/2"},{"type":"B","he":"ערש עוג המתואר בפסוק לא זוהה בביטחון כממצא באתר; אזכורו אינו רישום של חפץ שנחפר.","en":"Og's bed in the verse has no secure archaeological identification there; its mention is not an excavated-object record.","source":"https://www.sefaria.org/Deuteronomy.3.11?lang=bi"}],"quote":{"he":"כִּי רַק עוֹג מֶלֶךְ הַבָּשָׁן, נִשְׁאַר מִיֶּתֶר הָרְפָאִים. הִנֵּה עַרְשׂוֹ עֶרֶשׂ בַּרְזֶל, הֲלֹה הִוא בְּרַבַּת בְּנֵי עַמּוֹן: תֵּשַׁע אַמּוֹת אָרְכָּהּ, וְאַרְבַּע אַמּוֹת רָחְבָּהּ. בְּאַמַּת אִישׁ.","en":"For only Og king of Bashan remained of the remnant of giants; behold his bedstead was a bedstead of iron; is it not in Rabbath of the children of Ammon? nine cubits was the length thereof, and four cubits the breadth of it, after the cubit of a man."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_003/images/idea_03_v8-11.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 3 בלבד. הנוף והמבנים אינם תיעוד מזוהה של רבת בני עמון.","en":"Artistic illustration for Deuteronomy 3 only. Its landscape and buildings are not identified views of Rabbath-ammon."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/3-c3c013d25eec857d1b99215ef8b2f934.mp3?version_id=1","start":92.46,"end":109.8},"he":{"url":"https://mechon-mamre.org/mp3/t0503.mp3","start":99.61,"end":114.22}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-3-14-geshur","book":"דברים","chapter":3,"verse":14,"title":{"he":"גשור — שערי העיר בא־תל","en":"Geshur: the city gates at et-Tell"},"placeKey":"geshur","facts":[{"type":"U","he":"ממלכת גשור קשורה למרחב שמצפון־מזרח לכנרת; גבולותיה המדויקים אינם ידועים.","en":"Geshur is associated with the region northeast of the Sea of Galilee; its precise borders are unknown.","source":"https://www.sbl-site.org/assets/pdfs/pubs/9780884143482_OA.pdf"},{"type":"U","he":"א־תל, המכונה בחפירות בית צידה, הוצע כמרכז שלטוני של גשור.","en":"Et-Tell, called Bethsaida by its excavators, has been proposed as Geshur's political centre.","source":"https://www.sbl-site.org/assets/pdfs/pubs/9780884143482_OA.pdf"},{"type":"F","he":"בחפירות א־תל התגלו שער חיצוני ושער פנימי מתקופת הברזל.","en":"Excavations at et-Tell uncovered outer and inner Iron Age gates.","source":"https://bethsaidaarchaeology.org/wp-content/uploads/2024/04/bethsaida-2022-field-report-1.pdf"},{"type":"F","he":"מעבר מרוצף אבני בזלת חיבר בין חלקי מערכת השערים.","en":"A basalt-paved passage connected parts of the gateway system.","source":"https://ngsba.org/excavations/bethsaida/"},{"type":"F","he":"ליד השער נמצאה מצבת בזלת עם דמות בעלת קרניים; פירושה הדתי נידון במחקר.","en":"A basalt stele with a horned figure was found by the gate; its religious interpretation is debated.","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/bethsaida-et-tell/"},{"type":"F","he":"במערכת השער נמצאו גם במות ומצבות בלתי מעוטרות, המעידות על פעילות פולחנית בכניסה לעיר.","en":"The gate complex also contained high places and undecorated stelae, documenting cult activity at the entrance.","source":"https://library.biblicalarchaeology.org/book/the-new-encyclopedia-of-archaeological-excavations-in-the-holy-land/bethsaida-et-tell/"}],"quote":{"he":"יָאִיר בֶּן מְנַשֶּׁה, לָקַח אֶת כָּל חֶבֶל אַרְגֹּב, עַד גְּבוּל הַגְּשׁוּרִי, וְהַמַּעֲכָתִי. וַיִּקְרָא אֹתָם עַל שְׁמוֹ אֶת הַבָּשָׁן חַוֹּת יָאִיר, עַד הַיּוֹם הַזֶּה.","en":"Jair the son of Manasseh took all the country of Argob unto the coasts of Geshuri and Maachathi; and called them after his own name, Bashanhavothjair, unto this day."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_003/images/idea_04_v12-17.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 3 בלבד. הנוף והמבנים אינם תיעוד מזוהה של גשור.","en":"Artistic illustration for Deuteronomy 3 only. Its landscape and buildings are not identified views of Geshur."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/3-c3c013d25eec857d1b99215ef8b2f934.mp3?version_id=1","start":133.88,"end":147.96},"he":{"url":"https://mechon-mamre.org/mp3/t0503.mp3","start":140.13,"end":154.61}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-3-25-lebanon","book":"דברים","chapter":3,"verse":25,"title":{"he":"הלבנון — שני רכסים ובקעה","en":"Lebanon: two ranges and a valley"},"placeKey":"lebanon","facts":[{"type":"F","he":"רכס הלבנון נמשך במקביל לחוף הים התיכון, ממזרח למישור החוף של לבנון.","en":"The Lebanon range runs parallel to the Mediterranean, east of Lebanon's coastal plain.","source":"https://science.nasa.gov/earth/earth-observatory/snow-in-lebanon-49849/"},{"type":"F","he":"ממזרח לו נמצא רכס מול הלבנון; בין שני הרכסים משתרעת בקעת הלבנון.","en":"The Anti-Lebanon lies to its east, with the Beqaa Valley between the two ranges.","source":"https://science.nasa.gov/earth/earth-observatory/snow-in-lebanon-49849/"},{"type":"F","he":"שלג עונתי מצטבר בחלקים הגבוהים של הרכסים, גם סמוך למרחב חוף ים־תיכוני מתון יותר.","en":"Seasonal snow accumulates at high elevations despite the nearby milder Mediterranean coast.","source":"https://science.nasa.gov/earth/earth-observatory/snow-in-lebanon-49849/"},{"type":"F","he":"ארז הלבנון הוא עץ הררי המותאם לקור; עצים נטועים בישראל אינם יער בר מקומי של הארז.","en":"Lebanon cedar is a cold-adapted mountain tree; planted trees in Israel are not a native wild cedar forest.","source":"https://www.kkl.org.il/education/youth-and-education/study-materials-for-teachers/trees-and-tubishvat/trees_of_israel/israel_posters_and_podcasts/cedar_of_lebanon/"},{"type":"F","he":"עצת הארז העמידה שימשה בעת העתיקה לבנייה ולמלאכת עץ יוקרתית.","en":"Durable cedar timber served ancient construction and prestigious woodworking.","source":"https://www.kkl.org.il/education/youth-and-education/study-materials-for-teachers/trees-and-tubishvat/trees_of_israel/israel_posters_and_podcasts/cedar_of_lebanon/"},{"type":"B","he":"הבקשה לראות את הלבנון משקפת מרחב צפוני בסיפור; אין להסיק ממנה שמשה עמד בנקודה שממנה רואים כל רכס.","en":"The wish to see Lebanon invokes a northern region; it does not establish a vantage point overlooking every range.","source":"https://www.sefaria.org/Deuteronomy.3.25?lang=bi"}],"quote":{"he":"״אֶעְבְּרָה נָּא, וְאֶרְאֶה אֶת הָאָרֶץ הַטּוֹבָה, אֲשֶׁר, בְּעֵבֶר הַיַּרְדֵּן: הָהָר הַטּוֹב הַזֶּה וְהַלְּבָנֹן.״","en":"I pray thee, let me go over, and see the good land that is beyond Jordan, that goodly mountain, and Lebanon."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_003/images/idea_07_v23-27.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 3 בלבד. הנוף והמבנים אינם תיעוד מזוהה של הלבנון.","en":"Artistic illustration for Deuteronomy 3 only. Its landscape and buildings are not identified views of Lebanon."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/3-c3c013d25eec857d1b99215ef8b2f934.mp3?version_id=1","start":241.48,"end":248.98},"he":{"url":"https://mechon-mamre.org/mp3/t0503.mp3","start":265.19,"end":272.68}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-8-9-timna","book":"דברים","chapter":8,"verse":9,"title":{"he":"נחושת — הדוגמה של בקעת תמנע","en":"Copper: the example of Timna Valley"},"placeKey":"timna","facts":[{"type":"F","he":"בקעת תמנע שבדרום הערבה כוללת שכבות אבן חול נושאות עפרות נחושת.","en":"Timna Valley in the southern Arabah contains sandstone layers bearing copper ores.","source":"https://doi.org/10.1016/j.jaridenv.2026.105557"},{"type":"F","he":"באתרי הכרייה נחשפו פירים וגלריות, ולא רק מחצבות פתוחות.","en":"Mining sites preserve shafts and galleries as well as surface workings.","source":"https://doi.org/10.1016/j.jaridenv.2026.105557"},{"type":"F","he":"ערמות סיגים הן פסולת התכה ומעידות שהפקת המתכת נעשתה גם בתוך הבקעה.","en":"Slag heaps are smelting waste, showing that metal extraction occurred within the valley.","source":"https://en-humanities.tau.ac.il/Blog.BD.Timna"},{"type":"F","he":"במרחב הכרייה נחפר מקדש מצרי לאלה חתחור, לצד מתקני התעשייה.","en":"An Egyptian temple to Hathor was excavated in the mining district alongside industrial installations.","source":"https://en-humanities.tau.ac.il/Blog.BD.Timna"},{"type":"F","he":"מחקרי תיארוך מבחינים בין פעילות בתקופת הברונזה המאוחרת לבין שלבים מתקופת הברזל.","en":"Dating studies distinguish Late Bronze Age activity from Iron Age production phases.","source":"https://www.tandfonline.com/doi/abs/10.1080/00758914.2016.1145943"},{"type":"U","he":"דברים אינו מציין את תמנע בשמה; האתר הוא דוגמה אזורית להפקת נחושת, לא זיהוי ודאי של ״ההרים״ שבפסוק.","en":"Deuteronomy does not name Timna; it is a regional example of copper extraction, not certain identification of the verse's mountains.","source":"https://www.sefaria.org/Deuteronomy.8.9?lang=bi"}],"quote":{"he":"״אֶרֶץ, אֲשֶׁר לֹא בְמִסְכֵּנֻת תֹּאכַל בָּהּ לֶחֶם. לֹא תֶחְסַר כֹּל בָּהּ. אֶרֶץ אֲשֶׁר אֲבָנֶיהָ בַרְזֶל, וּמֵהֲרָרֶיהָ תַּחְצֹב נְחֹשֶׁת.״","en":"A land wherein thou shalt eat bread without scarceness, thou shalt not lack any thing in it; a land whose stones are iron, and out of whose hills thou mayest dig brass."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"https://upload.wikimedia.org/wikipedia/commons/7/7b/Chrysocolla_Timna_070613.jpg?utm_campaign=index&utm_content=original&utm_source=commons.wikimedia.org","kind":"photograph","source":"https://commons.wikimedia.org/wiki/File:Chrysocolla_Timna_070613.jpg","rights":"CC0 1.0 Universal Public Domain Dedication, Wilson44691. Unmodified image.","caption":{"he":"עפרת נחושת (כריזוקולה) באבן חול בבקעת תמנע. צילום: Wilson44691, רישיון CC0.","en":"Copper ore (chrysocolla) in sandstone, Timna Valley. Photograph: Wilson44691; CC0."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/8-5a504c0dab868eb3b8ed6e7fc9f89050.mp3?version_id=1","start":79.78,"end":90.46},"he":{"url":"https://mechon-mamre.org/mp3/t0508.mp3","start":95.56,"end":107.26}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-10-7-jotbathah","book":"דברים","chapter":10,"verse":7,"title":{"he":"יטבתה — נווה, דרך ומצודה","en":"Jotbathah: oasis, road and fort"},"placeKey":"jotbathah","facts":[{"type":"U","he":"יטבתה המקראית מקושרת במסורת המחקר לנווה יטבתה שבערבה הדרומית; הזיהוי משוער.","en":"Biblical Jotbathah is associated with the Yotvata oasis in the southern Arabah; the identification is tentative.","source":"https://journalofromanarchaeology.com/wp-content/uploads/2020/04/19_Davies-Magness.pdf"},{"type":"F","he":"המצודה הרומית נמצאת בשולי נווה גדול, על ציר תנועה לכיוון אילה שבמפרץ אילת.","en":"The Roman fort stands on the edge of a large oasis along a route toward Aila at the gulf's head.","source":"https://journalofromanarchaeology.com/wp-content/uploads/2020/04/19_Davies-Magness.pdf"},{"type":"F","he":"ליד המצודה נמצאה כתובת לטינית המזכירה הקמת מצודה בתקופת הטטררכיה.","en":"A Latin inscription near the fort refers to a Tetrarchic fort foundation.","source":"https://journalofromanarchaeology.com/wp-content/uploads/2020/04/19_Davies-Magness.pdf"},{"type":"U","he":"חופרי המצודה הציעו לתארך את המבנה שנחפר למאה הרביעית, מאוחר מן הייחוס המקובל על סמך הכתובת.","en":"The excavators proposed dating the excavated fort to the fourth century, later than the customary inscription-based attribution.","source":"https://journalofromanarchaeology.com/wp-content/uploads/2020/04/19_Davies-Magness.pdf"},{"type":"F","he":"בתקופה האסלאמית הקדומה שימשו באזור בארות שרשרת ובריכות פתוחות להשקיית גידולים.","en":"Early Islamic cultivation used qanats and open pools for irrigation in the area.","source":"https://hadashot.iaa.org.il/Report_Detail_Eng.aspx?id=25682"},{"type":"B","he":"הכינוי ״ארץ נחלי מים״ הוא תיאור מקראי; מתקני המים המאוחרים אינם תיארוך למסע המתואר.","en":"“A land of watercourses” is the biblical description; later waterworks do not date the narrated journey.","source":"https://www.sefaria.org/Deuteronomy.10.7?lang=bi"}],"quote":{"he":"״מִשָּׁם נָסְעוּ הַגֻּדְגֹּדָה. וּמִן הַגֻּדְגֹּדָה יָטְבָתָה, אֶרֶץ נַחֲלֵי מָיִם.״","en":"From thence they journeyed unto Gudgodah; and from Gudgodah to Jotbath, a land of rivers of waters."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_010/images/idea_02_v6-11.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 10 בלבד. הנוף והמבנים אינם תיעוד מזוהה של יטבתה.","en":"Artistic illustration for Deuteronomy 10 only. Its landscape and buildings are not identified views of Jotbathah."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/10-fa86ac78b51ace532d180f1bdd153aa8.mp3?version_id=1","start":68.68,"end":77.26},"he":{"url":"https://mechon-mamre.org/mp3/t0510.mp3","start":70.07,"end":77.73}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-11-10-rainFarming","book":"דברים","chapter":11,"verse":10,"title":{"he":"מצרים וכנען — השקיה לעומת גשם","en":"Egypt and Canaan: irrigation and rainfall"},"placeKey":"rainFarming","facts":[{"type":"B","he":"הפסוקים משווים את מצרים שבה משקים את הזרע לארץ הרים ובקעות התלויה בגשם.","en":"The verses contrast irrigated Egypt with a land of hills and valleys dependent on rainfall.","source":"https://www.sefaria.org/Deuteronomy.11.11?lang=bi"},{"type":"F","he":"חקלאות עמק הנילוס נשענה על מי הנהר גם במקום שכמעט אין בו גשם מקומי.","en":"Nile Valley farming relied on river water even where local rainfall was scarce.","source":"https://documents1.worldbank.org/curated/en/402661468248083855/pdf/455240PUB0indi101Official0Use0Only1.pdf"},{"type":"F","he":"האקלים הים־תיכוני באזור כנען מאופיין בחורף גשום ובקיץ יבש.","en":"The Mediterranean climate in the Canaan region has rainy winters and dry summers.","source":"https://www.cbs.gov.il/he/publications/doclib/2023/yarhon0523/intstat_e.pdf"},{"type":"F","he":"המרחב הדרומי והמזרחי עובר לתנאים מדבריים, ולכן אין משטר גשם אחיד לכל הארץ.","en":"The south and east transition into desert conditions, so rainfall is not uniform across the land.","source":"https://www.cbs.gov.il/he/publications/doclib/2023/yarhon0523/intstat_e.pdf"},{"type":"F","he":"במדרונות אזור בתיר, מדרגות אבן ותעלות מעיינות משלבות חקלאות בעל ושלחין באותו מרחב הררי.","en":"At Battir, stone terraces and spring channels combine rain-fed and irrigated farming in one hill landscape.","source":"https://whc.unesco.org/en/list/1492/"},{"type":"U","he":"הניגוד המקראי אינו אומר שלא הייתה השקיה בכנען או שלא התרחש רעב במצרים.","en":"The biblical contrast does not mean Canaan lacked irrigation or Egypt never experienced famine.","source":"https://www.sefaria.org/Deuteronomy.11.10?lang=bi"}],"quote":{"he":"״כִּי הָאָרֶץ, אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ. לֹא כְאֶרֶץ מִצְרַיִם הִוא, אֲשֶׁר יְצָאתֶם מִשָּׁם: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ וְהִשְׁקִיתָ בְרַגְלְךָ כְּגַן הַיָּרָק.״","en":"For the land, whither thou goest in to possess it, is not as the land of Egypt, from whence ye came out, where thou sowedst thy seed, and wateredst it with thy foot, as a garden of herbs:"},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_011/images/idea_02_v8-12.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 11 בלבד. הנוף והמבנים אינם תיעוד מזוהה של מצרים וכנען.","en":"Artistic illustration for Deuteronomy 11 only. Its landscape and buildings are not identified views of Egypt and Canaan."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/11-50b90d1612b7da185f7e76a62434cc7b.mp3?version_id=1","start":95.88,"end":109.6},"he":{"url":"https://mechon-mamre.org/mp3/t0511.mp3","start":101.69,"end":114.78}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-11-29-gerizimEbal","book":"דברים","chapter":11,"verse":29,"title":{"he":"גריזים ועיבל — שני עברי עמק שכם","en":"Gerizim and Ebal: opposite sides of Shechem's valley"},"placeKey":"gerizimEbal","facts":[{"type":"F","he":"הר גריזים נמצא מדרום לעמק שכם, והר עיבל מצפונו.","en":"Mount Gerizim lies south of Shechem's valley and Mount Ebal to its north.","source":"https://whc.unesco.org/en/tentativelists/6949/"},{"type":"F","he":"על גריזים נחפר מתחם מקודש שסביבו התפתחה עיר בתקופות הפרסית וההלניסטית.","en":"Gerizim yielded a sacred precinct around which a Persian- and Hellenistic-period town developed.","source":"https://landmarks.gov.il/גריזים"},{"type":"F","he":"במתחם התגלו שערים, חומות ומדרגות המקשרות בין אזורי העיר לפסגה.","en":"The precinct yielded gates, walls and stairs connecting town areas with the summit.","source":"https://landmarks.gov.il/גריזים"},{"type":"F","he":"כתובות הקדשה בכתבים ובשפות שונות מתעדות את הפעילות הדתית באתר.","en":"Dedicatory inscriptions in different scripts and languages document religious activity at the site.","source":"https://landmarks.gov.il/גריזים"},{"type":"F","he":"במרקם העירוני שעל ההר נמצאו גם בתי בד, ולא רק מבני פולחן.","en":"The mountain's urban remains include olive presses as well as cult buildings.","source":"https://landmarks.gov.il/גריזים"},{"type":"B","he":"הפסוק מציב ברכה על גריזים וקללה על עיבל; המקדש המאוחר אינו תיארוך לטקס המקראי.","en":"The verse assigns blessing to Gerizim and curse to Ebal; the later temple does not date the biblical ceremony.","source":"https://www.sefaria.org/Deuteronomy.11.29?lang=bi"}],"quote":{"he":"״וְהָיָה, כִּי יְבִיאֲךָ יְהוָה אֱלֹהֶיךָ, אֶל הָאָרֶץ, אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ. וְנָתַתָּה אֶת הַבְּרָכָה עַל הַר גְּרִזִים וְאֶת הַקְּלָלָה עַל הַר עֵיבָל.״","en":"And it shall come to pass, when the Lord thy God hath brought thee in unto the land whither thou goest to possess it, that thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_011/images/idea_07_v29-30.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 11 בלבד. הנוף והמבנים אינם תיעוד מזוהה של גריזים ועיבל.","en":"Artistic illustration for Deuteronomy 11 only. Its landscape and buildings are not identified views of Gerizim and Ebal."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/11-50b90d1612b7da185f7e76a62434cc7b.mp3?version_id=1","start":285.34,"end":298.96},"he":{"url":"https://mechon-mamre.org/mp3/t0511.mp3","start":303.1,"end":315.6}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-27-4-ebal","book":"דברים","chapter":27,"verse":4,"title":{"he":"הר עיבל — מבנה שפירושו במחלוקת","en":"Mount Ebal: a disputed structure"},"placeKey":"ebal","facts":[{"type":"F","he":"האתר שנחפר בידי אדם זרטל נמצא במדרון הצפון־מזרחי של הר עיבל, ולא בפסגתו.","en":"Adam Zertal's excavation lies on Mount Ebal's northeastern slope, not its summit.","source":"https://cojs.org/mt-_ebal_altar-_13th-12th_century_bce/"},{"type":"F","he":"באתר נחשף מבנה אבן מלבני בתוך מערכת מתחמים וחצרות.","en":"A rectangular stone structure was exposed within enclosures and courtyards.","source":"https://cojs.org/has_joshua-s_altar_been_found_on_mt-_ebal-_adam_zertal-_bar_11-01-_jan-feb_1985/"},{"type":"F","he":"אל המבנה ניגש מתקן משופע שזרטל פירש ככבש למזבח.","en":"An inclined approach reaches the structure; Zertal interpreted it as an altar ramp.","source":"https://cojs.org/has_joshua-s_altar_been_found_on_mt-_ebal-_adam_zertal-_bar_11-01-_jan-feb_1985/"},{"type":"F","he":"במילוי ובמתקנים נמצאו אפר, עצמות בעלי חיים וכלי חרס מתקופת הברזל א׳.","en":"Fill and installations contained ash, animal bones and Iron Age I pottery.","source":"https://library.biblicalarchaeology.org/sidebar/evidence-for-dating-the-mt-ebal-altar/"},{"type":"U","he":"הפירוש כמזבח מתקבל אצל חלק מהחוקרים, ואחרים הציעו פירושים שונים למבנה.","en":"Some researchers accept the altar interpretation; others propose different functions.","source":"https://cojs.org/mt-_ebal_altar-_13th-12th_century_bce/"},{"type":"U","he":"אין כתובת המזהה את המבנה כמזבח שציווה משה; השוואתו לפסוק היא פרשנות מחקרית.","en":"No inscription identifies it as the altar commanded by Moses; comparison with the verse is scholarly interpretation.","source":"https://www.sefaria.org/Deuteronomy.27.4?lang=bi"}],"quote":{"he":"״וְהָיָה, בְּעָבְרְכֶם אֶת הַיַּרְדֵּן, תָּקִימוּ אֶת הָאֲבָנִים הָאֵלֶּה אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם בְּהַר עֵיבָל. וְשַׂדְתָּ אוֹתָם, בַּשִּׂיד.״","en":"Therefore it shall be when ye be gone over Jordan, that ye shall set up these stones, which I command you this day, in mount Ebal, and thou shalt plaister them with plaister."},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_027/images/idea_02_v4-8.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 27 בלבד. הנוף והמבנים אינם תיעוד מזוהה של הר עיבל.","en":"Artistic illustration for Deuteronomy 27 only. Its landscape and buildings are not identified views of Mount Ebal."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/27-195394298720d0ccf0915b49a244eba4.mp3?version_id=1","start":36.1,"end":46.76},"he":{"url":"https://mechon-mamre.org/mp3/t0527.mp3","start":42.81,"end":52.74}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-34-1-nebo","book":"דברים","chapter":34,"verse":1,"title":{"he":"הר נבו — תצפית, עיר ומקום זיכרון","en":"Mount Nebo: viewpoint, town and memorial"},"placeKey":"nebo","facts":[{"type":"F","he":"הר נבו נמצא בעבר הירדן, ממערב למידבא וממזרח לבקעת הירדן.","en":"Mount Nebo lies in Transjordan west of Madaba and east of the Jordan Valley.","source":"https://www.custodia.org/en/convents/madaba-mount-nebo/"},{"type":"F","he":"ראס סיאע׳ה הוא אתר הזיכרון המסורתי למשה, ובו בזיליקה ושרידי מנזר.","en":"Ras Siyagha is the traditional Moses memorial site, with a basilica and monastery remains.","source":"https://www.custodia.org/en/convents/madaba-mount-nebo/"},{"type":"F","he":"חורבת אל־מח׳יט היא אתר יישוב סמוך ונפרד מן הפסגה של סיאע׳ה.","en":"Khirbet al-Mukhayyat is a nearby settlement site distinct from Siyagha's summit.","source":"https://www.townofneboproject.com/wp-content/uploads/2018/07/Mukhayyat_LA-2016.pdf"},{"type":"F","he":"באל־מח׳יט נמצאו ממצאים מתקופת הברזל, ובהם כתובת מואבית וחותם.","en":"Al-Mukhayyat yielded Iron Age finds including a Moabite inscription and a seal.","source":"https://sbf.custodia.org/sites/default/files/2019-04/museo_guida_2018_en.pdf"},{"type":"U","he":"השם ״נבו״ יכול לציין בספרות גם יישוב וגם הר; אין למזג את כל האזכורים לנקודה אחת.","en":"“Nebo” can denote a town or a mountain; all references should not be merged into one point.","source":"https://www.townofneboproject.com/wp-content/uploads/2018/07/Mukhayyat_LA-2016.pdf"},{"type":"B","he":"המקרא עצמו אומר שקבר משה אינו ידוע; אתר הזיכרון אינו זיהוי ארכאולוגי של קברו.","en":"The Bible itself says Moses's grave is unknown; the memorial is not archaeological identification of his burial.","source":"https://www.sefaria.org/Deuteronomy.34.6?lang=bi"}],"quote":{"he":"וַיַּעַל מֹשֶׁה מֵעַרְבֹת מוֹאָב, אֶל הַר נְבוֹ, רֹאשׁ הַפִּסְגָּה, אֲשֶׁר עַל פְּנֵי יְרֵחוֹ. וַיַּרְאֵהוּ יְהוָה אֶת כָּל הָאָרֶץ אֶת הַגִּלְעָד, עַד דָּן.","en":"And Moses went up from the plains of Moab unto the mountain of Nebo, to the top of Pisgah, that is over against Jericho. And the Lord shewed him all the land of Gilead, unto Dan,"},"era":{"he":"מסורת המדבר ועבר הירדן — ללא תיארוך מוסכם","en":"Wilderness and Transjordan tradition — no agreed dating"},"image":{"src":"דברים/chapter_034/images/idea_01.jpg","kind":"artistic","caption":{"he":"איור אמנותי לפרק דברים 34 בלבד. הנוף והמבנים אינם תיעוד מזוהה של הר נבו.","en":"Artistic illustration for Deuteronomy 34 only. Its landscape and buildings are not identified views of Mount Nebo."}},"audio":{"en":{"url":"https://audio-bible-cdn.youversionapi.com/8/32k/DEU/34-32d6fd8fc55581a3dde5a9003618ce3e.mp3?version_id=1","start":2.88,"end":15.94},"he":{"url":"https://mechon-mamre.org/mp3/t0534.mp3","start":3.15,"end":18.54}},"review":{"structural":"passed","editorial":"initial review; independent scholarly review pending","image":"artistic chapter illustration, explicitly labelled"}},{"id":"deuteronomy-34-3-jerichoTown","book":"דברים","chapter":34,"verse":3,"title":{"he":"יריחו — המעיין והתל","en":"Jericho: spring and mound"},"placeKey":"jerichoTown","facts":[{"type":"F","he":"יריחו הקדומה מזוהה עם תל א־סולטאן, מצפון־מערב למרכז יריחו המודרנית.","en":"Ancient Jericho is identified with Tell es-Sultan northwest of modern Jericho's centre.","source":"https://whc.unesco.org/en/list/1687/"},{"type":"F","he":"מעיין עין א־סולטאן שלצד התל סיפק מים לנווה לאורך אלפי שנים.","en":"The adjacent Ain es-Sultan spring supplied the oasis over millennia.","source":"https://whc.unesco.org/en/list/1687/"},{"type":"F","he":"באתר נחשפו מגדל, חומה ותעלה מן התקופה הנאוליתית הקדם־קרמית.","en":"The site yielded a tower, wall and ditch from the Pre-Pottery Neolithic.","source":"https://whc.unesco.org/en/list/1687/"},{"type":"F","he":"בתקופת הברונזה התיכונה נבנתה מערכת סוללות וביצורים של עיר כנענית גדולה.","en":"The Middle Bronze Age saw ramparts and fortifications of a substantial Canaanite town.","source":"https://whc.unesco.org/en/list/1687/"},{"type":"F","he":"השכבות הנאוליתיות והביצורים הכנעניים רחוקים זה מזה בזמן; אין אלה חומות מתקופה אחת.","en":"The Neolithic remains and Canaanite defences are widely separated in time, not one period's walls.","source":"https://whc.unesco.org/en/list/1687/"},{"type":"B","he":"דברים מכנה את יריחו ״עיר התמרים״; זו מסורת זיהוי של נווה, ולא תאריך לשכבת חורבן מסוימת.","en":"Deuteronomy calls Jericho the city of palms, identifying an oasis rather than dating a particular destruction layer.","source":"https://www.sefaria.org/Deuteronomy.34.3?lang=bi"}],"quote":{"he":"וְאֶת הַנֶּגֶב, וְאֶת הַכִּכָּר בִּקְעַת יְרֵחוֹ עִיר הַתְּמָרִים. עַד צֹעַר.","en":"And the south, and the plain of the valley of Jericho, the  items=ATLAS.events.filter(x=>x.book===book);position=Math.max(0,Math.min(position,items.length-1));document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.body.classList.toggle('en',lang==='en');document.title=tx('תנ״ך גיאוגרפי — ','Geographical Bible — ')+(lang==='he'?book:ATLAS.books[book]);$('heading').textContent=document.title;$('lang').textContent=lang==='he'?'EN':'עב';$('lang').setAttribute('aria-label',tx('מעבר לאנגלית','Switch to Hebrew'));$('books').setAttribute('aria-label',tx('בחירת ספר','Choose a book'));$('fullscreen').setAttribute('aria-label',tx('מסך מלא','Fullscreen'));$('events').setAttribute('aria-label',tx('בחירת אירוע','Choose an event'));$('previous').setAttribute('aria-label',tx('האירוע הקודם','Previous event'));$('next').setAttribute('aria-label',tx('האירוע הבא','Next event'));$('reportBtn').setAttribute('aria-label',tx('דוח התקדמות','Progress report'));$('bookLabel').textContent=tx('בחירת ספר','Choose a book');$('reportLabel').textContent=tx('מצב האטלס — העבודה טרם הושלמה','Atlas progress — work is incomplete');$('progressNote').textContent=tx(`בהכנה · ${ATLAS.events.length} אירועים · גרסת עבודה · האטלס טרם הושלם`,`In progress · ${ATLAS.events.length} events · work in progress · atlas incomplete`);
 $('events').replaceChildren();if(!items.length){const o=make('option','',tx('טרם הושלם','Not yet completed'));o.value='0';$('events').append(o)}items.forEach((it,i)=>{const o=make('option','',`${it.chapter}:${it.verse} · ${it.title[lang]}`);o.value=i;$('events').append(o)});
 $('bookGrid').replaceChildren();for(const [he,en] of Object.entries(ATLAS.books)){const b=make('button','',lang==='he'?he:en),n=ATLAS.events.filter(x=>x.book===he).length;b.append(make('small','',n?tx(`${n} אירועים · בהכנה`,`${n} events · in progress`):tx('טרם נכתב','Not yet written')));b.onclick=()=>changeBook(he);$('bookGrid').append(b)}renderCard();requestAnimationFrame(() =>document.documentElement.style.setProperty('--head',$('heading').parentElement.offsetHeight+10+'px'))
}
function buildPrompt(it){const name=lang==='he'?it.book:ATLAS.books[it.book],facts=it.facts.map((f,i)=>`${i+1}. ${f[lang]}`).join('\n');return lang==='he'?`אני לומד תנ״ך גיאוגרפי: ${name} ${it.chapter}:${it.verse}.\nהמקום: ${it.title.he}.\nהתקופה: ${it.era.he}.\nהרקע הגיאוגרפי:\n${facts}\nספר לי בקצרה עובדה גיאוגרפית, היסטורית או ארכאולוגית מפתיעה ומדויקת הקשורה למקום. הבחן בין ממצאים מבוססים, השערות מחקריות ומסורת מקראית. ציין מקור אמין ואפשר לי לשאול שאלות המשך.`:`I am studying the geographical Bible: ${name} ${it.chapter}:${it.verse}.\nPlace: ${it.title.en}.\nPeriod: ${it.era.en}.\nGeographical background:\n${facts}\nTell me briefly one additional surprising and accurate geographical, historical or archaeological fact about this place. Distinguish established findings, research hypotheses and biblical tradition. Cite a reliable source and allow follow-up questions. Answer in English.`}
$('books').onclick=()=>{$('bookDialog').showModal()};$('lang').onclick=()=>{stop();lang=lang==='he'?'en':'he';render()};$('events').onchange=e=>{stop();position=Number(e.target.value);renderCard();window.scrollTo(0,0)};$('previous').onclick=()=>navigate(-1);$('next').onclick=()=>navigate(1);
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{announce(tx('מסך מלא זמין גם בפתיחה מתוך האפליקציה המותקנת.','Fullscreen is also available from the installed app.'))}};
for(const b of document.querySelectorAll('[data-close]'))b.onclick=()=>$(b.dataset.close).close();
$('gpt').onclick=()=>{stop();const it=items[position];if(!it)return;$('gptPrompt').value=buildPrompt(it);$('gptHint').textContent=tx('השאלה כוללת את המקום ושש העובדות. לחזרה לאטלס השתמש בלשונית הקודמת או באפליקציות האחרונות.','The question includes the place and all six facts. Return using the previous tab or Recent Apps.');$('openGPT').textContent=tx('פתח GPT','Open GPT');$('copyGPT').textContent=tx('העתק שאלה','Copy question');$('gptDialog').showModal()};
$('openGPT').onclick=()=>{const w=window.open('https://chatgpt.com/?q='+encodeURIComponent($('gptPrompt').value),'_blank');if(!w)$('gptHint').textContent=tx('החלון נחסם. אפשר חלונות קופצים או העתק את השאלה.','The popup was blocked. Allow popups or copy the question.')};$('copyGPT').onclick=async()=>{try{await navigator.clipboard.writeText($('gptPrompt').value);$('copyGPT').textContent=tx('הועתק','Copied')}catch{$('gptPrompt').select();$('gptHint').textContent=tx('בחר העתק בתפריט המכשיר.','Choose Copy from your device menu.')}};
$('reportBtn').onclick=()=>{const r=$('reportContent');r.replaceChildren();r.append(make('p','',tx('זהו מקטע עבודה ראשון, ולא אטלס שהושלם. חמשת חומשי התורה עברו סריקת מועמדים ראשונית; התוכן טרם השלים ביקורת מחקרית מלאה. שאר התנ״ך מופּה טכנית בלבד. בדיקות מבניות אינן תחליף לביקורת מחקרית עצמאית.','This is an initial work segment, not a completed atlas. The Torah books have had an initial geographical candidate pass; the content has not completed full scholarly review. The remaining books have only been technically indexed. Structural checks do not replace independent scholarly review.')));const t=make('table'),head=make('tr');for(const label of [tx('ספר','Book'),tx('פרקים במאגר','Chapters indexed'),tx('אירועים','Events'),tx('מצב','Status')])head.append(make('th','',label));t.append(head);for(const b of ATLAS.coverage.books){const row=make('tr');for(const value of [lang==='he'?b.book:b.nameEn,b.chapters.length,b.events,tx(b.chapters.some(c=>c.scan.startsWith('initial'))?'סריקת מועמדים':'טרם נסרק',b.chapters.some(c=>c.scan.startsWith('initial'))?'Candidate pass':'Not reviewed')])row.append(make('td','',String(value)));t.append(row)}r.append(t,make('p','',tx('גורן האטד: טעון השלמה, ואינו מוצג כאירוע מאושר. רשימת ההשלמות המפורטת מופיעה בדוח שבמאגר.','Atad: incomplete and excluded from the event viewer. The detailed remaining-candidate list is included in the repository progress report.')));$('reportDialog').showModal()};
// Swipes turn events only at the corresponding scroll boundary. Long cards remain readable.
$('content').addEventListener('touchstart',e=>{if(e.touches.length!==1)return;gesture={x:e.touches[0].clientX,y:e.touches[0].clientY,top:window.scrollY<=2,bottom:innerHeight+scrollY>=document.documentElement.scrollHeight-3}},{passive:true});
$('content').addEventListener('touchend',e=>{if(!gesture)return;const dy=e.changedTouches[0].clientY-gesture.y,dx=e.changedTouches[0].clientX-gesture.x;if(Math.abs(dy)>80&&Math.abs(dy)>Math.abs(dx)*1.5){if(dy<0&&gesture.bottom)navigate(1);else if(dy>0&&gesture.top)navigate(-1)}gesture=null},{passive:true});
let wheelLocked=false;window.addEventListener('wheel',e=>{if(document.querySelector('dialog[open]')||Math.abs(e.deltaY)<35||wheelLocked)return;const end=innerHeight+scrollY>=document.documentElement.scrollHeight-3,start=scrollY<=1;if((e.deltaY>0&&end)||(e.deltaY<0&&start)){wheelLocked=true;navigate(e.deltaY>0?1:-1);setTimeout(()=>wheelLocked=false,550)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.closest('button,select,textarea,input')||document.querySelector('dialog[open]'))return;if(e.key==='PageDown'||e.key==='ArrowDown'){e.preventDefault();navigate(1)}else if(e.key==='PageUp'||e.key==='ArrowUp'){e.preventDefault();navigate(-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);render();
</script></body></html>
