name: Remove duplicate idea headings
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Save changes to tanakh.html (false = preview)'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove upper underlined idea heading (Hebrew and English)
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python tools/remove_duplicate_idea_headings.py --apply
          else
            python tools/remove_duplicate_idea_headings.py
          fi
      - name: Commit only tanakh.html
        if: ${{ inputs.apply }}
        run: |
          git add -- tanakh.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove duplicate upper idea titles in Hebrew and English"
            git push
          fi
