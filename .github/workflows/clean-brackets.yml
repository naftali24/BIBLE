name: Clean brackets from Tanakh verses
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes and commit them (false = preview only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan chapters and clean Hebrew verses
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python3 tools/clean_tanakh_brackets.py . --apply
          else
            python3 tools/clean_tanakh_brackets.py .
          fi
      - name: Commit changed chapter files
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/chapter_*/chapter.json'
          if ! git diff --cached --quiet; then
            git commit -m "Remove bracketed content from Hebrew Tanakh verses"
            git push
          else
            echo "No changes needed."
          fi
