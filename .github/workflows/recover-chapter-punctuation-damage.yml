name: Restore files damaged by punctuation generator
on:
  push:
    paths:
      - '.github/workflows/recover-chapter-punctuation-damage.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Revert only the damaging bulk change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-commit ddeaa684c20b8d1dcf1e5d0fbfb05bdfae0a0009
          python - <<'PY'
          import json, pathlib, sys
          paths=[p for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]
          errors=[]
          for p in paths:
              try: json.loads(p.read_text(encoding='utf-8-sig'))
              except Exception as e: errors.append((str(p),str(e)))
          print('Validated JSON files:',len(paths),'errors:',len(errors))
          for path,error in errors[:15]: print(path,error)
          if errors: sys.exit(1)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Restore original files after accidental punctuation bulk edit"
            git push
          fi
