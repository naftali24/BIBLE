<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת כפילות פסוק אחרון</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f1e8;margin:0;padding:20px;color:#222}
main{max-width:850px;margin:auto;background:white;padding:22px;border-radius:16px;box-shadow:0 2px 12px #0002}
h1{margin-top:0;color:#315c39} select,button{font-size:18px;padding:10px 14px;margin:5px;border-radius:9px;border:1px solid #999}
button{background:#315c39;color:white;cursor:pointer}.row{padding:10px;border-bottom:1px solid #ddd}
.bad{background:#ffe4e4;color:#8b0000}.ok{color:#267238}.small{font-size:14px;color:#666}
#status{font-weight:bold;margin:12px 0}.verse{direction:rtl;text-align:right;margin:4px 0}
.en{direction:ltr;text-align:left}
</style></head>
<body><main>
<h1>בדיקת כפילות של פסוקים אחרונים</h1>
<p>המחולל עובר על כל ספרי התנ״ך וכל הפרקים, משווה את הפסוק האחרון לפסוק שלפניו בעברית ובאנגלית, ומדווח על כפילות מלאה או כמעט מלאה.</p>
<button id="run">בדוק את כל התנ״ך</button><div class="small">אין צורך לבחור ספר — הבדיקה עוברת אוטומטית על כולם.</div>
<div id="status"></div><div id="out"></div>
<script>
const ROOT='https://raw.githubusercontent.com/naftali24/BIBLE/main/';
const BOOKS=[['בראשית',50],['שמות',40],['ויקרא',27],['במדבר',36],['דברים',34],['יהושע',24],['שופטים',21],['שמואל א',31],['שמואל ב',24],['מלכים א',22],['מלכים ב',25],['ישעיהו',66],['ירמיהו',52],['יחזקאל',48],['הושע',14],['יואל',4],['עמוס',9],['עובדיה',1],['יונה',4],['מיכה',7],['נחום',3],['חבקוק',3],['צפניה',3],['חגי',2],['זכריה',14],['מלאכי',3],['תהילים',150],['משלי',31],['איוב',42],['שיר השירים',8],['רות',4],['איכה',5],['קהלת',12],['אסתר',10],['דניאל',12],['עזרא',10],['נחמיה',13],['דברי הימים א',29],['דברי הימים ב',36]];
const out=document.getElementById('out'),status=document.getElementById('status');
const pad=n=>String(n).padStart(3,'0');
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0591-\u05C7]/g,'').replace(/[^\p{L}\p{N}]+/gu,'').toLowerCase()}
function similarity(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 1;const A=new Set(a.match(/.{1,3}/g)||[]),B=new Set(b.match(/.{1,3}/g)||[]);let hit=0;A.forEach(x=>B.has(x)&&hit++);return hit/Math.max(A.size,B.size)}
function arr(d,names){for(const n of names)if(Array.isArray(d[n]))return d[n];return []}
document.getElementById('run').onclick=async()=>{
 out.innerHTML='';let bad=0,checked=0;const total=BOOKS.reduce((n,x)=>n+x[1],0);
 for(const [book,count] of BOOKS){
 for(let ch=1;ch<=count;ch++){
  status.textContent='בודק '+book+' פרק '+ch+' מתוך '+count+' — '+checked+' / '+total+' פרקים...';
  try{
   const url=ROOT+encodeURIComponent(book)+'/chapter_'+pad(ch)+'/chapter.json?v='+Date.now();
   const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);
   const d=await r.json(),he=arr(d,['verses','hebrew','hebrew_verses']),en=arr(d,['english','english_verses','kjv','en','verses_en']);
   let issues=[];
   for(const [label,a,cls] of [['עברית',he,'verse'],['אנגלית',en,'verse en']]){
    if(a.length<2)continue;
    const prev=a[a.length-2],last=a[a.length-1],s=similarity(prev,last);
    if(norm(prev)===norm(last)||s>=.88)issues.push({label,prev,last,s});
   }
   checked++;
   if(issues.length){
    bad++;
    const box=document.createElement('div');box.className='row bad';
    box.innerHTML='<b>'+book+' — פרק '+ch+'</b>'+issues.map(x=>'<div><b>'+x.label+': חשד לכפילות</b> ('+Math.round(x.s*100)+'%)</div><div class="'+(x.label==='אנגלית'?'en':'verse')+'">לפני אחרון: '+x.prev+'</div><div class="'+(x.label==='אנגלית'?'en':'verse')+'">אחרון: '+x.last+'</div>').join('');
    out.appendChild(box);
   }
  }catch(e){const x=document.createElement('div');x.className='row bad';x.textContent=book+' פרק '+ch+': לא ניתן לבדוק — '+e.message;out.appendChild(x)}
 }
 }
 status.textContent='בדיקת כל התנ״ך הסתיימה: '+checked+' פרקים. נמצאו '+bad+' פרקים חשודים.';
 if(!bad){const x=document.createElement('div');x.className='row ok';x.textContent='לא נמצאה כפילות בפסוק האחרון.';out.appendChild(x)}
};
document.getElementById('run').click();
</script></main></body></html>
