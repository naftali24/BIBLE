<script>


// Optional, verified verse-specific meanings. Never guess a contextual meaning.
let verseSpecificMeanings={};
async function loadVerseSpecificMeanings(){
  const filename='tanakh_meanings_by_verse.json';
  const remote='https://naftali24.github.io/BIBLE/'+filename;
  const local=new URL(filename,location.href).href;
  for(const url of (location.protocol==='file:'?[remote]:[local,remote])){
    try{
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok)continue;
      const value=await res.json();
      if(!value||typeof value!=='object'||Array.isArray(value))continue;
      verseSpecificMeanings=value;
      console.info('Verse-specific meanings loaded:',Object.keys(value).length);
      return;
    }catch(e){console.warn('Verse meanings unavailable:',url,e)}
  }
}
loadVerseSpecificMeanings();
let centralHebrewDictionary={};
// Load the external dictionary from GitHub Pages even when HTML is opened via file://.
// A relative file:// fetch is blocked by Chrome's local-file security policy.
async function loadCentralHebrewDictionary(){
  const filename='tanakh_dictionary_compact.json';
  const remote='https://naftali24.github.io/BIBLE/'+filename;
  const local=new URL(filename,window.location.href).href;
  const urls=location.protocol==='file:' ? [remote] : [local,remote];
  for(const url of [...new Set(urls)]){
    try{
      const response=await fetch(url,{cache:'no-store'});
      if(!response.ok)throw new Error('HTTP '+response.status);
      const data=await response.json();
      const words=(data&&data.words&&typeof data.words==='object')?data.words:data;
      if(!words||typeof words!=='object'||Array.isArray(words))throw new Error('Invalid dictionary');
      const cleaned={};
      for(const [word,value] of Object.entries(words)){
        const meaning=typeof value==='string'?value:value?.definition;
        if(typeof meaning==='string'&&meaning.trim())cleaned[word]=meaning.trim();
      }
      if(!Object.keys(cleaned).length)throw new Error('Empty dictionary');
      centralHebrewDictionary=cleaned;
      console.info('Hebrew dictionary loaded:',Object.keys(cleaned).length,'words from',url);
      return;
    }catch(err){console.warn('Dictionary source unavailable:',url,err);}
  }
  console.warn('Hebrew dictionary unavailable. Check GitHub Pages path and filename.');
}
loadCentralHebrewDictionary();
const googleTranslationCache=new Map();

 if(language!=='en'||!loadedBook||!loadedChapter)return '';
 const word=String(el?.dataset?.word||el?.textContent||'').toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,'');
 return (chapterSynonyms.en||{})[word]||'';
}

async function googleTranslateWord(word){
  const clean=String(word||'').replace(/^[^A-Za-z']+|[^A-Za-z']+$/g,'').trim();
  if(!clean)return '—';
  const ck=clean.toLowerCase();
  if(googleTranslationCache.has(ck))return googleTranslationCache.get(ck);
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=he&dt=t&q='+encodeURIComponent(clean);
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();

  googleTranslationCache.set(ck,tr);
  return tr;
}

function questionsAreComplete(qdata){

  return qdata.paragraphs.every(p =>
    Array.isArray(p.easy) && p.easy.length===3 &&
    Array.isArray(p.medium) && p.medium.length===3 &&
    Array.isArray(p.challenge) && p.challenge.length===3

// === GitHub BIBLE direct data source ===
function githubChapterBase(book,chapter){
  return GITHUB_RAW+'/'+encodeURIComponent(book.name)+'/chapter_'+String(chapter).padStart(3,'0');
}
function githubApiImages(book,chapter){
  return GITHUB_API+'/'+encodeURIComponent(book.name)+'/chapter_'+String(chapter).padStart(3,'0')+'/images?ref=main';
}
// Request fresh GitHub content on every chapter load, bypassing browser/CDN URL caches.
// This does not bypass GitHub Pages deployment time, but chapter data comes from raw GitHub.
function freshGithubUrl(url){
  const separator=url.includes('?')?'&':'?';
  return url+separator+'_fresh='+Date.now()+'_'+Math.random().toString(36).slice(2);
}
async function githubJSON(url,optional=false){
  const r=await fetch(freshGithubUrl(url),{cache:'no-store'});
  if(!r.ok){ if(optional) return null; throw new Error('GitHub HTTP '+r.status+' — '+url); }
  return await r.json();
}
// Supports both chapter-local synonyms.json and book_chapter_synonyms.json.
async function loadChapterSynonyms(book,chapter,base){
  const names=[
    base+'/synonyms.json',
    base+'/'+book.id+'_'+chapter+'_synonyms.json',
    base+'/'+book.id+'_'+String(chapter).padStart(3,'0')+'_synonyms.json',
    GITHUB_RAW+'/'+encodeURIComponent(book.name)+'/'+book.id+'_'+chapter+'_synonyms.json'
  ];
  for(const url of names){
    try{const result=await githubJSON(url,true);if(result)return result;}catch(e){console.warn('Synonyms:',url,e);}
  }
  return null;
}
async function githubText(url,optional=false){
  const r=await fetch(freshGithubUrl(url),{cache:'no-store'});
  if(!r.ok){ if(optional) return ''; throw new Error('GitHub HTTP '+r.status+' — '+url); }
  return (await r.text()).trim();
}

// Word data (Hebrew, timings and translations) comes from readalong_words.json in Google Drive.
// Only the Hebrew MP3 streams directly from Firebase. No ReadAlong word database is embedded in this HTML.
/* TEMPORARY HEBREW SOURCE:
   Hebrew text/audio/timings currently still use Tanakh Read Along.
   Keep isolated here until replaced by a source with verified redistribution rights.
   Do not package/cache/re-publish its MP3/JSON as app assets. */
const READALONG_STORAGE='https://firebasestorage.googleapis.com/v0/b/tanakh-read-along.appspot.com/o/';
const READALONG_PREFIX={
 genesis:'01',exodus:'02',leviticus:'03',numbers:'04',deuteronomy:'05',joshua:'06',judges:'07',
 samuel1:'08a',samuel2:'08b',kings1:'09a',kings2:'09b',isaiah:'10',jeremiah:'11',ezekiel:'12',hosea:'13',joel:'14',amos:'15',obadiah:'16',jonah:'17',micah:'18',nahum:'19',habakkuk:'20',zephaniah:'21',haggai:'22',zechariah:'23',malachi:'24',
 chronicles1:'25a',chronicles2:'25b',psalms:'26',job:'27',proverbs:'28',ruth:'29',songofsongs:'30',ecclesiastes:'31',lamentations:'32',esther:'33',daniel:'34',ezra:'35a',nehemiah:'35b'
};
function readAlongAudioCode(book,chapter){
  const prefix=READALONG_PREFIX[book.id];
  if(!prefix) return '';
  return 't'+prefix+String(chapter).padStart(2,'0');
}
// Verified working form used by the earlier Genesis/Exodus version: JSON and MP3 are root Storage objects.
function readAlongURL(code,ext){return READALONG_STORAGE+encodeURIComponent(code+'.'+ext)+'?alt=media'}
async function applyReadAlongHebrew(book,chapter,ra=null){
  try{
    const base=githubChapterBase(book,chapter);
    if(!ra) ra=await githubJSON(base+'/readalong_words.json',true);
    if(!ra) return false;
    const words=Array.isArray(ra.words)?ra.words:[];
    if(!words.length) return false;

    const verses=[],times=[],wordVerses=[];
    let textBuf=[],wordBuf=[],verseStart=null;
    for(const w of words){
      const h=String(w?.hebrew ?? w?.h ?? '').trim();
      if(!h) continue;
      const pos=Number(w?.position);
      if(pos===0 && textBuf.length){
        verses.push(textBuf.join(' ')); times.push(verseStart??0); wordVerses.push(wordBuf);
        textBuf=[];wordBuf=[];verseStart=null;
      }
      const st=Number(w?.start ?? w?.s), en=Number(w?.end ?? w?.e);
      if(verseStart===null && Number.isFinite(st)) verseStart=st;
      textBuf.push(h);
      wordBuf.push({h,s:Number.isFinite(st)?st:0,e:Number.isFinite(en)?en:(Number.isFinite(st)?st:0),tr:''});
      if(h.includes('׃')){
        verses.push(textBuf.join(' ')); times.push(verseStart??0); wordVerses.push(wordBuf);
        textBuf=[];wordBuf=[];verseStart=null;
      }
    }
    if(textBuf.length){verses.push(textBuf.join(' '));times.push(verseStart??0);wordVerses.push(wordBuf)}
    if(!verses.length) return false;

    // Preserve Hebrew verses already stored in chapter.json; ReadAlong supplies timing/karaoke.
    if(!Array.isArray(data.verses)||!data.verses.length) data.verses=verses;
    if(!Array.isArray(data.hebrew)||!data.hebrew.length) data.hebrew=data.verses;
    data.times=times; data.times_he=times; data.readalong_word_verses=wordVerses;

    const sideAudio=await githubText(base+'/audio_url.txt',true);
    const code=String(ra.audio_code||readAlongAudioCode(book,chapter)||'').trim();
    data.audio_code=code; data.audio_start_offset=(book.id==='numbers' && chapter===17) ? (Number.isFinite(Number(ra.timings_offset_applied)) ? Number(ra.timings_offset_applied) : 3) : 0;
    // Numbers: use the same Mechon-Mamre recordings as the working Ideas app.
    // Other books retain their existing recording source.
    const mmCode='t04'+String(chapter).padStart(2,'0');
    data.audio_he_url=(book.id==='numbers')
      ? 'https://mechon-mamre.org/mp3/'+mmCode+'.mp3'
      : (sideAudio || (code?readAlongURL(code,'mp3'):''));
    data.audio_url=data.audio_he_url;
    console.log('GitHub ReadAlong loaded:',book.name,chapter,verses.length,'verses');
    return true;
  }catch(e){
    console.warn('GitHub ReadAlong unavailable',e);
    return false;
  }
}

function cleanHebrewVerseEnd(s){
  return String(s||'')
    .replace(/(?:&nbsp;|\s)*(?:\{?\s*פ\s*\}?|[:׃]\s*פ)(?:&nbsp;|\s)*$/u,'')
    .trim();
}

function plainHebrewTranslation(s){
  return String(s||'')
    .normalize('NFD')
    .replace(/[\u0591-\u05BD\u05BF-\u05C7]/g,'')
    .replace(/\u05BE/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}


async function loadChapter(n,book=currentBook,returnVerse=null){
  if(!n)return;
  postReloadVerse=null;
  let savedVerse=0;
  try{savedVerse=Number(localStorage.getItem('naftali_verse_'+book.id+'_'+n))||0}catch(e){}
  lastReadingVerse=Number.isInteger(returnVerse)?returnVerse:Math.max(0,savedVerse);
  reloadPinnedVerse=null;
  reloadScrollTarget=null;
  closeDidYouKnow();activeDidYouKnow=null;didYouKnowBtn.classList.remove('available');
  quizOpen=false;quizBox.classList.remove('open');updateQuizMainButton();
  startChapterLoadTicker();currentBook=book||currentBook;
  stopTTS();stopAudio();startLoadProgress(currentBook,n);
  statusEl.textContent='טוען '+currentBook.name+' '+n+' מ-GitHub...';
  const requestedBook=currentBook;
  const base=githubChapterBase(requestedBook,n);
  try{
    setImageLoading(true); images={};current=n;sel.value=n;

    // All static chapter files load directly from GitHub, in parallel.
    const [chapterRes,readalongRes,qHeRes,qEnRes,dykHeRes,dykEnRes,synonymRes]=await Promise.all([
      githubJSON(base+'/chapter.json'),
      githubJSON(base+'/readalong_words.json',true),
      githubJSON(base+'/questions.json',true),
      githubJSON(base+'/questions_en.json',true),
      githubJSON(base+'/did_you_know.json',true),
      githubJSON(base+'/did_you_know_en.json',true),
      loadChapterSynonyms(requestedBook,n,base)
    ]);
    data=chapterRes||{}; current=n;sel.value=n;
    // Each chapter reads its own synonyms.json from the same GitHub directory as chapter.json.
    // Accept both {he:{},en:{}} and {hebrew:{},english:{}}.
    chapterSynonyms={he:synonymRes?.he||synonymRes?.hebrew||synonymRes?.synonyms?.he||{},en:synonymRes?.en||synonymRes?.english||synonymRes?.synonyms?.en||{}};
    questionsHe=qHeRes||null;questionsEn=qEnRes||null;

    // Keep BOTH Did-you-know languages; choose the correct one dynamically.
    const unpackDyk=(x)=>{
      if(!x)return [];
      if(Array.isArray(x))return x;
      if(Array.isArray(x.did_you_know))return x.did_you_know;
      if(Array.isArray(x.facts))return x.facts;
      return [];
    };
    data.did_you_know_he=unpackDyk(dykHeRes);
    data.did_you_know_en=unpackDyk(dykEnRes);
    data.did_you_know=(language==='en'?data.did_you_know_en:data.did_you_know_he);

    // Hebrew karaoke/timing comes from the GitHub readalong file.
    await applyReadAlongHebrew(requestedBook,n,readalongRes);

    // KJV English text, audio and verse timings are stored in chapter.json.
    // Keep audio_en_url exactly as generated by the KJV updater.

    lockedVerse=-1;stopAtTime=null;hebrewOverlay=false;englishOverlay=false;
    data.questions=language==='en'?questionsEn:questionsHe;
    data.questionsData=data.questions;

    // Start image directory lookup immediately; render text without waiting for it.
    const imagePromise=loadImagesInBackground(base,n,requestedBook);
    render();
    loadedBook=requestedBook;loadedChapter=n;
    saveReadingForPageRefresh();
    lastReadingVerse=Math.min(lastReadingVerse,Math.max(0,verseCards.length-1));
    if(Number.isInteger(returnVerse)){
      const target=Math.min(returnVerse,Math.max(0,verseCards.length-1));
      postReloadVerse={bookId:requestedBook.id,chapter:n,verse:target};
      reloadScrollTarget=target;
      restoreReloadVerse(target);
    }
    updateReturnVerseButton();

    bookTitle.textContent=language==='en'?(requestedBook.nameEn||requestedBook.name):('ספר '+requestedBook.name);
    chapterCounter.textContent=n+'/'+requestedBook.chapters;
    chapterMenuBtn.innerHTML='<span class="iconWithLabel"><span class="menuIcon" aria-hidden="true">🦉</span><span class="iconLabel">תפריט</span></span>';
    markChapterMenu(n);
    document.body.classList.remove('introMode');
    imageSection.classList.remove('hidden');
    finishLoadProgress(true);
    statusEl.textContent=requestedBook.name+' '+n+' • GitHub';
    await imagePromise;
    if(Number.isInteger(returnVerse)&&current===n&&loadedBook?.id===requestedBook.id)restoreReloadVerse(Math.min(returnVerse,Math.max(0,verseCards.length-1)));
    updateReturnVerseButton();
  }catch(e){
    console.error(e);statusEl.textContent='שגיאה';finishLoadProgress(false);
    alert('שגיאה בטעינת '+requestedBook.name+' '+n+' מ-GitHub:\n'+e.message);
  }
}

const IDEA_COLORS=['#ff4b4b','#38bdf8','#4ade80','#f59e0b','#c084fc','#fb7185','#2dd4bf','#facc15','#60a5fa','#f97316','#a3e635','#e879f9'];

function ideaTitleForVerse(v){
  const ix=ideaForVerse(v);
  const idea=(data?.ideas||[])[ix];
  return displayIdeaTitle(idea);

function displayIdeaTitle(idea){
  if(!idea)return '';
  if(language!=='en')return cleanText(idea.title||idea.idea||idea.name||'');
  const explicit=idea.title_en||idea.english_title||idea.titleEnglish||idea.idea_en||idea.name_en||idea.summary_en||idea.english_summary;
  if(explicit)return cleanText(explicit);
  const prompt=cleanText(idea.image_prompt||idea.imagePrompt||'');
  if(prompt){const first=prompt.split(/[,.!?;]/)[0].trim();if(first)return first;}
  return cleanText(idea.title||idea.idea||idea.name||'');
}
function normalizeQuestion(q){
  if(!q) return null;
  const text=cleanText(q.question||q.q||q.text||'');
  let answers=q.answers||q.options||q.choices||[];
  if(!Array.isArray(answers) && answers && typeof answers==='object') answers=Object.values(answers);
  answers=(answers||[]).map(x=>typeof x==='string'?x:(x?.text||x?.answer||'')).filter(Boolean);
  let correct=q.correct;
  if(correct===undefined) correct=q.correct_index;
  if(correct===undefined) correct=q.answer;
  if(typeof correct==='string'){
    const n=answers.findIndex(a=>cleanText(a)===cleanText(correct));
    correct=n>=0?n:Number(correct);
  }
  correct=Number(correct);
  if(Number.isFinite(correct) && correct>=1 && correct<=answers.length && !answers[correct]) correct-=1;
  if(!Number.isFinite(correct) || correct<0 || correct>=answers.length) correct=0;
  const explanation=cleanText(q.explanation||q.explain||q.reason||'');
  return text&&answers.length?{question:text,answers,correct,explanation}:null;
}
function questionsForIdea(ix,level=quizLevel){
  const idea=(data?.ideas||[])[ix]||{};
  const sv=Number(idea.start_verse??idea.startVerse??0);
  const ev=Number(idea.end_verse??idea.endVerse??sv);

  function matchedParagraph(root){
    if(!root || !Array.isArray(root.paragraphs)) return null;
    let p=root.paragraphs.find(x=>{
      const a=Number(x.start_verse??x.startVerse??0);
      const b=Number(x.end_verse??x.endVerse??a);
      return sv>0 && a>0 && sv>=a && sv<=b;
    });
    if(!p) p=root.paragraphs.find(x=>{
      const a=Number(x.start_verse??x.startVerse??0);
      const b=Number(x.end_verse??x.endVerse??a);
      return sv>0 && ev>0 && a>0 && b>0 && Math.max(sv,a)<=Math.min(ev,b);
    });
    return p;
  }

  let p=matchedParagraph(data?.questions)||matchedParagraph(data?.questionsData);
  let q=[];

  if(p){
    if(level==='easy') q=p.easy||[];
    else if(level==='medium') q=p.medium||[];
    else q=p.challenge||p.questions||[];
  }

  // Old files: challenge remains compatible with the old "questions" array.
  if(!q.length && level==='challenge') q=idea.challenge||idea.questions||idea.quiz||[];
  if(!q.length && level==='medium') q=idea.medium||[];
  if(!q.length && level==='easy') q=idea.easy||[];

  return (Array.isArray(q)?q:[]).map(normalizeQuestion).filter(Boolean);
}

function shuffledQuestion(q){
  const items=(q.answers||[]).map((text,i)=>({text,correct:i===q.correct}));
  for(let i=items.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [items[i],items[j]]=[items[j],items[i]];
  }
  return {
    ...q,
    answers:items.map(x=>x.text),
    correct:items.findIndex(x=>x.correct)
  };
}

function renderQuiz(){
  updateQuizLanguageLabels();
  if(!quizOpen || quizIdea<0){quizBox.classList.remove('open');return}

  quizEasy.classList.toggle('active',quizLevel==='easy');
  quizMedium.classList.toggle('active',quizLevel==='medium');
  quizChallenge.classList.toggle('active',quizLevel==='challenge');

  const qs=questionsForIdea(quizIdea,quizLevel);
  if(!qs.length){
    quizMeta.textContent=quizLevel==='easy'?'רמה קלה':(quizLevel==='medium'?'רמה בינונית':'רמת אתגר');
    quizQuestion.textContent=language==='en'
      ? 'English questions file was not returned by the server'
      : 'אין שאלות ברמה זו לנושא זה';
    quizAnswers.innerHTML='';
    quizExplanation.textContent='';
    quizExplanation.style.display='none';
    quizNext.style.display='none';
    quizBox.classList.add('open');
    return;
  }

  quizIndex=Math.max(0,Math.min(quizIndex,qs.length-1));
  const q=shuffledQuestion(qs[quizIndex]);
  quizMeta.textContent=language==='en'
    ? ((quizLevel==='easy'?'Easy':(quizLevel==='medium'?'Medium':'Challenge'))+' • Question '+(quizIndex+1)+' of '+qs.length)
    : ((quizLevel==='easy'?'קל':(quizLevel==='medium'?'בינוני':'אתגר'))+' • שאלה '+(quizIndex+1)+' מתוך '+qs.length);
  quizQuestion.textContent=q.question;
  quizBox.dir=language==='en'?'ltr':'rtl';
  quizQuestion.style.textAlign=language==='en'?'left':'right';
  quizAnswers.innerHTML='';
  quizExplanation.textContent='';
  quizExplanation.style.display='none';

  q.answers.forEach((answer,j)=>{
    const btn=document.createElement('button');
    btn.className='quizAnswer';
    btn.textContent=answer;
    btn.onclick=(ev)=>{
      ev.stopPropagation();
      [...quizAnswers.children].forEach(x=>x.disabled=true);
      if(j===q.correct) btn.classList.add('correct');
      else{
        btn.classList.add('wrong');
        quizAnswers.children[q.correct]?.classList.add('correct');
      }
      if(q.explanation){
        quizExplanation.textContent=q.explanation;
        quizExplanation.style.display='block';
      }else{
        quizExplanation.textContent='';
        quizExplanation.style.display='none';
      }
      quizNext.style.display=quizIndex<qs.length-1?'inline-block':'none';
    };
    quizAnswers.appendChild(btn);
  });

  quizNext.style.display='none';
  quizBox.classList.add('open');
}

function stripHebrewTrope(text){
  // Remove Hebrew cantillation marks (te'amim), keep niqqud.
  return String(text??'').normalize('NFD').replace(/[\u0591-\u05AF]/g,'').normalize('NFC');
}

function cleanText(s){
  let x=String(s??"");
  const ta=document.createElement("textarea");
  for(let k=0;k<3;k++){
    ta.innerHTML=x;
    const y=ta.value;
    if(y===x) break;
    x=y;
  }
  return x
    .replace(/&(?:nbsp|thinsp|ensp|emsp|#160|#8201);?/gi,' ')
    .replace(/[\u00a0\u2009\u2002\u2003]/g,' ')
    .replace(/\s{2,}/g,' ')
    .trim();
}

// Remove Hebrew paragraph markers ס / פ only when they appear after a colon.
// Examples: ": ס", ": {ס}", ": פ", ": {פ}".
function cleanHebrewVerseDisplay(text){
  return String(text ?? '')
    .replace(/:\s*(?:\{\s*)?[ספ](?:\s*\})?(?=\s|$)/g, ':')
    .replace(/:\s*[\u00a0\s]+/g, ': ')
    .trim();
}

function esc(s){return cleanText(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}


function cleanBibleDisplayText(x){
  x=String(x??"");

  // Decode HTML entities repeatedly (some Sefaria strings arrive double encoded).
  const ta=document.createElement("textarea");
  for(let k=0;k<3;k++){
    ta.innerHTML=x;
    const y=ta.value;
    if(y===x) break;
    x=y;
  }

  // Remove tags, paragraph markers and entity leftovers.
  x=x.replace(/<[^>]*>/g," ");
  x=x.replace(/\{[פס]\}/g," ");
  x=x.replace(/&(?:nbsp|thinsp|ensp|emsp|rlm|lrm|#160|#8201);?/gi," ");
  x=x.replace(/(?:nbsp|thinsp)\s*;?/gi," ");

  // Hebrew verses must never contain Latin/English material.
  x=x.replace(/[A-Za-z]+/g," ");

  // Normalize special spaces.
  x=x.replace(/[\u00a0\u2009\u2002\u2003\u200e\u200f]/g," ");
  return x.replace(/\s+/g," ").trim();
}

  u.volume=1;
  u.lang='en-US'; u.rate=Number(speedSel.value||1);
  u.onend=u.onerror=()=>stopEnglishTTS();
  speechSynthesis.speak(u);
}

function activateEnglishVerseFromElement(el){
  const card=el?.closest?.('.card');
  if(!card)return -1;
  const vi=verseCards.indexOf(card);
  if(vi>=0){
    rememberReadingVerse(vi);
    setActive(vi,false);       // highlight verse + switch image to its idea
    syncOtherLanguageToVerse(vi);
  }
  return vi;
}

function cleanTranslationMarks(value){
 return String(value||'').normalize('NFD')
  .replace(/[\u0591-\u05BD\u05BF-\u05C7]/g,'')
  .replace(/[\u064B-\u065F\u0670]/g,'')
  .replace(/[.,;:!?״׳“”‘’\u05BE\u2013\u2014]/g,'')
  .replace(/\s+/g,' ').trim();
}
function scrollCardToTop(el){
  const card=el?.closest?.('.card');if(!card)return;
  const main=document.getElementById('main');
  if(main)main.scrollTo({top:Math.max(0,card.offsetTop-108),behavior:'smooth'});
}

document.addEventListener('click', async function(ev){
  const w = ev.target.closest && ev.target.closest('.karaokeWord,.englishWord');
  if(!w) return;

  ev.preventDefault();
  ev.stopPropagation();

  if(language==='en' && w.classList.contains('englishWord')){
    if(selectedEnglishWordEl && selectedEnglishWordEl!==w) selectedEnglishWordEl.classList.remove('wordSelected');
    selectedEnglishWordEl=w;
    w.classList.add('wordSelected');
    const simpleEnglish=englishSynonymFor(w);
    if(simpleEnglish)showSynonymBubble(w,simpleEnglish);
    activateEnglishVerseFromElement(w);
    scrollCardToTop(w);
    const trBox=document.getElementById('wordTranslation');
    if(trBox){trBox.textContent='מתרגם…';trBox.classList.add('show');}
    // Speak only the tapped English word using TTS, not the recorded verse audio.
    speakEnglishTTS(w.dataset.word||w.textContent,w);
    try{
      const tr=await googleTranslateWord(w.dataset.word||w.textContent);
      if(trBox)trBox.textContent=cleanTranslationMarks(tr);
    }catch(err){
      if(trBox)trBox.textContent='שגיאת תרגום';
    }
    return;
  }

  if(language==='he'){
    const synonym=hebrewSynonymFor(w);
    showSynonymBubble(w,synonym || "פירוש עדיין לא הוזן למילון");
    showAdditionalMeaningsOnImage(w);
    const card=w.closest('.card');
    const vi=verseCards.indexOf(card);
    if(vi>=0){ rememberReadingVerse(vi);setActive(vi,false); syncOtherLanguageToVerse(vi); }
    scrollCardToTop(w);

    // Keep the manually selected Hebrew word marked until another word is selected.
    if(selectedHebrewWordEl && selectedHebrewWordEl!==w){
      selectedHebrewWordEl.classList.remove('wordSelected');
    }
    selectedHebrewWordEl=w;
    w.classList.add('wordSelected');
  }

  const s = Number(w.dataset.s);
  const e = Number(w.dataset.e);
  const trBox=document.getElementById('wordTranslation');
  if(trBox){
    const oldTr=(w.dataset.tr||'').trim();
    trBox.textContent=cleanTranslationMarks(oldTr) || 'מתרגם…';
    trBox.classList.add('show');
    // Hebrew -> English: use existing stored translation when present,
    // otherwise translate the clicked Hebrew word with Google Translate.
    if(!oldTr && language==='he'){
      const requestedWord=w.dataset.word||w.textContent;
      googleTranslateHebrewWordKeepOld(requestedWord).then(tr=>{
        if(selectedHebrewWordEl===w && trBox)trBox.textContent=cleanTranslationMarks(tr)||'—';
      }).catch(()=>{
        if(selectedHebrewWordEl===w && trBox)trBox.textContent='שגיאת תרגום';
      });
    }
  }
  // Hebrew word tap: play only this word from the recorded chapter,
  // using its karaoke start/end tags. English word taps use TTS above.
  if(language==='he'){
    if(!w.classList.contains('karaokeWord'))return;
    const start=Number(w.dataset.s),end=Number(w.dataset.e);
    if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start)return;
    absoluteSeekSerial++;
    try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(err){}
    sequenceMode=false;sequenceStartTarget=null;sequenceFloorTime=null;
    lockedVerse=-1;stopAtTime=null;
    if(verseButtonEl){verseButtonEl.classList.remove('playing');verseButtonEl.textContent='🔊';verseButtonEl=null;}
    verseButtonStopAt=null;
    clearClickedWordMode();
    clickedWordEl=w;
    clickedWordStopAt=end;
    document.querySelectorAll('.karaokeWord.karaokeActive').forEach(x=>x.classList.remove('karaokeActive'));
    w.classList.add('karaokeActive');
    const target=Math.max(0,start+activeAudioOffset());
    const startPlayback=()=>{
      if(clickedWordEl!==w)return;
      try{audio.pause();audio.currentTime=target;}catch(err){}
      const promise=audio.play();
      if(promise?.catch)promise.catch(err=>{if(clickedWordEl===w){clearClickedWordMode();w.classList.remove('karaokeActive');}console.warn('Hebrew word audio:',err);});
    };
    if(audio.readyState>=1)startPlayback();
    else audio.addEventListener('loadedmetadata',startPlayback,{once:true});
    return;
  }
  if(!Number.isFinite(s) || !Number.isFinite(e) || e <= s) return;

  // Invalidate any pending seek callback from sequence/verse playback.
  absoluteSeekSerial++;
  // Stop anything else, then jump exactly to the selected word.
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(err) {}
  sequenceMode=false;sequenceStartTarget=null;sequenceFloorTime=null;
  lockedVerse = -1;
  clearClickedWordMode();
  // The final word can end beyond the actual MP3 duration. Clamp its stop.
  clickedWordStopAt = Number.isFinite(audio.duration) && audio.duration>0
    ? Math.min(e,Math.max(s+0.05,audio.duration-activeAudioOffset())) : e;
  clickedWordEl = w;

  document.querySelectorAll('.karaokeWord.karaokeActive')
    .forEach(x=>x.classList.remove('karaokeActive'));
  w.classList.add('karaokeActive');

  const mediaTime = s + (Number(data?.audio_start_offset)||0);
  // Re-seek reliably even when the previous word reached the end of the MP3.
  // Avoid swallowing a failed seek and leaving the player stuck in ended state.
  const startWord=()=>{
    if(clickedWordEl!==w)return;
    try{audio.pause();audio.currentTime=Math.max(0,mediaTime);}catch(err){}
    const p=audio.play();
    if(p&&p.catch)p.catch(err=>{
      if(clickedWordEl===w){clearClickedWordMode();w.classList.remove('karaokeActive');}
      console.warn('Word playback failed:',err);
    });
  };
  if(audio.readyState>=1)startWord();
  else audio.addEventListener('loadedmetadata',startWord,{once:true});
}, true);

audio.addEventListener('timeupdate', function(){
  if(clickedWordStopAt == null) return;
  const ct = chapterTimeFromAudio();
  if(ct >= clickedWordStopAt - 0.015){
    audio.pause();
    if(clickedWordEl) clickedWordEl.classList.remove('karaokeActive');
    clearClickedWordMode();
  }
}, true);

audio.addEventListener('ended',()=>{
  if(clickedWordEl)clickedWordEl.classList.remove('karaokeActive');
  clearClickedWordMode();
});


let verseButtonStopAt = null;
let verseButtonEl = null;

function stopVerseButtonPlayback(){
  verseButtonStopAt = null;
  if(verseButtonEl){
    verseButtonEl.classList.remove('playing');
    verseButtonEl.textContent='🔊';
  }
  verseButtonEl = null;
  try { audio.pause(); } catch(e) {}
  document.querySelectorAll('.karaokeWord.karaokeActive')
    .forEach(x=>x.classList.remove('karaokeActive'));
}

document.addEventListener('click', async function(ev){
  const b=ev.target.closest && ev.target.closest('.verseAudioBtn');
  if(!b) return;
  ev.preventDefault();
  ev.stopPropagation();

  if(language==='en'){
    if(b.classList.contains('missingEnglishAudio')){
      const missing=[];
      if(!(data?.audio_en_url||data?.english_audio_url))missing.push('audio_en_url');
      if(!Array.isArray(data?.times_en))missing.push('times_en');
      else if(!Number.isFinite(englishTimingStart(Number(b.dataset.vi))))missing.push('valid verse timing');
      alert('English audio is not ready for this chapter. Missing: '+missing.join(', ')+'. Check chapter.json on GitHub.');
      return;
    }
    const vi=Number(b.dataset.vi);
    if(!Number.isFinite(vi)) return;
    if(verseButtonEl===b && !audio.paused){
      stopVerseButtonPlayback();
      return;
    }
    try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
    if(verseButtonEl && verseButtonEl!==b){
      verseButtonEl.classList.remove('playing');
      verseButtonEl.textContent='🔊';
    }
    const st=englishTimingStart(vi);
    let en=englishTimingEnd(vi);
    if(!Number.isFinite(st)) return;
    const src=isNum17English()?(vi<15?NUM17_EN16:NUM17_EN17):(data?.audio_en_url||data?.english_audio_url||'');
    if(!src) return;
    if(audio.src!==src){ audio.src=src; audio.load(); }
    audio.playbackRate=Number(speedSel.value||1);
    rememberReadingVerse(vi);
    setActive(vi,false);
    syncOtherLanguageToVerse(vi);
    scrollCardToTop(b);
    lockedVerse=vi;
    stopAtTime=Number.isFinite(en)?en:null;
    verseButtonEl=b;
    b.classList.add('playing');
    b.textContent='■';
    if(isNum17English())num17PlayVerse(vi);else seekAndPlayAbsolute(st);
    return;
  }

  // Hebrew verse audio: highlight and scroll the selected verse to the top.
  if(language==='he'){
    const vi=Number(b.dataset.vi);
    if(Number.isFinite(vi)){
      rememberReadingVerse(vi);
      setActive(vi,false);
      syncOtherLanguageToVerse(vi);
      scrollCardToTop(b);
    }
  }

  // Hebrew verse audio: highlight and scroll the verse as well.
  if(language==='he'){
    const vi=Number(b.dataset.vi);
    if(Number.isFinite(vi)){
      rememberReadingVerse(vi);
      setActive(vi,false);
      syncOtherLanguageToVerse(vi);
      scrollCardToTop(b);
    }
  }

  // Same button while playing = stop.
  if(verseButtonEl===b && !audio.paused){
    stopVerseButtonPlayback();
    return;
  }

  // Stop single-word mode and any previous verse-button mode.
  if(typeof clearClickedWordMode==='function') clearClickedWordMode();
  if(verseButtonEl && verseButtonEl!==b){
    verseButtonEl.classList.remove('playing');
    verseButtonEl.textContent='🔊';
  }

  const vi=Number(b.dataset.vi);
  if(Number.isInteger(vi))rememberReadingVerse(vi);
  const v=(language==='en' ? null : data?.readalong_word_verses?.[vi]);
  if(!Array.isArray(v)||!v.length)return;
  let s=Number(v[0].s), e=Number(v[v.length-1].e);

  if(!Number.isFinite(s)||!Number.isFinite(e))return;

  sequenceMode=false;sequenceStartTarget=null;sequenceFloorTime=null;
  lockedVerse=-1;
  absoluteSeekSerial++;
  verseButtonStopAt=e;
  verseButtonEl=b;
  b.classList.add('playing');
  b.textContent='⏹';

  try{audio.pause();}catch(err){}
  try{audio.currentTime=Math.max(0,s+(Number(data?.audio_start_offset)||0));}catch(err){}
  try{
    const p=audio.play();
    if(p&&p.catch)await p.catch(()=>{});
  }catch(err){}
},true);

audio.addEventListener('timeupdate',function(){
  if(verseButtonStopAt==null)return;
  const ct=chapterTimeFromAudio();
  if(ct>=verseButtonStopAt-0.015){
    stopVerseButtonPlayback();
  }
},true);

audio.addEventListener('ended',function(){
  if(verseButtonStopAt!=null) stopVerseButtonPlayback();
});


// Recover the open chapter and show its return button after a full browser refresh.
setTimeout(()=>{
  try{
    const saved=JSON.parse(sessionStorage.getItem(RETURN_SESSION_KEY)||'null');
    const book=BOOKS.find(b=>b.id===saved?.bookId);
    if(!book||!Number.isInteger(saved.chapter)||saved.chapter<1||saved.chapter>book.chapters)return;
    language=saved.lang==='en'?'en':'he';
    loadChapter(saved.chapter,book,Number.isInteger(saved.verse)?saved.verse:0);
  }catch(e){}
},0);

// Full screen: activated by the first tap/click (required by Android/Chrome).
(function(){
  let entered=false;
  async function goFullScreen(){
    if(entered || document.fullscreenElement) return;
    try{
      const el=document.documentElement;
      if(el.requestFullscreen){
        try{ await el.requestFullscreen({navigationUI:'hide'}); }
        catch(e){ await el.requestFullscreen(); }
        entered=true;
      }else if(el.webkitRequestFullscreen){
        el.webkitRequestFullscreen();
        entered=true;
      }
    }catch(e){}
  }
  document.addEventListener('pointerdown',goFullScreen,{once:true,capture:true});
  document.addEventListener('touchstart',goFullScreen,{once:true,capture:true,passive:true});
  document.addEventListener('click',goFullScreen,{once:true,capture:true});
  window.addEventListener('orientationchange',()=>{entered=!!document.fullscreenElement;});
  document.addEventListener('fullscreenchange',()=>{entered=!!document.fullscreenElement;});
})();
</script>

/* Playback fix: removed legacy LRC auto-seek on loadedmetadata/play.
