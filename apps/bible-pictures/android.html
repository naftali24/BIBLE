const $=id=>document.getElementById(id);const bookSelect=$('book');

function updateLanguage(){if(document.getElementById('startupHint'))$('startupHint').textContent=language==='he'?'אפשרות לגלגול למטה ולמעלה':'Swipe or scroll up and down';document.documentElement.lang=language;document.documentElement.dir=language==='he'?'rtl':'ltr';$('lang').textContent=language==='he'?'🇮🇱':'🇬🇧';$('heading').textContent=language==='he'?'🎬 תמונות התנ״ך':'🎬 Bible Picture Show';$('reload').title=language==='he'?'התחל מחדש':'Restart';$('manualHint').textContent=language==='he'?'גלגול ידני למטה ולמעלה':'Manual scrolling up and down';bookSelect.innerHTML=BOOK_INFO.map(b=>`<option value="${b.id}">${language==='he'?b.name:b.nameEn}</option>`).join('');bookSelect.value=bookSelect.dataset.current||'genesis';renderBooksPanel();updateTopics();requestAnimationFrame(fitLayout)}
let TOPIC_RANGES={};
async function loadTopicRanges(){
 const data=await json(RAW+'presentation_topics.json');
 if(!Array.isArray(data.topics))throw Error('Invalid presentation_topics.json');
 const grouped={};
 for(const t of data.topics){
  const book=BOOK_INFO.find(b=>b.name===t.book);
  if(!book)continue;
  const first=Number(t.start?.chapter),last=Number(t.end?.chapter);
  if(!Number.isInteger(first)||!Number.isInteger(last)||first<1||last>book.chapters||first>last)continue;
  (grouped[book.id]??=[]).push([first,last,t.title_he||'',t.title_en||t.title_he||'']);
 }
 TOPIC_RANGES=grouped;
 updateTopics();
 return Object.values(grouped).reduce((sum,list)=>sum+list.length,0);
}
function renderBooksPanel(){
 const panel=$('booksPanel'),list=$('booksList');if(!panel||!list)return;
 panel.dir=language==='he'?'rtl':'ltr';$('booksPanelTitle').textContent=language==='he'?'בחר ספר':'Choose a book';
 $('bookOpen').textContent='🦉';
 list.replaceChildren();
 const grid=document.createElement('div');grid.className='bookGrid';
 BOOK_INFO.forEach((b,i)=>{const btn=document.createElement('button');btn.className='bookTile '+(i<5?'torah':i<26?'prophets':'writings');btn.textContent=language==='he'?b.name:b.nameEn;
 btn.onclick=()=>{bookSelect.value=b.id;panel.hidden=true;loadBook()};grid.appendChild(btn)});
 list.appendChild(grid);
}
function topicFor(chapter){const book=bookSelect.value;const named=(TOPIC_RANGES[book]||[]).find(r=>chapter>=r[0]&&chapter<=r[1]);if(named)return {key:String(named[0]),label:language==='he'?named[2]:named[3]};return {key:'unassigned-'+chapter,label:language==='he'?`פרק ${chapter}`:`Chapter ${chapter}`}}
function updateTopics(){const old=$('ideas');old.innerHTML='';old.dir=language==='he'?'rtl':'ltr';old.style.textAlign=language==='he'?'right':'left';const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent=language==='he'?'בחר נושא ורעיון':'Choose topic and idea';old.appendChild(placeholder);const groups=new Map();entries.forEach((e,i)=>{const t=topicFor(e.chapter);if(!groups.has(t.key)){const g=document.createElement('optgroup');g.label=t.label;g.style.color='#74d58a';g.style.fontWeight='900';groups.set(t.key,g);old.appendChild(g)}const option=document.createElement('option');option.value=String(i);option.style.color='#f6c65e';option.style.fontWeight='700';option.textContent=`${e.chapter}:${e.id} · ${language==='he'?e.labelHe:e.labelEn}`;groups.get(t.key).appendChild(option)});if(entries.length)old.value=String(idx);renderTopicsPanel()}
function renderTopicsPanel(){
 const panel=$('ideasPanel'),list=$('ideasList');if(!panel||!list)return;
 panel.dir=language==='he'?'rtl':'ltr';$('ideasPanelTitle').textContent=language==='he'?'בחר נושא ותמונה':'Choose topic and picture';
 $('ideasOpen').textContent=language==='he'?'📚 נושאים':'📚 Topics';
 list.replaceChildren();
 const groups=new Map();
 entries.forEach((e,i)=>{const t=topicFor(e.chapter);if(!groups.has(t.key))groups.set(t.key,{topic:t,first:i,items:[]});groups.get(t.key).items.push({e,i});});
 const topicBox=document.createElement('div');topicBox.className='topicsAtTop';
 const title=document.createElement('div');title.className='topicsHeading';title.textContent=language==='he'?'נושאים מרכזיים':'Main topics';topicBox.appendChild(title);
 for(const g of groups.values()){
   const b=document.createElement('button');b.type='button';b.className='topicShortcut';b.textContent=g.topic.label;
   b.onclick=()=>{userAction();idx=g.first;panel.hidden=true;show();if(carouselMode)speakTitle(language==='he'?entries[idx].labelHe:entries[idx].labelEn)};
   topicBox.appendChild(b);
 }
 list.appendChild(topicBox);
 for(const g of groups.values()){
   const h=document.createElement('div');h.className='ideaTopic';h.textContent=g.topic.label;list.appendChild(h);
   for(const {e,i} of g.items){const b=document.createElement('button');b.type='button';b.className='ideaItem';b.textContent=`${e.chapter}:${e.id} · ${language==='he'?e.labelHe:e.labelEn}`;
     b.onclick=()=>{userAction();idx=i;panel.hidden=true;show();if(carouselMode)speakTitle(language==='he'?e.labelHe:e.labelEn)};list.appendChild(b)}
 }
}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
updateLanguage();
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' '+url);return r.json()}
function rows(d){if(Array.isArray(d))return d;for(const k of ['ideas','chapter_ideas','sections','items'])if(Array.isArray(d?.[k]))return d[k];if(d?.chapter)return rows(d.chapter);return []}
function title(row){const a=row?.idea||row||{};return String(a.ideaTitleEn||a.idea_title_en||a.title_en||a.titleEn||a.name_en||a.english_title||a.ideaTitle||a.idea_title||a.title_he||a.title||a.name||a.heading||'').trim()}
function titleHe(row){const a=row?.idea||row||{};return String(a.ideaTitle||a.idea_title||a.title_he||a.title||a.name||a.heading||'').trim()}
function normalize(p){return String(p).split('/').map(encodeURIComponent).join('/')}
function status(msg){$('status').textContent=msg;$('status').hidden=false}
function cancelSpeech(){if(window.AndroidTTS){window.AndroidTTS.stop();return}if('speechSynthesis' in window)speechSynthesis.cancel()}
function speakTitle(s){if(muted)return;try{if(window.AndroidTTS){window.AndroidTTS.speak(String(s),language==='he'?'he-IL':'en-US');return}if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang=language==='he'?'he-IL':'en-US';u.rate=1.08;u.volume=1;speechSynthesis.speak(u)}catch(e){console.warn(e)}}
function fitLayout(){document.documentElement.style.setProperty('--actual-header',Math.ceil(document.querySelector('header').getBoundingClientRect().height)+'px')}
function userAction(){fitLayout()}
async function requestFullScreen(){
 if(document.fullscreenElement)return;
 try{await document.documentElement.requestFullscreen?.()}catch(e){console.info('Fullscreen not available',e)}
 fitLayout();
}
function setMode(){
 carouselMode=!carouselMode;pause();
 document.body.classList.toggle('carousel-mode',carouselMode);
 $('manualHint').hidden=!carouselMode;$('manualHint').textContent=language==='he'?'גלגול ידני למטה ולמעלה':'Manual scrolling up and down';
 
 $('play').textContent=playing?'⏸':'🎬';
 show();
}
function activateManual(){if(!carouselMode){carouselMode=true;pause();document.body.classList.add('carousel-mode')} $('manualHint').hidden=true;}
async function moveCarousel(delta){
 if(!carouselMode||!entries.length)return;
 if(idx+delta>=0&&idx+delta<entries.length){idx+=delta;show();speakTitle(language==='he'?entries[idx].labelHe:entries[idx].labelEn);return;}
 const current=BOOK_INFO.findIndex(b=>b.id===bookSelect.value);
 const direction=delta>0?1:-1;
 for(let step=1;step<=BOOK_INFO.length;step++){
  const b=BOOK_INFO[(current+direction*step+BOOK_INFO.length*2)%BOOK_INFO.length];
  bookSelect.value=b.id;
  await loadBook(false);
  if(entries.length){carouselMode=true;document.body.classList.add('carousel-mode');idx=direction>0?0:entries.length-1;show();speakTitle(language==='he'?entries[idx].labelHe:entries[idx].labelEn);return;}
 }
}

function pause(){playing=false;clearTimeout(timer);timer=null;cancelSpeech();$('play').textContent=playing?'⏸':'🎬'}
function resizePicture(){
 const im=$('picture');if(!im.naturalWidth)return;
 const landscape=window.innerWidth>window.innerHeight;
 const mobileLandscape=landscape && window.matchMedia('(pointer:coarse)').matches;
 const w=mobileLandscape?Math.round(window.innerWidth*0.5):$('stage').clientWidth;
 const wanted=w*im.naturalHeight/im.naturalWidth+120;
 const header=document.querySelector('header').getBoundingClientRect().height;
 const ref=$('referenceLine').getBoundingClientRect().height;
 const caption=$('caption').getBoundingClientRect().height;
 const bottom=document.querySelector('.bottom').getBoundingClientRect().height;
 const available=Math.max(90,window.innerHeight-header-ref-caption-bottom-32);
 const height=landscape?Math.min(wanted,available):wanted;
 im.style.setProperty('width',w+'px','important');
 im.style.setProperty('max-width','100%','important');
 im.style.setProperty('margin-left','auto','important');
 im.style.setProperty('margin-right','auto','important');
 im.style.setProperty('height',height+'px','important');
}
$('picture').addEventListener('load',resizePicture);
window.addEventListener('resize',()=>requestAnimationFrame(()=>{fitLayout();resizePicture()}));window.addEventListener('orientationchange',()=>setTimeout(()=>{fitLayout();resizePicture()},250));
document.addEventListener('fullscreenchange',()=>setTimeout(resizePicture,100));
async function advanceToNextBook(){const current=BOOK_INFO.findIndex(b=>b.id===bookSelect.value);for(let step=1;step<=BOOK_INFO.length;step++){const b=BOOK_INFO[(current+step)%BOOK_INFO.length];bookSelect.value=b.id;await loadBook(true);if(entries.length)return;}pause();status(language==='he'?'לא נמצאו תמונות בספרים':'No pictures available');}
function show(){if(!entries.length)return;clearTimeout(timer);cancelSpeech();const x=entries[idx];const bk=BOOK_INFO.find(b=>b.id===bookSelect.value);$('referenceLine').textContent=language==='he'?`${bk?.name||''} ${x.verse||x.startVerse||x.id}:${x.chapter}`:`${bk?.nameEn||''} ${x.chapter}:${x.verse||x.startVerse||x.id}`;$('picture').src=RAW+normalize(x.path);$('caption').textContent=language==='he'?x.labelHe:x.labelEn;requestAnimationFrame(resizePicture);$('ideas').value=String(idx);$('status').hidden=true;if(playing&&!carouselMode){speakTitle(language==='he'?x.labelHe:x.labelEn);timer=setTimeout(()=>{if(idx+1<entries.length){idx++;show()}else{advanceToNextBook().catch(e=>{pause();status(e.message)})}},4000)}}
function resume(){if(!entries.length)return;if(carouselMode){carouselMode=false;document.body.classList.remove('carousel-mode')}playing=true;$('play').textContent='⏸';show()}
async function loadBook(continuePlaying=false){pause();const token=++loadToken;entries=[];idx=0;$('picture').removeAttribute('src');$('caption').textContent='';const book=BOOK_INFO.find(x=>x.id===bookSelect.value);bookSelect.dataset.current=book.id;updateTopics();status('Loading '+book.nameEn+' pictures…');try{
let approval=null;try{const a=await json(RAW+'trivia_approved/'+book.id+'.json');if(Array.isArray(a.approved))approval=new Set(a.approved.map(x=>x.image_path))}catch(e){}
let chapters=[];try{const tree=await json('https://api.github.com/repos/'+REPO+'/git/trees/main?recursive=1');const dirs=new Map();for(const f of tree.tree||[]){const m=f.path.match(/^([^/]+)\/chapter_(\d+)\/(.+)$/);if(!m||m[1]!==book.name)continue;const dir=m[1]+'/chapter_'+m[2];if(!dirs.has(dir))dirs.set(dir,{dir,chapter:Number(m[2]),images:[],hasJson:false});const ch=dirs.get(dir);if(m[3]==='chapter.json')ch.hasJson=true;if(/^images\/.*\.(jpg|jpeg|png|webp)$/i.test(m[3]))ch.images.push(f.path)}chapters=[...dirs.values()].filter(x=>x.hasJson&&x.images.length).sort((a,b)=>a.chapter-b.chapter)}catch(e){console.warn('GitHub tree not available, trying direct chapters',e)}
if(!chapters.length){chapters=Array.from({length:book.chapters},(_,i)=>({dir:book.name+'/chapter_'+String(i+1).padStart(3,'0'),chapter:i+1,images:[],hasJson:true}))}
let completed=0;const workers=Array.from({length:Math.min(8,chapters.length)},async()=>{while(completed<chapters.length){const n=completed++;const ch=chapters[n];if(token!==loadToken)return;try{const d=await json(RAW+normalize(ch.dir)+'/chapter.json');if(!ch.images.length){try{const f=await json('https://api.github.com/repos/'+REPO+'/contents/'+normalize(ch.dir)+'/images');ch.images=f.filter(x=>/\.(jpg|jpeg|png|webp)$/i.test(x.name)).map(x=>ch.dir+'/images/'+x.name)}catch(e){}}
for(const [i,r] of rows(d).entries()){const a=r?.idea||r||{},id=Number(a.idea_id??a.id??i+1);const path=ch.images.find(p=>new RegExp('idea_0*'+id+'(?:[^0-9]|$)','i').test(p.split('/').pop()));if(!path||approval&&!approval.has(path))continue;const labelEn=title(r),labelHe=titleHe(r);if(labelEn||labelHe){entries.push({path,labelHe:labelHe||labelEn,labelEn:labelEn||labelHe,chapter:ch.chapter,id})}}
}catch(e){console.warn('Chapter unavailable:',ch.dir,e)}if(token===loadToken&&n%5===0)status('Loading '+book.nameEn+'… '+Math.min(completed,chapters.length)+' / '+chapters.length+' chapters')}});await Promise.all(workers);if(token!==loadToken)return;entries.sort((a,b)=>a.chapter-b.chapter||a.id-b.id);if(!entries.length){status('No pictures found for '+book.nameEn);return}updateTopics();if(continuePlaying){playing=true;$('play').textContent='⏸'}show();if(!continuePlaying)$('play').textContent='🎬'
}catch(e){if(token===loadToken)status('Could not load images: '+e.message);console.error(e)}}
$('bookOpen').addEventListener('click',()=>{requestFullScreen();renderBooksPanel();$('booksPanel').hidden=false});$('booksClose').addEventListener('click',()=>{$('booksPanel').hidden=true});$('ideasOpen').addEventListener('click',()=>{requestFullScreen();userAction();renderTopicsPanel();$('ideasPanel').hidden=false});$('ideasClose').addEventListener('click',()=>{$('ideasPanel').hidden=true});$('play').addEventListener('click',()=>{userAction();requestFullScreen();playing?pause():resume()});bookSelect.addEventListener('change',()=>{userAction();loadBook()});$('lang').addEventListener('click',()=>{requestFullScreen();userAction();language=language==='he'?'en':'he';updateLanguage();show()});$('ideas').addEventListener('change',()=>{userAction();if($('ideas').value==='')return;idx=Number($('ideas').value);show()});$('reload').addEventListener('click',()=>{requestFullScreen();userAction();if(entries.length){pause();idx=0;resume()}else loadBook()});$('picture').addEventListener('error',()=>{if(entries.length){status('Image unavailable · continuing…');if(!playing)return}});$('stage').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
$('stage').addEventListener('touchend',e=>{if(touchY===null)return;const dy=e.changedTouches[0].clientY-touchY;touchY=null;if(Math.abs(dy)>35){activateManual();moveCarousel(dy<0?1:-1)}},{passive:true});
$('stage').addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>5){e.preventDefault();activateManual();moveCarousel(e.deltaY>0?1:-1)}},{passive:false});
window.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','PageDown','PageUp'].includes(e.key)){e.preventDefault();activateManual();moveCarousel(['ArrowDown','PageDown'].includes(e.key)?1:-1)}});

window.addEventListener('resize',fitLayout);document.addEventListener('fullscreenchange',fitLayout);new ResizeObserver(fitLayout).observe(document.querySelector('header'));fitLayout();loadTopicRanges().catch(e=>console.error('Topic index unavailable:',e)).finally(()=>loadBook());setTimeout(()=>{const h=$('startupHint');if(h)h.hidden=true},10000);
